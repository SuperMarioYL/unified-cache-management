# native-contract.yaml — UCM-owned backend build and native contracts
backend_contracts:
  cuda:
    platform_arg: cuda
    distribution_prefix: uc-manager-cuda-
    external_required_dependencies: []
    required_native:
      - ucmtrans
      - metrics
      - ucmmetrics
      - ucmlogger
      - ucmnfsstore
      - ucmpcstore
      - posixstore
      - compressor
      - cachestore
      - emptystore
      - fakestore
      - ucmpipelinestore
    forbidden_native:
      - mooncakestore
      - ds3fsstore
      - uc_hash_ext
      - ucm_custom_ops
      - hash_retrieval_backend
      - hamming
      - gsa_prefetch
      - kvstar_retrieve
      - retrieval_backend
      - gsa_offload_ops
    allowed_dt_needed:
      - ld-linux-aarch64.so.1
      - ld-linux-x86-64.so.2
      - libc.so.6
      - libcuda.so.1
      - libcudart.so.12
      - libcudart.so.13
      - libdl.so.2
      - libgcc_s.so.1
      - libm.so.6
      - libmetrics.so
      - libpthread.so.0
      - librt.so.1
      - libstdc++.so.6
  cann-a2:
    platform_arg: ascend
    distribution: uc-manager-cann-a2
    external_required_dependencies:
      - dependency: libascend_hal.so
        provider: host-ascend-driver
        expected_mount_root: /usr/local/Ascend/driver/lib64
        relation: transitive
        required_at: device-runtime
    required_native:
      - ucmtrans
      - metrics
      - ucmmetrics
      - ucmlogger
      - ucmnfsstore
      - ucmpcstore
      - posixstore
      - compressor
      - cachestore
      - emptystore
      - fakestore
      - ucmpipelinestore
      - mooncakestore
    forbidden_native:
      - ds3fsstore
      - uc_hash_ext
      - ucm_custom_ops
      - hash_retrieval_backend
      - hamming
      - gsa_prefetch
      - kvstar_retrieve
      - retrieval_backend
      - gsa_offload_ops
    allowed_dt_needed:
      - ascend_transport.so
      - ld-linux-aarch64.so.1
      - ld-linux-x86-64.so.2
      - libc.so.6
      - libascendcl.so
      - libasio.so
      - libcurl.so.4
      - libdl.so.2
      - libgcc_s.so.1
      - libglog.so.1
      - libibverbs.so.1
      - libjsoncpp.so.25
      - libm.so.6
      - libmetrics.so
      - libmooncake_store.so
      - libnuma.so.1
      - libpthread.so.0
      - librt.so.1
      - libruntime.so
      - libstdc++.so.6
      - libtransfer_engine.so
      - libunwind.so.8
  cann-a3:
    platform_arg: ascend-a3
    distribution: uc-manager-cann-a3
    external_required_dependencies:
      - dependency: libascend_hal.so
        provider: host-ascend-driver
        expected_mount_root: /usr/local/Ascend/driver/lib64
        relation: transitive
        required_at: device-runtime
    required_native:
      - ucmtrans
      - metrics
      - ucmmetrics
      - ucmlogger
      - ucmnfsstore
      - ucmpcstore
      - posixstore
      - compressor
      - cachestore
      - emptystore
      - fakestore
      - ucmpipelinestore
      - mooncakestore
    forbidden_native:
      - ds3fsstore
      - uc_hash_ext
      - ucm_custom_ops
      - hash_retrieval_backend
      - hamming
      - gsa_prefetch
      - kvstar_retrieve
      - retrieval_backend
      - gsa_offload_ops
    allowed_dt_needed:
      - ascend_transport.so
      - ld-linux-aarch64.so.1
      - ld-linux-x86-64.so.2
      - libc.so.6
      - libascendcl.so
      - libasio.so
      - libcurl.so.4
      - libdl.so.2
      - libgcc_s.so.1
      - libglog.so.1
      - libibverbs.so.1
      - libjsoncpp.so.25
      - libm.so.6
      - libmetrics.so
      - libmooncake_store.so
      - libnuma.so.1
      - libpthread.so.0
      - librt.so.1
      - libruntime.so
      - libstdc++.so.6
      - libtransfer_engine.so
      - libunwind.so.8
