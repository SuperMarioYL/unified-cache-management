# native-contract.yaml — required/forbidden/allowed_dt_needed per profile (moved from release.yaml)
cuda130:
  required_native:
  - ucmtrans
  - metrics
  - ucmmetrics
  - ucmlogger
  - ucmnfsstore
  - ucmpcstore
  - posixstore
  - compressor
  - cachestore
  - emptystore
  - fakestore
  - ucmpipelinestore
  forbidden_native:
  - mooncakestore
  - ds3fsstore
  - uc_hash_ext
  - ucm_custom_ops
  - hash_retrieval_backend
  - hamming
  - gsa_prefetch
  - kvstar_retrieve
  - retrieval_backend
  - gsa_offload_ops
  allowed_dt_needed:
  - ld-linux-aarch64.so.1
  - ld-linux-x86-64.so.2
  - libc.so.6
  - libcuda.so.1
  - libcudart.so.13
  - libdl.so.2
  - libgcc_s.so.1
  - libm.so.6
  - libmetrics.so
  - libpthread.so.0
  - librt.so.1
  - libstdc++.so.6
