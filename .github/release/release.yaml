upstream_products:
  - id: vllm
    runtime_product: vllm
    repository: docker.io/vllm/vllm-openai
    target_repository: ghcr.io/{owner}/vllm-openai
    target_tag_suffix: -ucm-0.5.0rc1-r1
    version_specifier: ">=0.21,<0.22"
    channels: [stable]
    variants:
      - id: default
        tag_suffix: ""
        npu_arch: na
        runtime_patch_variants: {vllm: default}
    required_cpu_architectures: [amd64, arm64]
  - id: vllm-ascend
    runtime_product: vllm-ascend
    repository: quay.io/ascend/vllm-ascend
    target_repository: ghcr.io/{owner}/vllm-ascend
    target_tag_suffix: -ucm-0.5.0rc1-r1
    version_specifier: ">=0.22.1rc1,<0.23"
    channels: [rc]
    variants:
      - id: a2
        tag_suffix: ""
        npu_arch: a2
        runtime_patch_variants: {vllm: default, vllm-ascend: a2}
      - id: a3
        tag_suffix: -a3
        npu_arch: a3
        runtime_patch_variants: {vllm: default, vllm-ascend: a3}
    required_cpu_architectures: [amd64, arm64]
compatibility:
  rules:
    - id: cuda-supported
      upstream_products: [vllm]
      version_specifier: ">=0.21,<0.22"
      variants: [default]
      accelerator: cuda
      accelerator_runtimes: [cuda-13.0]
      npu_architectures: [na]
      operating_systems: [ubuntu-22.04]
      cpu_architectures: [amd64, arm64]
      python_abis: [cp312]
      upstream_channels: [stable]
    - id: ascend-supported
      upstream_products: [vllm-ascend]
      version_specifier: ">=0.22.1rc1,<0.23"
      variants: [a2, a3]
      accelerator: ascend
      accelerator_runtimes: [cann-9.0.0]
      npu_architectures: [a2, a3]
      operating_systems: [ubuntu-22.04]
      cpu_architectures: [amd64, arm64]
      python_abis: [cp312]
      upstream_channels: [rc]
  excluded_upstream_patterns: [nightly, dev, custom, 310p, a5, "-a2"]
