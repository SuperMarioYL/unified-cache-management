kind: release-config
schema_version: 2
ucm_version: 0.5.0rc1
version_file: version.ini
source:
  staging_repository: ghcr.io/{owner}/ucm-release-staging
  default_branch: develop
  release_tag: v0.5.0rc1
  release_policy: owner-reviewed-v1
  protected_environment: release-production
lanes: [feature-candidate, protected-tag]
runner_map:
  amd64: ubuntu-24.04
  arm64: ubuntu-24.04-arm
publish:
  pypi:
    enabled: true
    index: https://upload.pypi.org/legacy/
    dists: [uc-manager-cuda, uc-manager-cann-a2, uc-manager-cann-a3]
  ghcr:
    enabled: true
    namespace: ghcr.io/{owner}
  dockerhub:
    enabled: false
    namespace: docker.io/{owner}
  chart_oci:
    enabled: true
    namespace: ghcr.io/{owner}/charts
  github_release:
    enabled: true
pr_smoke:
  image_selectors:
    - product_id: vllm
      variant: default
      cpu_arch: amd64
    - product_id: vllm-ascend
      variant: a2
      cpu_arch: arm64
docker_recipes:
  - id: mindie-a2-v2-source
    path: docker/Dockerfile.ucm-mindie-ascend.a2-v2
    status: specialized
    lanes: [pr-smoke, manual]
    product: mindie
    backend: ascend
    variant: a2
    upstream_version: 2.3.0-800I-A2-py311-openeuler24.03-lts
    base_image: {source: swr.cn-south-1.myhuaweicloud.com/ascendhub, name_version: "mindie:2.3.0-800I-A2-py311-openeuler24.03-lts"}
    cpu_arch: arm64
    platform: linux/arm64
    runner: ubuntu-24.04-arm
    build_mode: legacy-source-build
    cache_scope: recipe-mindie-a2-v2
    build_args: [PIP_INDEX_URL=https://pypi.org/simple]
    engine_type: mindie
    install_hook: required
    exclusion_reason: Specialized MindIE source build is not a sealed-wheel formal release recipe.
  - id: sglang-cuda-055-source
