steps:
- group: Build CUDA 13.0 Python wheels
  key: build-wheels
  steps:
  - id: build-wheel-x86-cuda-13-0
    commands:
    - docker build --build-arg CUDA_VERSION=13.0.2 --build-arg BUILD_BASE_IMAGE=pytorch/manylinux2_28-builder:cuda13.0-recipe --target build -f docker/Dockerfile .
  - id: build-wheel-arm64-cuda-13-0
    commands:
    - docker build --build-arg CUDA_VERSION=13.0.2 --build-arg BUILD_BASE_IMAGE=pytorch/manylinuxaarch64-builder:cuda13.0-recipe --target build -f docker/Dockerfile .
- group: Build additional Python wheels
  key: build-additional-wheels
  steps:
  - id: build-wheel-x86-cuda-12-9
    commands:
    - docker build --build-arg max_jobs=16 --build-arg USE_SCCACHE=1 --build-arg CUDA_VERSION=12.9.1 --build-arg BUILD_BASE_IMAGE=pytorch/manylinux2_28-builder:cuda12.9-recipe --target build -f docker/Dockerfile .
  - id: build-wheel-arm64-cuda-12-9
    commands:
    - docker build --build-arg max_jobs=16 --build-arg USE_SCCACHE=1 --build-arg CUDA_VERSION=12.9.1 --build-arg BUILD_BASE_IMAGE=pytorch/manylinuxaarch64-builder:cuda12.9-recipe --target build -f docker/Dockerfile .
  - id: build-wheel-x86-cpu
    commands:
    - docker build -f docker/Dockerfile.cpu .
  - id: build-wheel-x86-xpu
    commands:
    - docker build -f docker/Dockerfile.xpu .
- group: Build release Docker images
  key: build-release-images
  steps:
  - id: build-release-image-x86
    commands:
    - docker build --build-arg CUDA_VERSION=13.0.2 --target vllm-openai -f docker/Dockerfile .
    - docker push public.example/vllm:$BUILDKITE_COMMIT-$(uname -m)
  - id: build-release-image-arm64
    commands:
    - docker build --build-arg CUDA_VERSION=13.0.2 --target vllm-openai -f docker/Dockerfile .
    - docker push public.example/vllm:$BUILDKITE_COMMIT-$(uname -m)
  - id: build-release-image-x86-cuda-12-9
    commands:
    - docker build --build-arg CUDA_VERSION=12.9.1 --target vllm-openai -f docker/Dockerfile .
    - docker push public.example/vllm:$BUILDKITE_COMMIT-$(uname -m)-cu129
  - id: build-release-image-arm64-cuda-12-9
    commands:
    - docker build --build-arg CUDA_VERSION=12.9.1 --target vllm-openai -f docker/Dockerfile .
    - docker push public.example/vllm:$BUILDKITE_COMMIT-$(uname -m)-cu129
  - id: build-release-image-x86-ubuntu2404
    commands:
    - docker build --build-arg CUDA_VERSION=13.0.2 --target vllm-openai -f docker/Dockerfile .
    - docker push public.example/vllm:$BUILDKITE_COMMIT-$(uname -m)-ubuntu2404
