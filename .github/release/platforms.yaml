kind: ucm-platform-policy
schema_version: 1

excluded_upstream_variants:
  vllm-ascend: [310p]

builder_families:
  cuda:
    target_repository: ghcr.io/{owner}/ucm-builder-vllm
    source_repositories:
      amd64: docker.io/pytorch/manylinux2_28-builder
      arm64: docker.io/pytorch/manylinuxaarch64-builder
    manylinux: manylinux_2_28
    required_commands: [gcc, g++, make, git, nvcc, patchelf]

  ascend:
    target_repository: ghcr.io/{owner}/ucm-builder-vllm-ascend
    source_repositories:
      amd64: quay.io/ascend/manylinux
      arm64: quay.io/ascend/manylinux
    manylinux: manylinux_2_34
    required_commands: [gcc, g++, make, git, cmake, patchelf]
    required_files: [acl.h]
    variant_required_files:
      a3: [libruntime.so]

backends:
  cuda:
    status: supported
    platform: cuda
    distribution_template: uc-manager-cuda-{runtime_variant}
    external_runtime_libraries: ["libcudart.so.{accelerator_major}"]

  cann-a2:
    status: supported
    platform: ascend
    distribution_template: uc-manager-{runtime_variant}
    external_runtime_libraries:
      - libacl_rt.so
      - libacl_rt_impl.so
      - libascend_dump.so
      - libascend_hal.so
      - libascend_kms.so
      - libascend_protobuf.so.3.13.0.0
      - libascend_trace.so
      - libascend_watchdog.so
      - libascendalog.so
      - libascendcl.so
      - libc_sec.so
      - libcann_hixl.so
      - libccl_dpu.so
      - liberror_manager.so
      - libhccl_alg.so
      - libhccl_legacy.so
      - libhccl_plf.so
      - libhccl_v2.so
      - libhccl_v2_alg_frame.so
      - libhccl_v2_native_alg_repo.so
      - libhcomm.so
      - libmetadef.so
      - libmmpa.so
      - libmsprofiler.so
      - libopp_registry.so
      - libplatform.so
      - libprofapi.so
      - libra.so
      - libra_hdc.so
      - libra_peer.so
      - librs.so
      - libruntime.so
      - libruntime_common.so
      - libtls_adp.so
      - libtopoaddrinfo.so
      - libtsdclient.so
      - libunified_dlog.so

  cann-a3:
    status: supported
    platform: ascend-a3
    distribution_template: uc-manager-{runtime_variant}
    external_runtime_libraries:
      - libacl_rt.so
      - libacl_rt_impl.so
      - libascend_dump.so
      - libascend_hal.so
      - libascend_kms.so
      - libascend_protobuf.so.3.13.0.0
      - libascend_trace.so
      - libascend_watchdog.so
      - libascendalog.so
      - libascendcl.so
      - libc_sec.so
      - libcann_hixl.so
      - libccl_dpu.so
      - liberror_manager.so
      - libhccl_alg.so
      - libhccl_legacy.so
      - libhccl_plf.so
      - libhccl_v2.so
      - libhccl_v2_alg_frame.so
      - libhccl_v2_native_alg_repo.so
      - libhcomm.so
      - libmetadef.so
      - libmmpa.so
      - libmsprofiler.so
      - libopp_registry.so
      - libplatform.so
      - libprofapi.so
      - libra.so
      - libra_hdc.so
      - libra_peer.so
      - librs.so
      - libruntime.so
      - libruntime_common.so
      - libtls_adp.so
      - libtopoaddrinfo.so
      - libtsdclient.so
      - libunified_dlog.so

  cann-a5:
    status: blocked
    platform: ascend-a5
    distribution_template: uc-manager-{runtime_variant}
    reason: A5 requires a dedicated UCM native implementation
