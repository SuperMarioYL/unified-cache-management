{
  "kind": "ucm-release-lifecycle-config",
  "schema_version": 2,
  "mode": "dry-run",
  "repositories": {
    "production": "ModelEngine-Group/unified-cache-management",
    "validation": "SuperMarioYL/unified-cache-management"
  },
  "branches": {
    "develop": "develop",
    "main": "main"
  },
  "version": "0.6.0",
  "products": {
    "wheels": [
      {"distribution": "uc-manager-cuda", "import_name": "ucm", "backend": "cuda"},
      {"distribution": "uc-manager-cann-a2", "import_name": "ucm", "backend": "cann-a2"},
      {"distribution": "uc-manager-cann-a3", "import_name": "ucm", "backend": "cann-a3"}
    ],
    "images": [
      {
        "family": "cuda",
        "repository": "ghcr.io/{repository}/ucm-cuda",
        "platforms": ["linux/amd64", "linux/arm64"]
      },
      {
        "family": "cann-a2",
        "repository": "ghcr.io/{repository}/ucm-cann-a2",
        "platforms": ["linux/amd64", "linux/arm64"]
      },
      {
        "family": "cann-a3",
        "repository": "ghcr.io/{repository}/ucm-cann-a3",
        "platforms": ["linux/amd64", "linux/arm64"]
      }
    ],
    "chart": {
      "name": "unified-cache-pd",
      "source": "charts/ucm"
    }
  },
  "environments": {
    "blue": {"evidence_level": "simulated"},
    "yellow": {"evidence_level": "simulated"}
  },
  "retention_days": {
    "develop": 14,
    "draft": 30,
    "hotfix": null,
    "nightly": 14,
    "pr": 7,
    "rc": null,
    "stable": null
  },
  "repository_policy": {
    "default_branch": "main",
    "protected_branches": ["develop", "main"],
    "tag_pattern": "v[0-9]*",
    "production_environment": {
      "name": "release-production",
      "minimum_required_reviewers": 1,
      "deployment_branch_policy": {
        "protected_branches": true,
        "custom_branch_policies": false
      }
    },
    "dry_run_workflows": [
      "develop-release-dry-run.yml",
      "draft-environment-dry-run.yml",
      "nightly-release-dry-run.yml",
      "pr-release-dry-run.yml",
      "release-cleanup-dry-run.yml",
      "release-control-dry-run.yml",
      "release-lifecycle-dry-run.yml",
      "repository-policy-audit-dry-run.yml"
    ]
  }
}
