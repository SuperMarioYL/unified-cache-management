name: UCM Build Bot Hint

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  hint:
    # same-repo PRs only — external-fork PRs get a read-only GITHUB_TOKEN on
    # pull_request events, so they can't post. (head.repo.fork is true for ANY
    # PR in a fork-of-a-fork repo, so compare head vs base repo full_name instead.)
    # Fork contributors can run /ucm-build help.
    if: github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Post /ucm-build command list
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          cat >hint.md <<'EOF'
          ## 🤖 `/ucm-build` commands

          Available to repo members with **write** access. Each run fixes the current PR head SHA; pushed images are auto-deleted when the PR closes.

          | command | what it builds | pushes to GHCR? |
          | --- | --- | --- |
          | `/ucm-build wheel [profile=<name>]` | wheels — `profile=` one of `cuda130` / `cann900-a2` / `cann900-a3` (omit for all) | no (artifact only) |
          | `/ucm-build image family=<name>` | wheels + images, then auto-push | yes — `ghcr.io/<owner>/<family>:v<upstream-ver>-pr-<n>-<author>-<sha8>` |
          | `/ucm-build chart` | chart (lint + template + package) | no (artifact only) |
          | `/ucm-build all` | wheels + images + chart | yes (images) |

          - `family=`: `vllm` / `vllm-ascend` / `vllm-ascend-a2` / `vllm-ascend-a3`.
          - `/ucm-build help` (or bare `/ucm-build`) re-shows this message.
          EOF
          gh pr comment "${PR_NUMBER}" --body-file hint.md
