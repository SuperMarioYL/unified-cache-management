name: Reusable real install-only UCM image build

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      task_id:
        type: string
        required: true
      runner:
        type: string
        required: true
      resolved_plan_artifact:
        type: string
        required: true
      resolved_plan_sha256:
        type: string
        required: true
      deliver_full_oci:
        type: boolean
        required: true
    outputs:
      image_artifact:
        description: Compact same-run real image evidence for this reviewed task
        value: ${{ jobs.build.outputs.image_artifact }}
      image_result_sha256:
        description: Canonical real image-result identity
        value: ${{ jobs.build.outputs.image_result_sha256 }}
      oci_digest:
        description: Verified local OCI manifest digest
        value: ${{ jobs.build.outputs.oci_digest }}
      internal_oci_artifact:
        description: Protected same-run full OCI bridge artifact
        value: ${{ jobs.build.outputs.internal_oci_artifact }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 210
    permissions:
      contents: read
    outputs:
      image_artifact: ${{ steps.task.outputs.image_artifact }}
      image_result_sha256: ${{ steps.result.outputs.image_result_sha256 }}
      oci_digest: ${{ steps.result.outputs.oci_digest }}
      internal_oci_artifact: ${{ steps.task.outputs.internal_oci_artifact }}
    env:
      CRANE_VERSION: v0.20.3
      CRANE_LINUX_AMD64_SHA256: 36c67a932f489b3f2724b64af90b599a8ef2aa7b004872597373c0ad694dc059
      CRANE_LINUX_ARM64_SHA256: d2235f7779cd39c6e40f43701d2512c997409f629fb53e621ede0d57d3f995e2
    steps:
      - name: Validate reusable build contract
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TASK_ID: ${{ inputs.task_id }}
          RESOLVED_PLAN_ARTIFACT: ${{ inputs.resolved_plan_artifact }}
          RESOLVED_PLAN_SHA256: ${{ inputs.resolved_plan_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full lowercase commit SHA" >&2
            exit 2
          fi
          if [[ ! "${TASK_ID}" =~ ^image-[0-9a-f]{64}$ ]] || \
             [[ ! "${RESOLVED_PLAN_ARTIFACT}" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]] || \
             [[ ! "${RESOLVED_PLAN_SHA256}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "image task or frozen plan identity is invalid" >&2
            exit 2
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.resolved_plan_artifact }}
          path: input/plan
      - name: Validate frozen plan source before checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          RESOLVED_PLAN_SHA256: ${{ inputs.resolved_plan_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          plan_path="input/plan/resolved-plan.json"
          payload_path="${RUNNER_TEMP}/resolved-plan-unhashed.json"
          claimed_plan_sha256="$(jq -er '.resolved_plan_sha256 | select(type == "string")' "${plan_path}")"
          plan_source_sha="$(jq -er '.source.commit | select(type == "string")' "${plan_path}")"
          jq -cS 'del(.resolved_plan_sha256)' "${plan_path}" >"${payload_path}"
          payload_size="$(wc -c <"${payload_path}" | tr -d ' ')"
          test "${payload_size}" -gt 1
          truncate -s "$((payload_size - 1))" "${payload_path}"
          observed_plan_sha256="sha256:$(sha256sum "${payload_path}" | cut -d' ' -f1)"
          test "${claimed_plan_sha256}" = "${RESOLVED_PLAN_SHA256}"
          test "${observed_plan_sha256}" = "${RESOLVED_PLAN_SHA256}"
          test "${plan_source_sha}" = "${EXPECTED_SOURCE_SHA}"
      - name: Record disk before cleanup
        shell: bash
        run: |
          set -euo pipefail
          df -Pk / | tee "${RUNNER_TEMP}/ucm-disk-before.txt"
      - name: Free disk for immutable runtime image
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - name: Require sixty GiB after cleanup
        shell: bash
        run: |
          set -euo pipefail
          df -Pk / | tee "${RUNNER_TEMP}/ucm-disk-after.txt"
          available_kib="$(df -Pk / | awk 'NR==2 {print $4}')"
          available_gib="$((available_kib / 1024 / 1024))"
          if (( available_gib < 60 )); then
            echo "runtime image build requires at least 60 GiB, found ${available_gib} GiB" >&2
            exit 2
          fi
          printf '%s\n' "${available_gib}" >"${RUNNER_TEMP}/ucm-available-gib.txt"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - id: task-python
        name: Select task Python from the frozen plan
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          TASK_ID: ${{ inputs.task_id }}
          RESOLVED_PLAN_SHA256: ${{ inputs.resolved_plan_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/release/select_task_python.py \
            --plan input/plan/resolved-plan.json \
            --task-kind image \
            --task-id "${TASK_ID}" \
            --expected-sha256 "${RESOLVED_PLAN_SHA256}" \
            --expected-source-sha "${EXPECTED_SOURCE_SHA}" \
            --github-output "${GITHUB_OUTPUT}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "${{ steps.task-python.outputs.python_version }}"
      - name: Install compact release runtime dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - id: task
        name: Select frozen image and wheel dependency tasks
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TASK_ID: ${{ inputs.task_id }}
          RESOLVED_PLAN_SHA256: ${{ inputs.resolved_plan_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct "${SOURCE_SHA}")"
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          mkdir -p out
          PYTHONPATH=.github/release python -m ucm_release catalog select \
            --plan input/plan/resolved-plan.json \
            --task-kind image \
            --task-id "${TASK_ID}" \
            --expected-plan-sha256 "${RESOLVED_PLAN_SHA256}" \
            --output out/selected-task.json >/dev/null
          wheel_task_id="$(jq -r '.wheel_task_id' out/selected-task.json)"
          PYTHONPATH=.github/release python -m ucm_release catalog select \
            --plan input/plan/resolved-plan.json \
            --task-kind wheel \
            --task-id "${wheel_task_id}" \
            --expected-plan-sha256 "${RESOLVED_PLAN_SHA256}" \
            --output out/selected-wheel-task.json >/dev/null
          # Materialize the hosted image task: artifact and dependency bindings.
          # Mirrors verify.hosted_image_task so out/hosted-task.json is byte-faithful.
          runtime_patch_canonical="$(jq -cS '.runtime_patch_variants' out/selected-task.json)"
          jq -ncS \
            --slurpfile t out/selected-task.json \
            --arg source_sha "${SOURCE_SHA}" \
            --arg source_date_epoch "${source_date_epoch}" \
            --arg runtime_patch_canonical "${runtime_patch_canonical}" \
            '{
              task_id: $t[0].task_id,
              spec_id: $t[0].spec_id,
              profile_id: $t[0].profile_id,
              family_task_id: $t[0].family_task_id,
              wheel_task_id: $t[0].wheel_task_id,
              runner: $t[0].runner,
              source_sha: $source_sha,
              source_date_epoch: ($source_date_epoch | tonumber),
              task_sha256: $t[0].task_sha256,
              runtime_patch_variants: $t[0].runtime_patch_variants,
              wheel_artifact: $t[0].wheel_artifact_name,
              image_artifact: $t[0].artifact_name,
              build_args: {
                UCM_RUNTIME_PATCH_VARIANTS: $runtime_patch_canonical
              }
            }' > out/hosted-task.json
          hosted_task_sha256="sha256:$(jq -cjS . out/hosted-task.json | sha256sum | cut -d' ' -f1)"
          jq -cS --arg h "${hosted_task_sha256}" '.hosted_task_sha256 = $h' \
            out/hosted-task.json > out/hosted-task.json.tmp
          mv out/hosted-task.json.tmp out/hosted-task.json
          # Project the real image task authority from the frozen resolved plan.
          plan=input/plan/resolved-plan.json
          test "$(jq -r '.resolved_plan_sha256' "${plan}")" = "${RESOLVED_PLAN_SHA256}"
          matches="$(jq -c --arg id "${TASK_ID}" '[.image_tasks[] | select(.task_id == $id)]' "${plan}")"
          test "$(jq 'length' <<<"${matches}")" = "1"
          source_repo="$(jq -r '.source.repository' "${plan}")"
          frontend="$(sed -n '1s/^# syntax=//p' .github/release/docker/Dockerfile)"
          toolchain="$(jq -cnS --arg frontend "${frontend}" \
            '{schema_version:1,kind:"ucm-real-image-toolchain-authority",buildx_version:"v0.19.2",buildx_linux_sha256:{amd64:"sha256:a5ff61c0b6d2c8ee20964a9d6dac7a7a6383c4a4a0ee8d354e983917578306ea",arm64:"sha256:bd54f0e28c29789da1679bad2dd94c1923786ccd2cd80dd3a0a1d560a6baf10c"},buildkit_image:"moby/buildkit:v0.18.2@sha256:86c0ad9d1137c186e9d455912167df20e530bdf7f7c19de802e892bb8ca16552",dockerfile_frontend:$frontend,deterministic_flags:["--provenance=false","--sbom=false","oci-mediatypes=true","rewrite-timestamp=true"]}')"
          toolchain_sha256="sha256:$(printf '%s' "${toolchain}" | sha256sum | cut -d' ' -f1)"
          toolchain="$(jq -cS --arg sha "${toolchain_sha256}" '.authority_sha256 = $sha' <<<"${toolchain}")"
          auth="$(jq -cnS --argjson t "${matches}" --arg source_repo "${source_repo}" --arg resolved "${RESOLVED_PLAN_SHA256}" --argjson toolchain "${toolchain}" \
            '{schema_version:1,kind:"ucm-real-image-task-authority",candidate_kind:"real-candidate",fixture_only:false,unpublished:true,publication_attempted:false,source_repository:$source_repo,source_repository_url:("https://github.com/"+$source_repo),task_id:$t[0].task_id,family_task_id:$t[0].family_task_id,wheel_task_id:$t[0].wheel_task_id,spec_id:$t[0].spec_id,family_id:$t[0].family_task_id,profile_id:$t[0].profile_id,cpu_arch:$t[0].cpu_arch,platform:$t[0].platform,python_abi:$t[0].python_abi,wheel_version:$t[0].wheel_version,runtime:$t[0].runtime,runtime_patch_variants:$t[0].runtime_patch_variants,target_repository:$t[0].target_repository,target_tag:$t[0].target_tag,runtime_dependencies:$t[0].dependency_lock.runtime_dependencies,task_sha256:$t[0].task_sha256,resolved_plan_sha256:$resolved,toolchain:$toolchain}')"
          authority_sha256="sha256:$(printf '%s' "${auth}" | sha256sum | cut -d' ' -f1)"
          jq -cS --arg sha "${authority_sha256}" '.authority_sha256 = $sha' <<<"${auth}" >out/real-image-authority.json
          test "$(jq -r '.runner' out/selected-task.json)" = "${{ inputs.runner }}"
          logical_wheel_artifact="$(jq -r '.wheel_artifact_name' out/selected-task.json)"
          logical_image_artifact="$(jq -r '.artifact_name' out/selected-task.json)"
          wheel_artifact="${logical_wheel_artifact}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          image_artifact="${logical_image_artifact}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          internal_logical="ucm-internal-oci-${TASK_ID}"
          internal_oci_artifact="${internal_logical}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          jq -cnS --slurpfile i out/selected-task.json --slurpfile w out/selected-wheel-task.json '{image_task_sha256: $i[0].task_sha256, wheel_task_id: $i[0].wheel_task_id, wheel_task_sha256: $w[0].task_sha256}' > out/task-binding.json
          {
            echo "wheel_artifact=${wheel_artifact}"
            echo "image_artifact=${image_artifact}"
            echo "internal_oci_artifact=${internal_oci_artifact}"
          } >>"${GITHUB_OUTPUT}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ steps.task.outputs.wheel_artifact }}
          path: input/wheel
      - name: Reopen exact same-run wheel artifact
        env:
          TASK_ID: ${{ inputs.task_id }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t wheel_paths < <(find input/wheel -maxdepth 1 -type f -name '*.whl' -print | sort)
          test "${#wheel_paths[@]}" = 1
          wheel_path="${wheel_paths[0]}"
          spec_id="$(jq -r '.spec_id' out/selected-task.json)"
          wheel_sha256="sha256:$(sha256sum "${wheel_path}" | cut -d' ' -f1)"
          actual_sha256="sha256:$(sha256sum "${wheel_path}" | cut -d' ' -f1)"
          test "${actual_sha256}" = "${wheel_sha256}"
          metadata="$(unzip -p "${wheel_path}" '*.dist-info/METADATA')"
          dist="$(printf '%s\n' "${metadata}" | awk -F': ' '/^Name:/{print $2; exit}')"
          version="$(printf '%s\n' "${metadata}" | awk -F': ' '/^Version:/{print $2; exit}')"
          requires_dist="$(printf '%s\n' "${metadata}" | awk -F': ' '/^Requires-Dist:/{sub(/^Requires-Dist: /,""); print}' | jq -R -s 'split("\n") | map(select(length>0))')"
          patch_sha256="sha256:$(unzip -p "${wheel_path}" 'ucm/integration/vllm/patch/runtime_patch_rules.json' | sha256sum | cut -d' ' -f1)"
          wheel_size="$(wc -c < "${wheel_path}" | tr -d ' ')"
          jq -cnS \
            --arg spec_id "${spec_id}" \
            --arg filename "$(basename "${wheel_path}")" \
            --arg sha256 "${actual_sha256}" \
            --argjson size "${wheel_size}" \
            --arg distribution "${dist}" \
            --arg version "${version}" \
            --argjson requires_dist "${requires_dist}" \
            --arg runtime_patch_manifest_sha256 "${patch_sha256}" \
            '{schema_version:1, kind:"ucm-wheel-inspection", source_kind:"builder-candidate", spec_id:$spec_id, filename:$filename, sha256:$sha256, size:$size, distribution:$distribution, version:$version, requires_dist:$requires_dist, runtime_patch_manifest_sha256:$runtime_patch_manifest_sha256, published:false, publication_eligible:false}' \
            >out/reopened-wheel-inspection.json
          cmp input/wheel/wheel-inspection.json out/reopened-wheel-inspection.json
      - name: Install checksum-pinned Buildx
        shell: bash
        run: |
          set -euo pipefail
          buildx_version="$(jq -r '.toolchain.buildx_version' out/real-image-authority.json)"
          buildkit_image="$(jq -r '.toolchain.buildkit_image' out/real-image-authority.json)"
          case "$(uname -m)" in
            x86_64) buildx_arch=amd64 ;;
            aarch64|arm64) buildx_arch=arm64 ;;
            *) echo "unsupported Buildx architecture: $(uname -m)" >&2; exit 2 ;;
          esac
          buildx_sha="$(jq -r --arg arch "$buildx_arch" '.toolchain.buildx_linux_sha256[$arch]' out/real-image-authority.json)"
          buildx_binary="${RUNNER_TEMP}/docker-buildx"
          curl -fsSL --retry 3 -o "${buildx_binary}" \
            "https://github.com/docker/buildx/releases/download/${buildx_version}/buildx-${buildx_version}.linux-${buildx_arch}"
          echo "${buildx_sha#sha256:}  ${buildx_binary}" | sha256sum --check
          mkdir -p "${HOME}/.docker/cli-plugins"
          install -m 0755 "${buildx_binary}" "${HOME}/.docker/cli-plugins/docker-buildx"
          test "$(docker buildx version | awk '{print $2}')" = "${buildx_version}"
          docker buildx create --name ucm-release-builder \
            --driver docker-container \
            --driver-opt "image=${buildkit_image}" \
            --use
          bootstrap_ok=false
          for attempt in 1 2 3; do
            if docker buildx inspect ucm-release-builder --bootstrap \
              2>&1 | tee "out/buildx-bootstrap-attempt-${attempt}.log"; then
              bootstrap_ok=true
              break
            fi
            if [[ "${attempt}" != 3 ]]; then sleep "$((attempt * 5))"; fi
          done
          if [[ "${bootstrap_ok}" != true ]]; then
            docker buildx rm --force ucm-release-builder || true
            exit 2
          fi
      - name: Install checksum-pinned read-only crane
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) crane_arch=x86_64; crane_sha="${CRANE_LINUX_AMD64_SHA256}" ;;
            aarch64|arm64) crane_arch=arm64; crane_sha="${CRANE_LINUX_ARM64_SHA256}" ;;
            *) echo "unsupported crane architecture: $(uname -m)" >&2; exit 2 ;;
          esac
          mkdir -p "${RUNNER_TEMP}/crane"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/crane.tar.gz" \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_${crane_arch}.tar.gz"
          echo "${crane_sha}  ${RUNNER_TEMP}/crane.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/crane.tar.gz" -C "${RUNNER_TEMP}/crane" crane
          test "$("${RUNNER_TEMP}/crane/crane" version)" = "${CRANE_VERSION#v}"
          echo "${RUNNER_TEMP}/crane" >>"${GITHUB_PATH}"
      - name: Fetch and reopen exact upstream index member and config bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/base
          repository="$(jq -r '.runtime.repository' out/real-image-authority.json)"
          index_digest="$(jq -r '.runtime.index_digest' out/real-image-authority.json)"
          manifest_digest="$(jq -r '.runtime.manifest_digest' out/real-image-authority.json)"
          config_digest="$(jq -r '.runtime.config_digest' out/real-image-authority.json)"
          test "$(crane digest "${repository}@${index_digest}")" = "${index_digest}"
          crane manifest "${repository}@${index_digest}" >out/base/index.json
          crane manifest "${repository}@${manifest_digest}" >out/base/manifest.json
          crane config "${repository}@${manifest_digest}" >out/base/config.json
          test "sha256:$(sha256sum out/base/index.json | cut -d' ' -f1)" = "${index_digest}"
          test "sha256:$(sha256sum out/base/manifest.json | cut -d' ' -f1)" = "${manifest_digest}"
          test "sha256:$(sha256sum out/base/config.json | cut -d' ' -f1)" = "${config_digest}"
          # Reopen the real base descriptor chain and bind it to the task authority.
          auth=out/real-image-authority.json
          repository="$(jq -r '.runtime.repository' "${auth}")"
          platform="$(jq -r '.platform' "${auth}")"
          index_digest="sha256:$(sha256sum out/base/index.json | cut -d' ' -f1)"
          manifest_digest="sha256:$(sha256sum out/base/manifest.json | cut -d' ' -f1)"
          config_digest="sha256:$(sha256sum out/base/config.json | cut -d' ' -f1)"
          test "${index_digest}" = "$(jq -r '.runtime.index_digest' "${auth}")"
          test "${manifest_digest}" = "$(jq -r '.runtime.manifest_digest' "${auth}")"
          test "${config_digest}" = "$(jq -r '.runtime.config_digest' "${auth}")"
          jq -cnS \
            --rawfile index_raw out/base/index.json \
            --rawfile manifest_raw out/base/manifest.json \
            --rawfile config_raw out/base/config.json \
            --arg repository "${repository}" --arg platform "${platform}" --arg subject "${repository}@${manifest_digest}" \
            --argjson index_size "$(wc -c <out/base/index.json | tr -d ' ')" \
            --argjson manifest_size "$(wc -c <out/base/manifest.json | tr -d ' ')" \
            --argjson config_size "$(wc -c <out/base/config.json | tr -d ' ')" \
            --arg index_digest "${index_digest}" --arg manifest_digest "${manifest_digest}" --arg config_digest "${config_digest}" \
            '{schema_version:1,kind:"ucm-real-base-image-record",fixture_only:false,repository:$repository,index:{media_type:($index_raw|fromjson|.mediaType),digest:$index_digest,size:$index_size,raw:$index_raw},manifest:{media_type:($manifest_raw|fromjson|.mediaType),digest:$manifest_digest,size:$manifest_size,raw:$manifest_raw},config:{media_type:($manifest_raw|fromjson|.config.mediaType),digest:$config_digest,size:$config_size,raw:$config_raw},platform:{os:($platform|split("/")[0]),architecture:($platform|split("/")[1]),variant:($config_raw|fromjson|.variant),manifest_media_type:($manifest_raw|fromjson|.mediaType),manifest_digest:$manifest_digest,manifest_size:$manifest_size,config_media_type:($manifest_raw|fromjson|.config.mediaType),config_digest:$config_digest,config_size:$config_size},subject:$subject}' \
            >out/base-record-real.json
      - name: Download and hash-check locked runtime dependency wheels
        shell: bash
        run: |
          set -euo pipefail
          architecture="$(jq -r '.cpu_arch' out/selected-task.json)"
          target_platform="$(jq -r '.platform' out/selected-task.json)"
          python_version="$(jq -r '.python_version' out/selected-task.json)"
          python_abi="$(jq -r '.python_abi' out/selected-task.json)"
          test "$(jq -r '.cpu_arch' out/real-image-authority.json)" = "${architecture}"
          test "$(jq -r '.platform' out/real-image-authority.json)" = "${target_platform}"
          test "$(jq -r '.python_abi' out/real-image-authority.json)" = "${python_abi}"
          python_minor="${python_version//./}"
          mkdir -p input/runtime-dependencies input/runtime-download
          while IFS=$'\t' read -r requirement filename expected_sha256; do
            rm -rf input/runtime-download/*
            python -m pip download --disable-pip-version-check --no-cache-dir \
              --only-binary=:all: --no-deps \
              --python-version "${python_minor}" \
              --implementation cp --abi "${python_abi}" \
              --dest input/runtime-download "${requirement}"
            test "$(find input/runtime-download -maxdepth 1 -type f | wc -l | tr -d ' ')" = 1
            test -f "input/runtime-download/${filename}"
            echo "${expected_sha256#sha256:}  input/runtime-download/${filename}" | sha256sum --check
            mv "input/runtime-download/${filename}" input/runtime-dependencies/
          done < <(jq -r '.runtime_dependencies[] | [.requirement, .filename, .sha256] | @tsv' out/real-image-authority.json)
          expected_count="$(jq '(.runtime_dependencies) | length' out/real-image-authority.json)"
          test "$(find input/runtime-dependencies -maxdepth 1 -type f -name '*.whl' | wc -l | tr -d ' ')" = "${expected_count}"
      - name: Prepare the allowlisted offline runtime-real context
        shell: bash
        run: |
          set -euo pipefail
          wheel_path="$(find input/wheel -maxdepth 1 -type f -name '*.whl' -print)"
          wheel_name="$(basename "${wheel_path}")"
          wheel_sha256="sha256:$(sha256sum "${wheel_path}" | cut -d' ' -f1)"
          wheel_size="$(wc -c <"${wheel_path}" | tr -d ' ')"
          plan=input/plan/resolved-plan.json
          task="$(jq -c --arg id "${TASK_ID}" '.image_tasks[] | select(.task_id == $id)' "${plan}")"
          auth=out/real-image-authority.json
          base=out/base-record-real.json
          # Extract sealed source/build bindings embedded in the builder-candidate wheel.
          whl_build="$(unzip -p "${wheel_path}" '*.dist-info/ucm-build.json')"
          whl_authority="$(unzip -p "${wheel_path}" '*.dist-info/ucm-build-authority.json')"
          whl_closure="$(unzip -p "${wheel_path}" '*.dist-info/ucm-dependency-closure.json')"
          source_date_epoch="$(printf '%s' "${whl_build}" | jq -r '.source_date_epoch')"
          whl_build_key="$(printf '%s' "${whl_build}" | jq -r '.build_key')"
          source_repo="$(jq -r '.source.repository' "${plan}")"
          source_commit="$(jq -r '.source.commit' "${plan}")"
          source_tree="$(printf '%s' "${whl_authority}" | jq -r '.source_tree')"
          source_archive_sha256="$(printf '%s' "${whl_authority}" | jq -r '.source_archive_sha256')"
