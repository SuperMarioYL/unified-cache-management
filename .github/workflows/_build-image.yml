            github.ref_protected == true
          }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.task.outputs.internal_oci_artifact }}
          path: out/full-oci-artifact/
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          retention-days: 90
