      - name: Build runtime-real OCI and record archive checksum
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(jq -r '.payload.source_date_epoch' context/image-recipe.json)"
          export SOURCE_DATE_EPOCH
          recipe_sha256="$(jq -r '.payload_sha256' context/image-recipe.json)"
          task_sha256="$(jq -r '.payload.task_sha256' context/image-recipe.json)"
          target_platform="$(jq -r '.payload.target_platform' context/image-recipe.json)"
