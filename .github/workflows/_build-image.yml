          jq -cnS --argjson task "$(jq -c '.' "${auth}")" --argjson base "$(jq -c '.' "${base}")" --argjson deps "${deps}" \
            --argjson identity "${identity}" --arg build_key "${build_key}" --arg dep_lock_sha256 "${dep_lock_sha256}" \
            --arg preinstall "${preinstall}" --arg pip_command "${pip_command}" \
            '{schema_version:1,kind:"ucm-real-image-source-authority",candidate_kind:"real-candidate",fixture_only:false,unpublished:true,publication_attempted:false,task:$task,base:$base,runtime_dependencies:$deps,dependency_lock:{sha256:$dep_lock_sha256,preinstall_command:($preinstall|fromjson),pip_command:($pip_command|fromjson)},build_key_inputs:$identity,build_key_sha256:$build_key}' \
            >context/image-authority.json
