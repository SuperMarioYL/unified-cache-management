name: Reusable trusted UCM production release controller

on:
  workflow_call:
    inputs:
      control_sha:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      tag_name:
        type: string
        required: true
      tag_object_sha:
        type: string
        required: true
      candidate_run_id:
        type: string
        required: true
      candidate_run_attempt:
        type: string
        required: true
      candidate_artifact_name:
        type: string
        required: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      stage: ${{ steps.outputs.outputs.stage }}
      candidate_sha256: ${{ steps.outputs.outputs.candidate_sha256 }}
      source_identity_b64: ${{ steps.outputs.outputs.source_identity_b64 }}
      trusted_identity_b64: ${{ steps.outputs.outputs.trusted_identity_b64 }}
      source_date_epoch: ${{ steps.outputs.outputs.source_date_epoch }}
      baseline_deployment_id: ${{ steps.baseline.outputs.baseline_deployment_id }}
    steps:
      - name: Validate reusable controller identities before checkout
        env:
          CONTROL_SHA: ${{ inputs.control_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TAG_OBJECT_SHA: ${{ inputs.tag_object_sha }}
          TAG_NAME: ${{ inputs.tag_name }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
        shell: bash
        run: |
          set -euo pipefail
          for value in "${CONTROL_SHA}" "${SOURCE_SHA}" "${TAG_OBJECT_SHA}"; do
            [[ "${value}" =~ ^[0-9a-f]{40}$ ]]
          done
          [[ "${CANDIDATE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${CANDIDATE_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          [[ "${CANDIDATE_ARTIFACT_NAME}" =~ ^ucm-production-candidate-[1-9][0-9]*-[0-9a-f]{40}-[0-9a-f]{40}-[1-9][0-9]*-[1-9][0-9]*$ ]]
          case "${TAG_NAME}" in draft/v*|v*) ;; *) exit 2 ;; esac
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.control_sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Download only the trusted triggering Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.candidate_artifact_name }}
          path: input/candidate-artifact
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - id: outputs
        name: Reopen exact candidate and project closed outputs
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          PYTHONPATH=control/.github/release/production python -m ucm_release_production trusted identity \
            --repository "${GITHUB_REPOSITORY}" --run-id "${CANDIDATE_RUN_ID}" \
            --output out/trusted-identity.json
          PYTHONPATH=control/.github/release/production python -m ucm_release_production trusted reopen-candidate \
            --identity out/trusted-identity.json --artifact-dir input/candidate-artifact \
            --output-dir out/reopened
          PYTHONPATH=control/.github/release/production python -m ucm_release_production workflow-data candidate-outputs \
            --candidate out/reopened/verified-envelope.json --github-output "${GITHUB_OUTPUT}"
          trusted_identity_b64="$(base64 <out/trusted-identity.json | tr -d '\n')"
          echo "trusted_identity_b64=${trusted_identity_b64}" >>"${GITHUB_OUTPUT}"
      - id: baseline
        name: Snapshot prior Environment deployment id before approval
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(curl --request GET --fail --silent --show-error --retry 3 --max-redirs 0 \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments?environment=release-production&per_page=100" \
            | python -c 'import json,sys; value=json.load(sys.stdin); print(max([item["id"] for item in value if type(item.get("id")) is int], default=0))')"
          [[ "${baseline}" =~ ^[0-9]+$ ]]
          echo "baseline_deployment_id=${baseline}" >>"${GITHUB_OUTPUT}"
      - name: Upload trusted preflight bridge
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-preflight-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}
          path: |
            out/trusted-identity.json
            out/reopened/verified-envelope.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  rebuild-wheels:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        spec_id:
          - cuda130-amd64
          - cuda130-arm64
          - cann900-a2-amd64
          - cann900-a2-arm64
          - cann900-a3-amd64
          - cann900-a3-arm64
    permissions:
      contents: read
    uses: ./.github/workflows/_production-build-wheel.yml
    with:
      control_sha: ${{ inputs.control_sha }}
      source_sha: ${{ inputs.source_sha }}
      tag_name: ${{ inputs.tag_name }}
      spec_id: ${{ matrix.spec_id }}
      candidate_run_id: ${{ inputs.candidate_run_id }}
      candidate_run_attempt: ${{ inputs.candidate_run_attempt }}
      source_identity_b64: ${{ needs.preflight.outputs.source_identity_b64 }}
      cache_namespace: trusted

  compare-and-plan:
    needs: [preflight, rebuild-wheels]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      publish_plan_sha256: ${{ steps.plan.outputs.publish_plan_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.control_sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Download candidate and trusted identity bridge
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.candidate_artifact_name }}
          path: input/candidate-artifact
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Decode trusted identity
        env:
          TRUSTED_IDENTITY_B64: ${{ needs.preflight.outputs.trusted_identity_b64 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out trusted
          printf '%s' "${TRUSTED_IDENTITY_B64}" | base64 --decode >out/trusted-identity.json
          PYTHONPATH=control/.github/release/production python -m ucm_release_production trusted reopen-candidate \
            --identity out/trusted-identity.json --artifact-dir input/candidate-artifact \
            --output-dir out/reopened
      - name: Restore CUDA amd64 trusted wheel
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: cache/trusted/wheels/cuda130-amd64
          key: production-trusted-wheel-${{ github.repository_id }}-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}-${{ inputs.control_sha }}-${{ inputs.source_sha }}-cuda130-amd64
          enableCrossOsArchive: false
          fail-on-cache-miss: true
      - name: Restore CUDA arm64 trusted wheel
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: cache/trusted/wheels/cuda130-arm64
          key: production-trusted-wheel-${{ github.repository_id }}-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}-${{ inputs.control_sha }}-${{ inputs.source_sha }}-cuda130-arm64
          enableCrossOsArchive: false
          fail-on-cache-miss: true
      - name: Restore CANN A2 amd64 trusted wheel
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: cache/trusted/wheels/cann900-a2-amd64
          key: production-trusted-wheel-${{ github.repository_id }}-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}-${{ inputs.control_sha }}-${{ inputs.source_sha }}-cann900-a2-amd64
          enableCrossOsArchive: false
          fail-on-cache-miss: true
      - name: Restore CANN A2 arm64 trusted wheel
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: cache/trusted/wheels/cann900-a2-arm64
          key: production-trusted-wheel-${{ github.repository_id }}-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}-${{ inputs.control_sha }}-${{ inputs.source_sha }}-cann900-a2-arm64
          enableCrossOsArchive: false
          fail-on-cache-miss: true
      - name: Restore CANN A3 amd64 trusted wheel
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: cache/trusted/wheels/cann900-a3-amd64
          key: production-trusted-wheel-${{ github.repository_id }}-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}-${{ inputs.control_sha }}-${{ inputs.source_sha }}-cann900-a3-amd64
          enableCrossOsArchive: false
          fail-on-cache-miss: true
      - name: Restore CANN A3 arm64 trusted wheel
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: cache/trusted/wheels/cann900-a3-arm64
          key: production-trusted-wheel-${{ github.repository_id }}-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}-${{ inputs.control_sha }}-${{ inputs.source_sha }}-cann900-a3-arm64
          enableCrossOsArchive: false
          fail-on-cache-miss: true
      - id: plan
        name: Compare six wheel rebuilds and seal no-write plan
        env:
          REPOSITORY_ID: ${{ github.repository_id }}
        shell: bash
        run: |
          set -euo pipefail
          for spec in cuda130-amd64 cuda130-arm64 cann900-a2-amd64 cann900-a2-arm64 cann900-a3-amd64 cann900-a3-arm64; do
            mkdir -p "trusted/${spec}"
            cp cache/trusted/wheels/${spec}/uc_manager_*.whl "trusted/${spec}/"
          done
          PYTHONPATH=control/.github/release/production python -m ucm_release_production trusted compare-wheels \
            --candidate-zip input/candidate-artifact/candidate.zip \
            --identity out/trusted-identity.json --trusted-root trusted \
            --output out/wheel-comparison.json
          PYTHONPATH=control/.github/release/production python -m ucm_release_production tag parse \
            --config control/.github/release/production/production-release.json \
            --tag "${{ inputs.tag_name }}" --output out/tag-intent.json
          PYTHONPATH=control/.github/release/production python -m ucm_release_production plan \
            --config control/.github/release/production/production-release.json \
            --intent out/tag-intent.json \
            --candidate out/reopened/verified-envelope.json \
            --repository "${GITHUB_REPOSITORY}" --repository-id "${REPOSITORY_ID}" \
            --output out/publish-plan.json
          python - <<'PY'
          import json
          import os
          value = json.load(open('out/publish-plan.json'))
          if value['publishable'] is not True:
              raise SystemExit('production publish plan is blocked')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"publish_plan_sha256={value['sha256']}\n")
          PY
      - name: Upload trusted comparison and no-write plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-plan-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}
          path: |
            out/wheel-comparison.json
            out/publish-plan.json
          if-no-files-found: warn
          overwrite: false
          retention-days: 90

  publish-members:
    needs: [preflight, compare-and-plan]
    strategy:
      fail-fast: false
      matrix:
        spec_id:
          - cuda130-amd64
          - cuda130-arm64
          - cann900-a2-amd64
          - cann900-a2-arm64
          - cann900-a3-amd64
          - cann900-a3-arm64
    permissions:
      actions: read
      contents: read
      packages: write
    uses: ./.github/workflows/_production-publish-image-member.yml
    with:
      control_sha: ${{ inputs.control_sha }}
      source_sha: ${{ inputs.source_sha }}
      tag_name: ${{ inputs.tag_name }}
      tag_object_sha: ${{ inputs.tag_object_sha }}
      candidate_run_id: ${{ inputs.candidate_run_id }}
      candidate_run_attempt: ${{ inputs.candidate_run_attempt }}
      candidate_artifact_name: ${{ inputs.candidate_artifact_name }}
      spec_id: ${{ matrix.spec_id }}
      source_identity_b64: ${{ needs.preflight.outputs.source_identity_b64 }}
      trusted_identity_b64: ${{ needs.preflight.outputs.trusted_identity_b64 }}
      source_date_epoch: ${{ needs.preflight.outputs.source_date_epoch }}

  publish-indexes-and-chart:
    needs: [preflight, compare-and-plan, publish-members]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release-production
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      CRANE_VERSION: v0.20.3
      CRANE_LINUX_AMD64_SHA256: 36c67a932f489b3f2724b64af90b599a8ef2aa7b004872597373c0ad694dc059
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.control_sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.15.3
      - name: Download candidate aggregate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.candidate_artifact_name }}
          path: input/candidate-artifact
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Download exact six member records
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: production-member-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}-*
          path: input/members
          merge-multiple: false
      - name: Reopen candidate and prepare index/Chart requests
        env:
          TRUSTED_IDENTITY_B64: ${{ needs.preflight.outputs.trusted_identity_b64 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          printf '%s' "${TRUSTED_IDENTITY_B64}" | base64 --decode >out/trusted-identity.json
          PYTHONPATH=control/.github/release/production python -m ucm_release_production trusted reopen-candidate \
            --identity out/trusted-identity.json --artifact-dir input/candidate-artifact \
            --output-dir input/reopened
          PYTHONPATH=control/.github/release/production python -m ucm_release_production workflow-data channel-requests \
            --config control/.github/release/production/production-release.json \
            --candidate input/reopened/verified-envelope.json --candidate-root input/reopened/candidate \
            --member-root input/members --output-dir out/requests
      - name: Install checksum-pinned crane and authenticate GHCR
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/ucm-production-index-auth
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/crane" "${DOCKER_CONFIG}"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/crane.tar.gz" \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_LINUX_AMD64_SHA256}  ${RUNNER_TEMP}/crane.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/crane.tar.gz" -C "${RUNNER_TEMP}/crane" crane
          echo "${RUNNER_TEMP}/crane" >>"${GITHUB_PATH}"
          printf '%s' "${GITHUB_TOKEN}" | "${RUNNER_TEMP}/crane/crane" auth login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin
          printf '%s' "${GITHUB_TOKEN}" | helm registry login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin
      - name: Publish and reread three immutable indexes and optional Chart
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/ucm-production-index-auth
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/channels
          for profile in cuda130 cann900-a2 cann900-a3; do
            PYTHONPATH=control/.github/release/production python -m ucm_release_production publish index \
              --request "out/requests/index-${profile}.json" --output "out/channels/index-${profile}.json"
          done
          if [[ -f out/requests/chart.json ]]; then
            PYTHONPATH=control/.github/release/production python -m ucm_release_production publish chart \
              --request out/requests/chart.json --output out/channels/chart.json
          fi
      - name: Remove Registry credentials
        if: ${{ always() }}
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/ucm-production-index-auth
        shell: bash
        run: |
          set -euo pipefail
          crane auth logout ghcr.io || true
          helm registry logout ghcr.io || true
          rm -rf "${DOCKER_CONFIG}"
      - name: Upload index and Chart evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-channels-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}
          path: out/channels/
          if-no-files-found: warn
          overwrite: false
          retention-days: 90

  publish-release:
    needs: [preflight, compare-and-plan, publish-members, publish-indexes-and-chart]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release-production
    permissions:
      actions: read
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.control_sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Download candidate aggregate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.candidate_artifact_name }}
          path: input/candidate-artifact
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Download member records
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: production-member-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}-*
          path: input/channels/members
      - name: Download index and Chart records
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: production-channels-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}
          path: input/channels/aggregate
      - name: Reopen candidate and Environment deployment evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRUSTED_IDENTITY_B64: ${{ needs.preflight.outputs.trusted_identity_b64 }}
          STAGE: ${{ needs.preflight.outputs.stage }}
          BASELINE_DEPLOYMENT_ID: ${{ needs.preflight.outputs.baseline_deployment_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          printf '%s' "${TRUSTED_IDENTITY_B64}" | base64 --decode >out/trusted-identity.json
          PYTHONPATH=control/.github/release/production python -m ucm_release_production trusted reopen-candidate \
            --identity out/trusted-identity.json --artifact-dir input/candidate-artifact \
            --output-dir input/reopened
          PYTHONPATH=control/.github/release/production python -m ucm_release_production evidence environment \
            --repository "${GITHUB_REPOSITORY}" --source-sha "${{ inputs.source_sha }}" \
            --control-sha "${{ inputs.control_sha }}" --control-ref "${DEFAULT_BRANCH}" \
            --tag-name "${{ inputs.tag_name }}" --environment release-production \
            --stage "${STAGE}" --minimum-deployment-id "${BASELINE_DEPLOYMENT_ID}" \
            --output out/environment.json
          PYTHONPATH=control/.github/release/production python -m ucm_release_production workflow-data release-request \
            --candidate input/reopened/verified-envelope.json --candidate-root input/reopened/candidate \
            --environment out/environment.json --channel-root input/channels \
            --assets-dir out/assets --output out/release-request.json
      - name: Publish and reread GitHub Draft or Pre-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=control/.github/release/production python -m ucm_release_production publish release \
            --request out/release-request.json --output out/release-record.json
      - name: Upload GitHub Release and Environment evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-release-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}
          path: |
            out/environment.json
            out/release-record.json
            out/release-request.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  evidence:
    needs: [preflight, compare-and-plan, publish-members, publish-indexes-and-chart, publish-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.control_sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Download trusted preflight
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: production-preflight-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}
          path: input/preflight
      - name: Download member records
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: production-member-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}-*
          path: input/channels/members
      - name: Download index and Chart records
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: production-channels-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}
          path: input/channels/aggregate
      - name: Download Release record and Environment evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: production-release-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}
          path: input/release
      - name: Assemble canonical production evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          PYTHONPATH=control/.github/release/production python -m ucm_release_production workflow-data channels-list \
            --channel-root input/channels --release-record input/release/release-record.json \
            --output out/channels.json
          PYTHONPATH=control/.github/release/production python -m ucm_release_production evidence assemble \
            --identity input/preflight/trusted-identity.json \
            --candidate input/preflight/reopened/verified-envelope.json \
            --environment input/release/environment.json --channels out/channels.json \
            --output out/evidence.json
          PYTHONPATH=control/.github/release/production python -m ucm_release_production evidence summary \
            --evidence out/evidence.json --output out/summary.md
          cat out/summary.md >>"${GITHUB_STEP_SUMMARY}"
      - name: Upload final production evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-evidence-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}
          path: |
            out/evidence.json
            out/summary.md
          if-no-files-found: error
          overwrite: false
          retention-days: 90
