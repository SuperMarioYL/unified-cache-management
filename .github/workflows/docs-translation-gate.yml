name: UCM Documentation Translation Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: docs-translation-gate-${{ github.repository_id }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sync:
    name: Docs translation synchronized
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Classify pull request documentation changes
        id: classify
        uses: actions/github-script@v7.0.1
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const relevant = files.some(({filename}) =>
              filename.startsWith('docs-next/docs/en/') ||
              filename.startsWith('docs-next/docs/zh/') ||
              filename === 'docs-next/translation-glossary.json' ||
              filename === 'docs-next/translation-required.txt' ||
              filename === 'docs-next/translation-state.json'
            );
            core.setOutput('docs_changed', relevant ? 'true' : 'false');

      - name: Check out trusted validation code
        if: steps.classify.outputs.docs_changed == 'true'
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize only pull request documentation through the GitHub API
        if: steps.classify.outputs.docs_changed == 'true'
        env:
          BASE_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/aw/stage-pr-docs.mjs

      - name: Set up Python
        if: steps.classify.outputs.docs_changed == 'true'
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install trusted documentation dependencies
        if: steps.classify.outputs.docs_changed == 'true'
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          -r docs-next/requirements-translation.txt

      - name: Require synchronized Chinese critical paths
        if: steps.classify.outputs.docs_changed == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python docs-next/tools/site.py translate check
          --base-ref "${BASE_SHA}"

      - name: Strictly build both languages
        if: steps.classify.outputs.docs_changed == 'true'
        working-directory: docs-next
        run: python tools/site.py validate
