name: Develop release dry-run v2

on:
  workflow_run:
    workflows: [Push Commit Checks]
    branches: [develop]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: develop-release-dry-run-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  develop-preview:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Fetch first trusted main control ref
        env:
          CONFIGURED_MAIN: main
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --request GET --fail --silent --show-error --retry 3 --max-redirs 0 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/git/ref/heads/${CONFIGURED_MAIN}" \
            --output "$RUNNER_TEMP/main-ref-first.json"

      - name: Fetch second trusted main control ref
        env:
          CONFIGURED_MAIN: main
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --request GET --fail --silent --show-error --retry 3 --max-redirs 0 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/git/ref/heads/${CONFIGURED_MAIN}" \
            --output "$RUNNER_TEMP/main-ref-second.json"

      - name: Validate trusted controller and develop source event
        id: control
        env:
          CONFIGURED_MAIN: main
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          def reject_duplicates(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise SystemExit(f"main ref response contains duplicate key: {key}")
                  value[key] = item
              return value

          def observed(path, label):
              value = json.loads(path.read_text(encoding="utf-8"), object_pairs_hook=reject_duplicates)
              if not isinstance(value, dict) or value.get("ref") != "refs/heads/main":
                  raise SystemExit(f"{label} main ref response is invalid")
              target = value.get("object")
              if not isinstance(target, dict) or target.get("type") != "commit":
                  raise SystemExit(f"{label} main ref target is not a commit")
              sha = target.get("sha")
              if not isinstance(sha, str) or not re.fullmatch(r"[0-9a-f]{40}", sha):
                  raise SystemExit(f"{label} main ref SHA is invalid")
              return sha

          if os.environ["CONFIGURED_MAIN"] != "main" or os.environ["DEFAULT_BRANCH"] != "main" or os.environ["GITHUB_REF"] != "refs/heads/main" or os.environ["GITHUB_REF_NAME"] != "main":
              raise SystemExit("develop controller must run from default main")
          if os.environ["EVENT_REPOSITORY"] != "SuperMarioYL/unified-cache-management":
              raise SystemExit("develop controller repository is outside the validation allowlist")
          if os.environ["WORKFLOW_NAME"] != "Push Commit Checks":
              raise SystemExit("develop controller requires Push Commit Checks")
          if os.environ["WORKFLOW_EVENT"] != "push":
              raise SystemExit("develop source workflow event must be push")
          if os.environ["WORKFLOW_PATH"] != ".github/workflows/push-check.yml@develop":
              raise SystemExit("develop source workflow path must be push-check at develop")
          if os.environ["WORKFLOW_CONCLUSION"] != "success":
              raise SystemExit("develop source workflow conclusion must be success")
          if os.environ["HEAD_BRANCH"] != "develop" or os.environ["HEAD_REPOSITORY"] != os.environ["EVENT_REPOSITORY"]:
              raise SystemExit("develop source must be same-repository develop")
          source_sha = os.environ["HEAD_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", source_sha):
              raise SystemExit("develop source head SHA is invalid")
          first = observed(Path(os.environ["RUNNER_TEMP"]) / "main-ref-first.json", "first")
          second = observed(Path(os.environ["RUNNER_TEMP"]) / "main-ref-second.json", "second")
          if first != second or first != os.environ["WORKFLOW_SHA"]:
              raise SystemExit("workflow_sha must equal two identical main ref reads")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"control_sha={first}\n")
              output.write(f"source_sha={source_sha}\n")
          PY

      - name: Checkout immutable trusted default-main control revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.control.outputs.control_sha }}
          path: control
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Generate and validate develop lifecycle preview
        env:
          RUN_NUMBER: ${{ github.run_number }}
          SOURCE_SHA: ${{ steps.control.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p preview
          PYTHONPATH=control/.github/release/v2 python -m ucm_release_v2 lifecycle plan \
            --stage develop \
            --trigger push \
            --ref refs/heads/develop \
            --source-sha "$SOURCE_SHA" \
            --repository-role validation \
            --run-number "$RUN_NUMBER" \
            --output preview/lifecycle-plan.json \
            --config control/.github/release/v2/release.yaml
          PYTHONPATH=control/.github/release/v2 python -m ucm_release_v2 lifecycle validate \
            --plan preview/lifecycle-plan.json \
            --config control/.github/release/v2/release.yaml \
            > preview/lifecycle-plan-validation.json

      - name: Write develop preview summary
        env:
          SOURCE_SHA: ${{ steps.control.outputs.source_sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads(Path("preview/lifecycle-plan.json").read_text(encoding="utf-8"))
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "## Develop release dry-run v2\n\n"
              f"- source SHA: `{os.environ['SOURCE_SHA']}`\n"
              f"- plan digest: `{plan['sha256']}`\n"
              "- controller: default branch `main`\n"
              "- source conclusion: `success`\n"
              "- publication: blocked (dry-run)\n",
              encoding="utf-8",
          )
          PY

      - name: Upload develop preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: develop-release-dry-run-${{ github.run_number }}-${{ steps.control.outputs.source_sha }}
          path: preview/
          retention-days: 14
          if-no-files-found: error
