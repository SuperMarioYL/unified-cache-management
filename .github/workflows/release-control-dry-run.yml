name: Release control dry-run v2

on:
  workflow_call:
    inputs:
      operation:
        description: Exact dry-run operation selected by the data-only caller
        required: true
        type: string
      environment:
        description: Simulated target environment
        required: false
        default: ""
        type: string
      intent_json:
        description: Strict release intent JSON data
        required: false
        default: ""
        type: string
      nonce:
        description: Replay nonce data
        required: false
        default: ""
        type: string
      stage:
        description: Protected release stage data
        required: false
        default: ""
        type: string
      source_sha:
        description: Protected release source SHA data
        required: false
        default: ""
        type: string
      inventory_json:
        description: Strict offline inventory JSON data
        required: false
        default: ""
        type: string
      promotion_json:
        description: Optional promotion evidence JSON data
        required: false
        default: ""
        type: string
      promotion_source_lifecycle_plan_json:
        description: Optional promotion source lifecycle plan JSON data
        required: false
        default: ""
        type: string
      promotion_source_manifest_json:
        description: Optional promotion source manifest JSON data
        required: false
        default: ""
        type: string
      known_issues_json:
        description: Optional known issues JSON data
        required: false
        default: ""
        type: string
      as_of:
        description: Canonical cleanup retention boundary data
        required: false
        default: ""
        type: string
      repository_role:
        description: Configured repository role data
        required: false
        default: ""
        type: string
      snapshot_json:
        description: Strict offline repository policy snapshot JSON data
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      control_sha: ${{ steps.control.outputs.control_sha }}
    steps:
      - name: Fetch first trusted main control ref
        env:
          CONFIGURED_MAIN: main
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --request GET --fail --silent --show-error --retry 3 --max-redirs 0 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/git/ref/heads/${CONFIGURED_MAIN}" \
            --output "$RUNNER_TEMP/main-ref-first.json"

      - name: Fetch second trusted main control ref
        env:
          CONFIGURED_MAIN: main
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --request GET --fail --silent --show-error --retry 3 --max-redirs 0 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/git/ref/heads/${CONFIGURED_MAIN}" \
            --output "$RUNNER_TEMP/main-ref-second.json"

      - name: Validate exact trusted reusable controller identity
        id: control
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          CONFIGURED_MAIN: main
          JOB_CONTEXT_JSON: ${{ toJSON(job) }}
          OPERATION: ${{ inputs.operation }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          def reject_duplicates(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise SystemExit(f"main ref response contains duplicate key: {key}")
                  value[key] = item
              return value

          def observed(path, label):
              value = json.loads(path.read_text(encoding="utf-8"), object_pairs_hook=reject_duplicates)
              if not isinstance(value, dict) or value.get("ref") != "refs/heads/main":
                  raise SystemExit(f"{label} main ref response is invalid")
              target = value.get("object")
              if not isinstance(target, dict) or target.get("type") != "commit":
                  raise SystemExit(f"{label} main ref target is not a commit")
              sha = target.get("sha")
              if not isinstance(sha, str) or not re.fullmatch(r"[0-9a-f]{40}", sha):
                  raise SystemExit(f"{label} main ref SHA is invalid")
              return sha

          def strict_object(raw, label):
              try:
                  value = json.loads(raw, object_pairs_hook=reject_duplicates)
              except json.JSONDecodeError as error:
                  raise SystemExit(f"{label} must be strict JSON: {error}") from error
              if not isinstance(value, dict):
                  raise SystemExit(f"{label} must be an object")
              return value

          repository = "SuperMarioYL/unified-cache-management"
          workflow_path = ".github/workflows/release-control-dry-run.yml"
          workflow_ref = "SuperMarioYL/unified-cache-management/.github/workflows/release-control-dry-run.yml@refs/heads/main"
          if os.environ["CONFIGURED_MAIN"] != "main":
              raise SystemExit("configured control branch must be main")
          if os.environ["CALLER_REPOSITORY"] != repository:
              raise SystemExit("caller repository is outside the validation allowlist")
          job_context = strict_object(os.environ["JOB_CONTEXT_JSON"], "job context")
          required_job_keys = {
              "workflow_file_path",
              "workflow_ref",
              "workflow_repository",
              "workflow_sha",
          }
          if not required_job_keys <= set(job_context):
              raise SystemExit("called workflow job identity fields are incomplete")
          if any(not isinstance(job_context[key], str) for key in required_job_keys):
              raise SystemExit("called workflow job identity values must be strings")
          if job_context["workflow_repository"] != repository:
              raise SystemExit("called workflow repository is outside the validation allowlist")
          if job_context["workflow_file_path"] != workflow_path:
              raise SystemExit("called workflow path is not the trusted controller")
          if job_context["workflow_ref"] != workflow_ref:
              raise SystemExit("called workflow ref is not the exact main controller")
          if os.environ["OPERATION"] not in {
              "cleanup",
              "draft-environment",
              "policy-audit",
              "protected-lifecycle",
          }:
              raise SystemExit("unknown reusable controller operation")
          workflow_sha = job_context["workflow_sha"]
          if not re.fullmatch(r"[0-9a-f]{40}", workflow_sha):
              raise SystemExit("called workflow SHA is invalid")
          first = observed(Path(os.environ["RUNNER_TEMP"]) / "main-ref-first.json", "first")
          second = observed(Path(os.environ["RUNNER_TEMP"]) / "main-ref-second.json", "second")
          if first != second or first != workflow_sha:
              raise SystemExit("called workflow SHA must equal two identical main ref reads")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"control_sha={first}\n")
          PY

  simulated-environment:
    needs: control
    if: ${{ inputs.operation == 'draft-environment' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout trusted workflow control tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.control.outputs.control_sha }}
          path: control
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Validate immutable manual identity
        id: identity
        env:
          INTENT_JSON: ${{ inputs.intent_json }}
          NONCE: ${{ inputs.nonce }}
        run: |
          set -euo pipefail
          mkdir -p preview
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          def reject_duplicates(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise SystemExit(f"intent_json contains duplicate key: {key}")
                  value[key] = item
              return value

          intent = json.loads(
              os.environ["INTENT_JSON"],
              object_pairs_hook=reject_duplicates,
          )
          if not isinstance(intent, dict) or set(intent) != {"source_sha", "stage", "version"}:
              raise SystemExit("intent_json must contain exactly source_sha, stage, version")
          source_sha = intent["source_sha"]
          nonce = os.environ["NONCE"]
          if not isinstance(source_sha, str) or not re.fullmatch(r"[0-9a-f]{40}", source_sha):
              raise SystemExit("intent source_sha must be exactly 40 lowercase hexadecimal characters")
          if intent["stage"] != "draft":
              raise SystemExit("intent stage must be draft")
          if not re.fullmatch(r"[0-9a-f]{32}", nonce):
              raise SystemExit("nonce must be exactly 32 lowercase hexadecimal characters")
          Path("preview/release-intent.json").write_text(
              json.dumps(intent, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"source_sha={source_sha}\n")
          PY

      - name: Generate Draft plan
        env:
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
        run: |
          set -euo pipefail
          PYTHONPATH=control/.github/release/v2 python -m ucm_release_v2 lifecycle plan \
            --stage draft \
            --trigger workflow_dispatch \
            --ref refs/heads/main \
            --source-sha "$SOURCE_SHA" \
            --repository-role production \
            --intent preview/release-intent.json \
            --output preview/lifecycle-plan.json \
            --config control/.github/release/v2/release.yaml
          PYTHONPATH=control/.github/release/v2 python -m ucm_release_v2 lifecycle validate \
            --plan preview/lifecycle-plan.json \
            --config control/.github/release/v2/release.yaml \
            > preview/lifecycle-plan-validation.json

      - name: Create deterministic offline artifact fixtures
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          plan = json.loads(Path("preview/lifecycle-plan.json").read_text(encoding="utf-8"))
          base = Path("preview/fixtures")
          records = []
          for product in plan["products"]:
              if product["kind"] == "image":
                  def digest(label):
                      return "sha256:" + hashlib.sha256(label.encode()).hexdigest()
                  records.append({
                      **product,
                      "digest": digest(product["coordinate"] + ":index"),
                      "platforms": [
                          {"platform": "linux/amd64", "digest": digest(product["coordinate"] + ":amd64")},
                          {"platform": "linux/arm64", "digest": digest(product["coordinate"] + ":arm64")},
                      ],
                  })
              else:
                  relative = f"files/{product['name']}.fixture"
                  target = base / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes((product["kind"] + ":" + product["coordinate"] + "\n").encode())
                  records.append({**product, "path": relative})
          Path("preview/artifact-records.json").write_text(
              json.dumps(records, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          PYTHONPATH=control/.github/release/v2 python -m ucm_release_v2 artifacts collect \
            --lifecycle-plan preview/lifecycle-plan.json \
            --records-json preview/artifact-records.json \
            --base-dir preview/fixtures \
            --output preview/artifact-manifest.json \
            --config control/.github/release/v2/release.yaml
          PYTHONPATH=control/.github/release/v2 python -m ucm_release_v2 artifacts validate \
            --lifecycle-plan preview/lifecycle-plan.json \
            --manifest preview/artifact-manifest.json \
            --base-dir preview/fixtures \
            --config control/.github/release/v2/release.yaml \
            > preview/artifact-manifest-validation.json

      - name: Export simulate and verify environment evidence
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          NONCE: ${{ inputs.nonce }}
        run: |
          set -euo pipefail
          PYTHONPATH=control/.github/release/v2 python -m ucm_release_v2 environment export \
            --lifecycle-plan preview/lifecycle-plan.json \
            --manifest preview/artifact-manifest.json \
            --environment "$ENVIRONMENT" \
            --nonce "$NONCE" \
            --output preview/environment-test-request.json \
            --config control/.github/release/v2/release.yaml
          PYTHONPATH=control/.github/release/v2 python -m ucm_release_v2 environment simulate \
            --request preview/environment-test-request.json \
            --verdict passed \
            --output preview/environment-test-result.json \
            --config control/.github/release/v2/release.yaml
          PYTHONPATH=control/.github/release/v2 python -m ucm_release_v2 environment verify \
            --request preview/environment-test-request.json \
            --result preview/environment-test-result.json \
            --config control/.github/release/v2/release.yaml \
            > preview/environment-verification.json

      - name: Write simulated evidence summary
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          request = json.loads(Path("preview/environment-test-request.json").read_text(encoding="utf-8"))
          result = json.loads(Path("preview/environment-test-result.json").read_text(encoding="utf-8"))
          verification = json.loads(Path("preview/environment-verification.json").read_text(encoding="utf-8"))
          summary = (
              "## Draft environment dry-run v2\n\n"
              f"- environment: `{os.environ['ENVIRONMENT']}`\n"
              f"- source SHA: `{os.environ['SOURCE_SHA']}`\n"
              f"- request digest: `{request['sha256']}`\n"
              f"- simulated verdict: `{result['verdict']}`\n"
              f"- production gate: `{verification['production_gate']}`\n"
              "- evidence boundary: simulated fixtures only; no accelerator, runtime, or cluster was contacted\n"
          )
          Path("preview/summary.md").write_text(summary, encoding="utf-8")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(summary, encoding="utf-8")
          PY

      - name: Upload simulated environment package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: draft-environment-${{ inputs.environment }}-${{ steps.identity.outputs.source_sha }}-${{ inputs.nonce }}
          path: |
            preview/lifecycle-plan.json
            preview/artifact-manifest.json
            preview/environment-test-request.json
            preview/environment-test-result.json
            preview/environment-verification.json
            preview/summary.md
          retention-days: 30
          if-no-files-found: error

  release-preview:
    needs: control
    if: ${{ inputs.operation == 'protected-lifecycle' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout trusted workflow control tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.control.outputs.control_sha }}
          path: control
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Normalize untrusted JSON inputs without shell interpolation
        env:
          INTENT_JSON: ${{ inputs.intent_json }}
          INVENTORY_JSON: ${{ inputs.inventory_json }}
          KNOWN_ISSUES_JSON: ${{ inputs.known_issues_json }}
          PROMOTION_JSON: ${{ inputs.promotion_json }}
          PROMOTION_SOURCE_LIFECYCLE_PLAN_JSON: ${{ inputs.promotion_source_lifecycle_plan_json }}
          PROMOTION_SOURCE_MANIFEST_JSON: ${{ inputs.promotion_source_manifest_json }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          STAGE: ${{ inputs.stage }}
        run: |
          set -euo pipefail
          mkdir -p preview
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          def reject_duplicates(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError(f"duplicate JSON key: {key}")
                  value[key] = item
              return value

          def loads_strict(name):
              try:
                  return json.loads(os.environ[name], object_pairs_hook=reject_duplicates)
              except (json.JSONDecodeError, ValueError) as error:
                  raise SystemExit(f"{name} must be strict JSON: {error}") from error

          stage = os.environ["STAGE"]
          source_sha = os.environ["SOURCE_SHA"]
          if stage not in {"rc", "stable", "hotfix"}:
              raise SystemExit("stage must be rc, stable, or hotfix")
          if not re.fullmatch(r"[0-9a-f]{40}", source_sha):
              raise SystemExit("source_sha must be exactly 40 lowercase hexadecimal characters")
          intent = loads_strict("INTENT_JSON")
          if not isinstance(intent, dict) or set(intent) != {"source_sha", "stage", "version"}:
              raise SystemExit("intent_json must contain exactly source_sha, stage, version")
          if intent["stage"] != stage or intent["source_sha"] != source_sha:
              raise SystemExit("intent_json stage/source_sha must match dispatch inputs")
          documents = {
              "release-intent.json": intent,
              "release-inventory.json": loads_strict("INVENTORY_JSON"),
              "known-issues.json": loads_strict("KNOWN_ISSUES_JSON"),
          }
          promotion_raw = os.environ["PROMOTION_JSON"]
          if promotion_raw.strip():
              documents["promotion-evidence.json"] = loads_strict("PROMOTION_JSON")
          source_plan_raw = os.environ["PROMOTION_SOURCE_LIFECYCLE_PLAN_JSON"]
          source_manifest_raw = os.environ["PROMOTION_SOURCE_MANIFEST_JSON"]
          if bool(source_plan_raw.strip()) != bool(source_manifest_raw.strip()):
              raise SystemExit("promotion source lifecycle plan and manifest must be provided together")
          if source_plan_raw.strip() and not promotion_raw.strip():
              raise SystemExit("promotion source anchors require promotion evidence")
          if source_plan_raw.strip():
              documents["promotion-source-lifecycle-plan.json"] = loads_strict("PROMOTION_SOURCE_LIFECYCLE_PLAN_JSON")
              documents["promotion-source-manifest.json"] = loads_strict("PROMOTION_SOURCE_MANIFEST_JSON")
          for filename, value in documents.items():
              Path("preview", filename).write_text(
                  json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Generate and reopen protected lifecycle plan
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          STAGE: ${{ inputs.stage }}
        run: |
          set -euo pipefail
          PYTHONPATH=control/.github/release/v2 python -m ucm_release_v2 lifecycle plan \
            --stage "$STAGE" \
            --trigger workflow_dispatch \
            --ref refs/heads/main \
            --source-sha "$SOURCE_SHA" \
            --repository-role production \
            --intent preview/release-intent.json \
            --output preview/lifecycle-plan.json \
            --config control/.github/release/v2/release.yaml
          PYTHONPATH=control/.github/release/v2 python -m ucm_release_v2 lifecycle validate \
            --plan preview/lifecycle-plan.json \
            --config control/.github/release/v2/release.yaml \
            > preview/lifecycle-plan-validation.json

      - name: Create deterministic offline artifact fixtures
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def digest(label):
              return "sha256:" + hashlib.sha256(label.encode()).hexdigest()

          plan = json.loads(Path("preview/lifecycle-plan.json").read_text(encoding="utf-8"))
          base = Path("preview/fixtures")
          records = []
          for product in plan["products"]:
              if product["kind"] == "image":
                  records.append({
                      **product,
                      "digest": digest("index:" + product["coordinate"]),
                      "platforms": [
                          {"platform": "linux/amd64", "digest": digest("amd64:" + product["coordinate"])},
                          {"platform": "linux/arm64", "digest": digest("arm64:" + product["coordinate"])},
                      ],
                  })
              else:
                  suffix = ".tgz" if product["kind"] == "chart" else ".whl"
                  relative = f"files/{product['name']}-{plan['version']}{suffix}"
                  target = base / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes((product["kind"] + ":" + product["coordinate"] + "\n").encode())
                  records.append({**product, "path": relative})
          Path("preview/artifact-records.json").write_text(
              json.dumps(records, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          PYTHONPATH=control/.github/release/v2 python -m ucm_release_v2 artifacts collect \
            --lifecycle-plan preview/lifecycle-plan.json \
            --records-json preview/artifact-records.json \
            --base-dir preview/fixtures \
            --output preview/artifact-manifest.json \
            --config control/.github/release/v2/release.yaml
          PYTHONPATH=control/.github/release/v2 python -m ucm_release_v2 artifacts validate \
            --lifecycle-plan preview/lifecycle-plan.json \
            --manifest preview/artifact-manifest.json \
            --base-dir preview/fixtures \
            --config control/.github/release/v2/release.yaml \
            > preview/artifact-manifest-validation.json

      - name: Reconcile the offline inventory without execution
        run: |
          set -euo pipefail
          reconcile_args=(
            --lifecycle-plan preview/lifecycle-plan.json
            --manifest preview/artifact-manifest.json
            --inventory preview/release-inventory.json
            --output preview/reconcile-plan.json
            --config control/.github/release/v2/release.yaml
          )
          if [[ -f preview/promotion-evidence.json ]]; then
            reconcile_args+=(--promotion preview/promotion-evidence.json)
          fi
          if [[ -f preview/promotion-source-lifecycle-plan.json ]]; then
            reconcile_args+=(--promotion-source-lifecycle-plan preview/promotion-source-lifecycle-plan.json)
            reconcile_args+=(--promotion-source-manifest preview/promotion-source-manifest.json)
          fi
          PYTHONPATH=control/.github/release/v2 python -m ucm_release_v2 reconcile plan "${reconcile_args[@]}"

      - name: Render release preview Markdown
        run: |
          set -euo pipefail
          render_args=(
            --lifecycle-plan preview/lifecycle-plan.json
            --manifest preview/artifact-manifest.json
            --inventory preview/release-inventory.json
            --reconcile-plan preview/reconcile-plan.json
            --known-issues-json preview/known-issues.json
            --output preview/release-preview.md
            --config control/.github/release/v2/release.yaml
          )
          if [[ -f preview/promotion-evidence.json ]]; then
            render_args+=(--promotion preview/promotion-evidence.json)
          fi
          if [[ -f preview/promotion-source-lifecycle-plan.json ]]; then
            render_args+=(--promotion-source-lifecycle-plan preview/promotion-source-lifecycle-plan.json)
            render_args+=(--promotion-source-manifest preview/promotion-source-manifest.json)
          fi
          PYTHONPATH=control/.github/release/v2 python -m ucm_release_v2 release render "${render_args[@]}"

      - name: Write release preview summary
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          preview = Path("preview/release-preview.md").read_text(encoding="utf-8")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(preview, encoding="utf-8")
          PY

      - name: Upload protected release preview package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: protected-release-dry-run-${{ inputs.stage }}-${{ inputs.source_sha }}-${{ github.run_number }}
          path: |
            preview/lifecycle-plan.json
            preview/artifact-manifest.json
            preview/reconcile-plan.json
            preview/release-preview.md
            preview/release-inventory.json
            preview/known-issues.json
            preview/promotion-evidence.json
            preview/promotion-source-lifecycle-plan.json
            preview/promotion-source-manifest.json
          retention-days: 30
          if-no-files-found: error

  cleanup-preview:
    needs: control
    if: ${{ inputs.operation == 'cleanup' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout immutable trusted workflow control revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.control.outputs.control_sha }}
          path: control
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Normalize strict offline inventory
        env:
          INVENTORY_JSON: ${{ inputs.inventory_json }}
        run: |
          set -euo pipefail
          mkdir -p preview
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def reject_duplicates(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError(f"duplicate JSON key: {key}")
                  value[key] = item
              return value

          try:
              inventory = json.loads(
                  os.environ["INVENTORY_JSON"],
                  object_pairs_hook=reject_duplicates,
              )
          except (json.JSONDecodeError, ValueError) as error:
              raise SystemExit(f"inventory_json must be strict JSON: {error}") from error
          if not isinstance(inventory, dict):
              raise SystemExit("inventory_json must be a JSON object")
          Path("preview/cleanup-inventory.json").write_text(
              json.dumps(inventory, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Generate non-executing cleanup plan
        env:
          AS_OF: ${{ inputs.as_of }}
        run: |
          set -euo pipefail
          PYTHONPATH=control/.github/release/v2 python -m ucm_release_v2 cleanup plan \
            --inventory preview/cleanup-inventory.json \
            --as-of "$AS_OF" \
            --config control/.github/release/v2/release.yaml \
            --output preview/cleanup-plan.json

      - name: Write cleanup preview summary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads(Path("preview/cleanup-plan.json").read_text(encoding="utf-8"))
          summary = plan["summary"]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "## Release cleanup dry-run v2\n\n"
              f"- plan digest: `{plan['sha256']}`\n"
              f"- delete previews: `{summary['delete_preview']}`\n"
              f"- skips: `{summary['skip']}`\n"
              f"- known failures: `{summary['would_fail']}`\n"
              "- executed: `false`\n",
              encoding="utf-8",
          )
          PY

      - name: Upload cleanup preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-cleanup-dry-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            preview/cleanup-inventory.json
            preview/cleanup-plan.json
          retention-days: 30
          if-no-files-found: error

  policy-audit:
    needs: control
    if: ${{ inputs.operation == 'policy-audit' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout immutable trusted workflow control revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.control.outputs.control_sha }}
          path: control
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Normalize strict offline policy snapshot
        env:
          SNAPSHOT_JSON: ${{ inputs.snapshot_json }}
        run: |
          set -euo pipefail
          mkdir -p preview
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def reject_duplicates(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError(f"duplicate JSON key: {key}")
                  value[key] = item
              return value

          try:
              snapshot = json.loads(
                  os.environ["SNAPSHOT_JSON"],
                  object_pairs_hook=reject_duplicates,
              )
          except (json.JSONDecodeError, ValueError) as error:
              raise SystemExit(f"snapshot_json must be strict JSON: {error}") from error
          if not isinstance(snapshot, dict):
              raise SystemExit("snapshot_json must be a JSON object")
          Path("preview/repository-policy-snapshot.json").write_text(
              json.dumps(snapshot, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Audit repository policy snapshot offline
        env:
          REPOSITORY_ROLE: ${{ inputs.repository_role }}
        run: |
          set -euo pipefail
          PYTHONPATH=control/.github/release/v2 python -m ucm_release_v2 repo-policy audit \
            --snapshot preview/repository-policy-snapshot.json \
            --repository-role "$REPOSITORY_ROLE" \
            --config control/.github/release/v2/release.yaml \
            --output preview/repository-policy-report.json

      - name: Write repository policy audit summary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path("preview/repository-policy-report.json").read_text(encoding="utf-8")
          )
          gaps = [check for check in report["checks"] if check["status"] == "gap"]
          lines = [
              "## Repository policy audit dry-run v2",
              "",
              f"- validated repository identity: `{report['observed_repository']}`",
              f"- validated expected repository identity: `{report['expected_repository']}`",
              f"- validated compliance status: `{str(report['compliant']).lower()}`",
              f"- validated report digest: `{report['sha256']}`",
              "",
              "### Gaps (free-form evidence omitted)",
              "",
          ]
          lines.extend(
              f"- `{check['id']}`: `{check['status']}`" for check in gaps
          )
          if not gaps:
              lines.append("- none")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload repository policy report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-policy-audit-dry-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            preview/repository-policy-snapshot.json
            preview/repository-policy-report.json
          retention-days: 30
          if-no-files-found: error
