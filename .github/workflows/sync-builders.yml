name: Synchronize project builder pool

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  workflow_call:
    outputs:
      builder_catalog_artifact:
        description: Same-run canonical builder catalog artifact
        value: ${{ jobs.publish-builder-catalog.outputs.builder_catalog_artifact }}

permissions:
  contents: read
  packages: write

jobs:
  discover-project-builders:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      discovery_artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - name: Discover live project builders from default branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out/discovery
          PYTHONPATH=.github/release python -m ucm_release builders discover \
            --output out/discovery/builder-catalog.json >/dev/null
          test "$(jq '[.builders[].target_repository] | unique | length' out/discovery/builder-catalog.json)" -eq 2
      - id: artifact
        run: echo "name=ucm-builder-discovery-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" >>"${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: out/discovery/builder-catalog.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7

  read-existing-builder-pool:
    needs: discover-project-builders
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      existing_artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.discover-project-builders.outputs.discovery_artifact }}
          path: input/discovery
      - name: Install checksum-pinned crane
        env:
          CRANE_VERSION: v0.20.3
          CRANE_LINUX_AMD64_SHA256: 36c67a932f489b3f2724b64af90b599a8ef2aa7b004872597373c0ad694dc059
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/crane"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/crane.tar.gz" \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_LINUX_AMD64_SHA256}  ${RUNNER_TEMP}/crane.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/crane.tar.gz" -C "${RUNNER_TEMP}/crane" crane
          test "$("${RUNNER_TEMP}/crane/crane" version)" = "${CRANE_VERSION#v}"
          echo "${RUNNER_TEMP}/crane" >>"${GITHUB_PATH}"
      - name: Authenticate to ghcr
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "${GITHUB_TOKEN}" | crane auth login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin
      - name: Read exact tags from the two catalog repositories
        run: |
          set -euo pipefail
          catalog=input/discovery/builder-catalog.json
          mkdir -p out/existing
          printf '{}\n' >out/existing/existing-tags.json
          mapfile -t repositories < <(jq -r '[.builders[].target_repository] | unique[]' "${catalog}")
          test "${#repositories[@]}" -eq 2
          for repository in "${repositories[@]}"; do
            if tags="$(crane ls "${repository}" 2>"${RUNNER_TEMP}/crane-ls.err")"; then
              tags_json="$(printf '%s\n' "${tags}" | jq -Rsc 'split("\n") | map(select(length > 0)) | sort')"
            elif grep -Eqi 'NAME_UNKNOWN|repository.*not found|404 Not Found' "${RUNNER_TEMP}/crane-ls.err"; then
              echo "::notice::missing repository ${repository}; treating its exact tag set as empty"
              tags_json='[]'
            else
              cat "${RUNNER_TEMP}/crane-ls.err" >&2
              exit 1
            fi
            jq --arg repository "${repository}" --argjson tags "${tags_json}" \
              '. + {($repository): $tags}' out/existing/existing-tags.json \
              >out/existing/existing-tags.next.json
            mv out/existing/existing-tags.next.json out/existing/existing-tags.json
          done
      - id: artifact
        run: echo "name=ucm-builder-existing-tags-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" >>"${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: out/existing/existing-tags.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7

  compute-missing-builders:
    needs: [discover-project-builders, read-existing-builder-pool]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      has_missing: ${{ steps.plan.outputs.has_missing }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.discover-project-builders.outputs.discovery_artifact }}
          path: input/discovery
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.read-existing-builder-pool.outputs.existing_artifact }}
          path: input/existing
      - id: plan
        name: Compute the missing-only dynamic matrix
        run: |
          set -euo pipefail
          mkdir -p out/plan
          PYTHONPATH=.github/release python -m ucm_release builders sync-plan \
            --catalog input/discovery/builder-catalog.json \
            --existing input/existing/existing-tags.json \
            --output out/plan/builder-sync-plan.json >/dev/null
          matrix="$(jq -c '.matrix' out/plan/builder-sync-plan.json)"
          count="$(jq '.builders | length' out/plan/builder-sync-plan.json)"
          {
            echo "matrix=${matrix}"
            if [ "${count}" -gt 0 ]; then
              echo "has_missing=true"
            else
              echo "has_missing=false"
            fi
          } >>"${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ucm-builder-sync-plan-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out/plan/builder-sync-plan.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7

  build-missing-builders:
    needs: compute-missing-builders
    if: ${{ needs.compute-missing-builders.outputs.has_missing == 'true' }}
    runs-on: ${{ matrix.cpu_arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compute-missing-builders.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install checksum-pinned crane
        env:
          CRANE_VERSION: v0.20.3
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) crane_arch=x86_64; crane_sha=36c67a932f489b3f2724b64af90b599a8ef2aa7b004872597373c0ad694dc059 ;;
            aarch64|arm64) crane_arch=arm64; crane_sha=d2235f7779cd39c6e40f43701d2512c997409f629fb53e621ede0d57d3f995e2 ;;
            *) echo "unsupported crane architecture: $(uname -m)" >&2; exit 2 ;;
          esac
          mkdir -p "${RUNNER_TEMP}/crane"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/crane.tar.gz" \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_${crane_arch}.tar.gz"
          echo "${crane_sha}  ${RUNNER_TEMP}/crane.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/crane.tar.gz" -C "${RUNNER_TEMP}/crane" crane
          test "$("${RUNNER_TEMP}/crane/crane" version)" = "${CRANE_VERSION#v}"
          echo "${RUNNER_TEMP}/crane" >>"${GITHUB_PATH}"
      - name: Authenticate to ghcr
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "${GITHUB_TOKEN}" | crane auth login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin
      - name: Build or copy the missing builder only
        env:
          BUILD_MODE: ${{ matrix.build_mode }}
          SOURCE_IMAGE: ${{ matrix.source_image }}
          TARGET_REPOSITORY: ${{ matrix.target_repository }}
          TARGET_TAG: ${{ matrix.target_tag }}
        run: |
          set -euo pipefail
          target_ref="${TARGET_REPOSITORY}:${TARGET_TAG}"
          if crane digest "${target_ref}" >/dev/null 2>&1; then
            echo "Builder appeared after planning; preserving ${target_ref}"
            exit 0
          fi
          case "${BUILD_MODE}" in
            mirror)
              crane copy "${SOURCE_IMAGE}" "${target_ref}"
              ;;
            copy)
              crane copy "${SOURCE_IMAGE}" "${target_ref}"
              ;;
            extend)
              mooncake_version="$(printf '%s' "${TARGET_TAG}" | sed -nE 's/^.*-mooncake([0-9]+\.[0-9]+\.[0-9]+)-.*$/\1/p')"
              test -n "${mooncake_version}"
              MOONCAKE_TAG="v${mooncake_version}"
              mkdir -p context/tools
              cp .github/release/docker/mooncake_installer.sh context/tools/mooncake_installer.sh
              docker build \
                --file .github/release/docker/Dockerfile.builder \
                --build-arg "CANN_BASE=${SOURCE_IMAGE}" \
                --build-arg "MOONCAKE_TAG=${MOONCAKE_TAG}" \
                --tag "${target_ref}" context
              docker push "${target_ref}"
              ;;
            *)
              echo "unsupported builder build mode: ${BUILD_MODE}" >&2
              exit 2
              ;;
          esac
          crane digest "${target_ref}"

  publish-builder-catalog:
    needs:
      - discover-project-builders
      - read-existing-builder-pool
      - compute-missing-builders
      - build-missing-builders
    if: >-
      ${{
        always() && !cancelled() &&
        needs.discover-project-builders.result == 'success' &&
        needs.read-existing-builder-pool.result == 'success' &&
        needs.compute-missing-builders.result == 'success' &&
        (needs.build-missing-builders.result == 'success' ||
         needs.build-missing-builders.result == 'skipped')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      builder_catalog_artifact: ${{ steps.publish.outputs.builder_catalog_artifact }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.discover-project-builders.outputs.discovery_artifact }}
          path: input/discovery
      - name: Install checksum-pinned crane
        env:
          CRANE_VERSION: v0.20.3
          CRANE_LINUX_AMD64_SHA256: 36c67a932f489b3f2724b64af90b599a8ef2aa7b004872597373c0ad694dc059
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/crane"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/crane.tar.gz" \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_LINUX_AMD64_SHA256}  ${RUNNER_TEMP}/crane.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/crane.tar.gz" -C "${RUNNER_TEMP}/crane" crane
          test "$("${RUNNER_TEMP}/crane/crane" version)" = "${CRANE_VERSION#v}"
          echo "${RUNNER_TEMP}/crane" >>"${GITHUB_PATH}"
      - name: Authenticate to ghcr
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "${GITHUB_TOKEN}" | crane auth login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin
      - name: Verify every catalog target is readable
        run: |
          set -euo pipefail
          while IFS= read -r target_ref; do
            crane digest "${target_ref}"
          done < <(jq -r '.builders[] | "\(.target_repository):\(.target_tag)"' input/discovery/builder-catalog.json)
      - id: publish
        run: echo "builder_catalog_artifact=ucm-builder-catalog-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" >>"${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.publish.outputs.builder_catalog_artifact }}
          path: input/discovery/builder-catalog.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7

  builder-sync-success:
    needs:
      - discover-project-builders
      - read-existing-builder-pool
      - compute-missing-builders
      - build-missing-builders
      - publish-builder-catalog
    if: >-
      ${{
        always() &&
        needs.discover-project-builders.result == 'success' &&
        needs.read-existing-builder-pool.result == 'success' &&
        needs.compute-missing-builders.result == 'success' &&
        (needs.build-missing-builders.result == 'success' ||
         needs.build-missing-builders.result == 'skipped') &&
        needs.publish-builder-catalog.result == 'success'
      }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Builder catalog synchronized and verified"
