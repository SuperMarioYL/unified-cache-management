name: PR release dry-run v2

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: pr-release-dry-run-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  pull-request-preview:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout immutable trusted workflow control revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Generate and validate PR lifecycle preview
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CONTROL_SHA: ${{ github.workflow_sha }}
          OUTPUT_DIR: ${{ runner.temp }}/pr-release-preview
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          values = {
              "base_sha": os.environ["BASE_SHA"],
              "control_sha": os.environ["CONTROL_SHA"],
              "source_sha": os.environ["SOURCE_SHA"],
          }
          if not all(re.fullmatch(r"[0-9a-f]{40}", value) for value in values.values()):
              raise SystemExit("unsafe PR source, base, or control SHA")
          output_dir = Path(os.environ["OUTPUT_DIR"])
          output_dir.joinpath("source-identity.json").write_text(
              json.dumps(values, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          PYTHONPATH=control/.github/release/v2 python -m ucm_release_v2 lifecycle plan \
            --stage pr \
            --trigger pull_request \
            --ref "refs/pull/${PR_NUMBER}/head" \
            --source-sha "$SOURCE_SHA" \
            --repository-role validation \
            --pr-number "$PR_NUMBER" \
            --config control/.github/release/v2/release.yaml \
            --output "$OUTPUT_DIR/lifecycle-plan.json"
          PYTHONPATH=control/.github/release/v2 python -m ucm_release_v2 lifecycle validate \
            --plan "$OUTPUT_DIR/lifecycle-plan.json" \
            --config control/.github/release/v2/release.yaml \
            > "$OUTPUT_DIR/lifecycle-plan-validation.json"

      - name: Write PR preview summary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CONTROL_SHA: ${{ github.workflow_sha }}
          OUTPUT_DIR: ${{ runner.temp }}/pr-release-preview
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          plan_path = Path(os.environ["OUTPUT_DIR"]) / "lifecycle-plan.json"
          plan = json.loads(plan_path.read_text(encoding="utf-8"))
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          summary.write_text(
              "## PR release dry-run v2\n\n"
              f"- source/head SHA: `{os.environ['SOURCE_SHA']}`\n"
              f"- base SHA: `{os.environ['BASE_SHA']}`\n"
              f"- workflow control SHA: `{os.environ['CONTROL_SHA']}`\n"
              f"- plan digest: `{plan['sha256']}`\n"
              "- publication: blocked (dry-run)\n",
              encoding="utf-8",
          )
          PY

      - name: Upload PR preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-release-dry-run-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/pr-release-preview/
          retention-days: 7
          if-no-files-found: error

  issue-comment-preview:
    if: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Fetch observed PR identity with read-only GET
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --request GET --fail --silent --show-error --retry 3 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/pulls/${PR_NUMBER}" \
            --output "$RUNNER_TEMP/observed-pr.json"

      - name: Checkout immutable trusted control revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Fetch current PR identity with read-only GET
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT_DIR: ${{ runner.temp }}/pr-comment-preview
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          curl --request GET --fail --silent --show-error --retry 3 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/pulls/${PR_NUMBER}" \
            --output "$OUTPUT_DIR/current-pr.json"

      - name: Validate and separate observed, current, base, and control identity
        id: identity
        env:
          CONTROL_SHA: ${{ github.workflow_sha }}
          OUTPUT_DIR: ${{ runner.temp }}/pr-comment-preview
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          observed_path = Path(os.environ["RUNNER_TEMP"]) / "observed-pr.json"
          output_dir = Path(os.environ["OUTPUT_DIR"])
          observed = json.loads(observed_path.read_text(encoding="utf-8"))
          current = json.loads(output_dir.joinpath("current-pr.json").read_text(encoding="utf-8"))
          identity = {
              "observed_sha": observed["head"]["sha"],
              "current_sha": current["head"]["sha"],
              "base_sha": current["base"]["sha"],
              "control_sha": os.environ["CONTROL_SHA"],
          }
          if not all(
              isinstance(value, str) and re.fullmatch(r"[0-9a-f]{40}", value)
              for value in identity.values()
          ):
              raise SystemExit("GitHub API returned an unsafe PR identity")
          base_ref = current["base"]["ref"]
          if not isinstance(base_ref, str) or not base_ref or "\n" in base_ref or "\r" in base_ref:
              raise SystemExit("GitHub API returned an unsafe base ref")
          identity["base_ref"] = base_ref
          output_dir.joinpath("source-identity.json").write_text(
              json.dumps(identity, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          output_dir.joinpath("observed-pr.json").write_text(
              json.dumps(observed, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              for key in ("observed_sha", "current_sha", "base_sha", "control_sha", "base_ref"):
                  output.write(f"{key}={identity[key]}\n")
          PY

      - name: Parse command without shell interpolation
        id: command
        env:
          ACTOR: ${{ github.actor }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          CURRENT_SOURCE_SHA: ${{ steps.identity.outputs.current_sha }}
          OBSERVED_SOURCE_SHA: ${{ steps.identity.outputs.observed_sha }}
          OUTPUT_DIR: ${{ runner.temp }}/pr-comment-preview
        run: |
          set -euo pipefail
          PYTHONPATH=control/.github/release/v2 python -m ucm_release_v2 command parse \
            --body-env COMMENT_BODY \
            --actor "$ACTOR" \
            --author-association "$AUTHOR_ASSOCIATION" \
            --observed-source-sha "$OBSERVED_SOURCE_SHA" \
            --current-source-sha "$CURRENT_SOURCE_SHA" \
            > "$OUTPUT_DIR/command.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          command_path = Path(os.environ["OUTPUT_DIR"]) / "command.json"
          command = json.loads(command_path.read_text(encoding="utf-8"))
          accepted = "true" if command["accepted"] else "false"
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"accepted={accepted}\n")
              output.write(f"command={command['command']}\n")
          PY

      - name: Generate and validate authorized build preview
        if: ${{ steps.command.outputs.accepted == 'true' && steps.command.outputs.command == 'build' }}
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
          OUTPUT_DIR: ${{ runner.temp }}/pr-comment-preview
          SOURCE_SHA: ${{ steps.identity.outputs.current_sha }}
        run: |
          set -euo pipefail
          PYTHONPATH=control/.github/release/v2 python -m ucm_release_v2 lifecycle plan \
            --stage pr \
            --trigger pull_request \
            --ref "refs/pull/${PR_NUMBER}/head" \
            --source-sha "$SOURCE_SHA" \
            --repository-role validation \
            --pr-number "$PR_NUMBER" \
            --config control/.github/release/v2/release.yaml \
            --output "$OUTPUT_DIR/lifecycle-plan.json"
          PYTHONPATH=control/.github/release/v2 python -m ucm_release_v2 lifecycle validate \
            --plan "$OUTPUT_DIR/lifecycle-plan.json" \
            --config control/.github/release/v2/release.yaml \
            > "$OUTPUT_DIR/lifecycle-plan-validation.json"

      - name: Write comment command summary
        if: ${{ always() }}
        env:
          BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          CONTROL_SHA: ${{ steps.identity.outputs.control_sha }}
          CURRENT_SOURCE_SHA: ${{ steps.identity.outputs.current_sha }}
          OBSERVED_SOURCE_SHA: ${{ steps.identity.outputs.observed_sha }}
          OUTPUT_DIR: ${{ runner.temp }}/pr-comment-preview
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          command_path = Path(os.environ["OUTPUT_DIR"]) / "command.json"
          if not command_path.exists():
              summary.write_text(
                  "## PR comment release dry-run v2\n\nFail closed before command parsing.\n",
                  encoding="utf-8",
              )
              raise SystemExit(0)
          command = json.loads(command_path.read_text(encoding="utf-8"))
          summary.write_text(
              "## PR comment release dry-run v2\n\n"
              "- build syntax: `/release build <40-lowerhex-sha>`\n"
              f"- command: `{command['command']}`\n"
              f"- requested head SHA: `{command.get('requested_source_sha', 'not-applicable')}`\n"
              f"- accepted: `{str(command['accepted']).lower()}`\n"
              f"- reason: `{command['reason']}`\n"
              f"- observed head SHA: `{os.environ['OBSERVED_SOURCE_SHA']}`\n"
              f"- current head SHA: `{os.environ['CURRENT_SOURCE_SHA']}`\n"
              f"- base SHA: `{os.environ['BASE_SHA']}`\n"
              f"- workflow control SHA: `{os.environ['CONTROL_SHA']}`\n"
              "- Actions write: `false`\n",
              encoding="utf-8",
          )
          PY

      - name: Upload comment command preview
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-command-dry-run-${{ github.event.issue.number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pr-comment-preview/
          retention-days: 7
          if-no-files-found: warn
