name: UCM Build Bot

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  permission-check:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/ucm-build')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      pr-head-sha: ${{ steps.pr-info.outputs.head-sha }}
      pr-number: ${{ steps.pr-info.outputs.number }}
      pr-author: ${{ steps.pr-info.outputs.pr-author }}
      allowed: ${{ steps.check-permission.outputs.allowed }}
      subcommand: ${{ steps.parse.outputs.subcommand }}
      profile-arg: ${{ steps.parse.outputs.profile-arg }}
      image-refs: ${{ steps.parse.outputs.image-refs }}
    steps:
      - name: Parse /ucm-build subcommand
        id: parse
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          body="${COMMENT_BODY}"
          # second token after /ucm-build is the subcommand
          subcommand="$(printf '%s\n' "$body" | awk '/^[[:space:]]*\/ucm-build[[:space:]]/ {print $2; exit}')"
          # bare /ucm-build or /ucm-build help -> help (posts the command list, no build)
          case "$subcommand" in
            "") subcommand="help" ;;
            help|wheel|image|chart|all) ;;
            *) echo "::error::/ucm-build subcommand must be in {wheel,image,chart,all,help}; got: '${subcommand}'" >&2; exit 2 ;;
          esac
          profile_arg=""
          image_refs=()
          for tok in $body; do
            case "$tok" in
              profile=*) profile_arg="${tok#profile=}" ;;
            esac
          done
          # image takes one or more positional <repo:tag> refs after the `image`
          # keyword (catalog resolve --pin-upstream validates each repo).
          if [ "$subcommand" = "image" ]; then
            seen_image=0
            for tok in $body; do
              if [ "$seen_image" = "0" ]; then
                case "$tok" in image) seen_image=1 ;; esac
                continue
              fi
              case "$tok" in
                profile=*) ;;  # ignored (cross-checked: invalid with image)
                *:*) image_refs+=("$tok") ;;
                *) echo "::error::/ucm-build image: '${tok}' is not a repo:tag" >&2; exit 2 ;;
              esac
            done
            if [ "${#image_refs[@]}" -eq 0 ]; then
              echo "::error::/ucm-build image requires one or more <repo:tag> refs, e.g. /ucm-build image quay.io/ascend/vllm-ascend:v0.22.1rc1-a3" >&2; exit 2
            fi
          fi
          # cross-check: profile only with wheel/all; image takes refs only
          if [ "$subcommand" != "help" ]; then
            if [ -n "$profile_arg" ] && [ "$subcommand" != "wheel" ] && [ "$subcommand" != "all" ]; then
              echo "::error::profile= is only valid with /ucm-build wheel|all" >&2; exit 2
            fi
          fi
          {
            echo "subcommand=${subcommand}"
            echo "profile-arg=${profile_arg}"
            echo "image-refs<<EOF"
            printf '%s\n' "${image_refs[@]}"
            echo "EOF"
          } >>"${GITHUB_OUTPUT}"
      - name: Post help comment
        if: steps.parse.outputs.subcommand == 'help'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          cat >help.md <<'EOF'
          ## 🤖 `/ucm-build` 命令 / Commands

          仓库成员(write+)可用。每次构建固定当前 PR head SHA;推送的镜像在 PR 关闭时自动删除。
          Available to repo members (write+). Each run fixes the current PR head SHA; pushed images auto-delete when the PR closes.

          | 命令 / Command | 构建 / Builds | 推 GHCR? / Push? |
          | --- | --- | --- |
          | `/ucm-build wheel [profile=<name>]` | UCM wheel — profile: `cuda130`/`cann900-a2`/`cann900-a3`(省略=全部)/ UCM wheel — profile: `cuda130`/`cann900-a2`/`cann900-a3` (omit for all) | 否 / no(仅 artifact / artifact only) |
          | `/ucm-build image <repo:tag> [<repo:tag>...]` | 钉住上游的 wheel + 镜像,自动推送 / wheels + images for the pinned upstreams, auto-push | 是 / yes |
          | `/ucm-build chart` | chart(lint + template + package)/ chart (lint + template + package) | 否 / no(仅 artifact / artifact only) |
          | `/ucm-build all` | 全部(wheel + image + chart)/ everything (wheel + image + chart) | 是(镜像)/ yes (images) |

          - 镜像 tag / Image tag: `ghcr.io/<owner>/<family>:v<upstream-ver>-pr-<n>-<author>-<sha8>`(ascend 带 `-a2`/`-a3` 变体 / ascend variants carry `-a2`/`-a3`)。
          - 钉住的上游仓库 / Pinned repos: `docker.io/vllm/vllm-openai`(cuda)/ `quay.io/ascend/vllm-ascend`(a2/a3)。变体由检查镜像 `SOC_VERSION` 自动检测 / variant auto-detected by inspecting the image;任意 pep440 tag 都行(含超 specifier 版本)/ any pep440 tag works (incl. out-of-specifier)。
          - `/ucm-build help`(或光敲 `/ucm-build`)重显本消息 / re-shows this message.
          EOF
          gh pr comment "${PR_NUMBER}" --repo "${{ github.repository }}" --body-file help.md
      - name: Check commenter write permission
        if: steps.parse.outputs.subcommand != 'help'
        id: check-permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commenter="${{ github.event.comment.user.login }}"
          repo="${{ github.repository }}"
          perm="$(gh api "repos/${repo}/collaborators/${commenter}/permission" --jq '.permission')"
          if [[ "${perm}" == "admin" || "${perm}" == "write" || "${perm}" == "maintain" ]]; then
            echo "allowed=true" >>"${GITHUB_OUTPUT}"
            echo "Commenter ${commenter} has ${perm} access — build authorized"
          else
            echo "allowed=false" >>"${GITHUB_OUTPUT}"
            echo "::error::Commenter ${commenter} has ${perm} access (needs write+)"
            exit 1
          fi
      - name: Get PR head SHA
        if: steps.parse.outputs.subcommand != 'help'
        id: pr-info
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          set -euo pipefail
          pr_url="${{ github.event.issue.pull_request.url }}"
          head_sha="$(gh api "${pr_url}" --jq '.head.sha')"
          pr_number="$(gh api "${pr_url}" --jq '.number')"
          {
            echo "head-sha=${head_sha}"
            echo "number=${pr_number}"
            echo "pr-author=${PR_AUTHOR}"
          } >>"${GITHUB_OUTPUT}"
      - name: Reply denial on permission failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GitHub expressions are expanded before Bash evaluates the quoted body.
          # shellcheck disable=SC2016
          gh pr comment "${{ steps.pr-info.outputs.number }}" --repo "${{ github.repository }}" --body "$(printf '%s\n' \
            '🚫 `/ucm-build` not authorized.' \
            '' \
            "Requester @${{ github.event.comment.user.login }} needs **write** access (or higher) to trigger a build. Ask a repo member to run it, or request access." \
            '' \
            "Fixed SHA: \`${{ steps.pr-info.outputs.head-sha }}\`")" || true

  sync-builders:
    needs: permission-check
    if: needs.permission-check.outputs.allowed == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/sync-builders.yml

  plan:
    needs: [permission-check, sync-builders]
    if: >-
      ${{
        needs.permission-check.outputs.allowed == 'true' &&
        needs.sync-builders.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      resolved_plan_artifact: ${{ steps.plan.outputs.resolved_plan_artifact }}
      resolved_plan_sha256: ${{ steps.plan.outputs.resolved_plan_sha256 }}
      build_wheel_matrix: ${{ steps.filter.outputs.build_wheel_matrix }}
      build_image_matrix: ${{ steps.filter.outputs.build_image_matrix }}
      chart_enabled: ${{ steps.filter.outputs.chart_enabled }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.permission-check.outputs.pr-head-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.sync-builders.outputs.builder_catalog_artifact }}
          path: input/builders
      - name: Install checksum-pinned read-only crane
        env:
          CRANE_VERSION: v0.20.3
          CRANE_LINUX_AMD64_SHA256: 36c67a932f489b3f2724b64af90b599a8ef2aa7b004872597373c0ad694dc059
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/crane"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/crane.tar.gz" \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_LINUX_AMD64_SHA256}  ${RUNNER_TEMP}/crane.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/crane.tar.gz" -C "${RUNNER_TEMP}/crane" crane
          test "$("${RUNNER_TEMP}/crane/crane" version)" = "${CRANE_VERSION#v}"
          echo "${RUNNER_TEMP}/crane" >>"${GITHUB_PATH}"
      - name: Authenticate to ghcr for builder digest reads
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "${GITHUB_TOKEN}" | crane auth login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin
      - id: plan
        name: Resolve one frozen feature-candidate plan for the PR head
        env:
          SOURCE_SHA: ${{ needs.permission-check.outputs.pr-head-sha }}
          SUBCOMMAND: ${{ needs.permission-check.outputs.subcommand }}
          IMAGE_REFS: ${{ needs.permission-check.outputs.image-refs }}
        run: |
          set -euo pipefail
          mkdir -p out/plan
          resolve_args=(
            --lane feature-candidate
            --source-sha "${SOURCE_SHA}"
            --builder-catalog input/builders/builder-catalog.json
            --output out/plan/resolved-plan.json
          )
          if [ "${SUBCOMMAND}" = "image" ]; then
            while IFS= read -r ref; do
              [ -n "${ref}" ] && resolve_args+=(--pin-upstream "${ref}")
            done <<< "${IMAGE_REFS}"
          fi
          PYTHONPATH=.github/release python -m ucm_release catalog resolve "${resolve_args[@]}" >/dev/null
          resolved_plan_sha256="$(jq -r '.resolved_plan_sha256' out/plan/resolved-plan.json)"
          logical_artifact="$(jq -r '.expected_artifacts.resolved_plan' out/plan/resolved-plan.json)"
          resolved_plan_artifact="${logical_artifact}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          {
            echo "source_sha=${SOURCE_SHA}"
            echo "resolved_plan_artifact=${resolved_plan_artifact}"
            echo "resolved_plan_sha256=${resolved_plan_sha256}"
          } >>"${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.plan.outputs.resolved_plan_artifact }}
          path: out/plan/resolved-plan.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
      - id: filter
        name: Filter matrices by /ucm-build subcommand
        env:
          SUBCOMMAND: ${{ needs.permission-check.outputs.subcommand }}
          PROFILE_ARG: ${{ needs.permission-check.outputs.profile-arg }}
        run: |
          set -euo pipefail
          plan=out/plan/resolved-plan.json
          subcommand="${SUBCOMMAND}"
          profile="${PROFILE_ARG}"
          case "$subcommand" in
            wheel)
              if [ -n "$profile" ]; then
                wm="$(jq -c --arg p "$profile" '{include:[.wheel_tasks[]|select(.profile_id==$p)|{task_id,runner}]}' "$plan")"
                if [ "$(printf '%s' "$wm" | jq '.include|length')" -eq 0 ]; then
                  echo "::error::profile '${profile}' matched no wheel tasks" >&2; exit 2
                fi
              else
                wm="$(jq -c '{include:[.wheel_tasks[]|{task_id,runner}]}' "$plan")"
              fi
              im='{"include":[]}'
              chart=false
              ;;
            image)
              # the pinned plan (catalog resolve --pin-upstream) already contains
              # only the user's image:tags -> build all image_tasks + their wheels
              im="$(jq -c '{include:[.image_tasks[]|{task_id,runner,wheel_task_id}]}' "$plan")"
              needed="$(jq -c '[.image_tasks[].wheel_task_id]' "$plan")"
              wm="$(jq -c --argjson needed "$needed" '{include:[.wheel_tasks[]|select(.task_id|IN($needed[]))|{task_id,runner}]}' "$plan")"
              chart=false
              ;;
            chart)
              wm='{"include":[]}'; im='{"include":[]}'; chart=true
              ;;
            all)
              wm="$(jq -c '.github_wheel_matrix' "$plan")"
              im="$(jq -c '.github_image_matrix' "$plan")"
              chart=true
              ;;
            *) echo "::error::unknown subcommand '$subcommand'" >&2; exit 2 ;;
          esac
          {
            echo "build_wheel_matrix=${wm}"
            echo "build_image_matrix=${im}"
            echo "chart_enabled=${chart}"
          } >>"${GITHUB_OUTPUT}"

  build-wheels:
    needs: [permission-check, plan]
    if: >-
      ${{ !cancelled() && needs.permission-check.outputs.allowed == 'true' &&
          needs.plan.result == 'success' &&
          (needs.permission-check.outputs.subcommand == 'wheel' ||
           needs.permission-check.outputs.subcommand == 'image' ||
           needs.permission-check.outputs.subcommand == 'all') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build_wheel_matrix) }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/_build-wheel.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      task_id: ${{ matrix.task_id }}
      runner: ${{ matrix.runner }}
      resolved_plan_artifact: ${{ needs.plan.outputs.resolved_plan_artifact }}
      resolved_plan_sha256: ${{ needs.plan.outputs.resolved_plan_sha256 }}

  build-images:
    needs: [permission-check, plan, build-wheels]
    if: >-
      ${{ !cancelled() && needs.permission-check.outputs.allowed == 'true' &&
          needs.build-wheels.result == 'success' &&
          (needs.permission-check.outputs.subcommand == 'image' ||
           needs.permission-check.outputs.subcommand == 'all') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build_image_matrix) }}
    permissions:
      contents: read
    uses: ./.github/workflows/_build-image.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      task_id: ${{ matrix.task_id }}
      runner: ${{ matrix.runner }}
      resolved_plan_artifact: ${{ needs.plan.outputs.resolved_plan_artifact }}
      resolved_plan_sha256: ${{ needs.plan.outputs.resolved_plan_sha256 }}
      deliver_full_oci: true

  package-chart:
    needs: [permission-check, plan]
    if: >-
      ${{ !cancelled() && needs.permission-check.outputs.allowed == 'true' &&
          needs.plan.result == 'success' &&
          (needs.permission-check.outputs.subcommand == 'chart' ||
           needs.permission-check.outputs.subcommand == 'all') }}
    permissions:
      contents: read
    uses: ./.github/workflows/_build-chart.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      resolved_plan_artifact: ${{ needs.plan.outputs.resolved_plan_artifact }}
      resolved_plan_sha256: ${{ needs.plan.outputs.resolved_plan_sha256 }}

  publish-trusted:
    needs: [permission-check, plan, build-wheels, build-images, package-chart]
    if: >-
      ${{ !cancelled() && needs.permission-check.result == 'success' &&
          (needs.build-wheels.result == 'success' ||
           needs.build-images.result == 'success' ||
           needs.package-chart.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      packages: write
      pull-requests: write
    env:
      CRANE_VERSION: v0.20.3
      CRANE_LINUX_AMD64_SHA256: 36c67a932f489b3f2724b64af90b599a8ef2aa7b004872597373c0ad694dc059
    steps:
      - name: Validate publish contract
        env:
          SOURCE_SHA: ${{ needs.permission-check.outputs.pr-head-sha }}
          PR_NUMBER: ${{ needs.permission-check.outputs.pr-number }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]
      # Checkout the trusted default branch ONLY to materialize the local
      # composite action (download-artifact-retry) on the runner. This never
      # checks out PR code; the build artifacts below were validated by the
      # reusable workflows' frozen-plan sha256 checks.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download resolved plan (trusted, never PR code)
        uses: ./.github/actions/download-artifact-retry
        with:
          name: ${{ needs.plan.outputs.resolved_plan_artifact }}
          path: input/plan
      - name: Install checksum-pinned crane publisher
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/crane"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/crane.tar.gz" \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_LINUX_AMD64_SHA256}  ${RUNNER_TEMP}/crane.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/crane.tar.gz" -C "${RUNNER_TEMP}/crane" crane
          test "$("${RUNNER_TEMP}/crane/crane" version)" = "${CRANE_VERSION#v}"
          echo "${RUNNER_TEMP}/crane" >>"${GITHUB_PATH}"
      - name: Download image OCI artifacts (trusted, never PR code)
        if: needs.build-images.result == 'success'
        uses: ./.github/actions/download-artifact-retry
        with:
          pattern: ucm-oci-image-*
          path: input/oci
      - name: Push image OCI artifacts to PR-tagged GHCR
        id: push-images
        if: needs.build-images.result == 'success'
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/ucm-publish-docker-config
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          SOURCE_SHA: ${{ needs.permission-check.outputs.pr-head-sha }}
          PR_NUMBER: ${{ needs.permission-check.outputs.pr-number }}
          PR_AUTHOR: ${{ needs.permission-check.outputs.pr-author }}
        run: |
          set -euo pipefail
          mkdir -p "${DOCKER_CONFIG}"
          printf '%s' "${GITHUB_TOKEN}" | crane auth login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin
          owner_lc="$(printf '%s' "${REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          # lowercase the PR author for the tag (tags are case-sensitive; GH logins are not)
          author_lc="$(printf '%s' "${PR_AUTHOR}" | tr '[:upper:]' '[:lower:]')"
          sha8="${SOURCE_SHA:0:8}"
          plan=input/plan/resolved-plan.json
          # publish-manifest.tsv columns: pkg<TAB>base_tag<TAB>arch<TAB>arch_tag<TAB>digest
          : >publish-manifest.tsv
          # download every same-run image OCI artifact (each contains image.oci.tar)
          mapfile -t dirs < <(find input/oci -maxdepth 1 -type d -name 'ucm-oci-image-*' | sort)
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "::error::build-images reported success but no ucm-oci-image-* artifacts were found" >&2
            exit 2
          fi
          for d in "${dirs[@]}"; do
            artifact_name="$(basename "$d")"
            # ucm-oci-<task_id>-run-<run_id>-attempt-<attempt>  ->  task_id
            task_id="$(printf '%s' "$artifact_name" | sed -E 's/^ucm-oci-//; s/-run-[0-9]+-attempt-[0-9]+$//')"
            read -r product_id variant arch upstream_ver <<<"$(jq -r --arg tid "$task_id" \
              '.image_tasks[]|select(.task_id==$tid)|[.runtime.product_id,.runtime.variant,.cpu_arch,.runtime.version]|@tsv' "$plan")"
            if [ -z "$product_id" ] || [ -z "$variant" ] || [ -z "$arch" ] || [ -z "$upstream_ver" ]; then
              echo "::error::could not resolve product_id/variant/arch/version for task ${task_id}" >&2; exit 2
            fi
            # package is named by family (product_id): vllm, vllm-ascend, ...
            pkg="ghcr.io/${owner_lc}/${product_id}"
            # variant goes in the tag for ascend (a2/a3 share one package); cuda has no variant
            vsuffix=""
            [ "$variant" != "default" ] && vsuffix="-${variant}"
            # tag mirrors the release shape (v<upstream-ver>-ucm-...) but with the
            # ucm-version part replaced by pr-<n>-<author>-<sha8>. For a non-pep440
            # pinned version (e.g. 'latest') drop the v prefix so the tag stays valid.
            case "$upstream_ver" in
              [0-9]*) ver_prefix="v${upstream_ver}" ;;
              *) ver_prefix="${upstream_ver}" ;;
            esac
            base_tag="${ver_prefix}-pr-${PR_NUMBER}-${author_lc}-${sha8}${vsuffix}"
            test -f "$d/image.oci.tar"
            layout="$(mktemp -d)"
            tar -xf "$d/image.oci.tar" -C "$layout"
            arch_tag="${pkg}:${base_tag}-${arch}"
            crane push "$layout" "$arch_tag"
            arch_digest="$(crane digest "$arch_tag")"
            printf '%s\t%s\t%s\t%s\t%s\n' "$pkg" "$base_tag" "$arch" "$arch_tag" "$arch_digest" >>publish-manifest.tsv
            rm -rf "$layout"
          done
          # compose a per-(package,variant) multi-arch manifest list reviewers can `docker pull`
          list_tags=()
          # read full lines (pkg<TAB>base_tag); do NOT word-split, the tab is significant
          while IFS= read -r key; do
            [ -n "$key" ] || continue
            pkg="${key%$'\t'*}"
            base_tag="${key#*$'\t'}"
            refs=()
            while IFS= read -r r; do refs+=("$r"); done < <(awk -v p="$pkg" -v b="$base_tag" '$1==p && $2==b {print $4}' publish-manifest.tsv)
            if [ "${#refs[@]}" -eq 0 ]; then
              echo "::error::no arch refs found for ${pkg}:${base_tag}" >&2; exit 2
            fi
            list_tag="${pkg}:${base_tag}"
            docker buildx imagetools create -t "$list_tag" "${refs[@]}"
            list_digest="$(crane digest "$list_tag")"
            list_tags+=("${list_tag}|${list_digest}")
          done < <(cut -f1,2 publish-manifest.tsv | sort -u)
          {
            echo "list_tags<<EOF"
            printf '%s\n' "${list_tags[@]}"
            echo "EOF"
          } >>"${GITHUB_OUTPUT}"
      - name: Post PR build receipt comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.permission-check.outputs.pr-number }}
          PR_AUTHOR: ${{ needs.permission-check.outputs.pr-author }}
          SOURCE_SHA: ${{ needs.permission-check.outputs.pr-head-sha }}
          SUBCOMMAND: ${{ needs.permission-check.outputs.subcommand }}
          WHEEL_RESULT: ${{ needs.build-wheels.result }}
          IMAGE_RESULT: ${{ needs.build-images.result }}
          CHART_RESULT: ${{ needs.package-chart.result }}
          CHART_ARTIFACT: ${{ needs.package-chart.outputs.chart_artifact }}
          LIST_TAGS: ${{ steps.push-images.outputs.list_tags }}
        run: |
          set -euo pipefail
          sha8="${SOURCE_SHA:0:8}"
          author_lc="$(printf '%s' "${PR_AUTHOR}" | tr '[:upper:]' '[:lower:]')"
          plan=input/plan/resolved-plan.json
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # one API call for the run's artifacts (name -> id/size, for download links)
          artifacts_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts' 2>/dev/null || true)"
          artifact_link() {
            # echo "id<TAB>size_bytes" for the named artifact, or empty
            printf '%s' "${artifacts_json}" | jq -re --arg n "$1" '.[]? | select(.name==$n) | "\(.id)\t\(.size_in_bytes)"' 2>/dev/null | head -1 || true
          }
          human_size() {
            local b="${1:-0}"; b="${b%%[^0-9]*}"
            if [ "${b:-0}" -ge 1048576 ]; then awk -v b="$b" 'BEGIN{printf "%.1f MB", b/1048576}'
            elif [ "${b:-0}" -ge 1024 ]; then awk -v b="$b" 'BEGIN{printf "%.1f KB", b/1024}'
            else printf '%s B' "${b:-0}"; fi
          }
          wheel_arch() { case "$1" in amd64) echo x86_64;; arm64) echo aarch64;; *) echo "$1";; esac; }
          {
            echo "## 🤖 \`/ucm-build ${SUBCOMMAND}\` — 构建回执 / Build receipt"
            echo ""
            echo "**固定 SHA / Fixed SHA:** \`${SOURCE_SHA}\`"
            echo ""
            echo "| 产物 / Product | 状态 / Status |"
            echo "| --- | --- |"
            echo "| wheel | \`${WHEEL_RESULT}\` |"
            echo "| image | \`${IMAGE_RESULT}\` |"
            echo "| chart | \`${CHART_RESULT}\` |"
            echo ""
            if [ -n "${LIST_TAGS}" ]; then
              echo "### 🐳 GHCR 镜像 / Images(自动推送,PR 关闭时自动删除 / auto-pushed, auto-deleted on PR close)"
              echo ""
              echo '```bash'
              printf '%s\n' "${LIST_TAGS}" | while IFS='|' read -r tag digest; do
                [ -n "$tag" ] || continue
                echo "docker pull ${tag}   # ${digest}"
              done
              echo '```'
              echo ""
              echo "包名按 family(\`vllm\`/\`vllm-ascend\`);tag 前缀 \`pr-${PR_NUMBER}-${author_lc}-${sha8}-\`(ascend 带 \`-a2\`/\`-a3\`)。"
              echo "Packages named by family; tags prefixed \`pr-${PR_NUMBER}-${author_lc}-${sha8}-\` (ascend: \`-a2\`/\`-a3\`)."
              echo ""
            fi
            echo "### 📦 产物 / Artifacts(7 天保留 / 7-day retention)"
            echo ""
            echo "| 文件 / File | 大小 / Size | 下载 / Download |"
            echo "| --- | --- | --- |"
            # chart (real filename from the plan + per-artifact download link)
            if [ -n "${CHART_ARTIFACT}" ] && [ "${CHART_RESULT}" = "success" ] && [ -f "$plan" ]; then
              chart_name="$(jq -r '.chart.name' "$plan")"
              chart_version="$(jq -r '.chart.version' "$plan")"
              chart_file="${chart_name}-${chart_version}.tgz"
              cid=""; csize=""
              read -r cid csize < <(artifact_link "${CHART_ARTIFACT}") || true
              if [ -n "${cid:-}" ]; then
                echo "| \`${chart_file}\` | $(human_size "${csize:-0}") | [下载 / download](${run_url}/artifacts/${cid}) |"
              else
                echo "| \`${chart_file}\` | — | ${run_url} |"
              fi
            fi
            # wheels (real .whl filename derived from the plan + download link)
            if [ "${WHEEL_RESULT}" = "success" ] && [ -f "$plan" ]; then
              jq -c '.wheel_tasks[] | {task_id, dist_name, wheel_version, python_abi, wheel_platform, cpu_arch}' "$plan" 2>/dev/null | while IFS= read -r t; do
                task_id="$(printf '%s' "$t" | jq -r '.task_id')"
                dist="$(printf '%s' "$t" | jq -r '.dist_name' | tr '-' '_')"
                wver="$(printf '%s' "$t" | jq -r '.wheel_version')"
                abi="$(printf '%s' "$t" | jq -r '.python_abi')"
                wplat="$(printf '%s' "$t" | jq -r '.wheel_platform')"
                arch="$(printf '%s' "$t" | jq -r '.cpu_arch')"
                warch="$(wheel_arch "$arch")"
                whl="${dist}-${wver}-${abi}-${abi}-${wplat}_${warch}.whl"
                art_name="ucm-wheel-${task_id}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
                wid=""; wsize=""
                read -r wid wsize < <(artifact_link "${art_name}") || true
                if [ -n "${wid:-}" ]; then
                  echo "| \`${whl}\` | $(human_size "${wsize:-0}") | [下载 / download](${run_url}/artifacts/${wid}) |"
                else
                  echo "| \`${whl}\` | — | ${run_url} |"
                fi
              done
            fi
            echo ""
            echo "完整产物列表(含镜像 OCI 证据)/ Full artifact list (incl. image OCI evidence): ${run_url}"
            echo ""
            echo "---"
            echo "_子命令 / Subcommands:\`/ucm-build wheel [profile=<name>]\` · \`/ucm-build image <repo:tag> [<repo:tag>...]\` · \`/ucm-build chart\` · \`/ucm-build all\` — \`/ucm-build help\` 重显命令清单 / re-shows commands_"
          } >comment.md
          gh pr comment "${PR_NUMBER}" --repo "${{ github.repository }}" --body-file comment.md
