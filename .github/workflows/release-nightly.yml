# Isolated Fork acceptance branch only. Default develop keeps the real publisher.
name: UCM Nightly Release · Shanghai 02:00
run-name: Fork lifecycle fixture · ${{ inputs.role }} · ${{ inputs.outcome }}

on:
  workflow_dispatch:
    inputs:
      production_sha:
        description: Full repaired commit deployed on Fork default develop
        type: string
        required: true
      role:
        type: choice
        required: true
        options: [manual, filler, victim]
      outcome:
        type: choice
        required: true
        options: [success, failure, cancel]
      hold_seconds:
        description: Capture ledger in independent closure before this terminal step
        type: number
        required: true
        default: 180

concurrency:
  group: ucm-nightly-${{ github.repository_id }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-fixture:
    if: ${{ github.repository == 'SuperMarioYL/unified-cache-management' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: fork-preview
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}
          path: fixture-helper
          sparse-checkout: .github/release/tests
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: -r .github/release/requirements.txt
      - name: Prepare source-bound remote resources using deployed production
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_SHA: ${{ inputs.production_sha }}
          FIXTURE_ROLE: ${{ inputs.role }}
          FIXTURE_OUTCOME: ${{ inputs.outcome }}
        run: |
          set -euo pipefail
          outcome="${FIXTURE_OUTCOME}"
          [ "${outcome}" != cancel ] || outcome=cancelled
          python fixture-helper/.github/release/tests/hosted_cleanup.py prepare-nightly \
            --production-root . --production-sha "${PRODUCTION_SHA}" \
            --role "${FIXTURE_ROLE}" --outcome "${outcome}"
      - uses: actions/upload-artifact@v4.6.2
        if: ${{ always() && hashFiles('out/open/*.json') != '' }}
        with:
          name: ucm-release-cleanup-open-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out/open/*.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4.6.2
        if: ${{ always() && hashFiles('out/plan/*.json') != '' }}
        with:
          name: ucm-release-cleanup-plan-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out/plan/*.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4.6.2
        if: ${{ always() && hashFiles('out/ledger/*.json') != '' }}
        with:
          name: fixture-ledger-run-${{ github.run_id }}
          path: out/ledger/
          if-no-files-found: error
          retention-days: 7

  conclude-fixture:
    needs: prepare-fixture
    if: ${{ github.repository == 'SuperMarioYL/unified-cache-management' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Hold capture window, then complete or fail; cancellation is external
        env:
          FIXTURE_OUTCOME: ${{ inputs.outcome }}
          HOLD_SECONDS: ${{ inputs.hold_seconds }}
        run: |
          set -euo pipefail
          [[ "${HOLD_SECONDS}" =~ ^[1-9][0-9]*$ ]]
          test "${HOLD_SECONDS}" -le 900
          echo 'SOURCE_CAPTURE_WINDOW_OPEN: durable ledger and both snapshots are uploaded.'
          sleep "${HOLD_SECONDS}"
          case "${FIXTURE_OUTCOME}" in
            success) echo 'Fixture terminal success; this is not a native product build.' ;;
            failure) echo 'Intentional fixture terminal failure after durable evidence.' >&2; exit 1 ;;
            cancel) echo 'External cancellation did not arrive during capture window.' >&2; exit 1 ;;
            *) exit 2 ;;
          esac
