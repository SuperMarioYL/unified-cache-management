# Acceptance source only. Install on an isolated Fork fixture branch at
# .github/workflows/release-nightly.yml; never include in the production PR.
name: UCM Nightly Release · Shanghai 02:00
run-name: Nightly cleanup fixture · ${{ inputs.outcome }}

on:
  workflow_dispatch:
    inputs:
      outcome:
        description: Actual source workflow conclusion to exercise
        type: choice
        required: true
        options: [success, failure, cancel]

concurrency:
  group: ucm-nightly-${{ github.repository_id }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-fixture:
    name: Persist source-bound Nightly fixture
    if: ${{ github.repository == 'SuperMarioYL/unified-cache-management' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      release_id: ${{ steps.prepare.outputs.release_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FIXTURE_OUTCOME: ${{ inputs.outcome }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: -r .github/release/requirements.txt
      - id: prepare
        name: Create fixture Tag and Draft with verified cleanup asset
        run: |
          set -euo pipefail
          test "${GH_REPO}" = SuperMarioYL/unified-cache-management
          test "${GITHUB_EVENT_NAME}" = workflow_dispatch
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          case "${FIXTURE_OUTCOME}" in
            success) sequence=101 ;;
            failure) sequence=102 ;;
            cancel) sequence=103 ;;
            *) echo 'Unsupported fixture outcome' >&2; exit 1 ;;
          esac
          tag="nightly/v0.8.0-20261009-${sequence}"
          mkdir -p out/nightly
          record=out/nightly/release-cleanup.json
          # Bind before creating remote resources so an interrupted prepare
          # still leaves recovery evidence through the always-uploaded artifact.
          python .github/release/ucm_release/cleanup.py record \
            --repository "${GH_REPO}" --tag "${tag}" \
            --source-sha "${GITHUB_SHA}" --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" --output "${record}"
          # Deliberately fail on a collision; the fixture must not replace any
          # pre-existing Tag, Release, or cleanup binding.
          gh api --method POST "/repos/${GH_REPO}/git/refs" \
            -f "ref=refs/tags/${tag}" -f "sha=${GITHUB_SHA}" >/dev/null
          # shellcheck disable=SC2016
          body="$(printf 'Status: `release-open`\n\nNightly cleanup hosted acceptance fixture: %s.\nNo Wheels, Builder images, Runtime images, Chart or public Manifest are published.\n' \
            "${FIXTURE_OUTCOME}")"
          jq -n --arg tag "${tag}" --arg source "${GITHUB_SHA}" --arg body "${body}" \
            '{tag_name:$tag,target_commitish:$source,name:$tag,body:$body,
              draft:true,prerelease:true,make_latest:"false"}' \
            >"${RUNNER_TEMP}/fixture-release-request.json"
          gh api --method POST "/repos/${GH_REPO}/releases" \
            --input "${RUNNER_TEMP}/fixture-release-request.json" \
            >"${RUNNER_TEMP}/fixture-release-response.json"
          release_id="$(jq -er '.id' "${RUNNER_TEMP}/fixture-release-response.json")"
          python .github/release/ucm_release/cleanup.py record \
            --repository "${GH_REPO}" --tag "${tag}" \
            --source-sha "${GITHUB_SHA}" --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" --release-id "${release_id}" \
            --previous "${record}" --output "${record}"
          gh release upload "${tag}" "${record}"
          gh api "/repos/${GH_REPO}/releases/${release_id}" \
            >"${RUNNER_TEMP}/fixture-release-readback.json"
          asset_id="$(jq -er '[.assets[] | select(.name == "release-cleanup.json")] |
            if length == 1 then .[0].id else error("cleanup asset missing or duplicated") end' \
            "${RUNNER_TEMP}/fixture-release-readback.json")"
          gh api -H 'Accept: application/octet-stream' \
            "/repos/${GH_REPO}/releases/assets/${asset_id}" \
            >"${RUNNER_TEMP}/fixture-cleanup-readback.json"
          cmp "${record}" "${RUNNER_TEMP}/fixture-cleanup-readback.json"
          jq -e --arg repository "${GH_REPO}" --arg tag "${tag}" --arg sha "${GITHUB_SHA}" \
            --argjson run "${GITHUB_RUN_ID}" --argjson attempt "${GITHUB_RUN_ATTEMPT}" \
            --argjson release "${release_id}" \
            '.kind == "ucm-release-cleanup" and .schema_version == 1 and
             .repository == $repository and .tag == $tag and .source_sha == $sha and
             .release_ids == [$release] and
             any(.runs[]; .id == $run and .attempt == $attempt) and .resources == []' \
            "${RUNNER_TEMP}/fixture-cleanup-readback.json" >/dev/null
          {
            echo "tag=${tag}"
            echo "release_id=${release_id}"
          } >>"${GITHUB_OUTPUT}"
          echo "FIXTURE_READY tag=${tag} release_id=${release_id} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
          {
            echo '### Nightly cleanup acceptance fixture'
            echo
            echo "Requested source conclusion: ${FIXTURE_OUTCOME}"
            echo "Tag: ${tag}"
            echo "Release ID: ${release_id}"
            echo "Source SHA: ${GITHUB_SHA}"
            echo 'Cleanup asset upload and readback: confirmed identical.'
          } >>"${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v4.6.2
        if: ${{ always() && hashFiles('out/nightly/release-cleanup.json') != '' }}
        with:
          name: ucm-nightly-cleanup-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out/nightly/release-cleanup.json
          if-no-files-found: error
          retention-days: 7

  conclude-fixture:
    name: Produce the requested terminal conclusion
    needs: prepare-fixture
    if: ${{ github.repository == 'SuperMarioYL/unified-cache-management' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      FIXTURE_OUTCOME: ${{ inputs.outcome }}
      FIXTURE_TAG: ${{ needs.prepare-fixture.outputs.tag }}
      FIXTURE_RELEASE_ID: ${{ needs.prepare-fixture.outputs.release_id }}
    steps:
      - name: Source result or external cancellation window
        run: |
          set -euo pipefail
          echo "Prepared ${FIXTURE_TAG}; Release ${FIXTURE_RELEASE_ID}."
          case "${FIXTURE_OUTCOME}" in
            success)
              echo 'Complete the source workflow successfully.'
              ;;
            failure)
              echo 'Intentional source workflow failure after durable fixture evidence.' >&2
              exit 1
              ;;
            cancel)
              echo 'CANCEL_WINDOW_OPEN: cancel this workflow run externally now.'
              # The driver cancels only after this job starts, proving that the
              # Release asset and binding artifact survived preparation.
              sleep 900
              echo 'External cancellation did not arrive within the window.' >&2
              exit 1
              ;;
            *) exit 1 ;;
          esac
