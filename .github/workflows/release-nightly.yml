# Fork acceptance source. Keep this workflow on the isolated fixture branch.
name: UCM Nightly Release · Shanghai 02:00
run-name: Nightly cleanup fixture · ${{ inputs.outcome }}

on:
  workflow_dispatch:
    inputs:
      outcome:
        description: Source conclusion after durable publication evidence
        type: choice
        required: true
        options: [success, failure, cancel]

concurrency:
  group: ucm-nightly-${{ github.repository_id }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-fixture:
    name: Create source-bound Nightly fixture
    if: ${{ github.repository == 'SuperMarioYL/unified-cache-management' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      release_id: ${{ steps.prepare.outputs.release_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FIXTURE_OUTCOME: ${{ inputs.outcome }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: -r .github/release/requirements.txt
      - id: prepare
        name: Record ownership, create Tag and persist both stages
        run: |
          set -euo pipefail
          test "${GH_REPO}" = SuperMarioYL/unified-cache-management
          test "${GITHUB_EVENT_NAME}" = workflow_dispatch
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          case "${FIXTURE_OUTCOME}" in
            success) tag=nightly/v0.8.0-20261010-201 ;;
            failure) tag=nightly/v0.8.0-20261010-202 ;;
            cancel) tag=nightly/v0.8.0-20261010-203 ;;
            *) exit 1 ;;
          esac
          python .github/release/ucm_release/cleanup.py record \
            --repository "${GH_REPO}" --tag "${tag}" --source-sha "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --output-dir out/early
          # Collisions fail; this fixture never replaces an existing Tag or Release.
          gh api --method POST "/repos/${GH_REPO}/git/refs" \
            -f "ref=refs/tags/${tag}" -f "sha=${GITHUB_SHA}" >/dev/null
          jq -n --arg tag "${tag}" --arg source "${GITHUB_SHA}" \
            '{tag_name:$tag,target_commitish:$source,name:$tag,
              body:"Status: `release-open`\n\nFork cleanup acceptance fixture; no registry publication.",
              draft:true,prerelease:true,make_latest:"false"}' \
            >"${RUNNER_TEMP}/fixture-release-request.json"
          gh api --method POST "/repos/${GH_REPO}/releases" \
            --input "${RUNNER_TEMP}/fixture-release-request.json" \
            >"${RUNNER_TEMP}/fixture-release-response.json"
          release_id="$(jq -er '.id' "${RUNNER_TEMP}/fixture-release-response.json")"
          python .github/release/ucm_release/cleanup.py record-targets \
            --repository "${GH_REPO}" --tag "${tag}" --release-type nightly \
            --source-sha "${GITHUB_SHA}" --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" --release-id "${release_id}" \
            --output-dir out/open
          classification="$(python scripts/materialize_version.py --tag "${tag}" --classify)"
          jq -n --argjson identity "${classification}" --arg repository "${GH_REPO}" \
            '{kind:"ucm-release-plan",repository:$repository,route:"release",
              git_tag:$identity.git_tag,release_type:$identity.release_type,
              version:$identity.version,image_version:$identity.image_version,
              families:[],publish:{chart_oci:{enabled:false}}}' \
            >"${RUNNER_TEMP}/fixture-plan.json"
          python .github/release/ucm_release/cleanup.py record-targets \
            --repository "${GH_REPO}" --tag "${tag}" --release-type nightly \
            --source-sha "${GITHUB_SHA}" --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" --release-id "${release_id}" \
            --plan "${RUNNER_TEMP}/fixture-plan.json" --output-dir out/plan
          {
            echo "tag=${tag}"
            echo "release_id=${release_id}"
          } >>"${GITHUB_OUTPUT}"
          echo "FIXTURE_READY tag=${tag} release_id=${release_id} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
      - uses: actions/upload-artifact@v4.6.2
        if: ${{ always() && hashFiles('out/early/*.json') != '' }}
        with:
          name: ucm-release-cleanup-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out/early/*.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4.6.2
        if: ${{ always() && hashFiles('out/open/*.json') != '' }}
        with:
          name: ucm-release-cleanup-open-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out/open/*.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4.6.2
        if: ${{ always() && hashFiles('out/plan/*.json') != '' }}
        with:
          name: ucm-release-cleanup-plan-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out/plan/*.json
          if-no-files-found: error
          retention-days: 7

  conclude-fixture:
    name: Produce the requested terminal conclusion
    needs: prepare-fixture
    if: ${{ github.repository == 'SuperMarioYL/unified-cache-management' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FIXTURE_OUTCOME: ${{ inputs.outcome }}
      FIXTURE_TAG: ${{ needs.prepare-fixture.outputs.tag }}
    steps:
      - name: Complete, fail or wait for external cancellation
        run: |
          set -euo pipefail
          echo "Prepared ${FIXTURE_TAG}."
          case "${FIXTURE_OUTCOME}" in
            success) echo 'Source completed successfully.' ;;
            failure) echo 'Intentional failure after durable evidence.' >&2; exit 1 ;;
            cancel)
              echo 'CANCEL_WINDOW_OPEN: all three evidence artifacts are saved.'
              sleep 600
              echo 'External cancellation did not arrive.' >&2
              exit 1
              ;;
            *) exit 1 ;;
          esac
