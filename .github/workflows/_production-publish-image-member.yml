name: Reusable production image member publisher

on:
  workflow_call:
    inputs:
      control_sha:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      tag_name:
        type: string
        required: true
      tag_object_sha:
        type: string
        required: true
      candidate_run_id:
        type: string
        required: true
      candidate_run_attempt:
        type: string
        required: true
      candidate_artifact_name:
        type: string
        required: true
      spec_id:
        type: string
        required: true
      source_identity_b64:
        type: string
        required: true
      trusted_identity_b64:
        type: string
        required: true
      source_date_epoch:
        type: string
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ${{ endsWith(inputs.spec_id, '-arm64') && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 240
    environment: release-production
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      CRANE_VERSION: v0.20.3
      CRANE_LINUX_AMD64_SHA256: 36c67a932f489b3f2724b64af90b599a8ef2aa7b004872597373c0ad694dc059
      CRANE_LINUX_ARM64_SHA256: d2235f7779cd39c6e40f43701d2512c997409f629fb53e621ede0d57d3f995e2
      BUILDX_VERSION: v0.19.2
      BUILDX_LINUX_AMD64_SHA256: a5ff61c0b6d2c8ee20964a9d6dac7a7a6383c4a4a0ee8d354e983917578306ea
      BUILDX_LINUX_ARM64_SHA256: bd54f0e28c29789da1679bad2dd94c1923786ccd2cd80dd3a0a1d560a6baf10c
      BUILDKIT_IMAGE: moby/buildkit:v0.18.2@sha256:86c0ad9d1137c186e9d455912167df20e530bdf7f7c19de802e892bb8ca16552
    steps:
      - name: Validate approved member publisher inputs before checkout
        env:
          CONTROL_SHA: ${{ inputs.control_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TAG_OBJECT_SHA: ${{ inputs.tag_object_sha }}
          TAG_NAME: ${{ inputs.tag_name }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          SPEC_ID: ${{ inputs.spec_id }}
          SOURCE_IDENTITY_B64: ${{ inputs.source_identity_b64 }}
          TRUSTED_IDENTITY_B64: ${{ inputs.trusted_identity_b64 }}
          SOURCE_DATE_EPOCH: ${{ inputs.source_date_epoch }}
        shell: bash
        run: |
          set -euo pipefail
          for value in "${CONTROL_SHA}" "${SOURCE_SHA}" "${TAG_OBJECT_SHA}"; do
            [[ "${value}" =~ ^[0-9a-f]{40}$ ]]
          done
          [[ "${CANDIDATE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${CANDIDATE_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          [[ "${CANDIDATE_ARTIFACT_NAME}" =~ ^ucm-production-candidate-[1-9][0-9]*-[0-9a-f]{40}-[0-9a-f]{40}-[1-9][0-9]*-[1-9][0-9]*$ ]]
          [[ "${SOURCE_IDENTITY_B64}" =~ ^[A-Za-z0-9+/=]+$ ]]
          [[ "${TRUSTED_IDENTITY_B64}" =~ ^[A-Za-z0-9+/=]+$ ]]
          [[ "${SOURCE_DATE_EPOCH}" =~ ^[1-9][0-9]{8,9}$ ]]
          case "${SPEC_ID}" in
            cuda130-amd64|cuda130-arm64|cann900-a2-amd64|cann900-a2-arm64|cann900-a3-amd64|cann900-a3-arm64) ;;
            *) exit 2 ;;
          esac
          case "${TAG_NAME}" in draft/v*|v*) ;; *) exit 2 ;; esac
      - name: Free publisher disk
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.control_sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Download only the triggering candidate aggregate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.candidate_artifact_name }}
          path: input/candidate-artifact
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Reopen candidate bytes and restore trusted wheel
        env:
          CONTROL_SHA: ${{ inputs.control_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TAG_NAME: ${{ inputs.tag_name }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          SOURCE_IDENTITY_B64: ${{ inputs.source_identity_b64 }}
          TRUSTED_IDENTITY_B64: ${{ inputs.trusted_identity_b64 }}
          SPEC_ID: ${{ inputs.spec_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          printf '%s' "${SOURCE_IDENTITY_B64}" | base64 --decode >out/source-identity.json
          printf '%s' "${TRUSTED_IDENTITY_B64}" | base64 --decode >out/trusted-identity.json
          PYTHONPATH=control/.github/release/production python -m ucm_release_production trusted reopen-candidate \
            --identity out/trusted-identity.json --artifact-dir input/candidate-artifact \
            --output-dir input/reopened
          PYTHONPATH=control/.github/release/production python -m ucm_release_production tag parse \
            --config control/.github/release/production/production-release.json \
            --tag "${TAG_NAME}" --output out/tag-intent.json
          PYTHONPATH=control/.github/release/production python -m ucm_release_production build task \
            --config control/.github/release/production/production-release.json \
            --intent out/tag-intent.json --source out/source-identity.json \
            --spec-id "${SPEC_ID}" --output out/build-task.json
      - name: Restore exact trusted rebuild wheel
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: cache/trusted/wheels/${{ inputs.spec_id }}
          key: production-trusted-wheel-${{ github.repository_id }}-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}-${{ inputs.control_sha }}-${{ inputs.source_sha }}-${{ inputs.spec_id }}
          enableCrossOsArchive: false
          fail-on-cache-miss: true
      - name: Download and verify pinned runtime dependencies
        env:
          SPEC_ID: ${{ inputs.spec_id }}
        shell: bash
        run: |
          set -euo pipefail
          wheel_root="cache/trusted/wheels/${SPEC_ID}"
          wheel_path="$(find "${wheel_root}" -maxdepth 1 -type f -name '*.whl' -print)"
          test -n "${wheel_path}"
          architecture="${SPEC_ID##*-}"
          case "${architecture}" in
            amd64) pip_platform=manylinux2014_x86_64 ;;
            arm64) pip_platform=manylinux2014_aarch64 ;;
            *) exit 2 ;;
          esac
          mkdir -p input/runtime-download
          python - "${architecture}" <<'PY' >out/runtime-wheels.tsv
          import json
          import sys

          config = json.load(open("control/.github/release/production/production-release.json"))
          architecture = sys.argv[1]
          packaging = config["toolchain"]["python_build"]["packaging"]
          wrapt_group = config["toolchain"]["wrapt"]
          wrapt = wrapt_group[architecture]
          print(f"packaging=={packaging['version']}\t{packaging['filename']}\t{packaging['sha256']}")
          print(f"wrapt=={wrapt_group['version']}\t{wrapt['filename']}\t{wrapt['sha256']}")
          PY
          while IFS=$'\t' read -r requirement filename expected_sha256; do
            rm -rf input/runtime-download/*
            python -m pip download --disable-pip-version-check --no-cache-dir \
              --only-binary=:all: --no-deps --platform "${pip_platform}" \
              --python-version 312 --implementation cp --abi cp312 \
              --dest input/runtime-download "${requirement}"
            test -f "input/runtime-download/${filename}"
            test "$(sha256sum "input/runtime-download/${filename}" | cut -d' ' -f1)" = \
              "${expected_sha256}"
            mv "input/runtime-download/${filename}" "${wheel_root}/${filename}"
          done <out/runtime-wheels.tsv
          PYTHONPATH=control/.github/release/production python -m ucm_release_production image context \
            --config control/.github/release/production/production-release.json \
            --task out/build-task.json --intent out/tag-intent.json \
            --wheel-record "${wheel_root}/record.json" --wheel "${wheel_path}" \
            --dockerfile control/.github/release/production/docker/Dockerfile.image \
            --output-dir context --recipe-output out/image-recipe.json \
            >out/image-context.json
      - name: Install checksum-pinned Buildx and crane
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=amd64; crane_arch=x86_64; buildx_sha="${BUILDX_LINUX_AMD64_SHA256}"; crane_sha="${CRANE_LINUX_AMD64_SHA256}" ;;
            aarch64|arm64) arch=arm64; crane_arch=arm64; buildx_sha="${BUILDX_LINUX_ARM64_SHA256}"; crane_sha="${CRANE_LINUX_ARM64_SHA256}" ;;
            *) exit 2 ;;
          esac
          mkdir -p "${RUNNER_TEMP}/crane" "${HOME}/.docker/cli-plugins"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/crane.tar.gz" \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_${crane_arch}.tar.gz"
          echo "${crane_sha}  ${RUNNER_TEMP}/crane.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/crane.tar.gz" -C "${RUNNER_TEMP}/crane" crane
          test "$("${RUNNER_TEMP}/crane/crane" version)" = "${CRANE_VERSION#v}"
          echo "${RUNNER_TEMP}/crane" >>"${GITHUB_PATH}"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/docker-buildx" \
            "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-${arch}"
          echo "${buildx_sha}  ${RUNNER_TEMP}/docker-buildx" | sha256sum --check
          install -m 0755 "${RUNNER_TEMP}/docker-buildx" "${HOME}/.docker/cli-plugins/docker-buildx"
          docker buildx create --name ucm-production-publisher \
            --driver docker-container --driver-opt "image=${BUILDKIT_IMAGE}" --use
          docker buildx inspect ucm-production-publisher --bootstrap
      - name: Rebuild and compare the exact candidate OCI closure
        env:
          SOURCE_DATE_EPOCH: ${{ inputs.source_date_epoch }}
        shell: bash
        run: |
          set -euo pipefail
          platform="$(python -c 'import json; print(json.load(open("out/build-task.json"))["platform"])')"
          base="$(python -c 'import json; r=json.load(open("out/image-recipe.json"))["base"]; print("{}@{}".format(r["repository"],r["manifest_digest"]))')"
          distribution="$(python -c 'import json; print(json.load(open("out/build-task.json"))["distribution"])')"
          source_sha="$(python -c 'import json; print(json.load(open("out/build-task.json"))["source_sha"])')"
          image_tag="$(python -c 'import json; print(json.load(open("out/image-recipe.json"))["image_tag"])')"
          spec_id="$(python -c 'import json; print(json.load(open("out/build-task.json"))["spec_id"])')"
          task_sha="sha256:$(python -c 'import json; print(json.load(open("out/build-task.json"))["sha256"])')"
          recipe_sha="sha256:$(python -c 'import json; print(json.load(open("out/image-recipe.json"))["sha256"])')"
          wheel_name="$(python -c 'import json; print(json.load(open("out/image-context.json"))["wheel_name"])')"
          packaging_name="$(python -c 'import json; print(next(name for name in json.load(open("out/image-context.json"))["runtime_wheel_names"] if name.startswith("packaging-")))')"
          wrapt_name="$(python -c 'import json; print(next(name for name in json.load(open("out/image-context.json"))["runtime_wheel_names"] if name.startswith("wrapt-")))')"
          wheel_path="context/${wheel_name}"
          wheel_sha="sha256:$(sha256sum "${wheel_path}" | cut -d' ' -f1)"
          docker buildx build --builder ucm-production-publisher --platform "${platform}" \
            --target production-runtime --provenance=false --sbom=false \
            --build-arg "BASE_IMAGE=${base}" --build-arg "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" \
            --build-arg "UCM_DISTRIBUTION=${distribution}" \
            --build-arg "UCM_WHEEL=${wheel_name}" \
            --build-arg "PACKAGING_WHEEL=${packaging_name}" \
            --build-arg "WRAPT_WHEEL=${wrapt_name}" \
            --build-arg "UCM_SOURCE_SHA=${source_sha}" --build-arg "UCM_IMAGE_TAG=${image_tag}" \
            --build-arg "UCM_SPEC_ID=${spec_id}" --build-arg "UCM_TASK_SHA256=${task_sha}" \
            --build-arg "UCM_WHEEL_SHA256=${wheel_sha}" --build-arg "UCM_RECIPE_SHA256=${recipe_sha}" \
            --annotation "manifest:org.opencontainers.image.revision=${source_sha}" \
            --annotation "manifest:org.opencontainers.image.version=${image_tag}" \
            --output type=oci,dest=out/image.oci.tar,oci-mediatypes=true,rewrite-timestamp=true \
            --progress plain context
          PYTHONPATH=control/.github/release/production python -m ucm_release_production image extract \
            --archive out/image.oci.tar --output-dir out/oci-layout
          PYTHONPATH=control/.github/release/production python -m ucm_release_production image inspect \
            --layout out/oci-layout --recipe out/image-recipe.json \
            --wheel-sha256 "${wheel_sha}" --output out/rebuilt-closure.json
          candidate_closure="input/reopened/candidate/images/${spec_id}/closure.json"
          cmp out/rebuilt-closure.json "${candidate_closure}"
      - name: Authenticate to GHCR only after full closure equality
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/ucm-production-member-auth
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${DOCKER_CONFIG}"
          printf '%s' "${GITHUB_TOKEN}" | crane auth login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin
      - name: Publish and reread one immutable member
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/ucm-production-member-auth
          SPEC_ID: ${{ inputs.spec_id }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=control/.github/release/production python -m ucm_release_production workflow-data member-request \
            --config control/.github/release/production/production-release.json \
            --candidate input/reopened/verified-envelope.json \
            --candidate-root input/reopened/candidate --spec-id "${SPEC_ID}" \
            --layout out/oci-layout --output out/member-request.json
          set +e
          PYTHONPATH=control/.github/release/production python -m ucm_release_production publish member \
            --request out/member-request.json --output "out/${SPEC_ID}.json"
          result=$?
          set -e
          if [[ "${result}" -ne 0 ]]; then
            exit "${result}"
          fi
      - name: Remove registry credentials
        if: ${{ always() }}
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/ucm-production-member-auth
        shell: bash
        run: |
          set -euo pipefail
          crane auth logout ghcr.io || true
          rm -rf "${DOCKER_CONFIG}"
      - name: Upload member publication evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-member-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}-${{ inputs.spec_id }}
          path: out/${{ inputs.spec_id }}.json
          if-no-files-found: warn
          overwrite: false
          retention-days: 90
