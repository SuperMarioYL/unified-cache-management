name: UCM Documentation Translation Generate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - docs-next/docs/en/**
      - docs-next/docs/zh/**
      - docs-next/translation-glossary.json
      - docs-next/translation-state.json
      - docs-next/translation-required.txt
  workflow_dispatch:

concurrency:
  group: docs-translation-${{ github.repository_id }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  generate:
    if: ${{ vars.DOCS_TRANSLATION_API_FORMAT != '' }}
    name: Translate prepared Markdown
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: docs-translation
    steps:
      - name: Check out trusted generation code
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize only pull request documentation through the GitHub API
        if: github.event_name == 'pull_request_target'
        env:
          BASE_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/aw/stage-pr-docs.mjs

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install trusted translation dependencies
        run: python -m pip install --disable-pip-version-check -r docs-next/requirements-translation.txt

      - name: Prepare deterministic translation chunks
        id: prepare
        env:
          API_FORMAT: ${{ vars.DOCS_TRANSLATION_API_FORMAT }}
          BASE_URL: ${{ vars.DOCS_TRANSLATION_BASE_URL }}
          MODEL: ${{ vars.DOCS_TRANSLATION_MODEL }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REPOSITORY_ID: ${{ github.event.pull_request.base.repo.id }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = pull_request_target ]; then
            arguments=(
              --changed --base-ref "${PR_BASE_SHA}" --head-sha "${PR_HEAD_SHA}"
              --base-repository-id "${PR_BASE_REPOSITORY_ID}"
              --head-repository-id "${PR_HEAD_REPOSITORY_ID}"
              --pr-number "${PR_NUMBER}" --max-pages 10
            )
          else
            source_sha="$(git rev-parse HEAD)"
            arguments=(
              --missing --base-ref "${source_sha}" --head-sha "${source_sha}"
              --base-repository-id "${GITHUB_REPOSITORY_ID}"
              --head-repository-id "${GITHUB_REPOSITORY_ID}" --max-pages 5
            )
          fi
          python docs-next/tools/site.py translate prepare "${arguments[@]}" \
            --api-format "${API_FORMAT}" --model "${MODEL}" --base-url "${BASE_URL}" \
            --output-dir raw/task
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          task = json.loads(Path("raw/task/translation-task.json").read_text())
          summary = task["summary"]
          has_work = any(summary[key] for key in ("selected_chunks", "deletes", "state_changes"))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"has_work={str(has_work).lower()}\n")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as output:
              output.write(f"Translation task: {summary['selected_pages']} pages, {summary['selected_chunks']} chunks.\n")
              if not has_work:
                  output.write("Chinese documentation is synchronized; no API requests were sent.\n")
          PY

      - name: Translate chunks with the configured HTTP API
        if: steps.prepare.outputs.has_work == 'true'
        env:
          DOCS_TRANSLATION_API_FORMAT: ${{ vars.DOCS_TRANSLATION_API_FORMAT }}
          DOCS_TRANSLATION_BASE_URL: ${{ vars.DOCS_TRANSLATION_BASE_URL }}
          DOCS_TRANSLATION_MODEL: ${{ vars.DOCS_TRANSLATION_MODEL }}
          DOCS_TRANSLATION_API_KEY: ${{ secrets.DOCS_TRANSLATION_API_KEY }}
        run: >-
          python docs-next/tools/site.py translate generate
          --task-dir raw/task --output-dir raw/agent-output

      - name: Validate Markdown and terminology before hand-off
        if: steps.prepare.outputs.has_work == 'true'
        run: >-
          python docs-next/tools/site.py translate finalize
          --task-dir raw/task --agent-output-dir raw/agent-output
          --output-dir checked

      - name: Upload the complete raw task for credential-separated delivery
        if: steps.prepare.outputs.has_work == 'true'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: docs-translation-raw
          path: raw/
          if-no-files-found: error
          retention-days: 1
