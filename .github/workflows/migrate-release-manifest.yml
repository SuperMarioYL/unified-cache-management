name: UCM Release · Migrate v0.9.3 Manifest

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact Stable Tag to migrate
        type: string
        required: true
        default: v0.9.3

concurrency:
  group: ucm-release-manifest-migration-${{ github.repository_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate-manifest:
    name: Migrate ${{ inputs.tag }} to Schema 8
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      ORIGINAL_RUN_ID: "33235078637"
    outputs:
      release_tag: ${{ steps.inspect.outputs.release_tag }}
      migrated: ${{ steps.inspect.outputs.needs_migration }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - id: inspect
        name: Inspect the exact Stable Release
        run: |
          set -euo pipefail
          test "${RELEASE_TAG}" = v0.9.3
          git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = \
            98eda15bb9d17dc0f9d7b1438f06a7930626d0e9

          mkdir -p input/legacy input/release
          releases="$(gh api --paginate --slurp \
            "/repos/${GH_REPO}/releases?per_page=100" \
            | jq -ce --arg tag "${RELEASE_TAG}" \
              '[.[][] | select(.tag_name == $tag)]')"
          test "$(jq 'length' <<<"${releases}")" = 1
          release_id="$(jq -er '.[0].id' <<<"${releases}")"
          gh api "/repos/${GH_REPO}/releases/${release_id}" \
            >input/release/release-before.json
          jq -e --arg tag "${RELEASE_TAG}" '
            .tag_name == $tag and .draft == false and .prerelease == false
          ' input/release/release-before.json >/dev/null

          manifest_asset_id="$(jq -er '
            [.assets[] | select(.name == "release-manifest.json")] |
            if length == 1 then .[0].id
            else error("Release Manifest asset is ambiguous") end
          ' input/release/release-before.json)"
          gh api -H 'Accept: application/octet-stream' \
            "/repos/${GH_REPO}/releases/assets/${manifest_asset_id}" \
            >input/legacy/release-manifest.json
          schema_version="$(jq -er '.schema_version' \
            input/legacy/release-manifest.json)"
          PYTHONPATH=.github/release python - "${RELEASE_TAG}" <<'PY'
          import json
          import sys
          from pathlib import Path
          from ucm_release import cleanup

          manifest = json.loads(
              Path("input/legacy/release-manifest.json").read_text(encoding="utf-8")
          )
          cleanup.validate_manifest(manifest, expected_tag=sys.argv[1])
          PY
          if [ "${schema_version}" = 8 ]; then
            jq -e --slurpfile manifest input/legacy/release-manifest.json \
              '([.assets[].name] | sort) == $manifest[0].github_release_assets' \
              input/release/release-before.json >/dev/null
            echo "needs_migration=false" >>"${GITHUB_OUTPUT}"
          else
            test "${schema_version}" = 6
            test "$(jq -er '.actions_run_id' \
              input/legacy/release-manifest.json)" = "${ORIGINAL_RUN_ID}"
            test "$(jq '.assets | length' input/release/release-before.json)" = 14
            test "$(jq '[.assets[] | select(.name == "pypi-receipt.json")] | length' \
              input/release/release-before.json)" = 0
            echo "needs_migration=true" >>"${GITHUB_OUTPUT}"
          fi
          echo "release_tag=${RELEASE_TAG}" >>"${GITHUB_OUTPUT}"
      - name: Preserve the original Schema 6 evidence
        if: ${{ steps.inspect.outputs.needs_migration == 'true' }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ucm-manifest-migration-backup-${{ inputs.tag }}-run-${{ github.run_id }}
          path: |
            input/legacy/
            input/release/release-before.json
          if-no-files-found: error
          retention-days: 90
      - name: Download the original staged Release State
        if: ${{ steps.inspect.outputs.needs_migration == 'true' }}
        uses: actions/download-artifact@v4.3.0
        with:
          name: ucm-release-stage-run-${{ env.ORIGINAL_RUN_ID }}
          path: input/stage
          run-id: ${{ env.ORIGINAL_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Download the original publication receipts
        if: ${{ steps.inspect.outputs.needs_migration == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p input/receipts
          gh run download "${ORIGINAL_RUN_ID}" --repo "${GH_REPO}" \
            --pattern "ucm-image-*-receipt-*-run-${ORIGINAL_RUN_ID}" \
            --dir input/receipts
          receipt_count="$(find input/receipts -type f -name '*.json' \
            | wc -l | tr -d '[:space:]')"
          echo "downloaded ${receipt_count} image publication receipts"
          test "${receipt_count}" = 62
      - name: Reconstruct Final State and Schema 8
        if: ${{ steps.inspect.outputs.needs_migration == 'true' }}
        run: |
          set -euo pipefail
          python .github/release/ucm_release/release.py finalize \
            --manifest input/stage/release-state.json \
            --receipts input/receipts \
            --build-outcome success \
            --member-outcome success \
            --index-outcome success \
            --pypi-outcome skipped \
            --pypi-install-outcome skipped \
            --chart-oci-outcome success \
            --output out/release
          jq -e --arg tag "${RELEASE_TAG}" \
            --argjson run_id "${ORIGINAL_RUN_ID}" '
            .kind == "ucm-release-state" and
            .schema_version == 3 and
            .release.status == "complete" and
            .release.git_tag == $tag and
            .release.release_type == "stable" and
            .release.actions_run_id == $run_id and
            .publish.pypi.enabled == false and
            (.pypi == null) and
            (.wheels | length) == 10 and
            (.images | length) == 42 and
            (.families | length) == 22
          ' out/release/release-state.json >/dev/null
          python .github/release/ucm_release/release.py manifest \
            --state out/release/release-state.json \
            --release input/release/release-before.json \
            --output out/release
          jq -e --arg tag "${RELEASE_TAG}" '
            .kind == "ucm-release-manifest" and
            .schema_version == 8 and
            .release.tag == $tag and
            .release.actions_run_id == 33235078637 and
            .python.version == "0.9.3" and
            .python.pypi == null and
            (.python.extras | length) == 6 and
            (.wheels | length) == 10 and
            (.images | length) == 22 and
            (.github_release_assets | length) == 14
          ' out/release/release-manifest.json >/dev/null
          jq -e --slurpfile manifest out/release/release-manifest.json '
            ([.assets[].name] | sort) == $manifest[0].github_release_assets
          ' input/release/release-before.json >/dev/null
      - name: Upload and read back Schema 8
        if: ${{ steps.inspect.outputs.needs_migration == 'true' }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" --repo "${GH_REPO}" --clobber \
            out/release/release-manifest.json
          release_id="$(jq -er '.id' input/release/release-before.json)"
          gh api "/repos/${GH_REPO}/releases/${release_id}" \
            >out/release/release-after.json
          asset_id="$(jq -er '
            [.assets[] | select(.name == "release-manifest.json")] |
            if length == 1 then .[0].id
            else error("Schema 8 asset is ambiguous") end
          ' out/release/release-after.json)"
          gh api -H 'Accept: application/octet-stream' \
            "/repos/${GH_REPO}/releases/assets/${asset_id}" \
            >out/release/release-manifest-readback.json
          cmp out/release/release-manifest.json \
            out/release/release-manifest-readback.json
          PYTHONPATH=.github/release python - "${RELEASE_TAG}" <<'PY'
          import json
          import sys
          from pathlib import Path
          from ucm_release import cleanup

          manifest = json.loads(
              Path("out/release/release-manifest-readback.json").read_text(
                  encoding="utf-8"
              )
          )
          cleanup.validate_manifest(manifest, expected_tag=sys.argv[1])
          PY
          jq -e --slurpfile manifest out/release/release-manifest.json '
            ([.assets[].name] | sort) == $manifest[0].github_release_assets
          ' out/release/release-after.json >/dev/null
      - name: Upload migration evidence
        if: ${{ steps.inspect.outputs.needs_migration == 'true' }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ucm-manifest-migration-evidence-${{ inputs.tag }}-run-${{ github.run_id }}
          path: out/release/
          if-no-files-found: error
          retention-days: 90

  publish-stable-pages:
    name: Publish migrated Stable documentation
    needs: migrate-manifest
    if: >-
      ${{
        needs.migrate-manifest.outputs.migrated == 'true' &&
        vars.UCM_PAGES_ENABLED == 'true'
      }}
    permissions:
      contents: write
    uses: ./.github/workflows/docs-pages.yml
    with:
      mode: stable
      source_ref: ${{ github.sha }}
      release_tag: ${{ needs.migrate-manifest.outputs.release_tag }}
      replace_existing: false

  publish-latest-pages:
    name: Publish latest from Schema 8
    needs: publish-stable-pages
    permissions:
      contents: write
    uses: ./.github/workflows/docs-pages.yml
    with:
      mode: latest
      source_ref: ${{ github.sha }}
      release_tag: ""
