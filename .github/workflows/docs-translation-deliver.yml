name: UCM Documentation Translation Delivery

on:
  workflow_run:
    workflows:
      - UCM Documentation Translation Generate
    types: [completed]

concurrency:
  group: docs-translation-delivery-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  inspect:
    name: Translation · Inspect raw hand-off
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      base_sha: ${{ steps.metadata.outputs.base_sha }}
      base_repository_id: ${{ steps.metadata.outputs.base_repository_id }}
      found: ${{ steps.artifact.outputs.found }}
      head_ref: ${{ steps.current.outputs.head_ref }}
      head_repo: ${{ steps.current.outputs.head_repo }}
      head_repository_id: ${{ steps.metadata.outputs.head_repository_id }}
      head_sha: ${{ steps.metadata.outputs.head_sha }}
      maintainer_can_modify: ${{ steps.current.outputs.maintainer_can_modify }}
      mode: ${{ steps.metadata.outputs.mode }}
      model: ${{ steps.metadata.outputs.model }}
      pr_number: ${{ steps.metadata.outputs.pr_number }}
      provider: ${{ steps.metadata.outputs.provider }}
      current: ${{ steps.current.outputs.current }}
      validated_artifact: ${{ steps.metadata.outputs.validated_artifact }}
    steps:
      - name: Locate the fixed raw artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          count="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts" \
              --jq '[.artifacts[] | select(.name == "docs-translation-raw" and .expired == false)] | length'
          )"
          if [ "${count}" = 0 ]; then
            echo 'found=false' >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          test "${count}" = 1
          echo 'found=true' >>"${GITHUB_OUTPUT}"

      - name: Download raw task and agent output
        if: ${{ steps.artifact.outputs.found == 'true' }}
        uses: actions/download-artifact@v4.3.0
        with:
          name: docs-translation-raw
          path: raw
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate bounded provenance fields
        id: metadata
        if: ${{ steps.artifact.outputs.found == 'true' }}
        env:
          TASK: raw/task/translation-task.json
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          task = json.loads(Path(os.environ["TASK"]).read_text(encoding="utf-8"))
          if set(task) != {
              "schema_version", "provenance", "identity", "pages", "chunks",
              "deletes", "summary",
          } or task["schema_version"] != 1:
              raise SystemExit("unexpected translation task schema")
          provenance = task["provenance"]
          identity = task["identity"]
          expected_provenance = {
              "mode", "base_sha", "head_sha", "base_repository_id",
              "head_repository_id", "pr_number",
          }
          if set(provenance) != expected_provenance or provenance["mode"] not in {
              "changed", "missing"
          }:
              raise SystemExit("invalid translation delivery mode")
          if provenance["mode"] == "changed":
              if not isinstance(provenance["pr_number"], int) or provenance["pr_number"] <= 0:
                  raise SystemExit("invalid pull request number")
          elif provenance["pr_number"] is not None:
              raise SystemExit("missing-page tasks must not name a pull request")
          for name in ("base_repository_id", "head_repository_id"):
              if not str(provenance[name]).isdigit() or int(provenance[name]) <= 0:
                  raise SystemExit(f"invalid {name}")
          for name in ("base_sha", "head_sha"):
              if not re.fullmatch(r"[0-9a-f]{40}|[0-9a-f]{64}", provenance[name]):
                  raise SystemExit(f"invalid {name}")
          if set(identity) != {
              "provider", "model", "endpoint_hash", "agent_hash", "glossary_hash"
          }:
              raise SystemExit("unexpected translation identity")

          if identity["provider"] not in {
              "openai-chat-completions", "openai-responses",
              "anthropic-messages", "gemini-generate-content",
          } or not re.fullmatch(r"[^\r\n\x00]{1,256}", identity["model"]):
              raise SystemExit("invalid translation API identity")
          outputs = Path(os.environ["GITHUB_OUTPUT"])
          with outputs.open("a", encoding="utf-8") as stream:
              for name in (
                  "base_repository_id", "base_sha", "head_repository_id", "head_sha"
              ):
                  stream.write(f"{name}={provenance[name]}\n")
              stream.write(f"mode={provenance['mode']}\n")
              stream.write(f"pr_number={provenance['pr_number'] or ''}\n")
              stream.write(f"provider={identity['provider']}\n")
              stream.write(f"model={identity['model']}\n")
              artifact_name = (
                  f"docs-translation-pr-{provenance['pr_number']}-{provenance['head_sha']}"
                  if provenance["pr_number"] is not None
                  else f"docs-translation-backfill-{provenance['head_sha']}"
              )
              stream.write(f"validated_artifact={artifact_name}\n")
          PY

      - name: Require the pull request to remain at the task HEAD
        id: current
        if: ${{ steps.artifact.outputs.found == 'true' }}
        env:
          EXPECTED_BASE_REPOSITORY_ID: ${{ steps.metadata.outputs.base_repository_id }}
          EXPECTED_HEAD_REPOSITORY_ID: ${{ steps.metadata.outputs.head_repository_id }}
          EXPECTED_HEAD_SHA: ${{ steps.metadata.outputs.head_sha }}
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.metadata.outputs.mode }}
          PR_NUMBER: ${{ steps.metadata.outputs.pr_number }}
        run: |
          set -euo pipefail
          if [ "${MODE}" = missing ]; then
            {
              echo 'current=true'
              echo "head_repo=${GITHUB_REPOSITORY}"
              echo 'head_ref=automation/docs-translation'
              echo 'maintainer_can_modify=false'
            } >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          current="$(
            jq -r \
              --arg base_id "${EXPECTED_BASE_REPOSITORY_ID}" \
              --arg head_id "${EXPECTED_HEAD_REPOSITORY_ID}" \
              --arg head_sha "${EXPECTED_HEAD_SHA}" \
              '(.state == "open" and
                (.base.repo.id | tostring) == $base_id and
                (.head.repo.id | tostring) == $head_id and
                .head.sha == $head_sha)' <<<"${pr}"
          )"
          {
            echo "current=${current}"
            echo "head_repo=$(jq -r '.head.repo.full_name' <<<"${pr}")"
            echo "head_ref=$(jq -r '.head.ref' <<<"${pr}")"
            echo "maintainer_can_modify=$(jq -r '.maintainer_can_modify' <<<"${pr}")"
          } >>"${GITHUB_OUTPUT}"

  validate:
    name: Translation · Validate without credentials
    needs: inspect
    if: ${{ needs.inspect.outputs.found == 'true' && needs.inspect.outputs.current == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted workflow code
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the exact PR HEAD without credentials
        uses: actions/checkout@v4.2.2
        with:
          repository: ${{ needs.inspect.outputs.head_repo }}
          ref: ${{ needs.inspect.outputs.head_sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Download raw task and agent output
        uses: actions/download-artifact@v4.3.0
        with:
          name: docs-translation-raw
          path: raw
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Stage exact PR documentation under trusted code
        if: ${{ needs.inspect.outputs.mode == 'changed' }}
        env:
          BASE_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_WORKSPACE: ${{ github.workspace }}/trusted
          HEAD_REPOSITORY: ${{ needs.inspect.outputs.head_repo }}
          HEAD_SHA: ${{ needs.inspect.outputs.head_sha }}
          PR_NUMBER: ${{ needs.inspect.outputs.pr_number }}
        run: node trusted/.github/aw/stage-pr-docs.mjs

      - name: Stage the backfill source under trusted code
        if: ${{ needs.inspect.outputs.mode == 'missing' }}
        env:
          SOURCE_ROOT: ${{ github.workspace }}/target
          TARGET_ROOT: ${{ github.workspace }}/trusted
        run: node trusted/.github/aw/copy-docs-snapshot.mjs

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install trusted documentation dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          -r trusted/docs-next/requirements-translation.txt
          -r trusted/docs-next/requirements-dev.txt

      - name: Reconstruct and validate the model output
        run: >-
          python trusted/docs-next/tools/site.py translate finalize
          --task-dir raw/task
          --agent-output-dir raw/agent-output
          --output-dir validated

      - name: Require the complete validated hand-off
        run: |
          test -f validated/translation-artifact.json
          test -f validated/translation.patch

      - name: Summarize the validated translation
        env:
          MANIFEST: validated/translation-artifact.json
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path(os.environ["MANIFEST"]).read_text(encoding="utf-8"))
          identity = manifest["identity"]
          summary = manifest["summary"]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              stream.write("## Documentation translation\n\n")
              stream.write("| Field | Value |\n| --- | ---: |\n")
              stream.write(f"| Provider | {identity['provider']} |\n")
              stream.write(f"| Model | {identity['model']} |\n")
              stream.write(f"| Translated pages | {summary['translated_pages']} |\n")
              stream.write(f"| Translated chunks | {summary['translated_chunks']} |\n")
              stream.write(f"| Written files | {summary['written_files']} |\n")
              stream.write(f"| Deleted files | {summary['deleted_files']} |\n")
              stream.write(f"\nSource run: {os.environ['SOURCE_RUN_URL']}\n")
          PY

      - name: CAS-apply the artifact to an isolated exact-HEAD checkout
        run: >-
          python trusted/docs-next/tools/site.py translate apply
          --artifact-dir validated
          --checkout-root target

      - name: Check translation freshness on the resulting PR tree
        env:
          BASE_SHA: ${{ needs.inspect.outputs.base_sha }}
        run: >-
          python trusted/docs-next/tools/site.py translate check
          --base-ref "${BASE_SHA}"
          --checkout-root target

      - name: Stage the validated documentation for trusted MkDocs
        env:
          SOURCE_ROOT: ${{ github.workspace }}/target
          TARGET_ROOT: ${{ github.workspace }}/trusted
        run: node trusted/.github/aw/copy-docs-snapshot.mjs

      - name: Strict build for all enabled languages
        working-directory: trusted/docs-next
        run: python tools/site.py validate

      - name: Test trusted documentation contracts
        working-directory: trusted/docs-next
        run: python -m pytest -q tests

      - name: Test trusted Installation renderer
        working-directory: trusted/docs-next
        run: node --test tests/install-ui.test.cjs

      - name: Upload the exact validated artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ needs.inspect.outputs.validated_artifact }}
          path: validated/
          if-no-files-found: error
          retention-days: 14

  writeback:
    name: Translation · Write back same-repository PR
    needs: [inspect, validate]
    if: >-
      ${{
        needs.inspect.outputs.mode == 'changed' &&
        needs.inspect.outputs.base_repository_id == needs.inspect.outputs.head_repository_id
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: docs-translation
    permissions:
      contents: read
    steps:
      - name: Check out trusted application code
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Create a narrowly scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2.1.4
        with:
          app-id: ${{ vars.DOCS_TRANSLATION_APP_ID }}
          private-key: ${{ secrets.DOCS_TRANSLATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read

      - name: Check out the exact PR HEAD with the App token
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.inspect.outputs.head_sha }}
          path: target
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token }}

      - name: Download the validated artifact
        uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ needs.inspect.outputs.validated_artifact }}
          path: validated

      - name: Apply with trusted code and commit only allowlisted paths
        env:
          EXPECTED_HEAD_SHA: ${{ needs.inspect.outputs.head_sha }}
          TARGET_BRANCH: ${{ needs.inspect.outputs.head_ref }}
        run: |
          set -euo pipefail
          remote_sha="$(
            git -C target ls-remote --heads origin "refs/heads/${TARGET_BRANCH}" |
              awk 'NR == 1 { print $1 }'
          )"
          test -n "${remote_sha}"
          test "${remote_sha}" = "${EXPECTED_HEAD_SHA}"
          python trusted/docs-next/tools/site.py translate apply \
            --artifact-dir validated \
            --checkout-root target
          git -C target add --all -- \
            docs-next/docs/zh \
            docs-next/translation-state.json
          if git -C target diff --cached --quiet; then
            echo 'Validated artifact is already present.'
            exit 0
          fi
          unexpected="$(
            git -C target diff --cached --name-only |
              awk '!/^docs-next\/docs\/zh\/.*\.md$/ && $0 != "docs-next/translation-state.json"'
          )"
          test -z "${unexpected}"
          git -C target config user.name 'ucm-docs-translation[bot]'
          git -C target config user.email 'ucm-docs-translation[bot]@users.noreply.github.com'
          git -C target commit -m 'docs: update Chinese translations'
          git -C target push origin "HEAD:refs/heads/${TARGET_BRANCH}"

  backfill:
    name: Translation · Update missing-page backfill PR
    needs: [inspect, validate]
    if: ${{ needs.inspect.outputs.mode == 'missing' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: docs-translation
    permissions:
      contents: read
    steps:
      - name: Check out trusted application code
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Create a narrowly scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2.1.4
        with:
          app-id: ${{ vars.DOCS_TRANSLATION_APP_ID }}
          private-key: ${{ secrets.DOCS_TRANSLATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out the exact backfill source with the App token
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.inspect.outputs.head_sha }}
          path: target
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token }}

      - name: Download the validated artifact
        uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ needs.inspect.outputs.validated_artifact }}
          path: validated

      - name: Apply and push the next bounded backfill batch
        env:
          BACKFILL_BRANCH: automation/docs-translation
          EXPECTED_HEAD_SHA: ${{ needs.inspect.outputs.head_sha }}
        run: |
          set -euo pipefail
          remote_sha="$(
            git -C target ls-remote --heads origin "refs/heads/${BACKFILL_BRANCH}" |
              awk 'NR == 1 { print $1 }'
          )"
          if [ -n "${remote_sha}" ]; then
            test "${remote_sha}" = "${EXPECTED_HEAD_SHA}"
          fi
          python trusted/docs-next/tools/site.py translate apply \
            --artifact-dir validated \
            --checkout-root target
          git -C target add --all -- \
            docs-next/docs/zh \
            docs-next/translation-state.json
          test -n "$(git -C target diff --cached --name-only)"
          unexpected="$(
            git -C target diff --cached --name-only |
              awk '!/^docs-next\/docs\/zh\/.*\.md$/ && $0 != "docs-next/translation-state.json"'
          )"
          test -z "${unexpected}"
          git -C target config user.name 'ucm-docs-translation[bot]'
          git -C target config user.email 'ucm-docs-translation[bot]@users.noreply.github.com'
          git -C target commit -m 'docs: backfill Chinese translations'
          git -C target push origin "HEAD:refs/heads/${BACKFILL_BRANCH}"

      - name: Create or update the backfill pull request
        env:
          BACKFILL_BRANCH: automation/docs-translation
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          title='docs: backfill missing Chinese translations'
          body='API translation backfill. Each workflow dispatch adds at most five pages; review the generated Chinese before merging.'
          pr_number="$(
            gh pr list --repo "${GITHUB_REPOSITORY}" --state open \
              --base develop --head "${BACKFILL_BRANCH}" \
              --json number --jq '.[0].number // empty'
          )"
          if [ -n "${pr_number}" ]; then
            gh pr edit "${pr_number}" --repo "${GITHUB_REPOSITORY}" \
              --title "${title}" --body "${body}"
          else
            gh pr create --repo "${GITHUB_REPOSITORY}" \
              --base develop --head "${BACKFILL_BRANCH}" \
              --title "${title}" --body "${body}"
          fi

  fork-patch:
    name: Translation · Publish fork patch instructions
    needs: [inspect, validate]
    if: >-
      ${{
        needs.inspect.outputs.mode == 'changed' &&
        needs.inspect.outputs.base_repository_id != needs.inspect.outputs.head_repository_id
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ needs.inspect.outputs.pr_number }}
    steps:
      - name: Create or update the fork patch comment
        env:
          ARTIFACT_NAME: ${{ needs.inspect.outputs.validated_artifact }}
          BASE_SHA: ${{ needs.inspect.outputs.base_sha }}
          HEAD_SHA: ${{ needs.inspect.outputs.head_sha }}
          MAINTAINER_CAN_MODIFY: ${{ needs.inspect.outputs.maintainer_can_modify }}
          MODEL: ${{ needs.inspect.outputs.model }}
          PROVIDER: ${{ needs.inspect.outputs.provider }}
        run: |
          set -euo pipefail
          body_file="${RUNNER_TEMP}/translation-comment.md"
          {
            echo '<!-- ucm-docs-translation -->'
            echo '## Chinese translation patch is ready'
            echo
            echo "- Provider: \`${PROVIDER}\`"
            echo "- Model: \`${MODEL}\`"
            echo "- PR HEAD: \`${HEAD_SHA}\`"
            echo "- Artifact: \`${ARTIFACT_NAME}\`"
            echo "- Maintainers may edit this fork PR: \`${MAINTAINER_CAN_MODIFY}\`"
            echo
            echo "Download the artifact from [this workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}), then apply it on the unchanged PR branch:"
            echo
            echo '```bash'
            echo 'set -euo pipefail'
            echo "gh pr checkout ${PR_NUMBER} --repo '${GITHUB_REPOSITORY}'"
            echo "gh run download ${GITHUB_RUN_ID} --repo '${GITHUB_REPOSITORY}' -n '${ARTIFACT_NAME}' -D .translation"
            echo "test \"\$(git rev-parse HEAD)\" = '${HEAD_SHA}'"
            echo "git fetch --no-tags 'https://github.com/${GITHUB_REPOSITORY}.git' '${BASE_SHA}'"
            echo '('
            echo "  trusted_dir=\"\$(mktemp -d)\""
            echo "  trap 'rm -rf -- \"\$trusted_dir\"' EXIT"
            echo "  git archive '${BASE_SHA}' docs-next/tools | tar -x -C \"\$trusted_dir\""
            echo "  python \"\$trusted_dir/docs-next/tools/site.py\" translate apply --checkout-root \"\$PWD\" --artifact-dir .translation"
            echo ')'
            echo 'git add docs-next/docs/zh docs-next/translation-state.json'
            echo "git commit -m 'docs: add Chinese translation'"
            echo 'git push'
            echo '```'
            echo
            echo 'The artifact is bound to the exact HEAD above. A newer commit requires the newer workflow artifact.'
          } >"${body_file}"

          comment_id="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --jq '.[] | select(.body | contains("<!-- ucm-docs-translation -->")) | .id' |
              head -n 1
          )"
          if [ -n "${comment_id}" ]; then
            jq -n --rawfile body "${body_file}" '{body: $body}' |
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" --input -
          else
            jq -n --rawfile body "${body_file}" '{body: $body}' |
              gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --input -
          fi
