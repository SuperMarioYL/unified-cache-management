# Fork acceptance source. Keep this workflow on the isolated fixture branch.
name: UCM Tag Release · Stable, Prerelease, Draft, and Nightly
run-name: Draft cleanup fixture · ${{ github.ref_name }}

on:
  push:
    tags:
      - draft/v0.8.0-9101

concurrency:
  group: ucm-release-retention-${{ github.repository_id }}-draft
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-fixture:
    name: Publish one tiny source-bound Draft target
    if: ${{ github.repository == 'SuperMarioYL/unified-cache-management' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FIXTURE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Checkout this Tag's isolated fixture helper
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}
          path: fixture-helper
          sparse-checkout: .github/release/tests/hosted_cleanup.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: -r .github/release/requirements.txt
      - name: Install Crane
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/crane"
          curl -fsSL --retry 3 \
            https://github.com/google/go-containerregistry/releases/download/v0.20.3/go-containerregistry_Linux_x86_64.tar.gz \
            | tar -xz -C "${RUNNER_TEMP}/crane" crane
          echo "${RUNNER_TEMP}/crane" >>"${GITHUB_PATH}"
      - name: Persist both snapshots and publish the exact registry target
        run: |
          set -euo pipefail
          test "${GH_REPO}" = SuperMarioYL/unified-cache-management
          test "${GITHUB_EVENT_NAME}" = push
          python fixture-helper/.github/release/tests/hosted_cleanup.py prepare \
            --production-root . --tag "${FIXTURE_TAG}" \
            --ledger-dir out/ledger --open-dir out/open --plan-dir out/plan
      - uses: actions/upload-artifact@v4.6.2
        if: ${{ always() && hashFiles('out/open/*.json') != '' }}
        with:
          name: ucm-release-cleanup-open-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out/open/*.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4.6.2
        if: ${{ always() && hashFiles('out/plan/*.json') != '' }}
        with:
          name: ucm-release-cleanup-plan-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out/plan/*.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4.6.2
        if: ${{ always() && hashFiles('out/ledger/*.json') != '' }}
        with:
          name: fixture-ledger-run-${{ github.run_id }}
          path: out/ledger/
          if-no-files-found: error
          retention-days: 7
      - name: Finish the source after its recovery evidence is saved
        run: |
          set -euo pipefail
          echo "FIXTURE_READY tag=${FIXTURE_TAG} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
          test "${FIXTURE_TAG}" = draft/v0.8.0-9101
          echo 'Intentional Draft source failure after durable publication evidence.' >&2
          exit 1
