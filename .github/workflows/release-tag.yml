# Isolated Fork fixture Tag only. Default develop keeps all genuine Tag publishers.
name: UCM Tag Release · Stable, Prerelease, Draft, and Nightly
run-name: Fork GHCR disposable source · ${{ github.ref_name }}

on:
  push:
    tags: ['draft/v0.8.0-202610139001', 'draft/v0.8.0-202610139002']

concurrency:
  group: ucm-release-retention-${{ github.repository_id }}-draft
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-fixture:
    if: ${{ github.repository == 'SuperMarioYL/unified-cache-management' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: fork-preview
    permissions:
      contents: write
      actions: write
      packages: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}
          path: fixture-helper
          sparse-checkout: .github/release/tests
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: -r .github/release/requirements.txt
      - uses: ./.github/actions/setup-crane
      - name: Prepare manual Draft or exclusive tiny GHCR fixture using deployed code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          config=fixture-helper/.github/release/tests/acceptance-config.json
          production_sha="$(jq -er '.production_sha' "${config}")"
          if [ "${GITHUB_REF_NAME}" = "$(jq -er '.draft_tag' "${config}")" ]; then
            operation=prepare-ghcr
          elif [ "${GITHUB_REF_NAME}" = "$(jq -er '.manual_draft_tag' "${config}")" ]; then
            operation=prepare-draft
          else
            echo 'Tag is outside both reviewed fixture coordinates.' >&2
            exit 2
          fi
          python fixture-helper/.github/release/tests/hosted_cleanup.py "${operation}" \
            --production-root . --production-sha "${production_sha}"
      - uses: actions/upload-artifact@v4.6.2
        if: ${{ always() && hashFiles('out/open/*.json') != '' }}
        with:
          name: ucm-release-cleanup-open-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out/open/*.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4.6.2
        if: ${{ always() && hashFiles('out/plan/*.json') != '' }}
        with:
          name: ucm-release-cleanup-plan-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out/plan/*.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4.6.2
        if: ${{ always() && hashFiles('out/ledger/*.json') != '' }}
        with:
          name: fixture-ledger-run-${{ github.run_id }}
          path: out/ledger/
          if-no-files-found: error
          retention-days: 7
      - name: Capture window before the intentionally failed source conclusion
        run: |
          echo 'SOURCE_CAPTURE_WINDOW_OPEN: GHCR ownership ledger is durable.'
          sleep 180
          echo 'Intentional fixture failure after actual GHCR publication.' >&2
          exit 1
