name: UCM Tag Release · Stable, Prerelease, Draft, and Nightly
run-name: Fork Draft quota source · ${{ github.ref_name }}

on:
  push:
    tags:
      - draft/v0.8.0-202610139201
      - draft/v0.8.0-202610139202
      - draft/v0.8.0-202610139203
      - draft/v0.8.0-202610139204
      - draft/v0.8.0-202610139205
      - draft/v0.8.0-202610139206
      - draft/v0.8.0-202610139207

permissions:
  contents: read

jobs:
  prepare-fixture:
    if: ${{ github.repository == 'SuperMarioYL/unified-cache-management' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: fork-preview
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}
          path: fixture-helper
          sparse-checkout: .github/release/tests
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: -r .github/release/requirements.txt
      - name: Save production recovery records for an exact disposable Draft
        run: |
          set -euo pipefail
          python fixture-helper/.github/release/tests/draft_quota.py prepare \
            --production-root . --production-sha f66366538b35faa51507452ae1ad676b10994a4d
      - uses: actions/upload-artifact@v4.6.2
        if: ${{ always() && hashFiles('out/open/*.json') != '' }}
        with:
          name: ucm-release-cleanup-open-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out/open/*.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4.6.2
        if: ${{ always() && hashFiles('out/plan/*.json') != '' }}
        with:
          name: ucm-release-cleanup-plan-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out/plan/*.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4.6.2
        if: ${{ always() && hashFiles('out/ledger/*.json') != '' }}
        with:
          name: fixture-ledger-run-${{ github.run_id }}
          path: out/ledger/
          if-no-files-found: error
          retention-days: 90
      - name: Stop the victim before a Release is ever allocated
        if: ${{ github.ref_name == 'draft/v0.8.0-202610139201' }}
        run: |
          echo 'Intentional protocol failure after real recovery artifacts, before Release allocation.' >&2
          exit 1
