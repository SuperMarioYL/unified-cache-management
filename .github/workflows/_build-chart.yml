name: Reusable UCM chart package

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      resolved_plan_artifact:
        type: string
        required: true
      resolved_plan_sha256:
        type: string
        required: true
    outputs:
      chart_artifact:
        description: Same-run chart package artifact name
        value: ${{ jobs.package-chart.outputs.chart_artifact }}

permissions:
  contents: read

jobs:
  package-chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      chart_artifact: ${{ steps.record.outputs.chart_artifact }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - name: Install checksum-pinned Helm
        env:
          HELM_VERSION: v3.15.3
          HELM_SHA256: ad871aecb0c9fd96aa6702f6b79e87556c8998c2e714a4959bf71ee31282ac9c
        run: |
          # shellcheck disable=SC2153,SC1083,SC2012,SC2100,SC2209
          set -euo pipefail
          test "$(uname -m)" = x86_64
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/helm.tgz" "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  ${RUNNER_TEMP}/helm.tgz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/helm.tgz" -C "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/linux-amd64/helm" "${RUNNER_TEMP}/helm"
          test "$("${RUNNER_TEMP}/helm" version --short)" = "v3.15.3+g3bb50bb"
          echo "${RUNNER_TEMP}" >>"${GITHUB_PATH}"
      - uses: ./.github/actions/download-artifact-retry
        with:
          name: ${{ inputs.resolved_plan_artifact }}
          path: input/plan
      - name: Normalize chart source timestamps
        id: source_time
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          # shellcheck disable=SC2153,SC1083,SC2012,SC2100,SC2209
          set -euo pipefail
          plan=input/plan/resolved-plan.json
          chart_source="$(jq -r '.chart.source' "$plan")"
          test -d "$chart_source"
          source_commit="$(git rev-parse --verify "${SOURCE_SHA}^{commit}")"
          test "$source_commit" = "$(git rev-parse --verify 'HEAD^{commit}')"
          source_date_epoch="$(git show -s --format=%ct "$source_commit")"
          case "$source_date_epoch" in
            ''|*[!0-9]*)
              echo "source commit has an invalid epoch: ${source_date_epoch}" >&2
              exit 2
              ;;
          esac
          test "$source_date_epoch" -ge 1
          test "$source_date_epoch" -le 4294967295
          SOURCE_DATE_EPOCH="$source_date_epoch" python - "$chart_source" <<'PY'
          import os
          import sys
          from pathlib import Path

          epoch = int(os.environ["SOURCE_DATE_EPOCH"])
          root = Path(sys.argv[1])
          paths = [root, *root.rglob("*")]
          for path in sorted(paths, key=lambda item: len(item.parts), reverse=True):
              os.utime(path, (epoch, epoch), follow_symlinks=False)
          PY
          echo "source_date_epoch=${source_date_epoch}" >>"${GITHUB_OUTPUT}"
      - name: Validate and package chart
        id: package
        env:
          RESOLVED_PLAN_SHA256: ${{ inputs.resolved_plan_sha256 }}
        run: |
          # shellcheck disable=SC2153,SC1083,SC2012,SC2100,SC2209
          set -euo pipefail
          mkdir -p out/chart out/artifact
          plan=input/plan/resolved-plan.json
          chart_source="$(jq -r '.chart.source' "$plan")"
          chart_version="$(jq -r '.chart.version' "$plan")"
          chart_app_version="$(jq -r '.chart.app_version' "$plan")"
          # Provenance assertion: the chart source tree is frozen with a recorded digest.
          test -f "${chart_source}/SOURCE_PROVENANCE.json"
          release_tree="$(jq -r '.release_tree_sha256' "${chart_source}/SOURCE_PROVENANCE.json")"
          test -n "$release_tree"
          # helm lint
          helm lint "${chart_source}"
          # helm template (validation cases): bind each case to its family runtime image
          case_count="$(jq '.chart.validation_cases | length' "$plan")"
          i=0
          while [ "$i" -lt "$case_count" ]; do
            case_name="$(jq -r ".chart.validation_cases[${i}].name" "$plan")"
            values="$(jq -r ".chart.validation_cases[${i}].values" "$plan")"
            product_id="$(jq -r ".chart.validation_cases[${i}].product_id" "$plan")"
            variant="$(jq -r ".chart.validation_cases[${i}].variant" "$plan")"
            expected_resource="$(jq -r ".chart.validation_cases[${i}].expected_resource" "$plan")"
            repo="$(jq -r --arg pid "$product_id" --arg v "$variant" \
              '.family_tasks[] | select(.product_id == $pid and .runtime.variant == $v) | .runtime.repository' "$plan")"
            digest="$(jq -r --arg pid "$product_id" --arg v "$variant" \
              '.family_tasks[] | select(.product_id == $pid and .runtime.variant == $v) | .runtime.index_digest' "$plan")"
            test -n "$repo"
            test -n "$digest"
            image="${repo}@${digest}"
            helm template "ucm-${case_name}" "${chart_source}" \
              --values "${values}" \
              --set-string "images.engine.repository=${repo}" \
              --set-string "images.engine.digest=${digest}" \
              >"out/chart/${case_name}.yaml"
            grep -q 'kind: ModelServing' "out/chart/${case_name}.yaml"
            grep -Fq "$image" "out/chart/${case_name}.yaml"
            grep -Fq "$expected_resource" "out/chart/${case_name}.yaml"
            i=$((i + 1))
          done
          # helm package
          helm package "${chart_source}" --version "${chart_version}" \
            --app-version "${chart_app_version}" --destination out/chart
          package="$(find out/chart -maxdepth 1 -type f -name '*.tgz' -print)"
          test -n "$package"
          echo "package=${package}" >>"${GITHUB_OUTPUT}"
          echo "release_tree=${release_tree}" >>"${GITHUB_OUTPUT}"
      - name: Normalize chart package metadata
        env:
          CHART_PACKAGE: ${{ steps.package.outputs.package }}
          SOURCE_DATE_EPOCH: ${{ steps.source_time.outputs.source_date_epoch }}
        run: |
          # shellcheck disable=SC2153,SC1083,SC2012,SC2100,SC2209
          set -euo pipefail
          python - <<'PY'
          import copy
          import gzip
          import io
          import os
          import tarfile
          import tempfile
          from pathlib import Path

          archive_path = Path(os.environ["CHART_PACKAGE"])
          epoch_text = os.environ["SOURCE_DATE_EPOCH"]
          if not epoch_text.isascii() or not epoch_text.isdecimal():
              raise SystemExit(f"invalid SOURCE_DATE_EPOCH: {epoch_text!r}")
          epoch = int(epoch_text)
          if not 0 < epoch <= 0xFFFFFFFF:
              raise SystemExit(f"SOURCE_DATE_EPOCH is outside gzip range: {epoch}")
          if not archive_path.is_file():
              raise SystemExit(f"chart package does not exist: {archive_path}")

          source_members = []
          with tarfile.open(archive_path, "r:gz") as source:
              for source_member in source.getmembers():
                  if not source_member.isfile():
                      raise SystemExit(
                          f"unexpected non-file chart member: {source_member.name}"
                      )
                  extracted = source.extractfile(source_member)
                  if extracted is None:
                      raise SystemExit(f"cannot read chart member: {source_member.name}")
                  member = copy.copy(source_member)
                  member.pax_headers = dict(member.pax_headers)
                  source_members.append((member, extracted.read()))
          if not source_members:
              raise SystemExit("chart package is empty")

          descriptor, temporary_name = tempfile.mkstemp(
              prefix=f".{archive_path.name}.", suffix=".tmp", dir=archive_path.parent
          )
          os.close(descriptor)
          temporary_path = Path(temporary_name)
          try:
              with temporary_path.open("wb") as raw:
                  with gzip.GzipFile(
                      filename="",
                      mode="wb",
                      fileobj=raw,
                      compresslevel=9,
                      mtime=epoch,
                  ) as compressed:
                      with tarfile.open(
                          fileobj=compressed, mode="w", format=tarfile.PAX_FORMAT
                      ) as target:
                          for member, data in source_members:
                              member.mtime = epoch
                              member.pax_headers.pop("mtime", None)
                              target.addfile(member, io.BytesIO(data))
              os.replace(temporary_path, archive_path)
          finally:
              temporary_path.unlink(missing_ok=True)

          rewritten_members = []
          with tarfile.open(archive_path, "r:gz") as rewritten:
              for member in rewritten.getmembers():
                  extracted = rewritten.extractfile(member)
                  if extracted is None:
                      raise SystemExit(f"cannot verify chart member: {member.name}")
                  if int(member.mtime) != epoch:
                      raise SystemExit(f"chart member timestamp drifted: {member.name}")
                  rewritten_members.append((member.name, extracted.read()))
          expected_members = [(member.name, data) for member, data in source_members]
          if rewritten_members != expected_members:
              raise SystemExit("chart member bytes changed during timestamp normalization")
          gzip_epoch = int.from_bytes(archive_path.read_bytes()[4:8], "little")
          if gzip_epoch != epoch:
              raise SystemExit(f"gzip timestamp drifted: {gzip_epoch} != {epoch}")
          PY
      - id: record
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CHART_PACKAGE: ${{ steps.package.outputs.package }}
          RELEASE_TREE: ${{ steps.package.outputs.release_tree }}
        run: |
          # shellcheck disable=SC2153,SC1083,SC2012,SC2100,SC2209
          set -euo pipefail
          package="$CHART_PACKAGE"
          release_tree="$RELEASE_TREE"
          test -f "$package"
          chart_sha="sha256:$(sha256sum "$package" | cut -d' ' -f1)"
          filename="$(basename "$package")"
          jq -nc --arg f "$filename" --arg s "$chart_sha" --arg r "$release_tree" \
            '{filename:$f,sha256:$s,release_tree_sha256:$r,status:"candidate-verified"}' \
            >out/artifact/chart-result.json
          cp "$package" out/artifact/
          logical="ucm-chart-${SOURCE_SHA}"
          physical="${logical}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          echo "chart_artifact=${physical}" >>"${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.record.outputs.chart_artifact }}
          path: out/artifact/
          if-no-files-found: error
          overwrite: false
          retention-days: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 90 || 7 }}
