name: Package UCM Helm Chart

on:
  workflow_call:
    inputs:
      plan_artifact:
        type: string
        required: true
      source_ref:
        type: string
        required: false
        default: ""
    outputs:
      chart_artifact:
        description: Chart artifact produced by this run
        value: ${{ jobs.package.outputs.chart_artifact }}

permissions:
  contents: read

jobs:
  package:
    name: Package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      chart_artifact: ${{ steps.package.outputs.chart_artifact }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.15.3
      - uses: ./.github/actions/download-artifact-retry
        with:
          name: ${{ inputs.plan_artifact }}
          path: input/plan
      - id: package
        name: Validate and package Chart
        run: |
          set -euo pipefail
          plan=input/plan/release-plan.json
          source="$(jq -r '.chart.source' "${plan}")"
          mkdir -p out/rendered out/chart
          helm lint "${source}"
          while IFS=$'\t' read -r product variant repository tag; do
            values="$(jq -r --arg product "${product}" --arg variant "${variant}" \
              '.chart.validation_cases[] | select(.product_id == $product and .variant == $variant) | .values' \
              "${plan}")"
            expected="$(jq -r --arg product "${product}" --arg variant "${variant}" \
              '.chart.validation_cases[] | select(.product_id == $product and .variant == $variant) | .expected_resource' \
              "${plan}")"
            test -n "${values}"
            helm template "ucm-${variant}" "${source}" --values "${values}" \
              --set-string "images.engine.repository=${repository}" \
              --set-string "images.engine.tag=${tag}" \
              >"out/rendered/${product}-${variant}.yaml"
            grep -Fq "${repository}:${tag}" "out/rendered/${product}-${variant}.yaml"
            grep -Fq "${expected}" "out/rendered/${product}-${variant}.yaml"
          done < <(jq -r '.families[] | [.product_id,.variant,.target_repository,.target_tag] | @tsv' "${plan}")
          helm package "${source}" \
            --version "$(jq -r '.chart.version' "${plan}")" \
            --app-version "$(jq -r '.chart.app_version' "${plan}")" \
            --destination out/chart
          test "$(find out/chart -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d ' ')" = 1
          echo "chart_artifact=ucm-chart-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" \
            >>"${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.package.outputs.chart_artifact }}
          path: out/chart/*.tgz
          if-no-files-found: error
          overwrite: false
          retention-days: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 90 || 7 }}
