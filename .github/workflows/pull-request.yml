name: 'Pull Request Gate'

on:
  pull_request:
    branches: [ "dev*", "main", "*release", "feature*" ]

permissions:
  contents: read

jobs:
  pre-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: fetch_base_and_pr_branches
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY_CLONE_URL: ${{ github.event.pull_request.head.repo.clone_url }}
        run: |
          set -euo pipefail
          git fetch -- origin "${BASE_REF}"

          if [ "${HEAD_REPOSITORY}" != "${BASE_REPOSITORY}" ]; then
            echo "PR is from a fork, adding remote."
            git remote add fork "${HEAD_REPOSITORY_CLONE_URL}"
            git fetch -- fork "${HEAD_REF}"
            HEAD_BRANCH_NAME="fork/${HEAD_REF}"
            echo "HEAD_BRANCH_NAME=${HEAD_BRANCH_NAME}" >> "${GITHUB_OUTPUT}"
          else
            git fetch -- origin "${HEAD_REF}"
            HEAD_BRANCH_NAME="origin/${HEAD_REF}"
            echo "HEAD_BRANCH_NAME=${HEAD_BRANCH_NAME}" >> "${GITHUB_OUTPUT}"
          fi

      # protect the workflows dir, only allow specific users to modify
      - id: permission-check
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_BRANCH_NAME: ${{ steps.fetch_base_and_pr_branches.outputs.HEAD_BRANCH_NAME }}
        run: |
          set -euo pipefail
          CHANGED_FILES=$(git diff --name-only "origin/${BASE_REF}...${HEAD_BRANCH_NAME}" --)
          echo "CHANGED_FILES=${CHANGED_FILES}"

          if ! echo "${CHANGED_FILES}" | grep -Eq '^\.github/(workflows/|release/)'; then
            echo "No protected workflow or release-authority changes, allow."
            exit 0
          fi

          ALLOWED_USERS=("dante159753" "mag1c-h" "yuanzhg078" "SuperMarioYL")
          author_lc="$(printf '%s' "${PR_AUTHOR}" | tr '[:upper:]' '[:lower:]')"

          echo "Workflow or release-authority changes detected, check if user is allowed..."
          echo "PR author: ${PR_AUTHOR}"

          for u in "${ALLOWED_USERS[@]}"; do
            allowed_lc="$(printf '%s' "${u}" | tr '[:upper:]' '[:lower:]')"
            if [[ "${author_lc}" == "${allowed_lc}" ]]; then
              echo "Authorized user, allowing change."
              exit 0
            fi
          done

          echo "::error:: Only privileged users may modify .github/workflows/ or .github/release/"
          exit 1

      - id: uptodate-check
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_BRANCH_NAME: ${{ steps.fetch_base_and_pr_branches.outputs.HEAD_BRANCH_NAME }}
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor "origin/${BASE_REF}" "${HEAD_BRANCH_NAME}"; then
            echo "PR branch is up-to-date with target branch, continue workflow."
          else
            echo "::error::PR branch is OUT-OF-DATE with target branch, stop workflow, please update your branch and try again."
            exit 1
          fi

  lint-and-unit-tests:
    needs: pre-check
    permissions:
      contents: read
    uses: ./.github/workflows/lint-and-test.yml

  release-catalog-smoke:
    needs: [pre-check]
    # GitHub validates the reusable workflow's maximum permissions before
    # evaluating lane-specific job conditions. The PR lane itself never runs
    # the formal-tag publication jobs.
    permissions:
      actions: read
      contents: write
      packages: write
    uses: ./.github/workflows/release-ucm.yml
    with:
      deliver_full_oci: false

  repository-recipe-plan:
    needs: [pre-check]
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      recipe_matrix: ${{ steps.recipes.outputs.recipe_matrix }}
      recipe_catalog_sha256: ${{ steps.recipes.outputs.recipe_catalog_sha256 }}
      recipe_matrix_sha256: ${{ steps.recipes.outputs.recipe_matrix_sha256 }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - id: recipes
        name: Project repository recipe lanes from the catalog
        run: |
          set -euo pipefail
          PYTHONPATH=.github/release python -m ucm_release catalog recipe-matrix \
            --lane pr-smoke --output pr-smoke-recipes.json >/dev/null
          jq -e 'keys | sort == ["catalog_sha256","count","include","kind","lane","matrix_sha256","protected_environment","schema_version"]' pr-smoke-recipes.json
          {
            echo "recipe_matrix=$(jq -cS '{include: .include}' pr-smoke-recipes.json)"
            echo "recipe_catalog_sha256=$(jq -r '.catalog_sha256' pr-smoke-recipes.json)"
            echo "recipe_matrix_sha256=$(jq -r '.matrix_sha256' pr-smoke-recipes.json)"
          } >> "$GITHUB_OUTPUT"

  repository-docker-smoke:
    needs: [pre-check, repository-recipe-plan]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.repository-recipe-plan.outputs.recipe_matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - id: recipe
        name: Reopen exact catalog recipe task
        env:
          TASK_ID: ${{ matrix.task_id }}
          EXPECTED_CATALOG_SHA256: ${{ needs.repository-recipe-plan.outputs.recipe_catalog_sha256 }}
          EXPECTED_MATRIX_SHA256: ${{ needs.repository-recipe-plan.outputs.recipe_matrix_sha256 }}
          EXPECTED_TASK_SHA256: ${{ matrix.task_sha256 }}
        run: |
          set -euo pipefail
          PYTHONPATH=.github/release python -m ucm_release catalog select-recipe \
            --lane pr-smoke \
            --task-id "${TASK_ID}" \
            --expected-catalog-sha256 "${EXPECTED_CATALOG_SHA256}" \
            --expected-matrix-sha256 "${EXPECTED_MATRIX_SHA256}" \
            --expected-task-sha256 "${EXPECTED_TASK_SHA256}" \
            --output selected-recipe.json >/dev/null
          {
            echo "task_id=$(jq -r '.task_id' selected-recipe.json)"
            echo "path=$(jq -r '.path' selected-recipe.json)"
            echo "platform=$(jq -r '.platform' selected-recipe.json)"
            echo "cache_scope=$(jq -r '.cache_scope' selected-recipe.json)"
            echo "build_args<<UCM_BUILD_ARGS"
            jq -r '.build_args | join("\n")' selected-recipe.json
            echo "UCM_BUILD_ARGS"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1
        with:
          version: v0.19.2
          driver-opts: image=moby/buildkit:v0.18.2
      - name: Build catalog-selected repository recipe
        uses: docker/build-push-action@v5.4.0
        with:
          context: .
          file: ${{ steps.recipe.outputs.path }}
          platforms: ${{ steps.recipe.outputs.platform }}
          build-args: ${{ steps.recipe.outputs.build_args }}
          tags: ucm-recipe-smoke:${{ steps.recipe.outputs.task_id }}
          push: false
          load: false
          cache-from: type=gha,scope=${{ steps.recipe.outputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.recipe.outputs.cache_scope }},ignore-error=true
