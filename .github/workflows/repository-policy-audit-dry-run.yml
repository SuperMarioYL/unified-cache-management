name: Repository policy audit dry-run v2

on:
  workflow_dispatch:
    inputs:
      repository_role:
        description: Configured repository coordinate to audit against
        required: true
        type: choice
        options:
          - validation
          - production
      snapshot_json:
        description: Strict offline repository policy snapshot JSON
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: repository-policy-audit-dry-run-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  invoke-trusted-main-controller:
    permissions:
      contents: read
    uses: SuperMarioYL/unified-cache-management/.github/workflows/release-control-dry-run.yml@main
    with:
      operation: policy-audit
      repository_role: ${{ inputs.repository_role }}
      snapshot_json: ${{ inputs.snapshot_json }}
