name: Reconcile UCM vLLM image candidates

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      wheel_artifact:
        type: string
        required: true
      validation_lane:
        type: string
        required: true
    outputs:
      loop_artifact:
        description: Compact two-reconcile and image evidence
        value: ${{ jobs.final-reconcile.outputs.loop_artifact }}
      loop_payload_sha256:
        description: Deterministic image-loop payload identity
        value: ${{ jobs.final-reconcile.outputs.loop_payload_sha256 }}
      image_result_sha256:
        description: Verified Task 4 result identity
        value: ${{ jobs.final-reconcile.outputs.image_result_sha256 }}
      oci_digest:
        description: Verified local OCI manifest digest
        value: ${{ jobs.final-reconcile.outputs.oci_digest }}
  schedule:
    - cron: "17 4 * * *"
  repository_dispatch:
    types: [ucm-reconcile]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsupported-validation-lane:
    if: ${{ inputs.source_sha != '' && inputs.validation_lane != 'fork-candidate' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - run: |
          echo "production image reconciliation remains external-required" >&2
          exit 2

  invalid-manual-ref:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref_name != github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - run: |
          echo "manual reconciliation is allowed only from the default branch" >&2
          exit 2

  standalone-wheel:
    if: ${{ inputs.source_sha == '' && (github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch) }}
    permissions:
      contents: read
    uses: ./.github/workflows/_build-wheel.yml
    with:
      source_sha: ${{ github.sha }}
      profile_id: cuda-cu129-ubuntu2204-amd64-cp312-release-default-sm75-sm80-sm86-sm89-sm90
      validation_lane: fork-candidate

  select-input:
    needs: standalone-wheel
    if: ${{ always() && ((inputs.source_sha != '' && inputs.wheel_artifact != '' && inputs.validation_lane == 'fork-candidate') || needs.standalone-wheel.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.select.outputs.source_sha }}
      wheel_artifact: ${{ steps.select.outputs.wheel_artifact }}
    steps:
      - id: select
        env:
          SOURCE_SHA: ${{ inputs.source_sha != '' && inputs.source_sha || github.sha }}
          WHEEL_ARTIFACT: ${{ inputs.wheel_artifact != '' && inputs.wheel_artifact || needs.standalone-wheel.outputs.wheel_artifact }}
        run: |
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test -n "${WHEEL_ARTIFACT}"
          echo "source_sha=${SOURCE_SHA}" >>"${GITHUB_OUTPUT}"
          echo "wheel_artifact=${WHEEL_ARTIFACT}" >>"${GITHUB_OUTPUT}"

  reconcile-fixture:
    needs: select-input
    if: ${{ needs.select-input.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      image_input_artifact: ${{ steps.plan.outputs.image_input_artifact }}
      first_reconcile_sha256: ${{ steps.plan.outputs.first_reconcile_sha256 }}
      upstream_index_digest: ${{ steps.plan.outputs.upstream_index_digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.select-input.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install compact release runtime dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.select-input.outputs.wheel_artifact }}
          path: input/wheel
      - id: plan
        name: Scan fixture Registry and reconcile one immutable task
        env:
          SOURCE_SHA: ${{ needs.select-input.outputs.source_sha }}
        run: |
          PYTHONPATH=.github/release python -m ucm_release loop prepare \
            --build-record input/wheel/fixture-build.json \
            --wheel-inspection input/wheel/wheel-inspection.json \
            --source-sha "${SOURCE_SHA}" \
            --output-dir out \
            --run-id "${GITHUB_RUN_ID}" \
            --attempt "${GITHUB_RUN_ATTEMPT}" >loop-prepare-result.json
          echo "image_input_artifact=ucm-image-input-${SOURCE_SHA}" >>"${GITHUB_OUTPUT}"
          echo "first_reconcile_sha256=$(cat out/first-reconcile.sha256)" >>"${GITHUB_OUTPUT}"
          echo "upstream_index_digest=$(python -c 'import json; print(json.load(open("loop-prepare-result.json"))["upstream_index_digest"])')" >>"${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.plan.outputs.image_input_artifact }}
          path: |
            out/prepared-loop.json
            out/image-input.json
            out/candidate.json
            out/first-reconcile.json
            out/first-reconcile.sha256
            out/loop-verification.json
          if-no-files-found: error
          retention-days: 3

  build-image:
    needs: [select-input, reconcile-fixture]
    if: ${{ needs.reconcile-fixture.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/_build-image.yml
    with:
      source_sha: ${{ needs.select-input.outputs.source_sha }}
      wheel_artifact: ${{ needs.select-input.outputs.wheel_artifact }}
      image_input_artifact: ${{ needs.reconcile-fixture.outputs.image_input_artifact }}
      validation_lane: fork-candidate

  final-reconcile:
    needs: [select-input, reconcile-fixture, build-image]
    if: ${{ needs.reconcile-fixture.result == 'success' && needs.build-image.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      loop_artifact: ${{ steps.close.outputs.loop_artifact }}
      loop_payload_sha256: ${{ steps.close.outputs.loop_payload_sha256 }}
      image_result_sha256: ${{ steps.close.outputs.image_result_sha256 }}
      oci_digest: ${{ steps.close.outputs.oci_digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.select-input.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install compact release runtime dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.reconcile-fixture.outputs.image_input_artifact }}
          path: input/reconcile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.build-image.outputs.image_artifact }}
          path: input/image
      - id: close
        name: Materialize local result and prove the second reconcile is zero
        env:
          SOURCE_SHA: ${{ needs.select-input.outputs.source_sha }}
        run: |
          PYTHONPATH=.github/release python -m ucm_release loop complete \
            --prepared input/reconcile/prepared-loop.json \
            --image-result input/image/image-result.json \
            --source-sha "${SOURCE_SHA}" \
            --output-dir out \
            --run-id "${GITHUB_RUN_ID}" \
            --attempt "${GITHUB_RUN_ATTEMPT}" >loop-complete-result.json
          echo "loop_artifact=ucm-vllm-loop-${SOURCE_SHA}" >>"${GITHUB_OUTPUT}"
          echo "loop_payload_sha256=$(python -c 'import json; print(json.load(open("loop-complete-result.json"))["loop_payload_sha256"])')" >>"${GITHUB_OUTPUT}"
          echo "image_result_sha256=$(python -c 'import json; print(json.load(open("loop-complete-result.json"))["image_result_sha256"])')" >>"${GITHUB_OUTPUT}"
          echo "oci_digest=$(python -c 'import json; print(json.load(open("loop-complete-result.json"))["oci_digest"])')" >>"${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.close.outputs.loop_artifact }}
          path: |
            out/completed-loop.json
            out/second-reconcile.json
            out/vllm-loop-evidence.json
          if-no-files-found: error
          retention-days: 3
