name: Build planner-selected UCM feature candidates

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      image_matrix:
        type: string
        required: true
      wheel_matrix:
        type: string
        required: true
      resolved_plan_artifact:
        type: string
        required: true
      resolved_plan_sha256:
        type: string
        required: true
      deliver_full_oci:
        type: boolean
        required: true
    outputs:
      loop_artifact:
        description: Feature-only deterministic image candidate evidence
        value: ${{ jobs.aggregate-feature.outputs.loop_artifact }}

permissions:
  contents: read

jobs:
  build-images-feature:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.image_matrix) }}
    permissions:
      contents: read
    uses: ./.github/workflows/_build-image.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      task_id: ${{ matrix.task_id }}
      runner: ${{ matrix.runner }}
      resolved_plan_artifact: ${{ inputs.resolved_plan_artifact }}
      resolved_plan_sha256: ${{ inputs.resolved_plan_sha256 }}
      deliver_full_oci: ${{ inputs.deliver_full_oci }}

  aggregate-feature:
    needs: [build-images-feature]
    if: >-
      ${{
        !cancelled() &&
        needs.build-images-feature.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      loop_artifact: ${{ steps.aggregate.outputs.loop_artifact }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ucm-wheel-*-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: input/wheels
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ucm-image-*-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: input/images
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.resolved_plan_artifact }}
          path: input/plan
      - id: aggregate
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RESOLVED_PLAN_SHA256: ${{ inputs.resolved_plan_sha256 }}
          WHEEL_MATRIX: ${{ inputs.wheel_matrix }}
          IMAGE_MATRIX: ${{ inputs.image_matrix }}
        run: |
          set -euo pipefail
          mkdir -p out
          printf '%s' "${WHEEL_MATRIX}" | jq -cS . > out/selected-wheel-matrix.json
          printf '%s' "${IMAGE_MATRIX}" | jq -cS . > out/selected-image-matrix.json
          PYTHONPATH=.github/release python -m ucm_release loop aggregate-real \
            --wheel-dir input/wheels --image-dir input/images \
            --repository "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF}" \
            --source-sha "${SOURCE_SHA}" --run-id "${GITHUB_RUN_ID}" \
            --attempt "${GITHUB_RUN_ATTEMPT}" \
            --resolved-plan input/plan/resolved-plan.json \
            --expected-plan-sha256 "${RESOLVED_PLAN_SHA256}" \
            --selected-wheel-matrix out/selected-wheel-matrix.json \
            --selected-image-matrix out/selected-image-matrix.json \
            --output out/real-image-loop-evidence.json >out/result.json
          logical="ucm-real-images-${SOURCE_SHA}"
          physical="${logical}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          echo "loop_artifact=${physical}" >>"${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.aggregate.outputs.loop_artifact }}
          path: out/
          if-no-files-found: error
          overwrite: false
          retention-days: 3
