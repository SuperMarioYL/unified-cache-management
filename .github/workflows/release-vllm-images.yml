name: Build planner-selected UCM feature candidates

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      image_matrix:
        type: string
        required: true
      wheel_matrix:
        type: string
        required: true
      resolved_plan_artifact:
        type: string
        required: true
      resolved_plan_sha256:
        type: string
        required: true
      deliver_full_oci:
        type: boolean
        required: true
    outputs:
      loop_artifact:
        description: Feature-only deterministic image candidate evidence
        value: ${{ jobs.aggregate-feature.outputs.loop_artifact }}

permissions:
  contents: read

jobs:
  build-images-feature:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.image_matrix) }}
    permissions:
      contents: read
    uses: ./.github/workflows/_build-image.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      task_id: ${{ matrix.task_id }}
      runner: ${{ matrix.runner }}
      resolved_plan_artifact: ${{ inputs.resolved_plan_artifact }}
      resolved_plan_sha256: ${{ inputs.resolved_plan_sha256 }}
      deliver_full_oci: ${{ inputs.deliver_full_oci }}

  aggregate-feature:
    needs: [build-images-feature]
    if: >-
      ${{
        !cancelled() &&
        needs.build-images-feature.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      loop_artifact: ${{ steps.aggregate.outputs.loop_artifact }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - uses: ./.github/actions/download-artifact-retry
        with:
          pattern: ucm-wheel-*-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: input/wheels
      - uses: ./.github/actions/download-artifact-retry
        with:
          pattern: ucm-image-*-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: input/images
      - uses: ./.github/actions/download-artifact-retry
        with:
          name: ${{ inputs.resolved_plan_artifact }}
          path: input/plan
      - id: aggregate
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RESOLVED_PLAN_SHA256: ${{ inputs.resolved_plan_sha256 }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p out
          test "$(jq -r '.resolved_plan_sha256' input/plan/resolved-plan.json)" = "${RESOLVED_PLAN_SHA256}"
          wheels="$(for d in input/wheels/*/; do
            whl="$(find "$d" -maxdepth 1 -type f -name '*.whl' | head -n1)"
            sha="sha256:$(sha256sum "$whl" | cut -d' ' -f1)"
            jq -nc --arg sha "$sha" --slurpfile i "$d/wheel-inspection.json" --slurpfile t "$d/hosted-task.json" \
              '{spec_id:$i[0].spec_id,task_id:$t[0].task_id,filename:$i[0].filename,wheel_sha256:$sha,wheel_size:$i[0].size,inspection_sha256:$i[0].sha256}'
          done | jq -c -s '.')"
          images="$(for d in input/images/*/; do
            jq -nc --slurpfile r "$d/image-result.json" \
              '{spec_id:$r[0].spec_id,task_id:$r[0].task_id,manifest_digest:$r[0].oci.digest,build_key_sha256:$r[0].build_key_sha256,content_identity_sha256:$r[0].content_identity_sha256,image_result_sha256:$r[0].result_sha256,recipe_sha256:$r[0].recipe_sha256}'
          done | jq -c -s '.')"
          jq -nc --arg s "$SOURCE_SHA" --arg p "$RESOLVED_PLAN_SHA256" --argjson w "$wheels" --argjson m "$images" \
            '{source_sha:$s,resolved_plan_sha256:$p,wheels:$w,images:$m,publication:{status:"blocked",attempted:false}}' \
            > out/real-image-loop-evidence.json
          jq -nc --argjson w "$wheels" --argjson m "$images" \
            '{wheel_count:($w|length),image_count:($m|length)}' > out/result.json
          logical="ucm-real-images-${SOURCE_SHA}"
          physical="${logical}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          echo "loop_artifact=${physical}" >>"${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.aggregate.outputs.loop_artifact }}
          path: out/
          if-no-files-found: error
          overwrite: false
          retention-days: 7
