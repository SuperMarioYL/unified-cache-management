name: Build six real UCM vLLM image candidates

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      deliver_full_oci:
        type: boolean
        required: true
    outputs:
      loop_artifact:
        description: Deterministic three-family real image candidate evidence
        value: ${{ jobs.aggregate-images.outputs.loop_artifact }}
      loop_payload_sha256:
        description: Deterministic six-member image-loop payload identity
        value: ${{ jobs.aggregate-images.outputs.loop_payload_sha256 }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
    steps:
      - name: Validate reusable image workflow contract
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full lowercase commit SHA" >&2
            exit 2
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install compact release runtime dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - id: plan
        name: Project exact six image tasks from reviewed authority
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct "${SOURCE_SHA}")"
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          mkdir -p out
          PYTHONPATH=.github/release python -m ucm_release core hosted-matrix \
            --source-sha "${SOURCE_SHA}" \
            --source-date-epoch "${source_date_epoch}" \
            --output out/hosted-matrix.json >/dev/null
          {
            echo "matrix=$(python -c 'import json; print(json.dumps(json.load(open("out/hosted-matrix.json"))["github_matrix"],separators=(",",":")))')"
            echo "source_sha=${SOURCE_SHA}"
          } >>"${GITHUB_OUTPUT}"

  build-images:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
    uses: ./.github/workflows/_build-image.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      spec_id: ${{ matrix.spec_id }}
      deliver_full_oci: ${{ inputs.deliver_full_oci }}

  matrix-barrier:
    needs: [plan, build-images]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail unless plan and every native image member succeeded
        env:
          BUILD_IMAGES_RESULT: ${{ needs.build-images.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${PLAN_RESULT}" != success || "${BUILD_IMAGES_RESULT}" != success ]]; then
            echo "all six image members are required: plan=${PLAN_RESULT} images=${BUILD_IMAGES_RESULT}" >&2
            exit 2
          fi

  aggregate-images:
    needs: [plan, build-images, matrix-barrier]
    if: >-
      ${{
        !cancelled() &&
        needs.plan.result == 'success' &&
        needs.build-images.result == 'success' &&
        needs.matrix-barrier.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      loop_artifact: ${{ steps.aggregate.outputs.loop_artifact }}
      loop_payload_sha256: ${{ steps.aggregate.outputs.loop_payload_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install compact release runtime dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ucm-wheel-*-${{ needs.plan.outputs.source_sha }}
          path: input/wheels
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ucm-image-*-${{ needs.plan.outputs.source_sha }}
          path: input/images
      - id: aggregate
        name: Reopen six results and prove three plans then second reconcile zero
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          PYTHONPATH=.github/release python -m ucm_release loop aggregate-real \
            --wheel-dir input/wheels \
            --image-dir input/images \
            --repository "${GITHUB_REPOSITORY}" \
            --ref "${GITHUB_REF}" \
            --source-sha "${SOURCE_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --attempt "${GITHUB_RUN_ATTEMPT}" \
            --output out/real-image-loop-evidence.json \
            --output-dir out/aggregate >out/aggregate-real-result.json
          test "$(python -c 'import json; print(json.load(open("out/aggregate-real-result.json"))["wheel_count"])')" = 6
          test "$(python -c 'import json; print(json.load(open("out/aggregate-real-result.json"))["image_count"])')" = 6
          test "$(python -c 'import json; print(json.load(open("out/aggregate-real-result.json"))["family_count"])')" = 3
          test "$(python -c 'import json; print(json.load(open("out/aggregate-real-result.json"))["second_task_count"])')" = 0
          {
            echo "loop_artifact=ucm-real-images-${SOURCE_SHA}"
            echo "loop_payload_sha256=$(python -c 'import json; print(json.load(open("out/real-image-loop-evidence.json"))["payload_sha256"])')"
          } >>"${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.aggregate.outputs.loop_artifact }}
          path: |
            out/real-image-loop-evidence.json
            out/aggregate-real-result.json
            out/aggregate/family-plans.json
            out/aggregate/candidate-inventory.json
            out/aggregate/second-reconcile.json
          if-no-files-found: error
          retention-days: 3
