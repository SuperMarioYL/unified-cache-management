name: Build six canonical UCM vLLM feature candidates

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      deliver_full_oci:
        type: boolean
        required: true
    outputs:
      loop_artifact:
        description: Feature-only deterministic image candidate evidence
        value: ${{ jobs.aggregate-feature.outputs.loop_artifact }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      feature: ${{ steps.plan.outputs.feature }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install compact release runtime dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - id: plan
        name: Fail closed and project the exact six feature members
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "${SOURCE_SHA}" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          if [[ "${REPOSITORY}" != SuperMarioYL/unified-cache-management || \
                "${REF}" != refs/heads/feature/* || \
                ( "${EVENT_NAME}" != push && "${EVENT_NAME}" != workflow_dispatch ) ]]; then
            echo "feature image invocation is outside exact authority" >&2
            exit 2
          fi
          PYTHONPATH=.github/release python -m ucm_release core tag-preflight \
            --lane feature-candidate >feature-preflight.json
          source_date_epoch="$(git show -s --format=%ct "${SOURCE_SHA}")"
          PYTHONPATH=.github/release python -m ucm_release core hosted-matrix \
            --source-sha "${SOURCE_SHA}" --source-date-epoch "${source_date_epoch}" \
            --output hosted-matrix.json >/dev/null
          {
            echo "matrix=$(python -c 'import json; print(json.dumps(json.load(open("hosted-matrix.json"))["github_matrix"],separators=(",",":")))')"
            echo "source_sha=${SOURCE_SHA}"
            echo "feature=true"
          } >>"${GITHUB_OUTPUT}"

  build-images-feature:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.feature == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
    uses: ./.github/workflows/_build-image.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      spec_id: ${{ matrix.spec_id }}
      deliver_full_oci: ${{ inputs.deliver_full_oci }}

  feature-barrier:
    needs: [plan, build-images-feature]
    if: ${{ always() && needs.plan.outputs.feature == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require all six feature candidates
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          IMAGE_RESULT: ${{ needs.build-images-feature.result }}
        run: |
          set -euo pipefail
          for result in "${PLAN_RESULT}" "${IMAGE_RESULT}"; do
            case "${result}" in
              success) ;;
              skipped|failure|cancelled) echo "feature member result=${result}" >&2; exit 2 ;;
              *) echo "unknown feature member result=${result}" >&2; exit 2 ;;
            esac
          done

  aggregate-feature:
    needs: [plan, build-images-feature, feature-barrier]
    if: >-
      ${{
        !cancelled() && needs.plan.outputs.feature == 'true' &&
        needs.plan.result == 'success' &&
        needs.build-images-feature.result == 'success' &&
        needs.feature-barrier.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      loop_artifact: ${{ steps.aggregate.outputs.loop_artifact }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ucm-wheel-*-${{ needs.plan.outputs.source_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: input/wheels
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ucm-image-*-${{ needs.plan.outputs.source_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: input/images
      - id: aggregate
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p out
          PYTHONPATH=.github/release python -m ucm_release loop aggregate-real \
            --wheel-dir input/wheels --image-dir input/images \
            --repository "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF}" \
            --source-sha "${SOURCE_SHA}" --run-id "${GITHUB_RUN_ID}" \
            --attempt "${GITHUB_RUN_ATTEMPT}" \
            --output out/real-image-loop-evidence.json >out/result.json
          logical="ucm-real-images-${SOURCE_SHA}"
          physical="$(PYTHONPATH=.github/release python -c 'import sys; from ucm_release.verify import run_bound_artifact_name; print(run_bound_artifact_name(*sys.argv[1:3], int(sys.argv[3])))' "${logical}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}")"
          echo "loop_artifact=${physical}" >>"${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.aggregate.outputs.loop_artifact }}
          path: out/
          if-no-files-found: error
          overwrite: false
          retention-days: 3
