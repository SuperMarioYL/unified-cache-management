# Fork acceptance closure. Keep this workflow on the isolated fixture branch.
name: Cleanup one UCM Tag Release
run-name: Fork GHCR skip acceptance closure

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact disposable Draft fixture Tag
        type: string
        required: true
        default: draft/v0.8.0-9101
      fixture_ref:
        description: Isolated fixture branch containing the acceptance helper
        type: string
        required: true
        default: feature/cleanup-hosted-fixtures-20261010

concurrency:
  group: ucm-release-retention-${{ github.repository_id }}-draft
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  closure:
    name: Verify GHCR HTTP 400 is nonfatal and preserve eleven baseline Releases
    if: ${{ github.repository == 'SuperMarioYL/unified-cache-management' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: fork-preview
    permissions:
      contents: write
      actions: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FIXTURE_TAG: ${{ inputs.tag }}
    steps:
      # Deletion always uses the deployed default-branch production modules.
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Checkout only the fixture helper
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.fixture_ref }}
          path: fixture-helper
          sparse-checkout: .github/release/tests/hosted_cleanup.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: -r .github/release/requirements.txt
      - name: Install Crane
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/crane"
          curl -fsSL --retry 3 \
            https://github.com/google/go-containerregistry/releases/download/v0.20.3/go-containerregistry_Linux_x86_64.tar.gz \
            | tar -xz -C "${RUNNER_TEMP}/crane" crane
          echo "${RUNNER_TEMP}/crane" >>"${GITHUB_PATH}"
      - name: Download the ledger from the completed fixture source run
        run: |
          set -euo pipefail
          test "${GH_REPO}" = SuperMarioYL/unified-cache-management
          test "${FIXTURE_TAG}" = draft/v0.8.0-9101
          mkdir -p in/ledgers out/hosted
          echo "PRODUCTION_SHA=$(git rev-parse HEAD)"
          tag="${FIXTURE_TAG}"
          runs="$(gh api --method GET --paginate --slurp \
            "/repos/${GH_REPO}/actions/workflows/release-tag.yml/runs" \
            -f branch="${tag}" -f event=push -f per_page=100 \
            | jq -ce --arg tag "${tag}" \
              '[.[] | .workflow_runs[] |
                select(.head_branch == $tag and .event == "push")]')"
          test "$(jq 'length' <<<"${runs}")" = 1
          test "$(jq -er '.[0].status' <<<"${runs}")" = completed
          run_id="$(jq -er '.[0].id' <<<"${runs}")"
          artifacts="$(gh api --paginate --slurp \
            "/repos/${GH_REPO}/actions/runs/${run_id}/artifacts?per_page=100" \
            | jq -ce --arg name "fixture-ledger-run-${run_id}" \
              '[.[] | .artifacts[] | select(.name == $name and .expired == false)]')"
          test "$(jq 'length' <<<"${artifacts}")" = 1
          artifact_id="$(jq -er '.[0].id' <<<"${artifacts}")"
          archive="${RUNNER_TEMP}/fixture-ledger-${run_id}.zip"
          gh api "/repos/${GH_REPO}/actions/artifacts/${artifact_id}/zip" >"${archive}"
          ledger_name="$(unzip -Z1 "${archive}")"
          [[ "${ledger_name}" =~ ^[A-Za-z0-9._-]+\.json$ ]]
          mkdir -p "in/ledgers/${run_id}"
          unzip -p "${archive}" "${ledger_name}" >"in/ledgers/${run_id}/${ledger_name}"
      - name: Prove partial cleanup, rediscovery and explicit fixture teardown
        run: |
          set -euo pipefail
          python fixture-helper/.github/release/tests/hosted_cleanup.py closure \
            --production-root . --ledger-dir in/ledgers --output-dir out/hosted \
            --tag "${FIXTURE_TAG}"
      - uses: actions/upload-artifact@v4.6.2
        if: ${{ always() }}
        with:
          name: hosted-ghcr-skip-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            out/hosted/
            in/ledgers/
          if-no-files-found: warn
          retention-days: 7
