# Keep this workflow on the isolated fixture branch. It never replaces a publisher.
name: Cleanup one UCM Tag Release
run-name: Fork cleanup closure · ${{ inputs.scenario }} · source ${{ inputs.source_run_id }}

on:
  workflow_dispatch:
    inputs:
      production_sha:
        description: Fixed repaired commit on Fork default develop
        type: string
        required: true
      helper_ref:
        description: Exact immutable fixture commit containing reviewed helper and config
        type: string
        required: true
      source_run_id:
        description: Source whose durable ledger is captured before deletion
        type: number
        required: false
        default: 0
      tag:
        description: Exact reviewed historical Tag for read-only preflight
        type: string
        required: false
        default: ''
      scenario:
        type: choice
        required: true
        options: [ghcr, manual, retention, kept, history-preview, history-readback]

permissions:
  contents: read

jobs:
  closure:
    if: ${{ github.repository == 'SuperMarioYL/unified-cache-management' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: fork-preview
    permissions:
      contents: write
      actions: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_SHA: ${{ inputs.production_sha }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SCENARIO: ${{ inputs.scenario }}
      PREVIEW_TAG: ${{ inputs.tag }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.helper_ref }}
          path: fixture-helper
          sparse-checkout: .github/release/tests
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: -r .github/release/requirements.txt
      - uses: ./.github/actions/setup-crane
      - name: Authenticate read-only registry preflight
        if: ${{ inputs.scenario == 'history-preview' }}
        run: |
          set -euo pipefail
          python fixture-helper/.github/release/tests/historical_readback.py auth
      - name: Preview only the four reviewed historical Tags using production CLI
        if: ${{ inputs.scenario == 'history-preview' }}
        run: |
          set -euo pipefail
          python fixture-helper/.github/release/tests/hosted_cleanup.py history-preview \
            --production-root . --production-sha "${PRODUCTION_SHA}" \
            --tag "${PREVIEW_TAG}"
      - name: Independently read exact deleted historical identities
        if: ${{ inputs.scenario == 'history-readback' }}
        run: |
          set -euo pipefail
          python fixture-helper/.github/release/tests/historical_readback.py readback \
            --production-root . --production-sha "${PRODUCTION_SHA}" \
            --tag "${PREVIEW_TAG}"
      - name: Capture durable source ledger in this independent closure run
        if: ${{ inputs.scenario != 'history-preview' && inputs.scenario != 'history-readback' }}
        run: |
          set -euo pipefail
          python fixture-helper/.github/release/tests/hosted_cleanup.py capture \
            --production-root . --production-sha "${PRODUCTION_SHA}" \
            --source-run-id "${SOURCE_RUN_ID}"
      - name: Publish capture acknowledgement before source cancellation or completion
        if: ${{ inputs.scenario != 'history-preview' && inputs.scenario != 'history-readback' }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: acceptance-capture-run-${{ github.run_id }}
          path: out/hosted/
          if-no-files-found: error
          retention-days: 90
      - name: Prove active source is deferred before acknowledging its terminal step
        if: ${{ inputs.scenario == 'manual' }}
        run: |
          set -euo pipefail
          python fixture-helper/.github/release/tests/hosted_cleanup.py active-manual \
            --production-root . --production-sha "${PRODUCTION_SHA}"
      - name: Publish independently verified active acknowledgement
        if: ${{ inputs.scenario == 'manual' }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: acceptance-active-run-${{ github.run_id }}
          path: out/hosted/active-proof.json
          if-no-files-found: error
          retention-days: 90
      - name: Observe terminal source and prove deployed cleanup behavior
        if: ${{ inputs.scenario != 'history-preview' && inputs.scenario != 'history-readback' }}
        run: |
          set -euo pipefail
          python fixture-helper/.github/release/tests/hosted_cleanup.py observe \
            --production-root . --production-sha "${PRODUCTION_SHA}" \
            --scenario "${SCENARIO}"
      - uses: actions/upload-artifact@v4.6.2
        if: ${{ always() }}
        with:
          name: hosted-closure-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out/hosted/
          if-no-files-found: warn
          retention-days: 90
