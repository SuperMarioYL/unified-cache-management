name: UCM Fork final acceptance evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # GitHub requires push access to observe a Draft Release; the helper only GETs.
      contents: write
      actions: read
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Load production API dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all: -r .github/release/requirements.txt
      - name: Record the independent observer source
        run: git rev-parse HEAD >.github/release/acceptance-evidence/observer-sha.txt
      - name: Verify preserved objects, exact target states, and original protection
        run: python .github/release/acceptance-evidence/final_summary.py
      - uses: actions/upload-artifact@v4.6.2
        if: ${{ always() }}
        with:
          name: ucm-fork-acceptance-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .github/release/acceptance-evidence/
          if-no-files-found: error
          retention-days: 90
