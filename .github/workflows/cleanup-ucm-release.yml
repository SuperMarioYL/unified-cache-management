name: Cleanup one UCM Tag Release
run-name: Fork Draft quota · ${{ inputs.stage }}

on:
  workflow_dispatch:
    inputs:
      helper_ref:
        type: string
        required: true
      stage:
        type: choice
        required: true
        options: [quota, readback]
      source_run_ids:
        type: string
        required: false
      quota_run_id:
        type: number
        default: 0

permissions:
  contents: read

jobs:
  closure:
    if: ${{ github.repository == 'SuperMarioYL/unified-cache-management' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: fork-preview
    concurrency:
      group: ucm-release-retention-${{ github.repository_id }}-draft
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      HELPER_SHA: ${{ inputs.helper_ref }}
      SOURCE_RUN_IDS: ${{ inputs.source_run_ids }}
      QUOTA_RUN_ID: ${{ inputs.quota_run_id }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.helper_ref }}
          path: fixture-helper
          sparse-checkout: .github/release/tests
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: -r .github/release/requirements.txt
      - name: Bind fixed production code while holding the existing Draft retention queue
        run: |
          set -euo pipefail
          python fixture-helper/.github/release/tests/draft_quota.py binding \
            --production-root . --production-sha f66366538b35faa51507452ae1ad676b10994a4d \
            --helper-sha "${HELPER_SHA}"
      - uses: actions/upload-artifact@v4.6.2
        if: ${{ inputs.stage == 'quota' }}
        with:
          name: draft-quota-lock-run-${{ github.run_id }}
          path: out/draft-quota/code-binding.json
          if-no-files-found: error
          retention-days: 90
      - name: Capture terminal sources and actual quota selection without mutation
        if: ${{ inputs.stage == 'quota' }}
        run: |
          set -euo pipefail
          python fixture-helper/.github/release/tests/draft_quota.py capture \
            --production-root . --production-sha f66366538b35faa51507452ae1ad676b10994a4d \
            --helper-sha "${HELPER_SHA}" --source-run-ids "${SOURCE_RUN_IDS}"
      - uses: actions/upload-artifact@v4.6.2
        if: ${{ inputs.stage == 'quota' }}
        with:
          name: draft-quota-capture-run-${{ github.run_id }}
          path: out/draft-quota/
          if-no-files-found: error
          retention-days: 90
      - name: Verify independent archive before invoking fixed production retention
        if: ${{ inputs.stage == 'quota' }}
        run: |
          set -euo pipefail
          python fixture-helper/.github/release/tests/draft_quota.py apply \
            --production-root . --production-sha f66366538b35faa51507452ae1ad676b10994a4d \
            --helper-sha "${HELPER_SHA}" 2>&1 | tee out/draft-quota/production-retention.log
      - name: Independently read every exact fixture after default production teardown
        if: ${{ inputs.stage == 'readback' }}
        run: |
          set -euo pipefail
          python fixture-helper/.github/release/tests/draft_quota.py readback \
            --production-root . --production-sha f66366538b35faa51507452ae1ad676b10994a4d \
            --helper-sha "${HELPER_SHA}" --quota-run-id "${QUOTA_RUN_ID}"
      - uses: actions/upload-artifact@v4.6.2
        if: ${{ always() }}
        with:
          name: draft-quota-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out/draft-quota/
          if-no-files-found: warn
          retention-days: 90
