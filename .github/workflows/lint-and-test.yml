name: 'Lint and Unit Tests'

on:
  workflow_call:
    outputs:
      source_sha:
        description: Source commit checked by the hosted baseline.
        value: ${{ jobs.hosted-check-summary.outputs.source_sha }}
      compact_test_count:
        description: Number of compact release test outcomes reported by pytest.
        value: ${{ jobs.hosted-check-summary.outputs.compact_test_count }}
      compact_test_result:
        description: Compact release pytest result.
        value: ${{ jobs.hosted-check-summary.outputs.compact_test_result }}
      production_test_count:
        description: Number of production release test outcomes reported by pytest.
        value: ${{ jobs.hosted-check-summary.outputs.production_test_count }}
      production_test_result:
        description: Production release pytest result.
        value: ${{ jobs.hosted-check-summary.outputs.production_test_result }}
      actionlint_result:
        description: actionlint result.
        value: ${{ jobs.hosted-check-summary.outputs.actionlint_result }}
      diff_check_result:
        description: git diff --check result.
        value: ${{ jobs.hosted-check-summary.outputs.diff_check_result }}
      failure_stages:
        description: Comma-separated hosted baseline stages that did not pass.
        value: ${{ jobs.hosted-check-summary.outputs.failure_stages }}

permissions:
  contents: read

jobs:
  cpp-linter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: cpp-linter/cpp-linter-action@b6edc0625e3941baa1797f4b4326adeab6890c97
        id: linter
        continue-on-error: true
        with:
          style: file
          tidy-checks: '-*'
          files-changed-only: true
          lines-changed-only: diff
          format-review: false
          step-summary: true
          version: 20

      - name: Show formatting diff
        if: steps.linter.outputs.checks-failed != 0
        run: |
          echo "::group::clang-format diff details"
          FILES=$(git diff --name-only HEAD~1 -- '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' 2>/dev/null || true)

          if [ -z "$FILES" ]; then
            echo "No changed C/C++ files found."
          else
            echo "$FILES" | while read -r file; do
              if [ -f "$file" ]; then
                DIFF=$(diff -u "$file" <(/usr/bin/clang-format-20 -style=file "$file") || true)
                if [ -n "$DIFF" ]; then
                  echo "::warning file=$file::File does not conform to clang-format style"
                  echo "$DIFF"
                  echo ""
                fi
              fi
            done
          fi
          echo "::endgroup::"

      - name: Fail fast?!
        if: steps.linter.outputs.checks-failed != 0
        run: |
          echo "::error::cpp-linter found ${{ steps.linter.outputs.checks-failed }} formatting issue(s). See the diff output above or the job summary for details."
          exit 1

  py-linter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: "3.12"

    - name: Add matchers for better error display
      run: |
        echo "::add-matcher::.github/workflows/matchers/actionlint.json"
        echo "::add-matcher::.github/workflows/matchers/mypy.json"

    - name: Run pre-commit checks on all files
      uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd
      env:
        SHELLCHECK_OPTS: "--exclude=SC2046,SC2006,SC2086"
      with:
        extra_args: --all-files --hook-stage manual

  release-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      compact_test_count: ${{ steps.compact-test-count.outputs.value }}
      compact_test_result: ${{ steps.compact-tests.outcome }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
        fetch-depth: 0
        fetch-tags: true

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: "3.12"

    - name: Install Helm
      env:
        HELM_VERSION: v3.15.3
        HELM_LINUX_AMD64_SHA256: ad871aecb0c9fd96aa6702f6b79e87556c8998c2e714a4959bf71ee31282ac9c
        HELM_LINUX_ARM64_SHA256: bd57697305ba46fef3299b50168a34faa777dd2cf5b43b50df92cca7ed118cce
      run: |
        case "$(uname -m)" in
          x86_64) helm_arch=amd64; helm_sha="${HELM_LINUX_AMD64_SHA256}" ;;
          aarch64|arm64) helm_arch=arm64; helm_sha="${HELM_LINUX_ARM64_SHA256}" ;;
          *) echo "unsupported Helm architecture: $(uname -m)" >&2; exit 2 ;;
        esac
        helm_archive="${RUNNER_TEMP}/helm.tar.gz"
        curl -fsSL --retry 3 -o "${helm_archive}" \
          "https://get.helm.sh/helm-${HELM_VERSION}-linux-${helm_arch}.tar.gz"
        echo "${helm_sha}  ${helm_archive}" | sha256sum --check
        tar -xzf "${helm_archive}" -C "${RUNNER_TEMP}"
        mkdir -p "${RUNNER_TEMP}/helm-bin"
        mv "${RUNNER_TEMP}/linux-${helm_arch}/helm" "${RUNNER_TEMP}/helm-bin/helm"
        test "$("${RUNNER_TEMP}/helm-bin/helm" version --short)" = "v3.15.3+g3bb50bb"
        echo "${RUNNER_TEMP}/helm-bin" >>"${GITHUB_PATH}"

    - name: Install compact release test dependencies
      run: >-
        python -m pip install --disable-pip-version-check --no-cache-dir
        --only-binary=:all: pytest==8.3.5 PyYAML==6.0.2 packaging==24.2
        setuptools==83.0.0

    - name: Fetch fork-source tags when no release tag is reachable
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if ! git describe --tags --match 'v[0-9]*' HEAD >/dev/null 2>&1; then
          source_repository_url="$(gh api "repos/${GITHUB_REPOSITORY}" \
            --jq '.source.clone_url // .parent.clone_url // empty')"
          test -n "${source_repository_url}"
          git fetch --force "${source_repository_url}" '+refs/tags/*:refs/tags/*'
          git describe --tags --match 'v[0-9]*' HEAD >/dev/null
        fi

    - name: Run compact release tests
      id: compact-tests
      continue-on-error: true
      shell: bash
      run: |
        set -o pipefail
        set +e
        pytest .github/release/tests -q --junitxml=compact-junit.xml | tee compact-pytest.log
        pytest_status="${PIPESTATUS[0]}"
        exit "${pytest_status}"

    - name: Record compact release test count from JUnit XML
      id: compact-test-count
      if: always()
      run: |
        set -euo pipefail
        if [ ! -f compact-junit.xml ]; then
          echo "value=0" >> "${GITHUB_OUTPUT}"
          exit 0
        fi
        python - <<'PY' >> "${GITHUB_OUTPUT}"
        from xml.etree import ElementTree

        root = ElementTree.parse("compact-junit.xml").getroot()
        print(f"value={sum(1 for _ in root.iter('testcase'))}")
        PY

    - name: Fail when compact release tests do not pass
      if: always() && steps.compact-tests.outcome != 'success'
      run: exit 1

  production-release-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      production_test_count: ${{ steps.production-test-count.outputs.value }}
      production_test_result: ${{ steps.production-tests.outcome }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
        fetch-depth: 0
        fetch-tags: true

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: "3.12"

    - name: Install production release test dependencies
      run: >-
        python -m pip install --disable-pip-version-check --no-cache-dir
        --only-binary=:all: pytest==8.3.5 PyYAML==6.0.2 jsonschema==4.23.0
        packaging==24.2 setuptools==83.0.0

    - name: Run production release tests
      id: production-tests
      continue-on-error: true
      shell: bash
      run: |
        set -o pipefail
        set +e
        pytest .github/release/production/tests -q --junitxml=production-junit.xml | tee production-pytest.log
        pytest_status="${PIPESTATUS[0]}"
        exit "${pytest_status}"

    - name: Record production release test count from JUnit XML
      id: production-test-count
      if: always()
      run: |
        set -euo pipefail
        if [ ! -f production-junit.xml ]; then
          echo "value=0" >> "${GITHUB_OUTPUT}"
          exit 0
        fi
        python - <<'PY' >> "${GITHUB_OUTPUT}"
        from xml.etree import ElementTree

        root = ElementTree.parse("production-junit.xml").getroot()
        print(f"value={sum(1 for _ in root.iter('testcase'))}")
        PY

    - name: Fail when production release tests do not pass
      if: always() && steps.production-tests.outcome != 'success'
      run: exit 1

  workflow-static-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      actionlint_result: ${{ steps.actionlint.outcome }}
      diff_check_result: ${{ steps.diff-check.outcome }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
        fetch-depth: 2

    - name: Install actionlint
      run: |
        set -euo pipefail
        go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
        echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

    - name: Run actionlint
      id: actionlint
      continue-on-error: true
      run: actionlint -shellcheck=

    - name: Run git diff --check
      id: diff-check
      continue-on-error: true
      run: git diff --check

    - name: Fail when workflow static checks do not pass
      if: always() && (steps.actionlint.outcome != 'success' || steps.diff-check.outcome != 'success')
      run: exit 1

  hosted-check-summary:
    if: always()
    needs: [release-tests, production-release-tests, workflow-static-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.summary.outputs.source_sha }}
      compact_test_count: ${{ steps.summary.outputs.compact_test_count }}
      compact_test_result: ${{ steps.summary.outputs.compact_test_result }}
      production_test_count: ${{ steps.summary.outputs.production_test_count }}
      production_test_result: ${{ steps.summary.outputs.production_test_result }}
      actionlint_result: ${{ steps.summary.outputs.actionlint_result }}
      diff_check_result: ${{ steps.summary.outputs.diff_check_result }}
      failure_stages: ${{ steps.summary.outputs.failure_stages }}
    steps:
    - name: Summarize hosted baseline results
      id: summary
      env:
        COMPACT_TEST_COUNT: ${{ needs.release-tests.outputs.compact_test_count }}
        COMPACT_TEST_RESULT: ${{ needs.release-tests.outputs.compact_test_result }}
        COMPACT_JOB_RESULT: ${{ needs.release-tests.result }}
        PRODUCTION_TEST_COUNT: ${{ needs.production-release-tests.outputs.production_test_count }}
        PRODUCTION_TEST_RESULT: ${{ needs.production-release-tests.outputs.production_test_result }}
        PRODUCTION_JOB_RESULT: ${{ needs.production-release-tests.result }}
        ACTIONLINT_RESULT: ${{ needs.workflow-static-checks.outputs.actionlint_result }}
        DIFF_CHECK_RESULT: ${{ needs.workflow-static-checks.outputs.diff_check_result }}
        STATIC_CHECKS_JOB_RESULT: ${{ needs.workflow-static-checks.result }}
      run: |
        set -euo pipefail
        compact_test_result="${COMPACT_TEST_RESULT:-not-run}"
        compact_job_result="${COMPACT_JOB_RESULT:-not-run}"
        production_test_result="${PRODUCTION_TEST_RESULT:-not-run}"
        production_job_result="${PRODUCTION_JOB_RESULT:-not-run}"
        actionlint_result="${ACTIONLINT_RESULT:-not-run}"
        diff_check_result="${DIFF_CHECK_RESULT:-not-run}"
        static_checks_job_result="${STATIC_CHECKS_JOB_RESULT:-not-run}"
        compact_test_count="${COMPACT_TEST_COUNT:-0}"
        production_test_count="${PRODUCTION_TEST_COUNT:-0}"

        failure_stages=()
        if [ "${compact_job_result}" != "success" ]; then
          failure_stages+=("compact-release-tests")
        fi
        if [ "${production_job_result}" != "success" ]; then
          failure_stages+=("production-release-tests")
        fi
        if [ "${actionlint_result}" != "success" ]; then
          failure_stages+=("actionlint")
        fi
        if [ "${diff_check_result}" != "success" ]; then
          failure_stages+=("diff-check")
        fi
        if [ "${static_checks_job_result}" != "success" ] \
          && [ "${actionlint_result}" = "success" ] \
          && [ "${diff_check_result}" = "success" ]; then
          failure_stages+=("workflow-static-checks")
        fi
        failure_stage_list="none"
        if [ "${#failure_stages[@]}" -gt 0 ]; then
          failure_stage_list="$(IFS=,; echo "${failure_stages[*]}")"
        fi

        {
          echo "source_sha=${GITHUB_SHA}"
          echo "compact_test_count=${compact_test_count}"
          echo "compact_test_result=${compact_test_result}"
          echo "production_test_count=${production_test_count}"
          echo "production_test_result=${production_test_result}"
          echo "actionlint_result=${actionlint_result}"
          echo "diff_check_result=${diff_check_result}"
          echo "failure_stages=${failure_stage_list}"
        } >> "${GITHUB_OUTPUT}"

        {
          echo "## Hosted baseline"
          echo
          echo "- Source SHA: \`${GITHUB_SHA}\`"
          echo "- Compact release tests: ${compact_test_count} (${compact_test_result})"
          echo "- Production release tests: ${production_test_count} (${production_test_result})"
          echo "- actionlint: ${actionlint_result}"
          echo "- git diff --check: ${diff_check_result}"
          echo "- Failure stages: ${failure_stage_list}"
        } >> "${GITHUB_STEP_SUMMARY}"

        if [ "${failure_stage_list}" != "none" ]; then
          exit 1
        fi

  cpp_gtest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BUILD_TYPE: Debug
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DBUILD_UCM_SPARSE=OFF -DBUILD_UNIT_TESTS=ON -DRUNTIME_ENVIRONMENT=simu

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} -j

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure
