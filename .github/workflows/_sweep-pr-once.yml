name: Sweep PR tags (one-off)

on:
  workflow_dispatch: {}

permissions:
  packages: write
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Delete all pr- prefixed GHCR tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          prefix="pr-"
          echo "Sweeping GHCR tags with prefix '${prefix}'"
          # GITHUB_TOKEN cannot list user/packages (needs a user PAT), but it CAN
          # read+delete versions of packages it owns. Enumerate the known family
          # packages the bot pushes to, plus historical ones.
          packages="vllm vllm-ascend vllm-openai ucm-pr"
          for pkg in ${packages}; do
            raw="$(gh api "user/packages/container/${pkg}/versions?per_page=100" 2>/dev/null || true)"
            printf '%s' "${raw}" | jq -e 'type=="array"' >/dev/null 2>&1 || { echo "${pkg}: not listable (skipped)"; continue; }
            printf '%s' "${raw}" | jq -r '.[] | select(.metadata.container.tags[0] // "" | startswith("'"${prefix}"'")) | "\(.id) \(.metadata.container.tags[0])"' 2>/dev/null | while IFS= read -r line; do
              [ -n "${line}" ] || continue
              vid="${line%% *}"
              tag="${line#* }"
              [[ "${vid}" =~ ^[0-9]+$ ]] || continue
              echo "Deleting ${pkg}:${tag} (version ${vid})"
              gh api --method DELETE "user/packages/container/${pkg}/versions/${vid}" 2>/dev/null || true
            done
          done
          echo "Sweep complete"
