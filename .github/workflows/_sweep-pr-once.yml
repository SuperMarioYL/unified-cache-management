name: Sweep PR tags (one-off)

on:
  workflow_dispatch: {}

permissions:
  packages: write
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Delete all pr- prefixed GHCR tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          prefix="pr-"
          echo "Sweeping GHCR tags with prefix '${prefix}'"
          # Capture the package list raw; gh api --jq leaks error bodies to stdout on 404.
          pkgs_raw="$(gh api "user/packages?package_type=container" 2>/dev/null || true)"
          printf '%s' "${pkgs_raw}" | jq -e 'type=="array"' >/dev/null 2>&1 || { echo "no listable packages; done"; exit 0; }
          for pkg in $(printf '%s' "${pkgs_raw}" | jq -r '.[].name'); do
            [ -n "${pkg}" ] || continue
            raw="$(gh api "user/packages/container/${pkg}/versions?per_page=100" 2>/dev/null || true)"
            # only versions arrays; skip 404/error bodies
            printf '%s' "${raw}" | jq -e 'type=="array"' >/dev/null 2>&1 || continue
            printf '%s' "${raw}" | jq -r '.[] | select(.metadata.container.tags[0] // "" | startswith("'"${prefix}"'")) | "\(.id) \(.metadata.container.tags[0])"' 2>/dev/null | while IFS= read -r line; do
              [ -n "${line}" ] || continue
              vid="${line%% *}"
              tag="${line#* }"
              [[ "${vid}" =~ ^[0-9]+$ ]] || continue
              echo "Deleting ${pkg}:${tag} (version ${vid})"
              gh api --method DELETE "user/packages/container/${pkg}/versions/${vid}" 2>/dev/null || true
            done
          done
          echo "Sweep complete"
