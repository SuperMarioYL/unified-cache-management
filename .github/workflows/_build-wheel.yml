name: Reusable build fixture UCM wheel

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      profile_id:
        type: string
        required: true
      validation_lane:
        type: string
        required: true
    outputs:
      wheel_artifact:
        description: Same-run artifact containing the exact fixture wheel
        value: ${{ jobs.build.outputs.wheel_artifact }}
      wheel_sha256:
        description: SHA256 of the exact wheel bytes
        value: ${{ jobs.build.outputs.wheel_sha256 }}
      inspection_sha256:
        description: SHA256 of the canonical Task 2 inspection record
        value: ${{ jobs.build.outputs.inspection_sha256 }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      wheel_artifact: ${{ steps.record.outputs.wheel_artifact }}
      wheel_sha256: ${{ steps.record.outputs.wheel_sha256 }}
      inspection_sha256: ${{ steps.record.outputs.inspection_sha256 }}
    steps:
      - name: Validate reusable build contract
        env:
          PROFILE_ID: ${{ inputs.profile_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VALIDATION_LANE: ${{ inputs.validation_lane }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full lowercase commit SHA" >&2
            exit 2
          fi
          if [[ "${VALIDATION_LANE}" != fork-candidate ]]; then
            echo "production wheel builder/toolchain/runner locks are unresolved" >&2
            exit 2
          fi
          if [[ "${PROFILE_ID}" != cuda-cu129-ubuntu2204-amd64-cp312-release-default-sm75-sm80-sm86-sm89-sm90 ]]; then
            echo "profile_id is not the authorized fixture profile" >&2
            exit 2
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install compact release runtime dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - name: Build and inspect fixture-only wheel with ordinary Requires-Dist wrapt==1.17.2
        env:
          PROFILE_ID: ${{ inputs.profile_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          PYTHONPATH=.github/release python -m ucm_release wheel fixture-build \
            --output-dir out \
            --source-sha "${SOURCE_SHA}" \
            --profile-id "${PROFILE_ID}" >fixture-build-result.json
      - id: record
        name: Expose immutable artifact identities
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          echo "wheel_artifact=ucm-fixture-wheel-${SOURCE_SHA}" >>"${GITHUB_OUTPUT}"
          echo "wheel_sha256=$(cat out/wheel.sha256)" >>"${GITHUB_OUTPUT}"
          echo "inspection_sha256=$(python -c 'import json; print(json.load(open("out/fixture-build.json"))["inspection_sha256"])')" >>"${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.record.outputs.wheel_artifact }}
          path: |
            out/*.whl
            out/wheel.sha256
            out/wheel-inspection.json
            out/fixture-build.json
          if-no-files-found: error
          retention-days: 3
