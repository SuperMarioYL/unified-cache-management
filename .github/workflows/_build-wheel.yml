name: Reusable real native UCM wheel build

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      task_id:
        type: string
        required: true
      runner:
        type: string
        required: true
      resolved_plan_artifact:
        type: string
        required: true
      resolved_plan_sha256:
        type: string
        required: true
    outputs:
      wheel_artifact:
        description: Same-run real wheel artifact for this exact reviewed task
        value: ${{ jobs.build.outputs.wheel_artifact }}
      wheel_sha256:
        description: SHA256 of the sealed real wheel bytes
        value: ${{ jobs.build.outputs.wheel_sha256 }}
      inspection_sha256:
        description: SHA256 of the canonical builder-candidate inspection
        value: ${{ jobs.build.outputs.inspection_sha256 }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      wheel_artifact: ${{ steps.task.outputs.wheel_artifact }}
      wheel_sha256: ${{ steps.record.outputs.wheel_sha256 }}
      inspection_sha256: ${{ steps.record.outputs.inspection_sha256 }}
    steps:
      - name: Validate reusable build contract
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TASK_ID: ${{ inputs.task_id }}
          RESOLVED_PLAN_ARTIFACT: ${{ inputs.resolved_plan_artifact }}
          RESOLVED_PLAN_SHA256: ${{ inputs.resolved_plan_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full lowercase commit SHA" >&2
            exit 2
          fi
          if [[ ! "${TASK_ID}" =~ ^wheel-[0-9a-f]{64}$ ]] || \
             [[ ! "${RESOLVED_PLAN_ARTIFACT}" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]] || \
             [[ ! "${RESOLVED_PLAN_SHA256}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "wheel task or frozen plan identity is invalid" >&2
            exit 2
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.resolved_plan_artifact }}
          path: input/plan
      - name: Validate frozen plan source before checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          RESOLVED_PLAN_SHA256: ${{ inputs.resolved_plan_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          plan_path="input/plan/resolved-plan.json"
          payload_path="${RUNNER_TEMP}/resolved-plan-unhashed.json"
          claimed_plan_sha256="$(jq -er '.resolved_plan_sha256 | select(type == "string")' "${plan_path}")"
          plan_source_sha="$(jq -er '.source.commit | select(type == "string")' "${plan_path}")"
          jq -cS 'del(.resolved_plan_sha256)' "${plan_path}" >"${payload_path}"
          payload_size="$(wc -c <"${payload_path}" | tr -d ' ')"
          test "${payload_size}" -gt 1
          truncate -s "$((payload_size - 1))" "${payload_path}"
          observed_plan_sha256="sha256:$(sha256sum "${payload_path}" | cut -d' ' -f1)"
          test "${claimed_plan_sha256}" = "${RESOLVED_PLAN_SHA256}"
          test "${observed_plan_sha256}" = "${RESOLVED_PLAN_SHA256}"
          test "${plan_source_sha}" = "${EXPECTED_SOURCE_SHA}"
      - name: Record disk before cleanup
        shell: bash
        run: |
          set -euo pipefail
          df -Pk / | tee "${RUNNER_TEMP}/ucm-disk-before.txt"
      - name: Free disk for immutable native builder
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - name: Require sixty GiB after cleanup
        shell: bash
        run: |
          set -euo pipefail
          df -Pk / | tee "${RUNNER_TEMP}/ucm-disk-after.txt"
          available_kib="$(df -Pk / | awk 'NR==2 {print $4}')"
          available_gib="$((available_kib / 1024 / 1024))"
          if (( available_gib < 60 )); then
            echo "native wheel build requires at least 60 GiB, found ${available_gib} GiB" >&2
            exit 2
          fi
          printf '%s\n' "${available_gib}" >"${RUNNER_TEMP}/ucm-available-gib.txt"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - id: task-python
        name: Select task Python from the frozen plan
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          TASK_ID: ${{ inputs.task_id }}
          RESOLVED_PLAN_SHA256: ${{ inputs.resolved_plan_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/release/select_task_python.py \
            --plan input/plan/resolved-plan.json \
            --task-kind wheel \
            --task-id "${TASK_ID}" \
            --expected-sha256 "${RESOLVED_PLAN_SHA256}" \
            --expected-source-sha "${EXPECTED_SOURCE_SHA}" \
            --github-output "${GITHUB_OUTPUT}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "${{ steps.task-python.outputs.python_version }}"
      - name: Install compact release runtime dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - id: task
        name: Select frozen wheel task and derive canonical build inputs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TASK_ID: ${{ inputs.task_id }}
          RESOLVED_PLAN_SHA256: ${{ inputs.resolved_plan_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct "${SOURCE_SHA}")"
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(find input/plan -maxdepth 1 -type f -name 'resolved-plan.json' | wc -l | tr -d ' ')" = 1
          PYTHONPATH=.github/release python -m ucm_release catalog select \
            --plan input/plan/resolved-plan.json \
            --task-kind wheel \
            --task-id "${TASK_ID}" \
            --expected-plan-sha256 "${RESOLVED_PLAN_SHA256}" \
            --output out/selected-task.json >/dev/null
          PYTHONPATH=.github/release python -m ucm_release core hosted-task \
            --task out/selected-task.json \
            --source-sha "${SOURCE_SHA}" \
            --source-date-epoch "${source_date_epoch}" \
            --resolved-plan input/plan/resolved-plan.json \
            --expected-plan-sha256 "${RESOLVED_PLAN_SHA256}" \
            --output out/hosted-task.json >/dev/null
          test "$(jq -r '.runner' out/selected-task.json)" = "${{ inputs.runner }}"
          PYTHONPATH=.github/release python -m ucm_release wheel context \
            --source-sha "${SOURCE_SHA}" \
            --output-dir out/source-context >out/source-context-result.json
          cp out/selected-task.json out/source-context/wheel-task.json
          logical_artifact="$(jq -r '.wheel_artifact' out/hosted-task.json)"
          wheel_artifact="${logical_artifact}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          echo "wheel_artifact=${wheel_artifact}" >>"${GITHUB_OUTPUT}"
      - name: Materialize the task-bound offline build tool wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/source-context/build-wheels out/build-tool-download
          jq -r '.build_tool_lock' out/hosted-task.json > out/source-context/build-requirements.lock
          test "sha256:$(sha256sum out/source-context/build-requirements.lock | cut -d' ' -f1)" = \
            "$(jq -r '.build_tool_lock_sha256' out/hosted-task.json)"
          while IFS=$'\t' read -r requirement filename expected_sha256; do
            rm -rf out/build-tool-download/*
            python -m pip download --disable-pip-version-check --no-cache-dir \
              --only-binary=:all: --no-deps \
              --dest out/build-tool-download "${requirement}"
            test "$(find out/build-tool-download -maxdepth 1 -type f | wc -l | tr -d ' ')" = 1
            test -f "out/build-tool-download/${filename}"
            echo "${expected_sha256#sha256:}  out/build-tool-download/${filename}" | sha256sum --check
            mv "out/build-tool-download/${filename}" out/source-context/build-wheels/
          done < <(jq -r '.build_tools[] | [.requirement, .filename, .sha256] | @tsv' out/hosted-task.json)
          expected_count="$(jq '(.build_tools) | length' out/hosted-task.json)"
          test "$(find out/source-context/build-wheels -maxdepth 1 -type f -name '*.whl' | wc -l | tr -d ' ')" = "${expected_count}"
      - name: Install checksum-pinned Buildx
        env:
          TASK_ID: ${{ inputs.task_id }}
          RESOLVED_PLAN_SHA256: ${{ inputs.resolved_plan_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=.github/release python -m ucm_release image task-toolchain-authority \
            --resolved-plan input/plan/resolved-plan.json \
            --task-kind wheel \
            --task-id "${TASK_ID}" \
            --expected-plan-sha256 "${RESOLVED_PLAN_SHA256}" \
            >out/task-toolchain-authority.json
          buildx_version="$(jq -r '.toolchain.buildx_version' out/task-toolchain-authority.json)"
          buildkit_image="$(jq -r '.toolchain.buildkit_image' out/task-toolchain-authority.json)"
          case "$(uname -m)" in
            x86_64) buildx_arch=amd64 ;;
            aarch64|arm64) buildx_arch=arm64 ;;
            *) echo "unsupported Buildx architecture: $(uname -m)" >&2; exit 2 ;;
          esac
          buildx_sha="$(jq -r --arg arch "$buildx_arch" '.toolchain.buildx_linux_sha256[$arch]' out/task-toolchain-authority.json)"
          buildx_binary="${RUNNER_TEMP}/docker-buildx"
          curl -fsSL --retry 3 -o "${buildx_binary}" \
            "https://github.com/docker/buildx/releases/download/${buildx_version}/buildx-${buildx_version}.linux-${buildx_arch}"
          echo "${buildx_sha#sha256:}  ${buildx_binary}" | sha256sum --check
          mkdir -p "${HOME}/.docker/cli-plugins"
          install -m 0755 "${buildx_binary}" "${HOME}/.docker/cli-plugins/docker-buildx"
          test "$(docker buildx version | awk '{print $2}')" = "${buildx_version}"
          docker buildx create --name ucm-release-builder \
            --driver docker-container \
            --driver-opt "image=${buildkit_image}" \
            --use
          docker buildx inspect ucm-release-builder --bootstrap
      - name: Build, seal, and export the real native wheel
        shell: bash
        run: |
          set -euo pipefail
          docker_target="$(jq -r '.docker_target' out/hosted-task.json)"
          platform="$(jq -r '.platform' out/hosted-task.json)"
          build_args=()
          while IFS= read -r build_arg; do
            build_args+=(--build-arg "${build_arg}")
          done < <(jq -r '.build_args | to_entries | sort_by(.key)[] | "\(.key)=\(.value)"' out/hosted-task.json)
          mkdir -p out
          : >out/build.log
          max_build_attempts=3
          for ((build_attempt=1; build_attempt<=max_build_attempts; build_attempt++)); do
            rm -rf out/wheel
            mkdir -p out/wheel
            attempt_log="out/build-attempt-${build_attempt}.log"
            : >"${attempt_log}"
            printf '=== Buildx attempt %s/%s ===\n' \
              "${build_attempt}" "${max_build_attempts}" \
              | tee -a "${attempt_log}" out/build.log
            if docker buildx build \
              --builder ucm-release-builder \
              --platform "${platform}" \
              --target "${docker_target}" \
              "${build_args[@]}" \
              --output type=local,dest=out/wheel \
              --progress plain \
              -f .github/release/docker/Dockerfile \
              out/source-context 2>&1 \
              | tee -a "${attempt_log}" out/build.log; then
              build_status=0
            else
              build_status=$?
            fi
            printf '=== Buildx attempt %s/%s exit=%s ===\n' \
              "${build_attempt}" "${max_build_attempts}" "${build_status}" \
              | tee -a "${attempt_log}" out/build.log
            if [[ "${build_status}" -eq 0 ]]; then
              break
            fi
            rm -rf out/wheel
            if [[ "${build_attempt}" -eq "${max_build_attempts}" ]]; then
              exit "${build_status}"
            fi
            retry_delay="$((build_attempt * 5))"
            printf 'Retrying the same BuildKit builder in %s seconds\n' \
              "${retry_delay}" | tee -a "${attempt_log}" out/build.log
            sleep "${retry_delay}"
          done
      - id: record
        name: Reopen the sealed wheel and expose immutable identities
        env:
          TASK_ID: ${{ inputs.task_id }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t wheel_paths < <(find out/wheel -maxdepth 1 -type f -name '*.whl' -print | sort)
          test "${#wheel_paths[@]}" = 1
          wheel_path="${wheel_paths[0]}"
          spec_id="$(jq -r '.spec_id' out/selected-task.json)"
          wheel_sha256="sha256:$(sha256sum "${wheel_path}" | cut -d' ' -f1)"
          test "$(jq -r '.wheel_sha256' out/wheel/wheel-seal.json)" = "${wheel_sha256}"
          runtime_patch_manifest_sha256="$(jq -r '.runtime_patch_manifest_sha256' out/selected-task.json)"
          test "$(jq -r '.runtime_patch_manifest_sha256' out/wheel/wheel-seal.json)" = "${runtime_patch_manifest_sha256}"
          PYTHONPATH=.github/release python -m ucm_release wheel inspect \
            "${wheel_path}" \
            --spec-id "${spec_id}" \
            --expected-sha256 "${wheel_sha256}" \
            --source-kind builder-candidate \
            --task-file out/selected-task.json >out/reopened-wheel-inspection.json
          cmp out/wheel/wheel-inspection.json out/reopened-wheel-inspection.json
          test "$(jq -r '.runtime_patch_manifest_sha256' out/reopened-wheel-inspection.json)" = "${runtime_patch_manifest_sha256}"
          inspection_sha256="sha256:$(sha256sum out/wheel/wheel-inspection.json | cut -d' ' -f1)"
          mkdir -p out/wheel-artifact
          cp "${wheel_path}" out/wheel-artifact/
          cp out/wheel/wheel-inspection.json out/wheel-artifact/wheel-inspection.json
          cp out/wheel/wheel-seal.json out/wheel-artifact/wheel-seal.json
          cp out/reopened-wheel-inspection.json out/wheel-artifact/reopened-wheel-inspection.json
          cp out/hosted-task.json out/wheel-artifact/hosted-task.json
          cp out/selected-task.json out/wheel-artifact/selected-task.json
          cp input/plan/resolved-plan.json out/wheel-artifact/resolved-plan.json
          cp out/source-context/source-context.json out/wheel-artifact/source-context.json
          cp out/source-context-result.json out/wheel-artifact/source-context-result.json
          cp out/task-toolchain-authority.json out/wheel-artifact/task-toolchain-authority.json
          cp "${RUNNER_TEMP}/ucm-disk-before.txt" out/wheel-artifact/disk-before.txt
          cp "${RUNNER_TEMP}/ucm-disk-after.txt" out/wheel-artifact/disk-after.txt
          cp "${RUNNER_TEMP}/ucm-available-gib.txt" out/wheel-artifact/available-gib.txt
          cp out/build.log out/wheel-artifact/build.log
          {
            echo "wheel_sha256=${wheel_sha256}"
            echo "inspection_sha256=${inspection_sha256}"
          } >>"${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.task.outputs.wheel_artifact }}
          path: out/wheel-artifact/
          if-no-files-found: error
          overwrite: false
          retention-days: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_protected == true && 90 || 3 }}
