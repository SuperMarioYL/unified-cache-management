name: Build one UCM wheel

on:
  workflow_call:
    inputs:
      wheel_id:
        type: string
        required: true
      runner:
        type: string
        required: true
      plan_artifact:
        type: string
        required: true
      source_ref:
        type: string
        required: false
        default: ""
    outputs:
      wheel_artifact:
        description: Wheel artifact produced by this task
        value: ${{ jobs.build.outputs.wheel_artifact }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 180
    outputs:
      wheel_artifact: ${{ steps.task.outputs.wheel_artifact }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - uses: ./.github/actions/download-artifact-retry
        with:
          name: ${{ inputs.plan_artifact }}
          path: input/plan
      - id: task
        name: Select wheel task
        env:
          WHEEL_ID: ${{ inputs.wheel_id }}
        run: |
          set -euo pipefail
          mkdir -p out .ucm-compact
          PYTHONPATH=.github/release python -m ucm_release compact select \
            --plan input/plan/release-plan.json --kind wheel --id "${WHEEL_ID}" \
            --output out/wheel-task.json >/dev/null
          PYTHONPATH=.github/release python -m ucm_release compact prepare-wheel-source \
            --source-root . \
            --distribution "$(jq -r '.dist_name' out/wheel-task.json)" >/dev/null
          jq -r '.build_requirements[]' out/wheel-task.json \
            >.ucm-compact/build-requirements.txt
          jq -c '.runtime_requirements' out/wheel-task.json \
            >.ucm-compact/runtime-requirements.json
          artifact="ucm-wheel-${WHEEL_ID}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          echo "wheel_artifact=${artifact}" >>"${GITHUB_OUTPUT}"
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Build native wheel
        run: |
          set -euo pipefail
          builder="$(jq -r '.builder.repository + ":" + .builder.tag' out/wheel-task.json)"
          docker buildx build \
            --platform "$(jq -r '.platform' out/wheel-task.json)" \
            --file .github/release/docker/Dockerfile.wheel \
            --target wheel \
            --build-arg "UCM_BUILDER_IMAGE=${builder}" \
            --build-arg "UCM_BUILD_VERSION=$(jq -r '.wheel_version' out/wheel-task.json)" \
            --build-arg "UCM_CPU_ARCH=$(jq -r '.cpu_arch' out/wheel-task.json)" \
            --build-arg "UCM_DIST_NAME=$(jq -r '.dist_name' out/wheel-task.json)" \
            --build-arg "UCM_PLATFORM=$(jq -r '.build.platform_arg' out/wheel-task.json)" \
            --build-arg "UCM_PYTHON_VERSION=$(jq -r '.python_version' out/wheel-task.json)" \
            --build-arg "UCM_PYTHON_ABI=$(jq -r '.python_abi' out/wheel-task.json)" \
            --output type=local,dest=out/wheel \
            --progress plain .
          test "$(find out/wheel -maxdepth 1 -type f -name '*.whl' | wc -l | tr -d ' ')" = 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.task.outputs.wheel_artifact }}
          path: out/wheel/*.whl
          if-no-files-found: error
          overwrite: false
          retention-days: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 90 || 7 }}
