name: Publish one protected UCM image member

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      spec_id:
        type: string
        required: true
    outputs:
      member_artifact:
        description: Protected same-run member publication evidence
        value: ${{ jobs.publish-member.outputs.member_artifact }}
      member_record_sha256:
        description: Protected canonical member publication record identity
        value: ${{ jobs.publish-member.outputs.member_record_sha256 }}

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/_build-image.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      spec_id: ${{ inputs.spec_id }}
      deliver_full_oci: false

  publish-member:
    needs: build
    if: >-
      ${{
        !cancelled() &&
        needs.build.result == 'success' &&
        github.event_name == 'push' &&
        github.repository == 'SuperMarioYL/unified-cache-management' &&
        github.ref == 'refs/tags/v0.5.0rc1' &&
        github.ref_protected == true
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    environment: release-production
    env:
      CRANE_VERSION: v0.20.3
      CRANE_LINUX_AMD64_SHA256: 36c67a932f489b3f2724b64af90b599a8ef2aa7b004872597373c0ad694dc059
      CRANE_LINUX_ARM64_SHA256: d2235f7779cd39c6e40f43701d2512c997409f629fb53e621ede0d57d3f995e2
    outputs:
      member_artifact: ${{ steps.record.outputs.member_artifact }}
      member_record_sha256: ${{ steps.record.outputs.member_record_sha256 }}
    steps:
      - name: Validate protected publisher contract
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SPEC_ID: ${{ inputs.spec_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          case "${SPEC_ID}" in
            cuda130-amd64|cuda130-arm64|cann900-a2-amd64|cann900-a2-arm64|cann900-a3-amd64|cann900-a3-arm64) ;;
            *) exit 2 ;;
          esac
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install compact release runtime dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - name: Recheck exact protected authority in the writer job
        env:
          UCM_RELEASE_POLICY: ${{ vars.UCM_RELEASE_POLICY }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin +refs/tags/v0.5.0rc1:refs/tags/v0.5.0rc1 +refs/heads/develop:refs/remotes/origin/develop
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD:.github/workflows)" = "$(git rev-parse origin/develop:.github/workflows)"
          test "$(git rev-parse HEAD:.github/release)" = "$(git rev-parse origin/develop:.github/release)"
          mkdir -p out
          PYTHONPATH=.github/release python -m ucm_release core tag-preflight \
            --lane protected-tag >out/member-preflight.json
      - name: Free publisher disk without exposing the write token to an action
        shell: bash
        run: |
          set -euo pipefail
          docker system prune --all --force || true
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          available_kib="$(df -Pk / | awk 'NR==2 {print $4}')"
          available_gib="$((available_kib / 1024 / 1024))"
          if (( available_gib < 60 )); then
            echo "member publisher requires at least 60 GiB, found ${available_gib} GiB" >&2
            exit 2
          fi
      - name: Install checksum-pinned crane publisher
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) crane_arch=x86_64; crane_sha="${CRANE_LINUX_AMD64_SHA256}" ;;
            aarch64|arm64) crane_arch=arm64; crane_sha="${CRANE_LINUX_ARM64_SHA256}" ;;
            *) exit 2 ;;
          esac
          mkdir -p "${RUNNER_TEMP}/crane"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/crane.tar.gz" \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_${crane_arch}.tar.gz"
          echo "${crane_sha}  ${RUNNER_TEMP}/crane.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/crane.tar.gz" -C "${RUNNER_TEMP}/crane" crane
          test "$("${RUNNER_TEMP}/crane/crane" version)" = "${CRANE_VERSION#v}"
          echo "${RUNNER_TEMP}/crane" >>"${GITHUB_PATH}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.build.outputs.internal_oci_artifact }}
          path: input/oci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.build.outputs.image_artifact }}
          path: input/image
      - name: Validate exact current-attempt bridge names
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SPEC_ID: ${{ inputs.spec_id }}
          OCI_ARTIFACT: ${{ needs.build.outputs.internal_oci_artifact }}
          IMAGE_ARTIFACT: ${{ needs.build.outputs.image_artifact }}
        run: |
          set -euo pipefail
          python -c 'import json,os; json.dump({"source_sha":os.environ["SOURCE_SHA"],"spec_id":os.environ["SPEC_ID"],"oci_artifact":os.environ["OCI_ARTIFACT"],"image_artifact":os.environ["IMAGE_ARTIFACT"],"hosted_task":"input/image/hosted-task.json","run":{"run_id":os.environ["GITHUB_RUN_ID"],"run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"])}},open("out/bridge-request.json","w"),sort_keys=True,separators=(",",":"))'
          PYTHONPATH=.github/release python -m ucm_release artifact validate-image-bridge --input out/bridge-request.json --output out/bridge-validation.json >/dev/null
      - name: Authenticate the pinned publisher to GHCR
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/ucm-member-docker-config
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${DOCKER_CONFIG}"
          printf '%s' "${GITHUB_TOKEN}" | crane auth login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin
      - id: record
        name: Publish and reopen one canonical private member
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/ucm-member-docker-config
          UCM_RELEASE_POLICY: ${{ vars.UCM_RELEASE_POLICY }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SPEC_ID: ${{ inputs.spec_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin +refs/tags/v0.5.0rc1:refs/tags/v0.5.0rc1 +refs/heads/develop:refs/remotes/origin/develop
          test "$(git rev-parse HEAD:.github/workflows)" = "$(git rev-parse origin/develop:.github/workflows)"
          test "$(git rev-parse HEAD:.github/release)" = "$(git rev-parse origin/develop:.github/release)"
          PYTHONPATH=.github/release python -m ucm_release core tag-preflight --lane protected-tag >out/member-mutation-preflight.json
          cmp input/oci/image-result.json input/image/image-result.json
          printf '%s\n' '{"image_result":"input/image/image-result.json","lane":"protected-tag","oci_archive":"input/oci/image.oci.tar"}' \
            >out/member-request.json
          PYTHONPATH=.github/release python -m ucm_release registry verify-member \
            --input out/member-request.json --output out/member-record.json >/dev/null
          # shellcheck disable=SC2016
          PYTHONPATH=.github/release python -c 'import json; from ucm_release import core,registry; record=core.load_json("out/member-record.json"); registry.validate_member_record(record); schema=core.load_json(core.DEFAULT_SCHEMA_DIR/"release-manifest.schema.json"); core.validate_schema(record,schema["$defs"]["registryMemberRecord"],root=schema); open("out/member-audit-request.json","w").write(json.dumps({"lane":"protected-tag","operations":record["operations"]},sort_keys=True,separators=(",",":"))+"\n")'
          PYTHONPATH=.github/release python -m ucm_release registry audit-operations \
            --input out/member-audit-request.json --output out/member-audit.json >/dev/null
          member_artifact="ucm-member-${SPEC_ID}-${SOURCE_SHA}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          {
            echo "member_artifact=${member_artifact}"
            echo "member_record_sha256=$(python -c 'import json; print(json.load(open("out/member-record.json"))["record_sha256"])')"
          } >>"${GITHUB_OUTPUT}"
      - name: Remove Registry credentials before evidence upload
        if: ${{ always() }}
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/ucm-member-docker-config
        run: |
          set -euo pipefail
          crane auth logout ghcr.io || true
          rm -rf "${DOCKER_CONFIG}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.record.outputs.member_artifact }}
          path: |
            out/member-record.json
            out/member-audit.json
            out/member-preflight.json
            out/member-mutation-preflight.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90
