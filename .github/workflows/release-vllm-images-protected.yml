name: Publish planner-selected UCM images to GHCR

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      image_matrix:
        type: string
        required: true
      resolved_plan_artifact:
        type: string
        required: true
      resolved_plan_sha256:
        type: string
        required: true
      draft_artifact:
        type: string
        required: true
    outputs:
      publication_artifact:
        description: Canonical GHCR publication result
        value: ${{ jobs.publish-ghcr.outputs.publication_artifact }}

permissions:
  contents: read

jobs:
  publish-members:
    if: >-
      ${{
        !cancelled() && github.event_name == 'push' &&
        github.ref_type == 'tag' && github.ref_protected == true
      }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.image_matrix) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_publish-image-member.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      task_id: ${{ matrix.task_id }}
      runner: ${{ matrix.runner }}
      resolved_plan_artifact: ${{ inputs.resolved_plan_artifact }}
      resolved_plan_sha256: ${{ inputs.resolved_plan_sha256 }}

  publish-ghcr:
    needs: publish-members
    if: >-
      ${{
        !cancelled() && github.event_name == 'push' &&
        github.ref_type == 'tag' && github.ref_protected == true &&
        needs.publish-members.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    environment: release-production
    outputs:
      publication_artifact: ${{ steps.publish.outputs.publication_artifact }}
    env:
      CRANE_VERSION: v0.20.3
      CRANE_LINUX_AMD64_SHA256: 36c67a932f489b3f2724b64af90b599a8ef2aa7b004872597373c0ad694dc059
      BUILDX_VERSION: v0.19.2
      BUILDX_LINUX_AMD64_SHA256: a5ff61c0b6d2c8ee20964a9d6dac7a7a6383c4a4a0ee8d354e983917578306ea
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - name: Install checksum-pinned Registry tools
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/crane" "${HOME}/.docker/cli-plugins"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/crane.tar.gz" \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_LINUX_AMD64_SHA256}  ${RUNNER_TEMP}/crane.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/crane.tar.gz" -C "${RUNNER_TEMP}/crane" crane
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/docker-buildx" \
            "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-amd64"
          echo "${BUILDX_LINUX_AMD64_SHA256}  ${RUNNER_TEMP}/docker-buildx" | sha256sum --check
          install -m 0755 "${RUNNER_TEMP}/docker-buildx" \
            "${HOME}/.docker/cli-plugins/docker-buildx"
          test "$("${RUNNER_TEMP}/crane/crane" version)" = "${CRANE_VERSION#v}"
          test "$("${HOME}/.docker/cli-plugins/docker-buildx" version | awk '{print $2}')" = "${BUILDX_VERSION}"
          echo "${RUNNER_TEMP}/crane" >>"${GITHUB_PATH}"
      - uses: ./.github/actions/download-artifact-retry
        with:
          pattern: ucm-member-*-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: input/members
      - uses: ./.github/actions/download-artifact-retry
        with:
          name: ${{ inputs.resolved_plan_artifact }}
          path: input/plan
      - uses: ./.github/actions/download-artifact-retry
        with:
          name: ${{ inputs.draft_artifact }}
          path: input/draft
      - name: Authenticate the GHCR index publisher
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/ucm-ghcr-publish
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${DOCKER_CONFIG}"
          printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin
      - id: publish
        name: Aggregate exact members and publish canonical GHCR indexes
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/ucm-ghcr-publish
          SOURCE_SHA: ${{ inputs.source_sha }}
          RESOLVED_PLAN_SHA256: ${{ inputs.resolved_plan_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p out/members
          test "$(jq -r '.resolved_plan_sha256' input/plan/resolved-plan.json)" = \
            "${RESOLVED_PLAN_SHA256}"
          test "$(jq '.image_tasks | length' input/plan/resolved-plan.json)" = 6
          while IFS= read -r task_id; do
            physical="ucm-member-${task_id}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
            source="input/members/${physical}/member-record.json"
            test -f "${source}"
            cp "${source}" "out/members/${task_id}.json"
          done < <(jq -r '.image_tasks[].task_id' input/plan/resolved-plan.json)
          test "$(find out/members -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')" = 6
          PYTHONPATH=.github/release python -m ucm_release publish ghcr \
            --plan input/plan/resolved-plan.json \
            --stage publish \
            --members-dir out/members \
            --draft-state input/draft/github-release-draft.json \
            --output out/ghcr-publication.json
          artifact="ucm-publication-ghcr-${SOURCE_SHA}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          echo "publication_artifact=${artifact}" >>"${GITHUB_OUTPUT}"
      - name: Remove GHCR credentials
        if: ${{ always() }}
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/ucm-ghcr-publish
        run: |
          rm -rf "${DOCKER_CONFIG}"
          rm -f "${HOME}/.docker/cli-plugins/docker-buildx"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.publish.outputs.publication_artifact }}
          path: out/ghcr-publication.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90
