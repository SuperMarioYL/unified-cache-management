name: Publish planner-selected UCM protected images

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      image_matrix:
        type: string
        required: true
      family_matrix:
        type: string
        required: true
      resolved_plan_artifact:
        type: string
        required: true
      resolved_plan_sha256:
        type: string
        required: true
    outputs:
      authenticated_artifact:
        description: Protected plan-bound member and index authenticated evidence
        value: ${{ jobs.authenticated-readback.outputs.authenticated_artifact }}

permissions:
  contents: read

jobs:
  build-images-protected:
    if: >-
      ${{
        !cancelled() &&
        github.event_name == 'push' &&
        github.repository == 'SuperMarioYL/unified-cache-management' &&
        github.ref_type == 'tag' && github.ref_protected == true
      }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.image_matrix) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_publish-image-member.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      task_id: ${{ matrix.task_id }}
      runner: ${{ matrix.runner }}
      resolved_plan_artifact: ${{ inputs.resolved_plan_artifact }}
      resolved_plan_sha256: ${{ inputs.resolved_plan_sha256 }}

  member-barrier:
    needs: [build-images-protected]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Block skipped cancelled or failed member publication
        env:
          MEMBERS_RESULT: ${{ needs.build-images-protected.result }}
        run: |
          set -euo pipefail
          for result in "${MEMBERS_RESULT}"; do
            case "${result}" in
              success) ;;
              skipped|failure|cancelled) echo "protected member result=${result}" >&2; exit 2 ;;
              *) echo "unknown protected member result=${result}" >&2; exit 2 ;;
            esac
          done

  aggregate-members:
    needs: [build-images-protected, member-barrier]
    if: >-
      ${{
        !cancelled() &&
        needs.build-images-protected.result == 'success' &&
        needs.member-barrier.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    outputs:
      parent_artifact: ${{ steps.plan-indexes.outputs.parent_artifact }}
    env:
      CRANE_VERSION: v0.20.3
      CRANE_LINUX_AMD64_SHA256: 36c67a932f489b3f2724b64af90b599a8ef2aa7b004872597373c0ad694dc059
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - name: Install checksum-pinned crane
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/crane"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/crane.tar.gz" \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_LINUX_AMD64_SHA256}  ${RUNNER_TEMP}/crane.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/crane.tar.gz" -C "${RUNNER_TEMP}/crane" crane
          test "$("${RUNNER_TEMP}/crane/crane" version)" = "${CRANE_VERSION#v}"
          echo "${RUNNER_TEMP}/crane" >>"${GITHUB_PATH}"
      - name: Authenticate exact Registry inventory read
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "${GITHUB_TOKEN}" | crane auth login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ucm-member-*-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: input/members
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.resolved_plan_artifact }}
          path: input/plan
      - id: plan-indexes
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RESOLVED_PLAN_SHA256: ${{ inputs.resolved_plan_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p out/parent/member-records
          python -c 'import json,os; json.dump({"root":"input/members","output_dir":"out/parent/member-records","source_sha":os.environ["SOURCE_SHA"],"resolved_plan":"input/plan/resolved-plan.json","resolved_plan_sha256":os.environ["RESOLVED_PLAN_SHA256"],"run":{"run_id":os.environ["GITHUB_RUN_ID"],"run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"])}},open("out/member-collection-request.json","w"),sort_keys=True,separators=(",",":"))'
          PYTHONPATH=.github/release python -m ucm_release artifact collect-members --input out/member-collection-request.json --output out/member-collection.json >/dev/null
          python -c 'import json,os; p=json.load(open("out/member-collection.json")); records=[json.load(open(x)) for x in p["member_records"]]; json.dump({"lane":"protected-tag","members":records,"member_statuses":{task_id:"success" for task_id in p["member_record_sha256s"]},"resolved_plan":"input/plan/resolved-plan.json","resolved_plan_sha256":os.environ["RESOLVED_PLAN_SHA256"]},open("out/plan-request.json","w"),sort_keys=True,separators=(",",":"))'
          PYTHONPATH=.github/release python -m ucm_release registry plan-index --input out/plan-request.json --output out/parent/parent-plans.json >/dev/null
          python -c 'import json; p=json.load(open("out/parent/parent-plans.json")); json.dump(p["inventory"],open("out/parent/inventory.json","w"),sort_keys=True,separators=(",",":"))'
          cp out/member-collection.json out/parent/member-collection.json
          logical="ucm-index-parent-${SOURCE_SHA}"
          physical="$(PYTHONPATH=.github/release python -c 'import sys; from ucm_release.verify import run_bound_artifact_name; print(run_bound_artifact_name(*sys.argv[1:3], int(sys.argv[3])))' "${logical}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}")"
          echo "parent_artifact=${physical}" >>"${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.plan-indexes.outputs.parent_artifact }}
          path: out/parent/
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  publish-indexes:
    needs: [aggregate-members]
    if: >-
      ${{
        !cancelled() && needs.aggregate-members.result == 'success' &&
        github.event_name == 'push' &&
        github.repository == 'SuperMarioYL/unified-cache-management' &&
        github.ref_type == 'tag' && github.ref_protected == true
      }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.family_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    environment: release-production
    env:
      CRANE_VERSION: v0.20.3
      CRANE_LINUX_AMD64_SHA256: 36c67a932f489b3f2724b64af90b599a8ef2aa7b004872597373c0ad694dc059
      CRANE_LINUX_ARM64_SHA256: d2235f7779cd39c6e40f43701d2512c997409f629fb53e621ede0d57d3f995e2
      BUILDX_VERSION: v0.19.2
      BUILDX_LINUX_AMD64_SHA256: a5ff61c0b6d2c8ee20964a9d6dac7a7a6383c4a4a0ee8d354e983917578306ea
      BUILDX_LINUX_ARM64_SHA256: bd54f0e28c29789da1679bad2dd94c1923786ccd2cd80dd3a0a1d560a6baf10c
      FAMILY_TASK_ID: ${{ matrix.family_task_id }}
      CONTROL_TASK_ID: ${{ matrix.control_task_id }}
      CONTROL_ARCH: ${{ matrix.control_arch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.resolved_plan_artifact }}
          path: input/plan
      - name: Select the exact plan-bound family control task
        env:
          RESOLVED_PLAN_SHA256: ${{ inputs.resolved_plan_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p out
          PYTHONPATH=.github/release python -m ucm_release catalog select \
            --plan input/plan/resolved-plan.json \
            --task-kind family \
            --task-id "${FAMILY_TASK_ID}" \
            --expected-plan-sha256 "${RESOLVED_PLAN_SHA256}" \
            --output out/selected-family.json >/dev/null
          test "$(python -c 'import json; print(json.load(open("out/selected-family.json"))["control_task_id"])')" = "${CONTROL_TASK_ID}"
          test "$(python -c 'import json; print(json.load(open("out/selected-family.json"))["control_arch"])')" = "${CONTROL_ARCH}"
          test "$(python -c 'import json; print(json.load(open("out/selected-family.json"))["control_runner"])')" = "${{ matrix.runner }}"
      - name: Reject missing policy before Registry authentication
        env:
          UCM_RELEASE_POLICY: ${{ vars.UCM_RELEASE_POLICY }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RESOLVED_PLAN_SHA256: ${{ inputs.resolved_plan_sha256 }}
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin "+${GITHUB_REF}:${GITHUB_REF}" +refs/heads/develop:refs/remotes/origin/develop
          test "$(git rev-parse HEAD:.github/workflows)" = "$(git rev-parse origin/develop:.github/workflows)"
          test "$(git rev-parse HEAD:.github/release)" = "$(git rev-parse origin/develop:.github/release)"
          PYTHONPATH=.github/release python -m ucm_release core tag-preflight --lane protected-tag \
            --resolved-plan input/plan/resolved-plan.json \
            --expected-plan-sha256 "${RESOLVED_PLAN_SHA256}" >index-preflight.json
      - name: Install checksum-pinned Registry tools
        run: |
          set -euo pipefail
          docker_config="${RUNNER_TEMP}/ucm-index-docker-config"
          buildx_binary="${RUNNER_TEMP}/docker-buildx"
          mkdir -p "${RUNNER_TEMP}/crane" "${docker_config}" "${HOME}/.docker/cli-plugins"
          case "${CONTROL_ARCH}" in
            amd64)
              crane_arch=x86_64
              crane_sha="${CRANE_LINUX_AMD64_SHA256}"
              buildx_arch=amd64
              buildx_sha="${BUILDX_LINUX_AMD64_SHA256}"
              case "$(uname -m)" in x86_64|amd64) ;; *) exit 2 ;; esac
              ;;
            arm64)
              crane_arch=arm64
              crane_sha="${CRANE_LINUX_ARM64_SHA256}"
              buildx_arch=arm64
              buildx_sha="${BUILDX_LINUX_ARM64_SHA256}"
              case "$(uname -m)" in aarch64|arm64) ;; *) exit 2 ;; esac
              ;;
            *) echo "unsupported plan control architecture: ${CONTROL_ARCH}" >&2; exit 2 ;;
          esac
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/crane.tar.gz" "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_${crane_arch}.tar.gz"
          echo "${crane_sha}  ${RUNNER_TEMP}/crane.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/crane.tar.gz" -C "${RUNNER_TEMP}/crane" crane
          curl -fsSL --retry 3 -o "${buildx_binary}" "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-${buildx_arch}"
          echo "${buildx_sha}  ${buildx_binary}" | sha256sum --check
          install -m 0755 "${buildx_binary}" "${HOME}/.docker/cli-plugins/docker-buildx"
          test "$("${RUNNER_TEMP}/crane/crane" version)" = "${CRANE_VERSION#v}"
          test "$("${HOME}/.docker/cli-plugins/docker-buildx" version | awk '{print $2}')" = "${BUILDX_VERSION}"
          echo "${RUNNER_TEMP}/crane" >>"${GITHUB_PATH}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.aggregate-members.outputs.parent_artifact }}
          path: input/parent
      - name: Reopen exact current-attempt parent before authentication
        env:
          PARENT_ARTIFACT: ${{ needs.aggregate-members.outputs.parent_artifact }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RESOLVED_PLAN_SHA256: ${{ inputs.resolved_plan_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p out
          python -c 'import json,os; json.dump({"parent_plans":"input/parent/parent-plans.json","parent_artifact":os.environ["PARENT_ARTIFACT"],"source_sha":os.environ["SOURCE_SHA"],"resolved_plan":"input/plan/resolved-plan.json","resolved_plan_sha256":os.environ["RESOLVED_PLAN_SHA256"],"run":{"run_id":os.environ["GITHUB_RUN_ID"],"run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"])}},open("out/parent-validation-request.json","w"),sort_keys=True,separators=(",",":"))'
          PYTHONPATH=.github/release python -m ucm_release artifact validate-index-parent --input out/parent-validation-request.json --output out/parent-validation.json >/dev/null
      - name: Authenticate GHCR publisher
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/ucm-index-docker-config
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${DOCKER_CONFIG}"
          printf '%s' "${GITHUB_TOKEN}" | crane auth login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - id: publish
        name: Fresh preflight then prepare one authenticated index
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/ucm-index-docker-config
          UCM_RELEASE_POLICY: ${{ vars.UCM_RELEASE_POLICY }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RESOLVED_PLAN_SHA256: ${{ inputs.resolved_plan_sha256 }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin "+${GITHUB_REF}:${GITHUB_REF}" +refs/heads/develop:refs/remotes/origin/develop
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD:.github/workflows)" = "$(git rev-parse origin/develop:.github/workflows)"
          test "$(git rev-parse HEAD:.github/release)" = "$(git rev-parse origin/develop:.github/release)"
          mkdir -p out/provisional
          PYTHONPATH=.github/release python -m ucm_release core tag-preflight --lane protected-tag \
            --resolved-plan input/plan/resolved-plan.json \
            --expected-plan-sha256 "${RESOLVED_PLAN_SHA256}" >out/provisional/preflight.json
          PYTHONPATH=.github/release python -c 'import json,os; from pathlib import Path; from ucm_release import core; json.dump({"lane":"protected-tag","parent_plans":core.load_json(Path("input/parent/parent-plans.json")),"family_task_id":os.environ["FAMILY_TASK_ID"],"resolved_plan":"input/plan/resolved-plan.json","resolved_plan_sha256":os.environ["RESOLVED_PLAN_SHA256"]},open("out/request.json","w"),sort_keys=True,separators=(",",":"))'
          PYTHONPATH=.github/release python -m ucm_release registry prepare-index --input out/request.json --output out/provisional/provisional.json >/dev/null
          logical="ucm-index-provisional-${FAMILY_TASK_ID}"
          physical="$(PYTHONPATH=.github/release python -c 'import sys; from ucm_release.verify import run_bound_artifact_name; print(run_bound_artifact_name(*sys.argv[1:3], int(sys.argv[3])))' "${logical}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}")"
          echo "artifact=${physical}" >>"${GITHUB_OUTPUT}"
      - name: Remove Registry credentials before evidence upload
        if: ${{ always() }}
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/ucm-index-docker-config
        run: |
          set -euo pipefail
          crane auth logout ghcr.io || true
          rm -rf "${DOCKER_CONFIG}"
          rm -f "${HOME}/.docker/cli-plugins/docker-buildx"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.publish.outputs.artifact }}
          path: out/provisional/
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  index-barrier:
    needs: [aggregate-members, publish-indexes]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every planner-selected authenticated index preparation
        env:
          MEMBERS_RESULT: ${{ needs.aggregate-members.result }}
          INDEXES_RESULT: ${{ needs.publish-indexes.result }}
        run: |
          set -euo pipefail
          for result in "${MEMBERS_RESULT}" "${INDEXES_RESULT}"; do
            case "${result}" in
              success) ;;
              skipped|failure|cancelled) echo "protected index result=${result}" >&2; exit 2 ;;
              *) echo "unknown protected index result=${result}" >&2; exit 2 ;;
            esac
          done

  authenticated-readback:
    needs: [aggregate-members, publish-indexes, index-barrier]
    if: >-
      ${{
        !cancelled() && needs.aggregate-members.result == 'success' &&
        needs.publish-indexes.result == 'success' &&
        needs.index-barrier.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      authenticated_artifact: ${{ steps.aggregate.outputs.artifact }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.aggregate-members.outputs.parent_artifact }}
          path: input/parent
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ucm-index-provisional-*-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: input/provisionals
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.resolved_plan_artifact }}
          path: input/plan
      - id: aggregate
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RESOLVED_PLAN_SHA256: ${{ inputs.resolved_plan_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p out/evidence/member-records out/evidence/provisionals
          cp input/parent/parent-plans.json out/evidence/parent-plans.json
          cp input/parent/member-collection.json out/evidence/member-collection.json
          cp input/parent/member-records/*.json out/evidence/member-records/
          python -c 'import json,os; json.dump({"root":"input/provisionals","output_dir":"out/evidence/provisionals","source_sha":os.environ["SOURCE_SHA"],"parent_plans":"out/evidence/parent-plans.json","resolved_plan":"input/plan/resolved-plan.json","resolved_plan_sha256":os.environ["RESOLVED_PLAN_SHA256"],"run":{"run_id":os.environ["GITHUB_RUN_ID"],"run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"])}},open("out/provisional-collection-request.json","w"),sort_keys=True,separators=(",",":"))'
          PYTHONPATH=.github/release python -m ucm_release artifact collect-provisionals --input out/provisional-collection-request.json --output out/provisional-collection.json >/dev/null
          cp out/provisional-collection.json out/evidence/provisional-collection.json
          python -c 'import glob,json,os; p=json.load(open("out/provisional-collection.json")); json.dump({"member_records":sorted(glob.glob("out/evidence/member-records/*.json")),"member_collection":"out/evidence/member-collection.json","provisional_indexes":p["provisional_indexes"],"provisional_collection":"out/evidence/provisional-collection.json","parent_plans":"out/evidence/parent-plans.json","source_sha":os.environ["SOURCE_SHA"],"resolved_plan":"input/plan/resolved-plan.json","resolved_plan_sha256":os.environ["RESOLVED_PLAN_SHA256"],"run":{"run_id":os.environ["GITHUB_RUN_ID"],"run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"])}},open("out/request.json","w"),sort_keys=True,separators=(",",":"))'
          PYTHONPATH=.github/release python -m ucm_release registry aggregate-authenticated --input out/request.json --output out/evidence/authenticated-publication.json >/dev/null
          logical="ucm-registry-authenticated-${SOURCE_SHA}"
          physical="$(PYTHONPATH=.github/release python -c 'import sys; from ucm_release.verify import run_bound_artifact_name; print(run_bound_artifact_name(*sys.argv[1:3], int(sys.argv[3])))' "${logical}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}")"
          echo "artifact=${physical}" >>"${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.aggregate.outputs.artifact }}
          path: out/evidence/
          if-no-files-found: error
          overwrite: false
          retention-days: 90
