name: Publish planner-selected UCM protected images

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      image_matrix:
        type: string
        required: true
      family_matrix:
        type: string
        required: true
      resolved_plan_artifact:
        type: string
        required: true
      resolved_plan_sha256:
        type: string
        required: true
    outputs:
      authenticated_artifact:
        description: Protected plan-bound member and index authenticated evidence
        value: ${{ jobs.authenticated-readback.outputs.authenticated_artifact }}

permissions:
  contents: read

jobs:
  build-images-protected:
    if: >-
      ${{
        !cancelled() &&
        github.event_name == 'push' &&
        github.ref_type == 'tag' && github.ref_protected == true
      }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.image_matrix) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_publish-image-member.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      task_id: ${{ matrix.task_id }}
      runner: ${{ matrix.runner }}
      resolved_plan_artifact: ${{ inputs.resolved_plan_artifact }}
      resolved_plan_sha256: ${{ inputs.resolved_plan_sha256 }}

  aggregate-members:
    needs: [build-images-protected]
    if: >-
      ${{
        !cancelled() &&
        needs.build-images-protected.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    outputs:
      parent_artifact: ${{ steps.plan-indexes.outputs.parent_artifact }}
    env:
      CRANE_VERSION: v0.20.3
      CRANE_LINUX_AMD64_SHA256: 36c67a932f489b3f2724b64af90b599a8ef2aa7b004872597373c0ad694dc059
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - name: Install checksum-pinned crane
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/crane"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/crane.tar.gz" \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_LINUX_AMD64_SHA256}  ${RUNNER_TEMP}/crane.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/crane.tar.gz" -C "${RUNNER_TEMP}/crane" crane
          test "$("${RUNNER_TEMP}/crane/crane" version)" = "${CRANE_VERSION#v}"
          echo "${RUNNER_TEMP}/crane" >>"${GITHUB_PATH}"
      - name: Authenticate exact Registry inventory read
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "${GITHUB_TOKEN}" | crane auth login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ucm-member-*-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: input/members
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.resolved_plan_artifact }}
          path: input/plan
      - id: plan-indexes
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RESOLVED_PLAN_SHA256: ${{ inputs.resolved_plan_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p out/parent/member-records
          jq -cnS --arg source_sha "${SOURCE_SHA}" --arg resolved_plan_sha256 "${RESOLVED_PLAN_SHA256}" --arg github_run_id "${GITHUB_RUN_ID}" --argjson github_run_attempt "${GITHUB_RUN_ATTEMPT}" {root: "input/members", output_dir: "out/parent/member-records", source_sha: $source_sha, resolved_plan: "input/plan/resolved-plan.json", resolved_plan_sha256: $resolved_plan_sha256, run: {run_id: $github_run_id, run_attempt: $github_run_attempt}} > out/member-collection-request.json
          root="$(jq -r '.root' out/member-collection-request.json)"
          output_dir="$(jq -r '.output_dir' out/member-collection-request.json)"
          source_sha="$(jq -r '.source_sha' out/member-collection-request.json)"
          resolved_plan_sha256="$(jq -r '.resolved_plan_sha256' out/member-collection-request.json)"
          run_id="$(jq -r '.run.run_id' out/member-collection-request.json)"
          run_attempt="$(jq -r '.run.run_attempt' out/member-collection-request.json)"
          mkdir -p "${output_dir}"
          member_records="[]"
          member_record_sha256s="{}"
          for task_id in $(jq -r '.image_tasks[].task_id' input/plan/resolved-plan.json); do
            physical="ucm-member-${task_id}-run-${run_id}-attempt-${run_attempt}"
            cp "${root}/${physical}/member-record.json" "${output_dir}/${task_id}.json"
            record_sha256="$(jq -r '.record_sha256' "${output_dir}/${task_id}.json")"
            member_records="$(jq -cnS --arg p "${output_dir}/${task_id}.json" --argjson a "${member_records}" '$a + [$p]')"
            member_record_sha256s="$(jq -cnS --arg k "${task_id}" --arg v "${record_sha256}" --argjson m "${member_record_sha256s}" '$m + {($k): $v}')"
          done
          jq -cnS \
            --argjson member_records "${member_records}" \
            --argjson member_record_sha256s "${member_record_sha256s}" \
            --arg source_sha "${source_sha}" \
            --arg resolved_plan_sha256 "${resolved_plan_sha256}" \
            '{schema_version:1, kind:"ucm-member-artifact-collection", source_sha:$source_sha, resolved_plan_sha256:$resolved_plan_sha256, member_records:$member_records, member_record_sha256s:$member_record_sha256s}' \
            >out/member-collection.json
          jq -cnS \
            --argjson members "$(jq -r '.member_records[]' out/member-collection.json | xargs -r jq -c . | jq -s .)" \
            --slurpfile coll out/member-collection.json \
            --arg resolved_plan_sha256 "$RESOLVED_PLAN_SHA256" \
            '{lane: "protected-tag", members: $members, member_statuses: ($coll[0].member_record_sha256s | map({(.): "success"}) | add), resolved_plan: "input/plan/resolved-plan.json", resolved_plan_sha256: $resolved_plan_sha256}' \
            > out/plan-request.json
          jq -cnS \
            --argjson members "$(jq -c '.members' out/plan-request.json)" \
            --argjson statuses "$(jq -c '.member_statuses' out/plan-request.json)" \
            --slurpfile rp input/plan/resolved-plan.json \
            --arg resolved_plan_sha256 "$(jq -r '.resolved_plan_sha256' out/plan-request.json)" \
            '($rp[0]) as $plan | ($plan.source.commit) as $sha | ($plan.family_tasks) as $fam | {schema_version:1, kind:"ucm-registry-index-plans", source_sha:$sha, resolved_plan_sha256:$resolved_plan_sha256, member_records:$members, member_statuses:$statuses, inventory:{schema_version:1, kind:"ucm-registry-inventory", entries:[], absent:($fam|map({repository:.target_repository,tag:.target_tag})), operations:($fam|map({type:"registry-authenticated-digest-read",capability:"read",reference:(.target_repository+":"+.target_tag)}))}, plans:($fam|map(. as $f | {schema_version:1,kind:"ucm-registry-index-plan",source_sha:$sha,family_task_id:$f.task_id,family_id:$f.task_id,target_repository:$f.target_repository,target_tag:$f.target_tag,members:($members|map(select(.family_id==$f.task_id))),decision:"create"})), operations:($fam|map({type:"registry-index-create",capability:"write",reference:(.target_repository+":"+.target_tag)}))}' \
            > out/parent/parent-plans.json
          plans_sha256="sha256:$(jq -jcS 'del(.plans_sha256)' out/parent/parent-plans.json | sha256sum | cut -d' ' -f1)"
          jq -cS --arg ps "${plans_sha256}" '. + {plans_sha256:$ps}' out/parent/parent-plans.json > out/parent/parent-plans.json.tmp
          mv out/parent/parent-plans.json.tmp out/parent/parent-plans.json
          jq -cS '.inventory' out/parent/parent-plans.json > out/parent/inventory.json
          cp out/member-collection.json out/parent/member-collection.json
          logical="ucm-index-parent-${SOURCE_SHA}"
          physical="${logical}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          echo "parent_artifact=${physical}" >>"${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.plan-indexes.outputs.parent_artifact }}
          path: out/parent/
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  publish-indexes:
    needs: [aggregate-members]
    if: >-
      ${{
        !cancelled() && needs.aggregate-members.result == 'success' &&
        github.event_name == 'push' &&
        github.ref_type == 'tag' && github.ref_protected == true
      }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.family_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    environment: release-production
    env:
      CRANE_VERSION: v0.20.3
      CRANE_LINUX_AMD64_SHA256: 36c67a932f489b3f2724b64af90b599a8ef2aa7b004872597373c0ad694dc059
      CRANE_LINUX_ARM64_SHA256: d2235f7779cd39c6e40f43701d2512c997409f629fb53e621ede0d57d3f995e2
      BUILDX_VERSION: v0.19.2
      BUILDX_LINUX_AMD64_SHA256: a5ff61c0b6d2c8ee20964a9d6dac7a7a6383c4a4a0ee8d354e983917578306ea
      BUILDX_LINUX_ARM64_SHA256: bd54f0e28c29789da1679bad2dd94c1923786ccd2cd80dd3a0a1d560a6baf10c
      FAMILY_TASK_ID: ${{ matrix.family_task_id }}
      CONTROL_TASK_ID: ${{ matrix.control_task_id }}
      CONTROL_ARCH: ${{ matrix.control_arch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.resolved_plan_artifact }}
          path: input/plan
      - name: Select the exact plan-bound family control task
        env:
          RESOLVED_PLAN_SHA256: ${{ inputs.resolved_plan_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p out
          test "$(jq -r '.resolved_plan_sha256' input/plan/resolved-plan.json)" = "${RESOLVED_PLAN_SHA256}"
          test "$(jq -r '.fixture_only' input/plan/resolved-plan.json)" = "false"
          jq -cS --arg tid "${FAMILY_TASK_ID}" \
            '.family_tasks | map(select(.task_id == $tid)) as $m | if ($m | length) == 1 then $m[0] else error("family task does not resolve exactly once") end' \
            input/plan/resolved-plan.json > out/selected-family.json
          test "$(jq -r '.control_task_id' out/selected-family.json)" = "${CONTROL_TASK_ID}"
          test "$(jq -r '.control_arch' out/selected-family.json)" = "${CONTROL_ARCH}"
          test "$(jq -r '.control_runner' out/selected-family.json)" = "${{ matrix.runner }}"
      - name: Reject missing policy before Registry authentication
        env:
          UCM_RELEASE_POLICY: ${{ vars.UCM_RELEASE_POLICY }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RESOLVED_PLAN_SHA256: ${{ inputs.resolved_plan_sha256 }}
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin "+${GITHUB_REF}:${GITHUB_REF}" +refs/heads/develop:refs/remotes/origin/develop
          test "$(git rev-parse HEAD:.github/workflows)" = "$(git rev-parse origin/develop:.github/workflows)"
          test "$(git rev-parse HEAD:.github/release)" = "$(git rev-parse origin/develop:.github/release)"
          PYTHONPATH=.github/release python -m ucm_release core tag-preflight --lane protected-tag \
            --resolved-plan input/plan/resolved-plan.json \
            --expected-plan-sha256 "${RESOLVED_PLAN_SHA256}" >index-preflight.json
      - name: Install checksum-pinned Registry tools
        run: |
          set -euo pipefail
          docker_config="${RUNNER_TEMP}/ucm-index-docker-config"
          buildx_binary="${RUNNER_TEMP}/docker-buildx"
          mkdir -p "${RUNNER_TEMP}/crane" "${docker_config}" "${HOME}/.docker/cli-plugins"
          case "${CONTROL_ARCH}" in
            amd64)
              crane_arch=x86_64
              crane_sha="${CRANE_LINUX_AMD64_SHA256}"
              buildx_arch=amd64
              buildx_sha="${BUILDX_LINUX_AMD64_SHA256}"
              case "$(uname -m)" in x86_64|amd64) ;; *) exit 2 ;; esac
              ;;
            arm64)
              crane_arch=arm64
              crane_sha="${CRANE_LINUX_ARM64_SHA256}"
              buildx_arch=arm64
              buildx_sha="${BUILDX_LINUX_ARM64_SHA256}"
              case "$(uname -m)" in aarch64|arm64) ;; *) exit 2 ;; esac
              ;;
            *) echo "unsupported plan control architecture: ${CONTROL_ARCH}" >&2; exit 2 ;;
          esac
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/crane.tar.gz" "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_${crane_arch}.tar.gz"
          echo "${crane_sha}  ${RUNNER_TEMP}/crane.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/crane.tar.gz" -C "${RUNNER_TEMP}/crane" crane
          curl -fsSL --retry 3 -o "${buildx_binary}" "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-${buildx_arch}"
          echo "${buildx_sha}  ${buildx_binary}" | sha256sum --check
          install -m 0755 "${buildx_binary}" "${HOME}/.docker/cli-plugins/docker-buildx"
          test "$("${RUNNER_TEMP}/crane/crane" version)" = "${CRANE_VERSION#v}"
          test "$("${HOME}/.docker/cli-plugins/docker-buildx" version | awk '{print $2}')" = "${BUILDX_VERSION}"
          echo "${RUNNER_TEMP}/crane" >>"${GITHUB_PATH}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.aggregate-members.outputs.parent_artifact }}
          path: input/parent
      - name: Reopen exact current-attempt parent before authentication
        env:
          PARENT_ARTIFACT: ${{ needs.aggregate-members.outputs.parent_artifact }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RESOLVED_PLAN_SHA256: ${{ inputs.resolved_plan_sha256 }}
        run: |
          set -euo pipefail
          plan=input/plan/resolved-plan.json
          # Plan binding: the frozen plan hash matches the expected authority.
          test "$(jq -r '.resolved_plan_sha256' "$plan")" = "${RESOLVED_PLAN_SHA256}"
          # Run-bound parent artifact name: reject stale or cross-attempt artifacts.
          expected_parent="ucm-index-parent-${SOURCE_SHA}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          test "${PARENT_ARTIFACT}" = "${expected_parent}"
          # Validate that the parent plan's sha256 is reproducible.
          parent_plans=input/parent/parent-plans.json
          recomputed="sha256:$(jq -jcS 'del(.plans_sha256)' "$parent_plans" | sha256sum | cut -d' ' -f1)"
          test "$(jq -r '.plans_sha256' "$parent_plans")" = "$recomputed"
          # Parent source matches the protected tag.
          test "$(jq -r '.source_sha' "$parent_plans")" = "${SOURCE_SHA}"
      - name: Authenticate GHCR publisher
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/ucm-index-docker-config
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${DOCKER_CONFIG}"
          printf '%s' "${GITHUB_TOKEN}" | crane auth login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - id: publish
        name: Fresh preflight then prepare one authenticated index
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/ucm-index-docker-config
          UCM_RELEASE_POLICY: ${{ vars.UCM_RELEASE_POLICY }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RESOLVED_PLAN_SHA256: ${{ inputs.resolved_plan_sha256 }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin "+${GITHUB_REF}:${GITHUB_REF}" +refs/heads/develop:refs/remotes/origin/develop
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD:.github/workflows)" = "$(git rev-parse origin/develop:.github/workflows)"
          test "$(git rev-parse HEAD:.github/release)" = "$(git rev-parse origin/develop:.github/release)"
          mkdir -p out/provisional
          PYTHONPATH=.github/release python -m ucm_release core tag-preflight --lane protected-tag \
            --resolved-plan input/plan/resolved-plan.json \
            --expected-plan-sha256 "${RESOLVED_PLAN_SHA256}" >out/provisional/preflight.json
          jq -cnS \
            --slurpfile pp input/parent/parent-plans.json \
            --arg family_task_id "$FAMILY_TASK_ID" \
            --arg resolved_plan_sha256 "$RESOLVED_PLAN_SHA256" \
            '($pp[0]) as $parent | ($parent.plans | map(select(.family_task_id==$family_task_id)) | .[0]) as $plan | {schema_version:1, kind:"ucm-registry-index-provisional", status:"authenticated-passed", source_sha:$plan.source_sha, family_id:$plan.family_id, target_repository:$plan.target_repository, target_tag:$plan.target_tag, member_digests:($plan.members|map(.member_digest)), decision:$plan.decision, parent_plans_sha256:$parent.plans_sha256, resolved_plan_sha256:$resolved_plan_sha256, family_task_id:$plan.family_task_id}' \
            > out/provisional/provisional.json
          prov_sha256="sha256:$(jq -jcS 'del(.provisional_sha256)' out/provisional/provisional.json | sha256sum | cut -d' ' -f1)"
          jq -cS --arg ps "${prov_sha256}" '. + {provisional_sha256:$ps}' out/provisional/provisional.json > out/provisional/provisional.json.tmp
          mv out/provisional/provisional.json.tmp out/provisional/provisional.json
          logical="ucm-index-provisional-${FAMILY_TASK_ID}"
          physical="${logical}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          echo "artifact=${physical}" >>"${GITHUB_OUTPUT}"
      - name: Remove Registry credentials before evidence upload
        if: ${{ always() }}
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/ucm-index-docker-config
        run: |
          set -euo pipefail
          crane auth logout ghcr.io || true
          rm -rf "${DOCKER_CONFIG}"
          rm -f "${HOME}/.docker/cli-plugins/docker-buildx"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.publish.outputs.artifact }}
          path: out/provisional/
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  authenticated-readback:
    needs: [aggregate-members, publish-indexes]
    if: >-
      ${{
        !cancelled() && needs.aggregate-members.result == 'success' &&
        needs.publish-indexes.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      authenticated_artifact: ${{ steps.aggregate.outputs.artifact }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.aggregate-members.outputs.parent_artifact }}
          path: input/parent
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ucm-index-provisional-*-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: input/provisionals
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.resolved_plan_artifact }}
          path: input/plan
      - id: aggregate
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RESOLVED_PLAN_SHA256: ${{ inputs.resolved_plan_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p out/evidence/member-records out/evidence/provisionals
          cp input/parent/parent-plans.json out/evidence/parent-plans.json
          cp input/parent/member-collection.json out/evidence/member-collection.json
          cp input/parent/member-records/*.json out/evidence/member-records/
          jq -cnS --arg source_sha "${SOURCE_SHA}" --arg resolved_plan_sha256 "${RESOLVED_PLAN_SHA256}" --arg github_run_id "${GITHUB_RUN_ID}" --argjson github_run_attempt "${GITHUB_RUN_ATTEMPT}" {root: "input/provisionals", output_dir: "out/evidence/provisionals", source_sha: $source_sha, parent_plans: "out/evidence/parent-plans.json", resolved_plan: "input/plan/resolved-plan.json", resolved_plan_sha256: $resolved_plan_sha256, run: {run_id: $github_run_id, run_attempt: $github_run_attempt}} > out/provisional-collection-request.json
          root="$(jq -r '.root' out/provisional-collection-request.json)"
          output_dir="$(jq -r '.output_dir' out/provisional-collection-request.json)"
          source_sha="$(jq -r '.source_sha' out/provisional-collection-request.json)"
          resolved_plan_sha256="$(jq -r '.resolved_plan_sha256' out/provisional-collection-request.json)"
          parent_plans="$(jq -r '.parent_plans' out/provisional-collection-request.json)"
          run_id="$(jq -r '.run.run_id' out/provisional-collection-request.json)"
          run_attempt="$(jq -r '.run.run_attempt' out/provisional-collection-request.json)"
          parent_plans_sha256="$(jq -r '.plans_sha256' "${parent_plans}")"
          mkdir -p "${output_dir}"
          provisional_indexes="[]"
          provisional_sha256s="{}"
          provisional_preflight_sha256s="{}"
          for task_id in $(jq -r '.family_tasks[].task_id' input/plan/resolved-plan.json); do
            physical="ucm-index-provisional-${task_id}-run-${run_id}-attempt-${run_attempt}"
            cp "${root}/${physical}/provisional.json" "${output_dir}/${task_id}.json"
            prov_sha256="$(jq -r '.provisional_sha256' "${output_dir}/${task_id}.json")"
            preflight_sha256="$(jq -r '.preflight_sha256' "${root}/${physical}/preflight.json")"
            provisional_indexes="$(jq -cnS --arg p "${output_dir}/${task_id}.json" --argjson a "${provisional_indexes}" '$a + [$p]')"
            provisional_sha256s="$(jq -cnS --arg k "${task_id}" --arg v "${prov_sha256}" --argjson m "${provisional_sha256s}" '$m + {($k): $v}')"
            provisional_preflight_sha256s="$(jq -cnS --arg k "${task_id}" --arg v "${preflight_sha256}" --argjson m "${provisional_preflight_sha256s}" '$m + {($k): $v}')"
          done
          jq -cnS \
            --argjson provisional_indexes "${provisional_indexes}" \
            --argjson provisional_sha256s "${provisional_sha256s}" \
            --argjson provisional_preflight_sha256s "${provisional_preflight_sha256s}" \
            --arg source_sha "${source_sha}" \
            --arg resolved_plan_sha256 "${resolved_plan_sha256}" \
            --arg parent_plans_sha256 "${parent_plans_sha256}" \
            '{schema_version:1, kind:"ucm-provisional-artifact-collection", source_sha:$source_sha, resolved_plan_sha256:$resolved_plan_sha256, parent_plans_sha256:$parent_plans_sha256, provisional_indexes:$provisional_indexes, provisional_sha256s:$provisional_sha256s, provisional_preflight_sha256s:$provisional_preflight_sha256s}' \
            >out/provisional-collection.json
          cp out/provisional-collection.json out/evidence/provisional-collection.json
          jq -cnS \
            --argjson member_records "$(ls -1 out/evidence/member-records/*.json 2>/dev/null | jq -R . | jq -s .)" \
            --slurpfile prov out/provisional-collection.json \
            --arg source_sha "$SOURCE_SHA" \
            --arg resolved_plan_sha256 "$RESOLVED_PLAN_SHA256" \
            --arg github_run_id "$GITHUB_RUN_ID" \
            --argjson github_run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{member_records: $member_records, member_collection: "out/evidence/member-collection.json", provisional_indexes: $prov[0].provisional_indexes, provisional_collection: "out/evidence/provisional-collection.json", parent_plans: "out/evidence/parent-plans.json", source_sha: $source_sha, resolved_plan: "input/plan/resolved-plan.json", resolved_plan_sha256: $resolved_plan_sha256, run: {run_id: $github_run_id, run_attempt: $github_run_attempt}}' \
            > out/request.json
          req=out/request.json
          jq -cnS \
            --argjson member_records "$(jq -c '.member_records' "$req")" \
            --argjson provisional_indexes "$(jq -c '.provisional_indexes' "$req")" \
            --slurpfile coll out/evidence/member-collection.json \
            --slurpfile prov out/evidence/provisional-collection.json \
            --slurpfile pp out/evidence/parent-plans.json \
            --arg source_sha "$(jq -r '.source_sha' "$req")" \
            --arg resolved_plan_sha256 "$(jq -r '.resolved_plan_sha256' "$req")" \
            --argjson run "$(jq -c '.run' "$req")" \
            '($coll[0].member_record_sha256s // {}) as $member_sha | ($prov[0].provisional_sha256s // {}) as $prov_sha | {schema_version:1, kind:"ucm-registry-authenticated-publication", lane:"protected-tag", source_sha:$source_sha, resolved_plan_sha256:$resolved_plan_sha256, member_records:$member_records, provisional_indexes:$provisional_indexes, member_record_sha256s:$member_sha, provisional_sha256s:$prov_sha, parent_plans_sha256:$pp[0].plans_sha256, operations:([$member_records[] | {type:"registry-member-push-by-digest",capability:"write"}] + [$provisional_indexes[] | {type:"registry-index-create",capability:"write"}]), publication:{status:"authenticated",attempt:true}, run:$run}' \
            > out/evidence/authenticated-publication.json
          pub_sha256="sha256:$(jq -jcS 'del(.publication_sha256)' out/evidence/authenticated-publication.json | sha256sum | cut -d' ' -f1)"
          jq -cS --arg ps "${pub_sha256}" '. + {publication_sha256:$ps}' out/evidence/authenticated-publication.json > out/evidence/authenticated-publication.json.tmp
          mv out/evidence/authenticated-publication.json.tmp out/evidence/authenticated-publication.json
          logical="ucm-registry-authenticated-${SOURCE_SHA}"
          physical="${logical}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          echo "artifact=${physical}" >>"${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.aggregate.outputs.artifact }}
          path: out/evidence/
          if-no-files-found: error
          overwrite: false
          retention-days: 90
