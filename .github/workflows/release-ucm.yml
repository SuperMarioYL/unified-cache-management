name: Build planner-selected UCM candidates and publish protected tags

on:
  push:
    branches: ["feature/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      deliver_full_oci:
        description: Upload complete feature OCI archives for this attempt
        type: boolean
        required: false
        default: false
      publish_channels:
        description: "Comma-separated subset; empty = use repo variable defaults. Options: pypi,ghcr,dockerhub,chart_oci,github_release"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Compute the publish plan only; do not publish"
        type: boolean
        required: false
        default: true
  workflow_call:
    inputs:
      deliver_full_oci:
        type: boolean
        required: false
        default: false

concurrency:
  group: ucm-tag-${{ github.repository_id }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      route: ${{ steps.plan.outputs.route }}
      feature: ${{ steps.plan.outputs.feature }}
      protected: ${{ steps.plan.outputs.protected }}
      deliver_full_oci: ${{ steps.plan.outputs.deliver_full_oci }}
      resolved_plan_artifact: ${{ steps.plan.outputs.resolved_plan_artifact }}
      resolved_plan_sha256: ${{ steps.plan.outputs.resolved_plan_sha256 }}
      wheel_matrix: ${{ steps.plan.outputs.wheel_matrix }}
      image_matrix: ${{ steps.plan.outputs.image_matrix }}
      family_matrix: ${{ steps.plan.outputs.family_matrix }}
      smoke_wheel_matrix: ${{ steps.plan.outputs.smoke_wheel_matrix }}
      smoke_image_matrix: ${{ steps.plan.outputs.smoke_image_matrix }}
      build_wheel_matrix: ${{ steps.plan.outputs.build_wheel_matrix }}
      build_image_matrix: ${{ steps.plan.outputs.build_image_matrix }}
      publish: ${{ steps.publish-plan.outputs.publish }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - name: Install checksum-pinned read-only crane
        env:
          CRANE_VERSION: v0.20.3
          CRANE_LINUX_AMD64_SHA256: 36c67a932f489b3f2724b64af90b599a8ef2aa7b004872597373c0ad694dc059
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/crane"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/crane.tar.gz" \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_LINUX_AMD64_SHA256}  ${RUNNER_TEMP}/crane.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/crane.tar.gz" -C "${RUNNER_TEMP}/crane" crane
          test "$("${RUNNER_TEMP}/crane/crane" version)" = "${CRANE_VERSION#v}"
          echo "${RUNNER_TEMP}/crane" >>"${GITHUB_PATH}"
      - id: plan
        name: Route invocation and resolve one frozen catalog plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_PROTECTED: ${{ github.ref_protected }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          MANUAL_DELIVERY: ${{ inputs.deliver_full_oci }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          feature=false
          protected=false
          route=
          lane=feature-candidate
          delivery=false
          if [[ "${EVENT_NAME}" == pull_request ]]; then
            route=pr
            PYTHONPATH=.github/release python -m ucm_release core tag-preflight \
              --lane feature-candidate --catalog-planner >feature-preflight.json
          elif [[ "${REF}" == refs/heads/feature/* && \
                ( "${EVENT_NAME}" == push || "${EVENT_NAME}" == workflow_dispatch ) ]]; then
            route=feature
            feature=true
            if [[ "${EVENT_NAME}" == push && "${HEAD_COMMIT_MESSAGE}" == *"[ucm-deliver-full-oci]"* ]] || \
               [[ "${EVENT_NAME}" == workflow_dispatch && "${MANUAL_DELIVERY}" == true ]]; then
              delivery=true
            fi
            PYTHONPATH=.github/release python -m ucm_release core tag-preflight --lane feature-candidate --catalog-planner >feature-preflight.json
          elif [[ "${EVENT_NAME}" == push && "${REF_TYPE}" == tag && \
                  "${REF_PROTECTED}" == true ]]; then
            route=protected
            protected=true
            lane=protected-tag
            git fetch --no-tags --force origin "+${REF}:${REF}" \
              +refs/heads/develop:refs/remotes/origin/develop
            PYTHONPATH=.github/release python -m ucm_release core tag-preflight \
              --lane protected-tag --catalog-planner >protected-preflight.json
          else
            echo "release invocation is outside feature/protected authority" >&2
            exit 2
          fi
          mkdir -p out/plan
          PYTHONPATH=.github/release python -m ucm_release catalog resolve \
            --lane "${lane}" --source-sha "${GITHUB_SHA}" \
            --output out/plan/resolved-plan.json >/dev/null
          resolved_plan_sha256="$(jq -r '.resolved_plan_sha256' out/plan/resolved-plan.json)"
          logical_artifact="$(jq -r '.expected_artifacts.resolved_plan' out/plan/resolved-plan.json)"
          resolved_plan_artifact="${logical_artifact}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          wheel_matrix="$(jq -c '.github_wheel_matrix' out/plan/resolved-plan.json)"
          image_matrix="$(jq -c '.github_image_matrix' out/plan/resolved-plan.json)"
          family_matrix="$(jq -c '.github_family_matrix' out/plan/resolved-plan.json)"
          smoke_wheel_matrix="$(jq -c '.pr_smoke.github_wheel_matrix' out/plan/resolved-plan.json)"
          smoke_image_matrix="$(jq -c '.pr_smoke.github_image_matrix' out/plan/resolved-plan.json)"
          build_wheel_matrix="${wheel_matrix}"
          build_image_matrix="${image_matrix}"
          if [[ "${route}" == pr ]]; then
            build_wheel_matrix="${smoke_wheel_matrix}"
            build_image_matrix="${smoke_image_matrix}"
          fi
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "route=${route}"
            echo "feature=${feature}"
            echo "protected=${protected}"
            echo "deliver_full_oci=${delivery}"
            echo "resolved_plan_artifact=${resolved_plan_artifact}"
            echo "resolved_plan_sha256=${resolved_plan_sha256}"
            echo "wheel_matrix=${wheel_matrix}"
            echo "image_matrix=${image_matrix}"
            echo "family_matrix=${family_matrix}"
            echo "smoke_wheel_matrix=${smoke_wheel_matrix}"
            echo "smoke_image_matrix=${smoke_image_matrix}"
            echo "build_wheel_matrix=${build_wheel_matrix}"
            echo "build_image_matrix=${build_image_matrix}"
          } >>"${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.plan.outputs.resolved_plan_artifact }}
          path: out/plan/resolved-plan.json
          if-no-files-found: error
          overwrite: false
          retention-days: ${{ steps.plan.outputs.protected == 'true' && 90 || 7 }}
      - id: publish-plan
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          ALLOW: >-
            {"pypi":"${{ vars.UCM_PUBLISH_PYPI }}",
             "ghcr":"${{ vars.UCM_PUBLISH_GHCR }}",
             "dockerhub":"${{ vars.UCM_PUBLISH_DOCKERHUB }}",
             "chart_oci":"${{ vars.UCM_PUBLISH_CHART_OCI }}",
             "github_release":"${{ vars.UCM_PUBLISH_GITHUB_RELEASE }}"}
        run: |
          set -euo pipefail
          if [[ "${{ steps.plan.outputs.protected }}" == "true" ]]; then
            lane=protected-tag
          else
            lane=feature-candidate
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            dry_run_val="${{ inputs.dry_run }}"
          else
            dry_run_val=false
          fi
          PYTHONPATH=.github/release python -m ucm_release publish plan \
            --lane "${lane}" \
            --repository "${GITHUB_REPOSITORY}" \
            --allow "${ALLOW}" \
            --request "${{ inputs.publish_channels }}" \
            --dry-run "${dry_run_val}" \
            --output out/plan/publish-plan.json
          echo "publish=$(cat out/plan/publish-plan.json)" >>"${GITHUB_OUTPUT}"

  build-wheels:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build_wheel_matrix) }}
    permissions:
      contents: read
    uses: ./.github/workflows/_build-wheel.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      task_id: ${{ matrix.task_id }}
      runner: ${{ matrix.runner }}
      resolved_plan_artifact: ${{ needs.plan.outputs.resolved_plan_artifact }}
      resolved_plan_sha256: ${{ needs.plan.outputs.resolved_plan_sha256 }}

  package-chart:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      chart_artifact: ${{ steps.record.outputs.chart_artifact }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - name: Install checksum-pinned Helm
        env:
          HELM_VERSION: v3.15.3
          HELM_SHA256: ad871aecb0c9fd96aa6702f6b79e87556c8998c2e714a4959bf71ee31282ac9c
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/helm.tgz" "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  ${RUNNER_TEMP}/helm.tgz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/helm.tgz" -C "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/linux-amd64/helm" "${RUNNER_TEMP}/helm"
          test "$("${RUNNER_TEMP}/helm" version --short)" = "v3.15.3+g3bb50bb"
          echo "${RUNNER_TEMP}" >>"${GITHUB_PATH}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.plan.outputs.resolved_plan_artifact }}
          path: input/plan
      - id: record
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          RESOLVED_PLAN_SHA256: ${{ needs.plan.outputs.resolved_plan_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p out/chart out/artifact
          plan=input/plan/resolved-plan.json
          # Plan binding assertion: the frozen plan hash must match the expected authority.
          test "$(jq -r '.resolved_plan_sha256' "$plan")" = "${RESOLVED_PLAN_SHA256}"
          chart_source="$(jq -r '.chart.source' "$plan")"
          chart_version="$(jq -r '.chart.version' "$plan")"
          chart_app_version="$(jq -r '.chart.app_version' "$plan")"
          # Provenance assertion: the chart source tree is frozen with a recorded digest.
          test -f "${chart_source}/SOURCE_PROVENANCE.json"
          release_tree="$(jq -r '.release_tree_sha256' "${chart_source}/SOURCE_PROVENANCE.json")"
          test -n "$release_tree"
          # helm lint
          helm lint "${chart_source}"
          # helm template (validation cases): bind each case to its family runtime image
          case_count="$(jq '.chart.validation_cases | length' "$plan")"
          i=0
          while [ "$i" -lt "$case_count" ]; do
            case_name="$(jq -r ".chart.validation_cases[${i}].name" "$plan")"
            values="$(jq -r ".chart.validation_cases[${i}].values" "$plan")"
            product_id="$(jq -r ".chart.validation_cases[${i}].product_id" "$plan")"
            variant="$(jq -r ".chart.validation_cases[${i}].variant" "$plan")"
            expected_resource="$(jq -r ".chart.validation_cases[${i}].expected_resource" "$plan")"
            repo="$(jq -r --arg pid "$product_id" --arg v "$variant" \
              '.family_tasks[] | select(.product_id == $pid and .runtime.variant == $v) | .runtime.repository' "$plan")"
            digest="$(jq -r --arg pid "$product_id" --arg v "$variant" \
              '.family_tasks[] | select(.product_id == $pid and .runtime.variant == $v) | .runtime.index_digest' "$plan")"
            test -n "$repo"
            test -n "$digest"
            image="${repo}@${digest}"
            helm template "ucm-${case_name}" "${chart_source}" \
              --values "${values}" \
              --set-string "images.engine.repository=${repo}" \
              --set-string "images.engine.digest=${digest}" \
              >"out/chart/${case_name}.yaml"
            grep -q 'kind: ModelServing' "out/chart/${case_name}.yaml"
            grep -Fq "$image" "out/chart/${case_name}.yaml"
            grep -Fq "$expected_resource" "out/chart/${case_name}.yaml"
            i=$((i + 1))
          done
          # helm package
          helm package "${chart_source}" --version "${chart_version}" \
            --app-version "${chart_app_version}" --destination out/chart
          package="$(find out/chart -maxdepth 1 -type f -name '*.tgz' -print)"
          test -n "$package"
          chart_sha="sha256:$(sha256sum "$package" | cut -d' ' -f1)"
          filename="$(basename "$package")"
          jq -nc --arg f "$filename" --arg s "$chart_sha" --arg r "$release_tree" \
            '{filename:$f,sha256:$s,release_tree_sha256:$r,status:"candidate-verified"}' \
            >out/artifact/chart-result.json
          cp "$package" out/artifact/
          logical="ucm-chart-${SOURCE_SHA}"
          physical="${logical}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          echo "chart_artifact=${physical}" >>"${GITHUB_OUTPUT}"
      - if: ${{ needs.plan.outputs.feature == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.record.outputs.chart_artifact }}
          path: out/artifact/
          if-no-files-found: error
          overwrite: false
          retention-days: 7
      - if: ${{ needs.plan.outputs.protected == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.record.outputs.chart_artifact }}
          path: out/artifact/
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  reconcile-images-feature:
    needs: [plan, build-wheels, package-chart]
    if: >-
      ${{
        !cancelled() && needs.plan.outputs.route != 'protected' &&
        needs.build-wheels.result == 'success' &&
        needs.package-chart.result == 'success'
      }}
    permissions:
      contents: read
    uses: ./.github/workflows/release-vllm-images.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      wheel_matrix: ${{ needs.plan.outputs.build_wheel_matrix }}
      image_matrix: ${{ needs.plan.outputs.build_image_matrix }}
      resolved_plan_artifact: ${{ needs.plan.outputs.resolved_plan_artifact }}
      resolved_plan_sha256: ${{ needs.plan.outputs.resolved_plan_sha256 }}
      deliver_full_oci: ${{ needs.plan.outputs.deliver_full_oci == 'true' }}

  reconcile-images-protected:
    needs: [plan, build-wheels, package-chart]
    if: >-
      ${{
        !cancelled() && needs.plan.outputs.protected == 'true' &&
        github.event_name == 'push' &&
        github.ref_type == 'tag' && github.ref_protected == true &&
        needs.build-wheels.result == 'success' &&
        needs.package-chart.result == 'success'
      }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-vllm-images-protected.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      image_matrix: ${{ needs.plan.outputs.image_matrix }}
      family_matrix: ${{ needs.plan.outputs.family_matrix }}
      resolved_plan_artifact: ${{ needs.plan.outputs.resolved_plan_artifact }}
      resolved_plan_sha256: ${{ needs.plan.outputs.resolved_plan_sha256 }}

  aggregate-evidence:
    needs: [plan, build-wheels, package-chart, reconcile-images-feature]
    if: >-
      ${{
        !cancelled() && needs.plan.outputs.feature == 'true' &&
        needs.build-wheels.result == 'success' &&
        needs.package-chart.result == 'success' &&
        needs.reconcile-images-feature.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - name: Install Helm
        env:
          HELM_VERSION: v3.15.3
          HELM_LINUX_AMD64_SHA256: ad871aecb0c9fd96aa6702f6b79e87556c8998c2e714a4959bf71ee31282ac9c
          HELM_LINUX_ARM64_SHA256: bd57697305ba46fef3299b50168a34faa777dd2cf5b43b50df92cca7ed118cce
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) helm_arch=amd64; helm_sha="${HELM_LINUX_AMD64_SHA256}" ;;
            aarch64|arm64) helm_arch=arm64; helm_sha="${HELM_LINUX_ARM64_SHA256}" ;;
            *) exit 2 ;;
          esac
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/helm.tgz" "https://get.helm.sh/helm-${HELM_VERSION}-linux-${helm_arch}.tar.gz"
          echo "${helm_sha}  ${RUNNER_TEMP}/helm.tgz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/helm.tgz" -C "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/linux-${helm_arch}/helm" "${RUNNER_TEMP}/helm"
          test "$("${RUNNER_TEMP}/helm" version --short)" = "v3.15.3+g3bb50bb"
          echo "${RUNNER_TEMP}" >>"${GITHUB_PATH}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ucm-wheel-*-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: input/wheels
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ucm-image-*-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: input/images
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.package-chart.outputs.chart_artifact }}
          path: input/chart
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.plan.outputs.resolved_plan_artifact }}
          path: input/plan
      - name: Aggregate exact current-attempt feature release evidence
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          RESOLVED_PLAN_SHA256: ${{ needs.plan.outputs.resolved_plan_sha256 }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          chart_package="$(find input/chart -maxdepth 1 -type f -name '*.tgz' -print)"
          test -n "${chart_package}"
          test "$(jq -r '.resolved_plan_sha256' input/plan/resolved-plan.json)" = "${RESOLVED_PLAN_SHA256}"
          wheels="$(for d in input/wheels/*/; do
            whl="$(find "$d" -maxdepth 1 -type f -name '*.whl' | head -n1)"
            sha="sha256:$(sha256sum "$whl" | cut -d' ' -f1)"
            jq -nc --arg sha "$sha" --slurpfile i "$d/wheel-inspection.json" --slurpfile t "$d/hosted-task.json" \
              '{spec_id:$i[0].spec_id,task_id:$t[0].task_id,filename:$i[0].filename,wheel_sha256:$sha,wheel_size:$i[0].size,inspection_sha256:$i[0].sha256}'
          done | jq -c -s '.')"
          images="$(for d in input/images/*/; do
            jq -nc --slurpfile r "$d/image-result.json" \
              '{spec_id:$r[0].spec_id,task_id:$r[0].task_id,manifest_digest:$r[0].oci.digest,build_key_sha256:$r[0].build_key_sha256,content_identity_sha256:$r[0].content_identity_sha256,image_result_sha256:$r[0].result_sha256,recipe_sha256:$r[0].recipe_sha256}'
          done | jq -c -s '.')"
          chart_sha="sha256:$(sha256sum "$chart_package" | cut -d' ' -f1)"
          chart="$(jq -nc --arg sha "$chart_sha" --slurpfile c input/chart/chart-result.json \
            '{filename:$c[0].filename,sha256:$c[0].sha256,package_sha256:$sha,release_tree_sha256:$c[0].release_tree_sha256,status:$c[0].status}')"
          jq -nc --arg s "$SOURCE_SHA" --arg p "$RESOLVED_PLAN_SHA256" --argjson w "$wheels" --argjson m "$images" --argjson c "$chart" \
            '{source_sha:$s,resolved_plan_sha256:$p,wheels:$w,images:$m,chart:$c,publication:{status:"blocked",attempted:false}}' \
            > release-loop-evidence.json
          jq -nc --argjson w "$wheels" --argjson m "$images" \
            '{wheel_count:($w|length),image_count:($m|length)}' > aggregate-real-result.json
          test "$(jq -r '[.wheels[].task_id]|unique|join(",")' release-loop-evidence.json)" = "$(jq -r '[.wheel_tasks[].task_id]|unique|join(",")' input/plan/resolved-plan.json)"
          test "$(jq -r '[.images[].task_id]|unique|join(",")' release-loop-evidence.json)" = "$(jq -r '[.image_tasks[].task_id]|unique|join(",")' input/plan/resolved-plan.json)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-loop-evidence-${{ needs.plan.outputs.source_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            release-loop-evidence.json
            aggregate-real-result.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7

  prepare-release-draft:
    needs: [plan, build-wheels, package-chart, reconcile-images-protected]
    if: >-
      ${{
        !cancelled() && needs.plan.outputs.protected == 'true' &&
        github.event_name == 'push' &&
        github.ref_type == 'tag' && github.ref_protected == true &&
        needs.build-wheels.result == 'success' &&
        needs.package-chart.result == 'success' &&
        needs.reconcile-images-protected.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    environment: release-production
    outputs:
      draft_artifact: ${{ steps.draft.outputs.artifact }}
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.plan.outputs.resolved_plan_artifact }}
          path: input/plan
      - id: draft
        name: Fresh preflight and create empty draft or reopen exact state
        env:
          GH_TOKEN: ${{ github.token }}
          UCM_RELEASE_POLICY: ${{ vars.UCM_RELEASE_POLICY }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          RESOLVED_PLAN_SHA256: ${{ needs.plan.outputs.resolved_plan_sha256 }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          test "$(jq -r '.resolved_plan_sha256' input/plan/resolved-plan.json)" = "$RESOLVED_PLAN_SHA256"
          release_repository="$(jq -r '.source.repository' input/plan/resolved-plan.json)"
          test "${release_repository}" = "${GITHUB_REPOSITORY}"
          mkdir -p out/draft
          git fetch --no-tags --force origin "+${GITHUB_REF}:${GITHUB_REF}"
          PYTHONPATH=.github/release python -m ucm_release core tag-preflight --lane protected-tag \
            --resolved-plan input/plan/resolved-plan.json \
            --expected-plan-sha256 "${RESOLVED_PLAN_SHA256}" >out/draft/preflight.json
          git fetch --no-tags --force origin "+${GITHUB_REF}:${GITHUB_REF}" +refs/heads/develop:refs/remotes/origin/develop
          git diff --quiet HEAD:.github/workflows origin/develop:.github/workflows
          git diff --quiet HEAD:.github/release origin/develop:.github/release
          PYTHONPATH=.github/release python -m ucm_release publish github-release \
            --plan input/plan/resolved-plan.json \
            --plan-sha256 "${RESOLVED_PLAN_SHA256}" \
            --repository "${GITHUB_REPOSITORY}" \
            --stage draft \
            --source-sha "${SOURCE_SHA}" \
            --output-dir out/draft
          release_id="$(jq -r '.release_id' out/draft/release-state.json)"
          logical="ucm-release-draft-${SOURCE_SHA}"
          physical="${logical}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          echo "artifact=${physical}" >>"${GITHUB_OUTPUT}"
          echo "release_id=${release_id}" >>"${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.draft.outputs.artifact }}
          path: out/draft/
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  anonymous-registry-readback:
    needs: [plan, reconcile-images-protected, prepare-release-draft]
    if: >-
      ${{
        !cancelled() && needs.reconcile-images-protected.result == 'success' &&
        needs.prepare-release-draft.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      protected_artifact: ${{ steps.finalize.outputs.artifact }}
    env:
      CRANE_VERSION: v0.20.3
      CRANE_LINUX_AMD64_SHA256: 36c67a932f489b3f2724b64af90b599a8ef2aa7b004872597373c0ad694dc059
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - name: Install checksum-pinned anonymous crane
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/crane"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/crane.tar.gz" "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_LINUX_AMD64_SHA256}  ${RUNNER_TEMP}/crane.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/crane.tar.gz" -C "${RUNNER_TEMP}/crane" crane
          test "$("${RUNNER_TEMP}/crane/crane" version)" = "${CRANE_VERSION#v}"
          echo "${RUNNER_TEMP}/crane" >>"${GITHUB_PATH}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ucm-registry-authenticated-${{ needs.plan.outputs.source_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: input/authenticated
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.plan.outputs.resolved_plan_artifact }}
          path: input/plan
      - id: finalize
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          RESOLVED_PLAN_SHA256: ${{ needs.plan.outputs.resolved_plan_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p out/protected/finalized
          while IFS= read -r family; do
            jq -cnS --arg family "${family}" --arg resolved_plan_sha256 "${RESOLVED_PLAN_SHA256}" '{parent_plans: "input/authenticated/parent-plans.json", provisional: ("input/authenticated/provisionals/" + $family + ".json"), family_task_id: $family, resolved_plan: "input/plan/resolved-plan.json", resolved_plan_sha256: $resolved_plan_sha256}' > out/finalize-request.json
            PYTHONPATH=.github/release python -m ucm_release registry finalize-index --input out/finalize-request.json --output "out/protected/finalized/${family}.json" >/dev/null
          done < <(jq -r '.family_tasks[].task_id' input/plan/resolved-plan.json)
          cp input/authenticated/parent-plans.json out/protected/parent-plans.json
          cp input/authenticated/member-collection.json out/protected/member-collection.json
          cp input/authenticated/provisional-collection.json out/protected/provisional-collection.json
          cp input/plan/resolved-plan.json out/protected/resolved-plan.json
          cp -R input/authenticated/member-records out/protected/member-records
          jq -cnS \
            --argjson member_records "$(ls -1 out/protected/member-records/*.json 2>/dev/null | jq -R . | jq -s .)" \
            --argjson finalized_indexes "$(ls -1 out/protected/finalized/*.json 2>/dev/null | jq -R . | jq -s .)" \
            --arg source_sha "$SOURCE_SHA" \
            --arg resolved_plan_sha256 "$RESOLVED_PLAN_SHA256" \
            --arg github_run_id "$GITHUB_RUN_ID" \
            --argjson github_run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{member_records: $member_records, member_collection: "out/protected/member-collection.json", finalized_indexes: $finalized_indexes, provisional_collection: "out/protected/provisional-collection.json", parent_plans: "out/protected/parent-plans.json", source_sha: $source_sha, resolved_plan: "input/plan/resolved-plan.json", resolved_plan_sha256: $resolved_plan_sha256, run: {run_id: $github_run_id, run_attempt: $github_run_attempt}}' \
            > out/protected-request.json
          PYTHONPATH=.github/release python -m ucm_release registry aggregate-protected --input out/protected-request.json --output out/protected/protected-publication.json >/dev/null
          logical="ucm-registry-protected-${SOURCE_SHA}"
          physical="${logical}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          echo "artifact=${physical}" >>"${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.finalize.outputs.artifact }}
          path: out/protected/
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  publish-release:
    needs: [plan, build-wheels, package-chart, prepare-release-draft, anonymous-registry-readback]
    if: >-
      ${{
        !cancelled() &&
        github.event_name == 'push' &&
        github.ref_type == 'tag' && github.ref_protected == true &&
        needs.build-wheels.result == 'success' &&
        needs.package-chart.result == 'success' &&
        needs.prepare-release-draft.result == 'success' &&
        needs.anonymous-registry-readback.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    environment: release-production
    outputs:
      release_state_artifact: ${{ steps.publish.outputs.artifact }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ucm-wheel-*-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: input/wheels
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.package-chart.outputs.chart_artifact }}
          path: input/chart
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.plan.outputs.resolved_plan_artifact }}
          path: input/plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ucm-release-draft-${{ needs.plan.outputs.source_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: input/draft
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ucm-registry-protected-${{ needs.plan.outputs.source_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: input/protected
      - id: publish
        name: Rehash the exact planner asset set and publish or reuse prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          UCM_RELEASE_POLICY: ${{ vars.UCM_RELEASE_POLICY }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          RESOLVED_PLAN_SHA256: ${{ needs.plan.outputs.resolved_plan_sha256 }}
          RELEASE_ID: ${{ needs.prepare-release-draft.outputs.release_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          test "$(jq -r '.resolved_plan_sha256' input/plan/resolved-plan.json)" = "$RESOLVED_PLAN_SHA256"
          release_repository="$(jq -r '.source.repository' input/plan/resolved-plan.json)"
          test "${release_repository}" = "${GITHUB_REPOSITORY}"
          mkdir -p out out/artifacts
          git fetch --no-tags --force origin "+${GITHUB_REF}:${GITHUB_REF}"
          PYTHONPATH=.github/release python -m ucm_release core tag-preflight --lane protected-tag \
            --resolved-plan input/plan/resolved-plan.json \
            --expected-plan-sha256 "${RESOLVED_PLAN_SHA256}" >out/preflight.json
          cp input/draft/release-state.json out/release-state.json
          find input/wheels -type f -name '*.whl' -exec cp -p {} out/artifacts/ \;
          chart_package="$(find input/chart -maxdepth 1 -type f -name '*.tgz' -print)"
          test -n "${chart_package}"
          cp "${chart_package}" out/artifacts/
          git fetch --no-tags --force origin "+${GITHUB_REF}:${GITHUB_REF}" +refs/heads/develop:refs/remotes/origin/develop
          git diff --quiet HEAD:.github/workflows origin/develop:.github/workflows
          git diff --quiet HEAD:.github/release origin/develop:.github/release
          PYTHONPATH=.github/release python -m ucm_release publish github-release \
            --plan input/plan/resolved-plan.json \
            --plan-sha256 "${RESOLVED_PLAN_SHA256}" \
            --repository "${GITHUB_REPOSITORY}" \
            --stage finalize \
            --source-sha "${SOURCE_SHA}" \
            --output-dir out
          logical="ucm-release-authenticated-${SOURCE_SHA}"
          physical="${logical}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          echo "artifact=${physical}" >>"${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.publish.outputs.artifact }}
          path: out/
          if-no-files-found: error
          overwrite: false
          retention-days: 90
