name: Build candidates and publish protected UCM v0.5.0rc1

on:
  push:
    branches: ["feature/**"]
    tags: ["v0.5.0rc1"]
  workflow_dispatch:
    inputs:
      deliver_full_oci:
        description: Upload complete feature OCI archives for this attempt
        type: boolean
        required: false
        default: false

concurrency:
  group: ucm-tag-${{ github.repository_id }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      feature: ${{ steps.plan.outputs.feature }}
      protected: ${{ steps.plan.outputs.protected }}
      deliver_full_oci: ${{ steps.plan.outputs.deliver_full_oci }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - id: plan
        name: Route only the feature lane or exact protected tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          MANUAL_DELIVERY: ${{ inputs.deliver_full_oci }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          feature=false
          protected=false
          delivery=false
          if [[ "${REPOSITORY}" == SuperMarioYL/unified-cache-management && \
                "${REF}" == refs/heads/feature/* && \
                ( "${EVENT_NAME}" == push || "${EVENT_NAME}" == workflow_dispatch ) ]]; then
            feature=true
            if [[ "${EVENT_NAME}" == push && "${HEAD_COMMIT_MESSAGE}" == *"[ucm-deliver-full-oci]"* ]] || \
               [[ "${EVENT_NAME}" == workflow_dispatch && "${MANUAL_DELIVERY}" == true ]]; then
              delivery=true
            fi
            PYTHONPATH=.github/release python -m ucm_release core tag-preflight --lane feature-candidate >feature-preflight.json
          elif [[ "${EVENT_NAME}" == push && \
                  "${REPOSITORY}" == SuperMarioYL/unified-cache-management && \
                  "${REF}" == refs/tags/v0.5.0rc1 && \
                  "${REF_PROTECTED}" == true ]]; then
            protected=true
          else
            echo "release invocation is outside feature/protected authority" >&2
            exit 2
          fi
          source_date_epoch="$(git show -s --format=%ct "${GITHUB_SHA}")"
          PYTHONPATH=.github/release python -m ucm_release core hosted-matrix \
            --source-sha "${GITHUB_SHA}" --source-date-epoch "${source_date_epoch}" \
            --output hosted-matrix.json >/dev/null
          {
            echo "matrix=$(python -c 'import json; print(json.dumps(json.load(open("hosted-matrix.json"))["github_matrix"],separators=(",",":")))')"
            echo "source_sha=${GITHUB_SHA}"
            echo "feature=${feature}"
            echo "protected=${protected}"
            echo "deliver_full_oci=${delivery}"
          } >>"${GITHUB_OUTPUT}"

  build-wheels-feature:
    needs: plan
    if: ${{ needs.plan.outputs.feature == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
    uses: ./.github/workflows/_build-wheel.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      spec_id: ${{ matrix.spec_id }}

  build-wheels-protected:
    needs: plan
    if: ${{ needs.plan.outputs.protected == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
    uses: ./.github/workflows/_build-wheel.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      spec_id: ${{ matrix.spec_id }}

  package-chart:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      chart_artifact: ${{ steps.record.outputs.chart_artifact }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - name: Install checksum-pinned Helm
        env:
          HELM_VERSION: v3.15.3
          HELM_SHA256: ad871aecb0c9fd96aa6702f6b79e87556c8998c2e714a4959bf71ee31282ac9c
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/helm.tgz" "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  ${RUNNER_TEMP}/helm.tgz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/helm.tgz" -C "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/linux-amd64/helm" "${RUNNER_TEMP}/helm"
          test "$("${RUNNER_TEMP}/helm" version --short)" = "v3.15.3+g3bb50bb"
          echo "${RUNNER_TEMP}" >>"${GITHUB_PATH}"
      - id: record
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p out/chart out/artifact
          PYTHONPATH=.github/release python -m ucm_release chart package --output-dir out/chart >out/artifact/chart-result.json
          cp out/chart/*.tgz out/artifact/
          logical="ucm-chart-${SOURCE_SHA}"
          physical="$(PYTHONPATH=.github/release python -c 'import sys; from ucm_release.verify import run_bound_artifact_name; print(run_bound_artifact_name(*sys.argv[1:3], int(sys.argv[3])))' "${logical}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}")"
          echo "chart_artifact=${physical}" >>"${GITHUB_OUTPUT}"
      - if: ${{ needs.plan.outputs.feature == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.record.outputs.chart_artifact }}
          path: out/artifact/
          if-no-files-found: error
          overwrite: false
          retention-days: 3
      - if: ${{ needs.plan.outputs.protected == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.record.outputs.chart_artifact }}
          path: out/artifact/
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  reconcile-images-feature:
    needs: [plan, build-wheels-feature, package-chart]
    if: >-
      ${{
        !cancelled() && needs.plan.outputs.feature == 'true' &&
        needs.build-wheels-feature.result == 'success' &&
        needs.package-chart.result == 'success'
      }}
    permissions:
      contents: read
    uses: ./.github/workflows/release-vllm-images.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      deliver_full_oci: ${{ needs.plan.outputs.deliver_full_oci == 'true' }}

  reconcile-images-protected:
    needs: [plan, build-wheels-protected, package-chart]
    if: >-
      ${{
        !cancelled() && needs.plan.outputs.protected == 'true' &&
        github.event_name == 'push' &&
        github.repository == 'SuperMarioYL/unified-cache-management' &&
        github.ref == 'refs/tags/v0.5.0rc1' && github.ref_protected == true &&
        needs.build-wheels-protected.result == 'success' &&
        needs.package-chart.result == 'success'
      }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-vllm-images.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      deliver_full_oci: false

  feature-barrier:
    needs: [plan, build-wheels-feature, package-chart, reconcile-images-feature]
    if: ${{ always() && needs.plan.outputs.feature == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - env:
          WHEELS: ${{ needs.build-wheels-feature.result }}
          CHART: ${{ needs.package-chart.result }}
          IMAGES: ${{ needs.reconcile-images-feature.result }}
        run: |
          set -euo pipefail
          test "${WHEELS}" = success
          test "${CHART}" = success
          test "${IMAGES}" = success

  aggregate-evidence:
    needs: [plan, build-wheels-feature, package-chart, reconcile-images-feature, feature-barrier]
    if: >-
      ${{
        !cancelled() && needs.plan.outputs.feature == 'true' &&
        needs.build-wheels-feature.result == 'success' &&
        needs.package-chart.result == 'success' &&
        needs.reconcile-images-feature.result == 'success' &&
        needs.feature-barrier.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - name: Install Helm
        env:
          HELM_VERSION: v3.15.3
          HELM_LINUX_AMD64_SHA256: ad871aecb0c9fd96aa6702f6b79e87556c8998c2e714a4959bf71ee31282ac9c
          HELM_LINUX_ARM64_SHA256: bd57697305ba46fef3299b50168a34faa777dd2cf5b43b50df92cca7ed118cce
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) helm_arch=amd64; helm_sha="${HELM_LINUX_AMD64_SHA256}" ;;
            aarch64|arm64) helm_arch=arm64; helm_sha="${HELM_LINUX_ARM64_SHA256}" ;;
            *) exit 2 ;;
          esac
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/helm.tgz" "https://get.helm.sh/helm-${HELM_VERSION}-linux-${helm_arch}.tar.gz"
          echo "${helm_sha}  ${RUNNER_TEMP}/helm.tgz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/helm.tgz" -C "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/linux-${helm_arch}/helm" "${RUNNER_TEMP}/helm"
          test "$("${RUNNER_TEMP}/helm" version --short)" = "v3.15.3+g3bb50bb"
          echo "${RUNNER_TEMP}" >>"${GITHUB_PATH}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ucm-wheel-*-${{ needs.plan.outputs.source_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: input/wheels
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ucm-image-*-${{ needs.plan.outputs.source_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: input/images
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.package-chart.outputs.chart_artifact }}
          path: input/chart
      - name: Aggregate exact current-attempt feature release evidence
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          set -euo pipefail
          chart_package="$(find input/chart -maxdepth 1 -type f -name '*.tgz' -print)"
          test -n "${chart_package}"
          PYTHONPATH=.github/release python -m ucm_release loop aggregate-real \
            --wheel-dir input/wheels --image-dir input/images \
            --chart-result input/chart/chart-result.json --chart-package "${chart_package}" \
            --repository "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF}" \
            --source-sha "${SOURCE_SHA}" --run-id "${GITHUB_RUN_ID}" \
            --attempt "${GITHUB_RUN_ATTEMPT}" --output release-loop-evidence.json \
            >aggregate-real-result.json
          test "$(python -c 'import json; print(len(json.load(open("release-loop-evidence.json"))["payload"]["wheels"]))')" = 6
          test "$(python -c 'import json; print(len(json.load(open("release-loop-evidence.json"))["payload"]["images"]))')" = 6
          test "$(python -c 'import json; print(len(json.load(open("release-loop-evidence.json"))["payload"]["families"]))')" = 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-loop-evidence-${{ needs.plan.outputs.source_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            release-loop-evidence.json
            aggregate-real-result.json
          if-no-files-found: error
          overwrite: false
          retention-days: 3

  prepare-release-draft:
    needs: [plan, build-wheels-protected, package-chart, reconcile-images-protected]
    if: >-
      ${{
        !cancelled() && needs.plan.outputs.protected == 'true' &&
        github.event_name == 'push' &&
        github.repository == 'SuperMarioYL/unified-cache-management' &&
        github.ref == 'refs/tags/v0.5.0rc1' && github.ref_protected == true &&
        needs.build-wheels-protected.result == 'success' &&
        needs.package-chart.result == 'success' &&
        needs.reconcile-images-protected.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    environment: release-production
    outputs:
      draft_artifact: ${{ steps.draft.outputs.artifact }}
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - id: draft
        name: Fresh preflight and create empty draft or reopen exact state
        env:
          GH_TOKEN: ${{ github.token }}
          UCM_RELEASE_POLICY: ${{ vars.UCM_RELEASE_POLICY }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          mkdir -p out/draft
          git fetch --no-tags --force origin +refs/tags/v0.5.0rc1:refs/tags/v0.5.0rc1
          PYTHONPATH=.github/release python -m ucm_release core tag-preflight --lane protected-tag >out/draft/preflight.json
          gh api --paginate --slurp \
            -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            'repos/SuperMarioYL/unified-cache-management/releases?per_page=100' >out/pages.json
          python -c 'import json,os; json.dump({"pages":"out/pages.json","source_sha":os.environ["SOURCE_SHA"]},open("out/select-pages-request.json","w"),sort_keys=True,separators=(",",":"))'
          PYTHONPATH=.github/release python -m ucm_release release select-pages --input out/select-pages-request.json --output out/selection.json >/dev/null
          python -c 'import json; p=json.load(open("out/selection.json")); json.dump(p["remote"],open("out/draft/observed-release.json","w"),sort_keys=True,separators=(",",":")); json.dump(p["plan_request"],open("out/plan-state-request.json","w"),sort_keys=True,separators=(",",":")); json.dump(p["create_request"],open("out/create-request.json","w"),sort_keys=True,separators=(",",":")); json.dump(p["operations"],open("out/draft/operations.json","w"),sort_keys=True,separators=(",",":"))'
          PYTHONPATH=.github/release python -m ucm_release release plan-state --input out/plan-state-request.json --output out/initial-plan.json >/dev/null
          cp out/initial-plan.json out/draft/initial-plan.json
          decision="$(python -c 'import json; print(json.load(open("out/initial-plan.json"))["decision"])')"
          if [[ "${decision}" == create ]]; then
            git fetch --no-tags --force origin +refs/tags/v0.5.0rc1:refs/tags/v0.5.0rc1 +refs/heads/develop:refs/remotes/origin/develop
            git diff --quiet HEAD:.github/workflows origin/develop:.github/workflows
            git diff --quiet HEAD:.github/release origin/develop:.github/release
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/develop^{commit})"
            PYTHONPATH=.github/release python -m ucm_release core tag-preflight --lane protected-tag >/dev/null
            gh api --method POST \
              -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
              repos/SuperMarioYL/unified-cache-management/releases \
              --input out/create-request.json >out/draft/create-response.json
            release_id="$(python -c 'import json; print(json.load(open("out/draft/create-response.json"))["id"])')"
            gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/SuperMarioYL/unified-cache-management/releases/${release_id}" >out/draft/observed-release.json
            python -c 'import json,os; p=json.load(open("out/draft/observed-release.json")); q={"remote":p,"source_sha":os.environ["SOURCE_SHA"],"just_created":True}; json.dump(q,open("out/created-state-request.json","w"),sort_keys=True,separators=(",",":"))'
            PYTHONPATH=.github/release python -m ucm_release release plan-state --input out/created-state-request.json --output out/draft/state-plan.json >/dev/null
            python -c 'import json; p=json.load(open("out/draft/operations.json")); p.extend([{"type":"github-release-create","capability":"write","reference":"https://api.github.com/repos/SuperMarioYL/unified-cache-management/releases","authenticated":True},{"type":"github-release-read","capability":"read","reference":"https://api.github.com/repos/SuperMarioYL/unified-cache-management/releases/"+str(json.load(open("out/draft/observed-release.json"))["id"]),"authenticated":True}]); json.dump(p,open("out/draft/operations.json","w"),sort_keys=True,separators=(",",":"))'
            git fetch --no-tags --force origin +refs/tags/v0.5.0rc1:refs/tags/v0.5.0rc1
            PYTHONPATH=.github/release python -m ucm_release core tag-preflight --lane protected-tag >/dev/null
          else
            cp out/initial-plan.json out/draft/state-plan.json
          fi
          release_id="$(python -c 'import json; print(json.load(open("out/draft/state-plan.json"))["release_id"])')"
          logical="ucm-release-draft-${SOURCE_SHA}"
          physical="$(PYTHONPATH=.github/release python -c 'import sys; from ucm_release.verify import run_bound_artifact_name; print(run_bound_artifact_name(*sys.argv[1:3], int(sys.argv[3])))' "${logical}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}")"
          echo "artifact=${physical}" >>"${GITHUB_OUTPUT}"
          echo "release_id=${release_id}" >>"${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.draft.outputs.artifact }}
          path: out/draft/
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  anonymous-registry-readback:
    needs: [plan, reconcile-images-protected, prepare-release-draft]
    if: >-
      ${{
        !cancelled() && needs.reconcile-images-protected.result == 'success' &&
        needs.prepare-release-draft.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      protected_artifact: ${{ steps.finalize.outputs.artifact }}
    env:
      CRANE_VERSION: v0.20.3
      CRANE_LINUX_AMD64_SHA256: 36c67a932f489b3f2724b64af90b599a8ef2aa7b004872597373c0ad694dc059
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - name: Install checksum-pinned anonymous crane
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/crane"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/crane.tar.gz" "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_LINUX_AMD64_SHA256}  ${RUNNER_TEMP}/crane.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/crane.tar.gz" -C "${RUNNER_TEMP}/crane" crane
          test "$("${RUNNER_TEMP}/crane/crane" version)" = "${CRANE_VERSION#v}"
          echo "${RUNNER_TEMP}/crane" >>"${GITHUB_PATH}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ucm-registry-authenticated-${{ needs.plan.outputs.source_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: input/authenticated
      - id: finalize
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p out/protected/finalized
          for family in cann900-a3 cann900-a2 cuda130; do
            python -c 'import json,sys; json.dump({"parent_plans":"input/authenticated/parent-plans.json","provisional":"input/authenticated/provisionals/"+sys.argv[1]+".json"},open("out/finalize-request.json","w"),sort_keys=True,separators=(",",":"))' "${family}"
            PYTHONPATH=.github/release python -m ucm_release registry finalize-index --input out/finalize-request.json --output "out/protected/finalized/${family}.json" >/dev/null
          done
          cp input/authenticated/parent-plans.json out/protected/parent-plans.json
          cp input/authenticated/member-collection.json out/protected/member-collection.json
          cp input/authenticated/provisional-collection.json out/protected/provisional-collection.json
          cp -R input/authenticated/member-records out/protected/member-records
          python -c 'import glob,json,os; json.dump({"member_records":sorted(glob.glob("out/protected/member-records/*.json")),"member_collection":"out/protected/member-collection.json","finalized_indexes":sorted(glob.glob("out/protected/finalized/*.json")),"provisional_collection":"out/protected/provisional-collection.json","parent_plans":"out/protected/parent-plans.json","source_sha":os.environ["SOURCE_SHA"],"run":{"run_id":os.environ["GITHUB_RUN_ID"],"run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"])}},open("out/protected-request.json","w"),sort_keys=True,separators=(",",":"))'
          PYTHONPATH=.github/release python -m ucm_release registry aggregate-protected --input out/protected-request.json --output out/protected/protected-publication.json >/dev/null
          logical="ucm-registry-protected-${SOURCE_SHA}"
          physical="$(PYTHONPATH=.github/release python -c 'import sys; from ucm_release.verify import run_bound_artifact_name; print(run_bound_artifact_name(*sys.argv[1:3], int(sys.argv[3])))' "${logical}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}")"
          echo "artifact=${physical}" >>"${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.finalize.outputs.artifact }}
          path: out/protected/
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  publish-release:
    needs: [plan, build-wheels-protected, package-chart, prepare-release-draft, anonymous-registry-readback]
    if: >-
      ${{
        !cancelled() &&
        github.event_name == 'push' &&
        github.repository == 'SuperMarioYL/unified-cache-management' &&
        github.ref == 'refs/tags/v0.5.0rc1' && github.ref_protected == true &&
        needs.build-wheels-protected.result == 'success' &&
        needs.package-chart.result == 'success' &&
        needs.prepare-release-draft.result == 'success' &&
        needs.anonymous-registry-readback.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    environment: release-production
    outputs:
      release_state_artifact: ${{ steps.publish.outputs.artifact }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ucm-wheel-*-${{ needs.plan.outputs.source_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: input/wheels
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.package-chart.outputs.chart_artifact }}
          path: input/chart
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ucm-release-draft-${{ needs.plan.outputs.source_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: input/draft
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ucm-registry-protected-${{ needs.plan.outputs.source_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: input/protected
      - id: publish
        name: Rehash exact seven upload absences and publish or reuse prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          UCM_RELEASE_POLICY: ${{ vars.UCM_RELEASE_POLICY }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          RELEASE_ID: ${{ needs.prepare-release-draft.outputs.release_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          mkdir -p out/state/release-assets out/downloads
          git fetch --no-tags --force origin +refs/tags/v0.5.0rc1:refs/tags/v0.5.0rc1
          PYTHONPATH=.github/release python -m ucm_release core tag-preflight --lane protected-tag >out/state/preflight.json
          chart_package="$(find input/chart -maxdepth 1 -type f -name '*.tgz' -print)"
          test -n "${chart_package}"
          CHART_PACKAGE="${chart_package}" python -c 'import json,os; p={"wheel_dir":"input/wheels","chart_result":"input/chart/chart-result.json","chart_package":os.environ["CHART_PACKAGE"],"output_dir":"out/state/release-assets","source_sha":os.environ["SOURCE_SHA"],"run":{"run_id":os.environ["GITHUB_RUN_ID"],"run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"])}}; json.dump(p,open("out/assets-request.json","w"),sort_keys=True,separators=(",",":"))'
          PYTHONPATH=.github/release python -m ucm_release release assets-manifest --input out/assets-request.json --output out/state/assets-manifest.json >/dev/null
          gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/SuperMarioYL/unified-cache-management/releases/${RELEASE_ID}" >out/live-release.json
          python -c 'import json,os; p={"remote":json.load(open("out/live-release.json")),"source_sha":os.environ["SOURCE_SHA"],"just_created":False}; json.dump(p,open("out/live-state-request.json","w"),sort_keys=True,separators=(",",":"))'
          PYTHONPATH=.github/release python -m ucm_release release plan-state --input out/live-state-request.json --output out/live-state-plan.json >/dev/null
          test "$(python -c 'import json; print(json.load(open("out/live-state-plan.json"))["release_id"])')" = "${RELEASE_ID}"
          gh api --paginate --slurp -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "repos/SuperMarioYL/unified-cache-management/releases/${RELEASE_ID}/assets?per_page=100" >out/assets-pages.json
          python -c 'import json,os; json.dump({"manifest":"out/state/assets-manifest.json","raw_assets":"out/assets-pages.json","release_id":int(os.environ["RELEASE_ID"]),"allowed_root":"out/state/release-assets","require_complete":False},open("out/initial-download-request.json","w"),sort_keys=True,separators=(",",":"))'
          PYTHONPATH=.github/release python -m ucm_release release plan-downloads --input out/initial-download-request.json --output out/initial-download-plan.json >/dev/null
          while IFS=$'\t' read -r asset_id name; do
            gh api -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/SuperMarioYL/unified-cache-management/releases/assets/${asset_id}" >"out/downloads/${name}"
          done < <(python -c 'import json; [print("{}\t{}".format(x["asset_id"],x["name"])) for x in json.load(open("out/initial-download-plan.json"))["downloads"]]')
          printf '%s\n' '{"download_plan":"out/initial-download-plan.json","download_root":"out/downloads"}' >out/complete-initial-request.json
          PYTHONPATH=.github/release python -m ucm_release release complete-downloads --input out/complete-initial-request.json --output out/observed-assets.json >/dev/null
          published="$(python -c 'import json; print(str(not json.load(open("out/live-release.json"))["draft"]).lower())')"
          PUBLISHED="${published}" python -c 'import json,os; p={"manifest":"out/state/assets-manifest.json","observed_assets":"out/observed-assets.json","release_id":int(os.environ["RELEASE_ID"]),"allowed_root":"out/state/release-assets","release_published":os.environ["PUBLISHED"]=="true"}; json.dump(p,open("out/asset-plan-request.json","w"),sort_keys=True,separators=(",",":"))'
          PYTHONPATH=.github/release python -m ucm_release release plan-assets --input out/asset-plan-request.json --output out/asset-plan.json >/dev/null
          cp input/draft/initial-plan.json out/state/prepare-initial-plan.json
          cp input/draft/observed-release.json out/state/prepare-release.json
          cp out/live-release.json out/state/initial-release.json
          cp out/observed-assets.json out/state/initial-assets.json
          cp out/asset-plan.json out/state/initial-asset-plan.json
          printf '[]\n' >out/uploaded-assets.json
          printf '[]\n' >out/state/upload-transcript.json
          if [[ "${published}" != true ]]; then
            git fetch --no-tags --force origin +refs/tags/v0.5.0rc1:refs/tags/v0.5.0rc1 +refs/heads/develop:refs/remotes/origin/develop
            git diff --quiet HEAD:.github/workflows origin/develop:.github/workflows
            git diff --quiet HEAD:.github/release origin/develop:.github/release
            PYTHONPATH=.github/release python -m ucm_release core tag-preflight --lane protected-tag >/dev/null
            while IFS= read -r name; do
              gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "repos/SuperMarioYL/unified-cache-management/releases/${RELEASE_ID}" >out/preupload-release.json
              python -c 'import json,os; p={"remote":json.load(open("out/preupload-release.json")),"source_sha":os.environ["SOURCE_SHA"],"just_created":False}; json.dump(p,open("out/preupload-state-request.json","w"),sort_keys=True,separators=(",",":"))'
              PYTHONPATH=.github/release python -m ucm_release release plan-state --input out/preupload-state-request.json --output out/preupload-plan.json >/dev/null
              test "$(python -c 'import json; print(json.load(open("out/preupload-plan.json"))["decision"])')" = resume-draft
              gh api --paginate --slurp -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "repos/SuperMarioYL/unified-cache-management/releases/${RELEASE_ID}/assets?per_page=100" >out/preupload-assets-pages.json
              NEXT_NAME="${name}" python -c 'import json,os; json.dump({"manifest":"out/state/assets-manifest.json","initial_asset_plan":"out/asset-plan.json","uploaded_assets":"out/uploaded-assets.json","current_assets":"out/preupload-assets-pages.json","allowed_root":"out/state/release-assets","next_name":os.environ["NEXT_NAME"],"release_id":int(os.environ["RELEASE_ID"])},open("out/upload-prefix-request.json","w"),sort_keys=True,separators=(",",":"))'
              PYTHONPATH=.github/release python -m ucm_release release verify-upload-prefix --input out/upload-prefix-request.json --output out/upload-prefix.json >/dev/null
              path="out/state/release-assets/${name}"
              encoded="$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1],safe=""))' "${name}")"
              gh api --method POST -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' --input "${path}" "https://uploads.github.com/repos/SuperMarioYL/unified-cache-management/releases/${RELEASE_ID}/assets?name=${encoded}" >out/upload-response.json
              NEXT_NAME="${name}" python -c 'import json,os; json.dump({"manifest":"out/state/assets-manifest.json","raw_response":"out/upload-response.json","expected_name":os.environ["NEXT_NAME"],"release_id":int(os.environ["RELEASE_ID"]),"allowed_root":"out/state/release-assets"},open("out/upload-response-request.json","w"),sort_keys=True,separators=(",",":"))'
              PYTHONPATH=.github/release python -m ucm_release release record-upload-response --input out/upload-response-request.json --output out/upload-record.json >/dev/null
              NEXT_NAME="${name}" python -c 'import json,os; p=json.load(open("out/state/upload-transcript.json")); p.append({"ordinal":len(p),"name":os.environ["NEXT_NAME"],"release":json.load(open("out/preupload-release.json")),"prefix":json.load(open("out/upload-prefix.json")),"response":json.load(open("out/upload-record.json"))}); json.dump(p,open("out/state/upload-transcript.json","w"),sort_keys=True,separators=(",",":"))'
              python -c 'import json; p=json.load(open("out/uploaded-assets.json")); p.append(json.load(open("out/upload-response.json"))); json.dump(p,open("out/uploaded-assets.json","w"),sort_keys=True,separators=(",",":"))'
            done < <(python -c 'import json; [print(x) for x in json.load(open("out/asset-plan.json"))["upload_names"]]')
          fi
          gh api --paginate --slurp -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "repos/SuperMarioYL/unified-cache-management/releases/${RELEASE_ID}/assets?per_page=100" >out/final-assets-pages.json
          rm -rf out/final-downloads && mkdir out/final-downloads
          python -c 'import json,os; json.dump({"manifest":"out/state/assets-manifest.json","raw_assets":"out/final-assets-pages.json","release_id":int(os.environ["RELEASE_ID"]),"allowed_root":"out/state/release-assets","require_complete":True},open("out/final-download-request.json","w"),sort_keys=True,separators=(",",":"))'
          PYTHONPATH=.github/release python -m ucm_release release plan-downloads --input out/final-download-request.json --output out/final-download-plan.json >/dev/null
          while IFS=$'\t' read -r asset_id name; do
            gh api -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/SuperMarioYL/unified-cache-management/releases/assets/${asset_id}" >"out/final-downloads/${name}"
          done < <(python -c 'import json; [print("{}\t{}".format(x["asset_id"],x["name"])) for x in json.load(open("out/final-download-plan.json"))["downloads"]]')
          printf '%s\n' '{"download_plan":"out/final-download-plan.json","download_root":"out/final-downloads"}' >out/complete-final-request.json
          PYTHONPATH=.github/release python -m ucm_release release complete-downloads --input out/complete-final-request.json --output out/state/authenticated-assets.json >/dev/null
          python -c 'import json,os; p={"manifest":"out/state/assets-manifest.json","observed_assets":"out/state/authenticated-assets.json","release_id":int(os.environ["RELEASE_ID"]),"allowed_root":"out/state/release-assets"}; json.dump(p,open("out/verify-assets-request.json","w"),sort_keys=True,separators=(",",":"))'
          PYTHONPATH=.github/release python -m ucm_release release verify-assets --input out/verify-assets-request.json --output out/state/authenticated-verification.json >/dev/null
          if [[ "${published}" != true ]]; then
            git fetch --no-tags --force origin +refs/tags/v0.5.0rc1:refs/tags/v0.5.0rc1 +refs/heads/develop:refs/remotes/origin/develop
            git diff --quiet HEAD:.github/workflows origin/develop:.github/workflows
            git diff --quiet HEAD:.github/release origin/develop:.github/release
            PYTHONPATH=.github/release python -m ucm_release core tag-preflight --lane protected-tag >/dev/null
            gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "repos/SuperMarioYL/unified-cache-management/releases/${RELEASE_ID}" >out/prepublish-release.json
            python -c 'import json,os; p={"remote":json.load(open("out/prepublish-release.json")),"source_sha":os.environ["SOURCE_SHA"],"just_created":False}; json.dump(p,open("out/prepublish-state-request.json","w"),sort_keys=True,separators=(",",":"))'
            PYTHONPATH=.github/release python -m ucm_release release plan-state --input out/prepublish-state-request.json --output out/prepublish-plan.json >/dev/null
            test "$(python -c 'import json; print(json.load(open("out/prepublish-plan.json"))["decision"])')" = resume-draft
            gh api --paginate --slurp -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "repos/SuperMarioYL/unified-cache-management/releases/${RELEASE_ID}/assets?per_page=100" >out/prepublish-assets-pages.json
            python -c 'import json,os; json.dump({"manifest":"out/state/assets-manifest.json","prior_assets":"out/state/authenticated-assets.json","raw_assets":"out/prepublish-assets-pages.json","release_id":int(os.environ["RELEASE_ID"]),"allowed_root":"out/state/release-assets"},open("out/refresh-assets-request.json","w"),sort_keys=True,separators=(",",":"))'
            PYTHONPATH=.github/release python -m ucm_release release refresh-assets --input out/refresh-assets-request.json --output out/state/prepublish-assets.json >/dev/null
            cp out/prepublish-release.json out/state/prepublish-release.json
            printf '%s\n' '{"draft":false,"prerelease":true,"make_latest":"false"}' >out/publish-request.json
            gh api --method PATCH -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "repos/SuperMarioYL/unified-cache-management/releases/${RELEASE_ID}" --input out/publish-request.json >out/state/publish-response.json
            gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "repos/SuperMarioYL/unified-cache-management/releases/${RELEASE_ID}" >out/state/authenticated-release.json
          else
            gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "repos/SuperMarioYL/unified-cache-management/releases/${RELEASE_ID}" >out/state/authenticated-release.json
            cp out/state/authenticated-release.json out/state/prepublish-release.json
            cp out/state/authenticated-assets.json out/state/prepublish-assets.json
          fi
          python -c 'import json,os; p={"remote":json.load(open("out/state/authenticated-release.json")),"source_sha":os.environ["SOURCE_SHA"],"just_created":False}; json.dump(p,open("out/final-state-request.json","w"),sort_keys=True,separators=(",",":"))'
          PYTHONPATH=.github/release python -m ucm_release release plan-state --input out/final-state-request.json --output out/state/final-state-plan.json >/dev/null
          test "$(python -c 'import json; print(json.load(open("out/state/final-state-plan.json"))["decision"])')" = inspect-published-prerelease
          cp input/protected/protected-publication.json out/state/protected-publication.json
          cp input/protected/member-collection.json out/state/member-collection.json
          cp input/protected/provisional-collection.json out/state/provisional-collection.json
          logical="ucm-release-authenticated-${SOURCE_SHA}"
          physical="$(PYTHONPATH=.github/release python -c 'import sys; from ucm_release.verify import run_bound_artifact_name; print(run_bound_artifact_name(*sys.argv[1:3], int(sys.argv[3])))' "${logical}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}")"
          echo "artifact=${physical}" >>"${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.publish.outputs.artifact }}
          path: out/state/
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  anonymous-release-readback:
    needs: [plan, prepare-release-draft, publish-release]
    if: ${{ !cancelled() && needs.publish-release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ucm-release-authenticated-${{ needs.plan.outputs.source_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: input/state
      - name: Anonymous exact release and seven-asset byte readback
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          RELEASE_ID: ${{ needs.prepare-release-draft.outputs.release_id }}
        run: |
          set -euo pipefail
          mkdir -p out/publication out/anonymous-downloads
          curl -fsSL --retry 3 -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/SuperMarioYL/unified-cache-management/releases/tags/v0.5.0rc1" >out/anonymous-release.json
          test "$(python -c 'import json; print(json.load(open("out/anonymous-release.json"))["id"])')" = "${RELEASE_ID}"
          curl -fsSL --retry 3 -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/SuperMarioYL/unified-cache-management/releases/${RELEASE_ID}/assets?per_page=100" >out/anonymous-assets-raw.json
          printf '%s\n' '{"manifest":"input/state/assets-manifest.json","allowed_root":"input/state/release-assets"}' >out/rebase-request.json
          PYTHONPATH=.github/release python -m ucm_release release rebase-manifest --input out/rebase-request.json --output out/assets-manifest.json >/dev/null
          python -c 'import json,os; json.dump({"manifest":"out/assets-manifest.json","raw_assets":"out/anonymous-assets-raw.json","release_id":int(os.environ["RELEASE_ID"]),"allowed_root":"input/state/release-assets","require_complete":True},open("out/anonymous-download-request.json","w"),sort_keys=True,separators=(",",":"))'
          PYTHONPATH=.github/release python -m ucm_release release plan-downloads --input out/anonymous-download-request.json --output out/anonymous-download-plan.json >/dev/null
          while IFS=$'\t' read -r api_url name; do
            curl -fsSL --retry 3 -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${api_url}" >"out/anonymous-downloads/${name}"
          done < <(python -c 'import json; [print("{}\t{}".format(x["api_url"],x["name"])) for x in json.load(open("out/anonymous-download-plan.json"))["downloads"]]')
          printf '%s\n' '{"download_plan":"out/anonymous-download-plan.json","download_root":"out/anonymous-downloads"}' >out/complete-anonymous-request.json
          PYTHONPATH=.github/release python -m ucm_release release complete-downloads --input out/complete-anonymous-request.json --output out/anonymous-assets.json >/dev/null
          python -c 'import json,os; json.dump({"prepare_initial_plan":"input/state/prepare-initial-plan.json","initial_release":"input/state/initial-release.json","initial_asset_plan":"input/state/initial-asset-plan.json","authenticated_assets":"input/state/authenticated-assets.json","asset_manifest":"out/assets-manifest.json","upload_transcript":"input/state/upload-transcript.json","allowed_root":"input/state/release-assets","source_sha":os.environ["SOURCE_SHA"]},open("out/ledger-request.json","w"),sort_keys=True,separators=(",",":"))'
          PYTHONPATH=.github/release python -m ucm_release release operation-ledger --input out/ledger-request.json --output out/operations.json >/dev/null
          python -c 'import json,os; request={"protected_registry":"input/state/protected-publication.json","asset_manifest":"out/assets-manifest.json","allowed_root":"input/state/release-assets","prepare_initial_plan":"input/state/prepare-initial-plan.json","prepare_release":"input/state/prepare-release.json","initial_release":"input/state/initial-release.json","initial_assets":"input/state/initial-assets.json","initial_asset_plan":"input/state/initial-asset-plan.json","upload_transcript":"input/state/upload-transcript.json","prepublish_release":"input/state/prepublish-release.json","prepublish_assets":"input/state/prepublish-assets.json","authenticated_release":"input/state/authenticated-release.json","authenticated_assets":"input/state/authenticated-assets.json","anonymous_release":"out/anonymous-release.json","anonymous_assets":"out/anonymous-assets.json","operations":"out/operations.json","source_sha":os.environ["SOURCE_SHA"],"run":{"run_id":os.environ["GITHUB_RUN_ID"],"run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"])}}; json.dump(request,open("out/publication-request.json","w"),sort_keys=True,separators=(",",":"))'
          PYTHONPATH=.github/release python -m ucm_release release publication-evidence --input out/publication-request.json --output out/publication/github-release-publication.json >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ucm-github-release-publication-${{ needs.plan.outputs.source_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out/publication/
          if-no-files-found: error
          overwrite: false
          retention-days: 90
