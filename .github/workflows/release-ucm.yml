name: Build real hosted UCM release candidates

on:
  push:
    branches: ["feature/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      deliver_full_oci:
        description: Upload each complete OCI archive as a one-day Actions Artifact
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  blocked-invocation:
    if: >-
      ${{
        (github.event_name != 'push' &&
        github.event_name != 'workflow_dispatch') ||
        github.repository != 'SuperMarioYL/unified-cache-management' ||
        !startsWith(github.ref, 'refs/heads/feature/')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail closed for tag production or non-fork invocations
        run: |
          echo "production/tag publication is blocked in this feature-only execution wave" >&2
          exit 2

  plan:
    if: >-
      ${{
        (github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch') &&
        github.repository == 'SuperMarioYL/unified-cache-management' &&
        startsWith(github.ref, 'refs/heads/feature/')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      deliver_full_oci: ${{ steps.delivery.outputs.deliver_full_oci }}
    steps:
      - id: delivery
        name: Resolve explicit full OCI delivery opt-in
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          MANUAL_DELIVER_FULL_OCI: ${{ inputs.deliver_full_oci }}
        shell: bash
        run: |
          set -euo pipefail
          deliver_full_oci=false
          case "${EVENT_NAME}" in
            push)
              if [[ "${HEAD_COMMIT_MESSAGE}" == *"[ucm-deliver-full-oci]"* ]]; then
                deliver_full_oci=true
              fi
              ;;
            workflow_dispatch)
              if [[ "${MANUAL_DELIVER_FULL_OCI}" == true ]]; then
                deliver_full_oci=true
              fi
              ;;
            *)
              echo "unsupported full OCI delivery event: ${EVENT_NAME}" >&2
              exit 2
              ;;
          esac
          echo "deliver_full_oci=${deliver_full_oci}" >>"${GITHUB_OUTPUT}"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install compact release runtime dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - id: plan
        name: Project exact six reviewed wheel tasks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          source_date_epoch="$(git show -s --format=%ct "${GITHUB_SHA}")"
          mkdir -p out
          PYTHONPATH=.github/release python -m ucm_release core tag-preflight \
            --lane feature-candidate >out/feature-preflight.json
          PYTHONPATH=.github/release python -m ucm_release core hosted-matrix \
            --source-sha "${GITHUB_SHA}" \
            --source-date-epoch "${source_date_epoch}" \
            --output out/hosted-matrix.json >/dev/null
          {
            echo "matrix=$(python -c 'import json; print(json.dumps(json.load(open("out/hosted-matrix.json"))["github_matrix"],separators=(",",":")))')"
            echo "source_sha=${GITHUB_SHA}"
          } >>"${GITHUB_OUTPUT}"

  build-wheels:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
    uses: ./.github/workflows/_build-wheel.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      spec_id: ${{ matrix.spec_id }}

  package-chart:
    needs: [plan, build-wheels]
    if: >-
      ${{
        !cancelled() &&
        needs.plan.result == 'success' &&
        needs.build-wheels.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      chart_artifact: ${{ steps.record.outputs.chart_artifact }}
      chart_sha256: ${{ steps.record.outputs.chart_sha256 }}
      chart_tree_sha256: ${{ steps.record.outputs.chart_tree_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install compact release runtime dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - name: Install Helm
        env:
          HELM_VERSION: v3.15.3
          HELM_LINUX_AMD64_SHA256: ad871aecb0c9fd96aa6702f6b79e87556c8998c2e714a4959bf71ee31282ac9c
          HELM_LINUX_ARM64_SHA256: bd57697305ba46fef3299b50168a34faa777dd2cf5b43b50df92cca7ed118cce
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) helm_arch=amd64; helm_sha="${HELM_LINUX_AMD64_SHA256}" ;;
            aarch64|arm64) helm_arch=arm64; helm_sha="${HELM_LINUX_ARM64_SHA256}" ;;
            *) echo "unsupported Helm architecture: $(uname -m)" >&2; exit 2 ;;
          esac
          helm_archive="${RUNNER_TEMP}/helm.tar.gz"
          curl -fsSL --retry 3 -o "${helm_archive}" \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-${helm_arch}.tar.gz"
          echo "${helm_sha}  ${helm_archive}" | sha256sum --check
          tar -xzf "${helm_archive}" -C "${RUNNER_TEMP}"
          mkdir -p "${RUNNER_TEMP}/helm-bin"
          mv "${RUNNER_TEMP}/linux-${helm_arch}/helm" "${RUNNER_TEMP}/helm-bin/helm"
          test "$("${RUNNER_TEMP}/helm-bin/helm" version --short)" = "v3.15.3+g3bb50bb"
          echo "${RUNNER_TEMP}/helm-bin" >>"${GITHUB_PATH}"
      - name: Lint template and deterministically package CUDA A2 and A3
        run: |
          set -euo pipefail
          mkdir -p out/chart out/chart-artifact
          PYTHONPATH=.github/release python -m ucm_release chart package \
            --output-dir out/chart >out/chart-result.json
          cp out/chart/*.tgz out/chart-artifact/
          cp out/chart-result.json out/chart-artifact/chart-result.json
      - id: record
        name: Expose Chart package and source-tree identities
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "chart_artifact=ucm-chart-${SOURCE_SHA}"
            echo "chart_sha256=$(python -c 'import json; print(json.load(open("out/chart-result.json"))["sha256"])')"
            echo "chart_tree_sha256=$(python -c 'import json; print(json.load(open("out/chart-result.json"))["release_tree_sha256"])')"
          } >>"${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.record.outputs.chart_artifact }}
          path: out/chart-artifact/
          if-no-files-found: error
          retention-days: 3

  reconcile-images:
    needs: [plan, build-wheels, package-chart]
    if: >-
      ${{
        !cancelled() &&
        needs.plan.result == 'success' &&
        needs.build-wheels.result == 'success' &&
        needs.package-chart.result == 'success'
      }}
    permissions:
      contents: read
    uses: ./.github/workflows/release-vllm-images.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      deliver_full_oci: ${{ needs.plan.outputs.deliver_full_oci == 'true' }}

  candidate-barrier:
    needs: [plan, build-wheels, package-chart, reconcile-images]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail unless every wheel Chart and image job succeeded
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          WHEELS_RESULT: ${{ needs.build-wheels.result }}
          CHART_RESULT: ${{ needs.package-chart.result }}
          IMAGES_RESULT: ${{ needs.reconcile-images.result }}
        shell: bash
        run: |
          set -euo pipefail
          for result in "${PLAN_RESULT}" "${WHEELS_RESULT}" "${CHART_RESULT}" "${IMAGES_RESULT}"; do
            if [[ "${result}" != success ]]; then
              echo "real hosted candidate dependency was not successful" >&2
              exit 2
            fi
          done

  aggregate-evidence:
    needs:
      [plan, build-wheels, package-chart, reconcile-images, candidate-barrier]
    if: >-
      ${{
        !cancelled() &&
        needs.plan.result == 'success' &&
        needs.build-wheels.result == 'success' &&
        needs.package-chart.result == 'success' &&
        needs.reconcile-images.result == 'success' &&
        needs.candidate-barrier.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install compact release runtime dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - name: Install Helm
        env:
          HELM_VERSION: v3.15.3
          HELM_LINUX_AMD64_SHA256: ad871aecb0c9fd96aa6702f6b79e87556c8998c2e714a4959bf71ee31282ac9c
          HELM_LINUX_ARM64_SHA256: bd57697305ba46fef3299b50168a34faa777dd2cf5b43b50df92cca7ed118cce
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) helm_arch=amd64; helm_sha="${HELM_LINUX_AMD64_SHA256}" ;;
            aarch64|arm64) helm_arch=arm64; helm_sha="${HELM_LINUX_ARM64_SHA256}" ;;
            *) echo "unsupported Helm architecture: $(uname -m)" >&2; exit 2 ;;
          esac
          helm_archive="${RUNNER_TEMP}/helm.tar.gz"
          curl -fsSL --retry 3 -o "${helm_archive}" \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-${helm_arch}.tar.gz"
          echo "${helm_sha}  ${helm_archive}" | sha256sum --check
          tar -xzf "${helm_archive}" -C "${RUNNER_TEMP}"
          mkdir -p "${RUNNER_TEMP}/helm-bin"
          mv "${RUNNER_TEMP}/linux-${helm_arch}/helm" "${RUNNER_TEMP}/helm-bin/helm"
          test "$("${RUNNER_TEMP}/helm-bin/helm" version --short)" = "v3.15.3+g3bb50bb"
          echo "${RUNNER_TEMP}/helm-bin" >>"${GITHUB_PATH}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ucm-wheel-*-${{ needs.plan.outputs.source_sha }}
          path: input/wheels
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ucm-image-*-${{ needs.plan.outputs.source_sha }}
          path: input/images
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.package-chart.outputs.chart_artifact }}
          path: input/chart
      - name: Aggregate deterministic six-wheel six-image Chart evidence
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          chart_package="$(find input/chart -maxdepth 1 -type f -name '*.tgz' -print)"
          test -n "${chart_package}"
          PYTHONPATH=.github/release python -m ucm_release loop aggregate-real \
            --wheel-dir input/wheels \
            --image-dir input/images \
            --chart-result input/chart/chart-result.json \
            --chart-package "${chart_package}" \
            --repository "${GITHUB_REPOSITORY}" \
            --ref "${GITHUB_REF}" \
            --source-sha "${SOURCE_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --attempt "${GITHUB_RUN_ATTEMPT}" \
            --output release-loop-evidence.json >aggregate-real-result.json
          test "$(python -c 'import json; print(len(json.load(open("release-loop-evidence.json"))["payload"]["wheels"]))')" = 6
          test "$(python -c 'import json; print(len(json.load(open("release-loop-evidence.json"))["payload"]["images"]))')" = 6
          test "$(python -c 'import json; print(len(json.load(open("release-loop-evidence.json"))["payload"]["families"]))')" = 3
          test "$(python -c 'import json; print(json.load(open("release-loop-evidence.json"))["payload"]["second_reconcile"]["task_count"])')" = 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-loop-evidence-${{ needs.plan.outputs.source_sha }}
          path: |
            release-loop-evidence.json
            aggregate-real-result.json
          if-no-files-found: error
          retention-days: 3
