name: Reusable production native UCM wheel build

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      tag_name:
        type: string
        required: true
      spec_id:
        type: string
        required: true
      candidate_run_id:
        type: string
        required: true
      candidate_run_attempt:
        type: string
        required: true
      source_identity_b64:
        type: string
        required: true
      control_sha:
        type: string
        required: true
      cache_namespace:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ endsWith(inputs.spec_id, '-arm64') && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Validate production wheel build inputs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TAG_NAME: ${{ inputs.tag_name }}
          SPEC_ID: ${{ inputs.spec_id }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          SOURCE_IDENTITY_B64: ${{ inputs.source_identity_b64 }}
          CONTROL_SHA: ${{ inputs.control_sha }}
          CACHE_NAMESPACE: ${{ inputs.cache_namespace }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${CANDIDATE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${CANDIDATE_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          [[ "${SOURCE_IDENTITY_B64}" =~ ^[A-Za-z0-9+/=]+$ ]]
          [[ "${CONTROL_SHA}" =~ ^[0-9a-f]{40}$ ]]
          case "${CACHE_NAMESPACE}" in candidate|trusted) ;; *) exit 2 ;; esac
          case "${SPEC_ID}" in
            cuda130-amd64|cuda130-arm64|cann900-a2-amd64|cann900-a2-arm64|cann900-a3-amd64|cann900-a3-arm64) ;;
            *) exit 2 ;;
          esac
          case "${TAG_NAME}" in
            draft/v*|v*) ;;
            *) exit 2 ;;
          esac
      - name: Free disk for immutable production builder
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.control_sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Resolve production wheel authority
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TAG_NAME: ${{ inputs.tag_name }}
          SPEC_ID: ${{ inputs.spec_id }}
          SOURCE_IDENTITY_B64: ${{ inputs.source_identity_b64 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          PYTHONPATH=control/.github/release/production python -m ucm_release_production tag parse \
            --config control/.github/release/production/production-release.json \
            --tag "${TAG_NAME}" --output out/tag-intent.json
          printf '%s' "${SOURCE_IDENTITY_B64}" | base64 --decode >out/source-identity.json
          PYTHONPATH=control/.github/release/production python -m ucm_release_production build task \
            --config control/.github/release/production/production-release.json \
            --intent out/tag-intent.json --source out/source-identity.json \
            --spec-id "${SPEC_ID}" --output out/build-task.json
          PYTHONPATH=control/.github/release/production python -m ucm_release_production build source-context \
            --repository-root source --source-sha "${SOURCE_SHA}" --output-dir out/source-context
          source_epoch="$(git -C source show -s --format=%ct "${SOURCE_SHA}")"
          PYTHONPATH=control/.github/release/production python -m ucm_release_production build projection \
            --config control/.github/release/production/production-release.json \
            --task out/build-task.json --source-context out/source-context/source-context.json \
            --source-date-epoch "${source_epoch}" --output-dir out/projection
          test -f out/projection/build-authority.json
          test -f out/projection/build-projection.json
          test -f out/projection/wheel-build.json
          cp out/projection/build-authority.json out/source-context/build-authority.json
          cp out/projection/wheel-build.json out/source-context/wheel-build.json
          mkdir -p out/source-context/trusted-control
          cp -R control/.github/release/ucm_release \
            out/source-context/trusted-control/ucm_release
      - name: Install checksum-pinned Buildx
        env:
          BUILDX_VERSION: v0.19.2
          BUILDX_LINUX_AMD64_SHA256: a5ff61c0b6d2c8ee20964a9d6dac7a7a6383c4a4a0ee8d354e983917578306ea
          BUILDX_LINUX_ARM64_SHA256: bd54f0e28c29789da1679bad2dd94c1923786ccd2cd80dd3a0a1d560a6baf10c
          BUILDKIT_IMAGE: moby/buildkit:v0.18.2@sha256:86c0ad9d1137c186e9d455912167df20e530bdf7f7c19de802e892bb8ca16552
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) buildx_arch=amd64; buildx_sha="${BUILDX_LINUX_AMD64_SHA256}" ;;
            aarch64|arm64) buildx_arch=arm64; buildx_sha="${BUILDX_LINUX_ARM64_SHA256}" ;;
            *) exit 2 ;;
          esac
          binary="${RUNNER_TEMP}/docker-buildx"
          curl -fsSL --retry 3 -o "${binary}" \
            "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-${buildx_arch}"
          echo "${buildx_sha}  ${binary}" | sha256sum --check
          mkdir -p "${HOME}/.docker/cli-plugins"
          install -m 0755 "${binary}" "${HOME}/.docker/cli-plugins/docker-buildx"
          docker buildx create --name ucm-production-wheel \
            --driver docker-container --driver-opt "image=${BUILDKIT_IMAGE}" --use
          docker buildx inspect ucm-production-wheel --bootstrap
      - name: Build and seal production wheel
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t build_args < <(python -c 'import json; d=json.load(open("out/projection/build-projection.json")); [print(f"{k}={v}") for k,v in d["build_args"].items()]')
          argv=()
          for item in "${build_args[@]}"; do argv+=(--build-arg "${item}"); done
          platform="$(python -c 'import json; print(json.load(open("out/projection/build-projection.json"))["platform"])')"
          docker buildx build --builder ucm-production-wheel --platform "${platform}" \
            --target production-wheel "${argv[@]}" --output type=local,dest=out/raw-wheel \
            --progress plain -f control/.github/release/production/docker/Dockerfile.wheel \
            out/source-context
          raw_wheel="$(find out/raw-wheel -maxdepth 1 -type f -name '*.whl' -print)"
          test -n "${raw_wheel}"
          PYTHONPATH=control/.github/release/production python -m ucm_release_production build seal-wheel \
            --task out/build-task.json --authority out/projection/build-authority.json \
            --raw-wheel "${raw_wheel}" --output-dir out/sealed-wheel
          cp out/build-task.json out/sealed-wheel/build-task.json
          mkdir -p "cache/${{ inputs.cache_namespace }}/wheels/${{ inputs.spec_id }}"
          cp out/sealed-wheel/* "cache/${{ inputs.cache_namespace }}/wheels/${{ inputs.spec_id }}/"
      - name: Save exact candidate wheel in same-run cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: cache/${{ inputs.cache_namespace }}/wheels/${{ inputs.spec_id }}
          key: production-${{ inputs.cache_namespace }}-wheel-${{ github.repository_id }}-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}-${{ inputs.control_sha }}-${{ inputs.source_sha }}-${{ inputs.spec_id }}
          enableCrossOsArchive: false
