name: Draft environment dry-run v2

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Simulated target environment
        required: true
        type: choice
        options:
          - blue
          - yellow
      intent_json:
        description: Exact Draft release intent JSON
        required: true
        type: string
      nonce:
        description: Replay nonce as exactly 32 lowercase hexadecimal characters
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: draft-environment-dry-run-${{ github.ref }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  invoke-trusted-main-controller:
    permissions:
      contents: read
    uses: SuperMarioYL/unified-cache-management/.github/workflows/release-control-dry-run.yml@main
    with:
      operation: draft-environment
      environment: ${{ inputs.environment }}
      intent_json: ${{ inputs.intent_json }}
      nonce: ${{ inputs.nonce }}
