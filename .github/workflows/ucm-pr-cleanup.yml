name: UCM PR Artifact Cleanup

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "0 3 * * *"  # Daily at 03:00 UTC — sweep expired PR tags

permissions:
  packages: write
  contents: read

jobs:
  cleanup-pr-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Delete PR-tagged GHCR images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          repo="${{ github.event.repository.name }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            pr_number="${{ github.event.pull_request.number }}"
            prefix="pr-${pr_number}-"
          else
            prefix="pr-"
          fi
          echo "Cleaning up GHCR images with prefix '${prefix}' for ${owner}/${repo}"
          # PR images live in per-family packages (vllm, vllm-ascend, ...) under
          # pr-<n>-... tags. Sweep every container package and delete any version
          # whose first tag starts with the PR prefix; release tags (v... ) are
          # never touched because they don't start with pr-. Capture each API
          # response raw and jq-filter separately — gh api --jq leaks 404 error
          # bodies to stdout, which would otherwise be parsed as garbage tags.
          pkgs_raw="$(gh api "user/packages?package_type=container" 2>/dev/null || true)"
          printf '%s' "${pkgs_raw}" | jq -e 'type=="array"' >/dev/null 2>&1 || { echo "no listable packages; done"; exit 0; }
          for pkg in $(printf '%s' "${pkgs_raw}" | jq -r '.[].name'); do
            [ -n "${pkg}" ] || continue
            raw="$(gh api "user/packages/container/${pkg}/versions?per_page=100" 2>/dev/null || true)"
            printf '%s' "${raw}" | jq -e 'type=="array"' >/dev/null 2>&1 || continue
            printf '%s' "${raw}" | jq -r '.[] | select(.metadata.container.tags[0] // "" | startswith("'"${prefix}"'")) | "\(.id) \(.metadata.container.tags[0])"' 2>/dev/null | while IFS= read -r line; do
              [ -n "${line}" ] || continue
              version_id="${line%% *}"
              tag="${line#* }"
              [[ "${version_id}" =~ ^[0-9]+$ ]] || continue
              echo "Deleting ${pkg}:${tag} (version ${version_id})"
              gh api --method DELETE "user/packages/container/${pkg}/versions/${version_id}" 2>/dev/null || true
            done
          done
          echo "PR artifact cleanup complete"
