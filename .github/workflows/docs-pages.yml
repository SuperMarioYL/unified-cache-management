name: UCM Documentation · Check and Publish Pages

on:
  pull_request:
    paths:
      - "docs-next/**"
      - ".github/release/release.yaml"
      - ".github/release/platforms.yaml"
      - ".github/release/requirements/wheel-runtime.txt"
      - ".github/release/ucm_release/compact.py"
      - ".github/release/ucm_release/release.py"
      - ".github/workflows/docs-pages.yml"
      - ".github/workflows/migrate-release-manifest.yml"
      - ".github/workflows/release-tag.yml"
      - ".github/workflows/release-ucm.yml"
  push:
    branches: ["develop"]
  workflow_call:
    inputs:
      mode:
        description: Pages publication mode, latest or stable
        type: string
        required: true
      source_ref:
        description: Source ref containing the documentation to publish
        type: string
        required: true
      release_tag:
        description: Stable GitHub Release Tag holding release-manifest.json
        type: string
        required: false
        default: ""
      replace_existing:
        description: Replace an existing Stable documentation body during migration
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      mode:
        description: Pages publication mode
        type: choice
        required: true
        default: latest
        options:
          - latest
          - stable
          - verify
      source_ref:
        description: Source ref containing the documentation to publish
        type: string
        required: true
        default: develop
      release_tag:
        description: Stable GitHub Release Tag; required in stable mode
        type: string
        required: false
        default: ""
      site_url:
        description: Published Pages root URL; required in verify mode
        type: string
        required: false
        default: ""

concurrency:
  group: ucm-pages-${{ github.repository_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Docs · Strict build
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          -r docs-next/requirements.txt
      - name: Strict build for all enabled languages
        working-directory: docs-next
        run: python tools/site.py validate
      - name: Test Pages publication and Simple Index contracts
        working-directory: docs-next
        run: python -m pytest -q tests
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: ucm-docs-pages-pr-${{ github.event.pull_request.number }}
          path: docs-next/site/
          if-no-files-found: error
          retention-days: 14

  publish-latest:
    name: Pages · Publish latest
    if: >-
      ${{
        vars.UCM_PAGES_ENABLED == 'true' &&
        ((github.event_name == 'push' && inputs.mode == '') ||
         inputs.mode == 'latest')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          -r docs-next/requirements.txt
      - name: Publish latest documentation and install pages
        run: >-
          python docs-next/tools/pages.py publish-latest
          --repository "${GITHUB_REPOSITORY}"

  publish-stable:
    name: Pages · Publish Stable
    if: >-
      ${{
        vars.UCM_PAGES_ENABLED == 'true' &&
        inputs.mode == 'stable' &&
        inputs.release_tag != ''
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          -r docs-next/requirements.txt
      - name: Download the completed Release Manifest
        run: |
          set -euo pipefail
          mkdir -p input/manifest
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern release-manifest.json \
            --dir input/manifest --clobber
          test -f input/manifest/release-manifest.json
      - name: Publish immutable Stable documentation and install pages
        env:
          REPLACE_EXISTING: ${{ inputs.replace_existing && 'true' || 'false' }}
        run: |
          set -euo pipefail
          arguments=(
            publish-stable
            --repository "${GITHUB_REPOSITORY}"
            --manifest input/manifest/release-manifest.json
          )
          if [ "${REPLACE_EXISTING}" = true ]; then
            arguments+=(--replace-existing)
          fi
          python docs-next/tools/pages.py "${arguments[@]}"

  verify-index:
    name: Index · Python 3.12 · ${{ matrix.channel }}
    if: >-
      ${{
        vars.UCM_PAGES_ENABLED == 'true' &&
        github.event_name == 'workflow_dispatch' &&
        inputs.mode == 'verify' &&
        inputs.site_url != ''
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        channel: [cu130, cann901-a2]
    env:
      SITE_URL: ${{ inputs.site_url }}
    steps:
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Resolve and install the published channel
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -euo pipefail
          site_root="${SITE_URL%/}"
          manifest="$(curl -fsSL "${site_root}/latest/release-manifest.json")"
          wheel_version="$(jq -er --arg channel "${CHANNEL}" '
            [.wheels[] | select(.channel == $channel) |
             select(.distribution == "uc-manager") | .version] |
            unique | if length == 1 then .[0]
            else error("channel Wheel version is ambiguous") end
          ' <<<"${manifest}")"
          ucm_venv="${RUNNER_TEMP}/ucm-index-${CHANNEL}"
          python -m venv "${ucm_venv}"
          "${ucm_venv}/bin/python" -m pip install \
            --disable-pip-version-check --no-cache-dir --only-binary=:all: \
            "uc-manager==${wheel_version}" \
            --index-url "${site_root}/whl/${CHANNEL}/"
          "${ucm_venv}/bin/python" -m pip check
          test "$("${ucm_venv}/bin/python" -c \
            'from importlib.metadata import version; print(version("uc-manager"))')" \
            = "${wheel_version}"
          test "$("${ucm_venv}/bin/python" -c \
            'from importlib.metadata import version; print(version("wrapt"))')" \
            = "1.17.2"
