<svg viewBox="0 0 1280 720" role="img" aria-labelledby="ucmstate-title ucmstate-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="ucmstate-title">UCM Release 状态收敛</title>
    <desc id="ucmstate-desc">UCM Release 的主状态从 release-open 向右进入 artifacts-ready，再由发布 receipt 和渠道结果计算内部 complete。只有内部 complete 后才生成、上传并逐字节回读 public release-manifest.json。规划或基础制品失败进入 artifacts-failed，镜像发布失败进入 images-failed，其他启用渠道失败进入 publication-failed；失败恢复需要人工重跑或创建新 Tag。</desc>

    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      }
      .title { fill: #0f172a; font-size: 28px; font-weight: 760; letter-spacing: -0.4px; }
      .subtitle { fill: #64748b; font-size: 16px; font-weight: 600; }
      .zone { fill: #64748b; font-size: 12px; font-weight: 760; letter-spacing: 1.6px; }
      .state-title { fill: #0f172a; font-size: 20px; font-weight: 760; letter-spacing: -0.2px; }
      .state-title-small { fill: #0f172a; font-size: 16px; font-weight: 740; }
      .copy { fill: #334155; font-size: 12px; font-weight: 560; }
      .copy-strong { fill: #0f172a; font-size: 16px; font-weight: 700; }
      .mono { fill: #1f2937; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: 650; }
      .mono-small { fill: #475569; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: 650; }
      .step { fill: #ffffff; font-size: 12px; font-weight: 780; }
      .step-dark { fill: #0f172a; font-size: 12px; font-weight: 780; }
      .transition { fill: #475569; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: 650; }
      .transition-red { fill: #991b1b; font-size: 12px; font-weight: 700; }
      .failure-chip { fill: #ffffff; font-size: 12px; font-weight: 780; }
      .caption { fill: #334155; font-size: 16px; font-weight: 680; }
    </style>

    <defs>
      <marker id="ucmstate-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
      </marker>
      <marker id="ucmstate-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
      </marker>
      <marker id="ucmstate-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
      </marker>
    </defs>

    <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
    <text class="title" x="56" y="40">UCM Release 状态收敛</text>
    <text class="subtitle" x="1224" y="40" text-anchor="end">内部 complete 在前 · Public Manifest 回读闭环在后</text>

    <rect x="56" y="72" width="1168" height="584" rx="16" fill="#f8fafc" stroke="#0f172a" stroke-width="3"/>
    <line x1="80" y1="352" x2="1200" y2="352" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8"/>

    <!-- Transitions are drawn before states. -->
    <line x1="96" y1="228" x2="120" y2="228" stroke="#0f172a" stroke-width="3" stroke-linecap="round" marker-end="url(#ucmstate-arrow)"/>
    <line x1="296" y1="228" x2="360" y2="228" stroke="#0f172a" stroke-width="3" stroke-linecap="round" marker-end="url(#ucmstate-arrow)"/>
    <line x1="536" y1="228" x2="600" y2="228" stroke="#0f172a" stroke-width="3" stroke-linecap="round" marker-end="url(#ucmstate-arrow)"/>
    <line x1="784" y1="228" x2="848" y2="228" stroke="#15803d" stroke-width="3" stroke-linecap="round" marker-end="url(#ucmstate-arrow-green)"/>
    <line x1="1128" y1="228" x2="1180" y2="228" stroke="#15803d" stroke-width="3" stroke-linecap="round" marker-end="url(#ucmstate-arrow-green)"/>

    <path d="M 200 296 V 396 Q 200 408 188 408 H 184 V 412"
          fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ucmstate-arrow-red)"/>
    <path d="M 456 296 V 396 Q 456 408 444 408 H 440 V 412"
          fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ucmstate-arrow-red)"/>
    <path d="M 504 296 V 360 Q 504 372 516 372 H 904 Q 916 372 916 384 V 412"
          fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ucmstate-arrow-red)"/>

    <!-- Main transition labels, each with an opaque mask and visible connector gap. -->
    <rect x="76" y="196" width="32" height="16" rx="4" fill="#f8fafc"/>
    <text class="transition" x="92" y="208" text-anchor="middle">TAG</text>
    <rect x="304" y="196" width="48" height="16" rx="4" fill="#f8fafc"/>
    <text class="transition" x="328" y="208" text-anchor="middle">资产就绪</text>
    <rect x="544" y="196" width="48" height="16" rx="4" fill="#f8fafc"/>
    <text class="transition" x="568" y="208" text-anchor="middle">渠道收敛</text>
    <rect x="792" y="196" width="48" height="16" rx="4" fill="#f8fafc"/>
    <text class="transition" x="816" y="208" text-anchor="middle">complete</text>
    <rect x="1132" y="196" width="48" height="16" rx="4" fill="#f8fafc"/>
    <text class="transition" x="1156" y="208" text-anchor="middle">回读一致</text>

    <rect x="208" y="328" width="112" height="16" rx="4" fill="#f8fafc"/>
    <text class="transition-red" x="216" y="340">规划或基础制品失败</text>
    <rect x="464" y="328" width="104" height="16" rx="4" fill="#f8fafc"/>
    <text class="transition-red" x="472" y="340">member 或 index 失败</text>
    <rect x="652" y="340" width="128" height="16" rx="4" fill="#f8fafc"/>
    <text class="transition-red" x="716" y="352" text-anchor="middle">其他启用渠道失败</text>

    <text class="zone" x="80" y="104">主状态路径</text>
    <text class="zone" x="80" y="384">失败出口 · 无自动回路</text>

    <!-- Start marker -->
    <circle cx="88" cy="228" r="6" fill="#0f172a"/>

    <!-- release-open -->
    <rect x="120" y="160" width="176" height="136" rx="8" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
    <rect x="136" y="176" width="32" height="20" rx="4" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.5"/>
    <text class="step-dark" x="152" y="191" text-anchor="middle">01</text>
    <text class="state-title-small" x="136" y="220">Release 已打开</text>
    <text class="mono-small" x="136" y="244">release-open</text>
    <text class="copy" x="136" y="268">创建或复用 GitHub Release</text>
    <text class="copy" x="136" y="284">基础制品仍在构建</text>

    <!-- artifacts-ready -->
    <rect x="360" y="160" width="176" height="136" rx="8" fill="#dbeafe" stroke="#0f172a" stroke-width="2.5"/>
    <rect x="376" y="176" width="32" height="20" rx="4" fill="#bfdbfe" stroke="#0f172a" stroke-width="1.5"/>
    <text class="step-dark" x="392" y="191" text-anchor="middle">02</text>
    <text class="state-title-small" x="376" y="220">基础资产可用</text>
    <text class="mono-small" x="376" y="244">artifacts-ready</text>
    <text class="copy" x="376" y="268">Wheel · Chart · Config</text>
    <text class="copy" x="376" y="284">已校验并上传 Release</text>

    <!-- complete internal state -->
    <rect x="600" y="148" width="184" height="160" rx="8" fill="#fbcfe8" stroke="#0f172a" stroke-width="3"/>
    <rect x="616" y="164" width="32" height="20" rx="4" fill="#f9a8d4" stroke="#0f172a" stroke-width="1.5"/>
    <text class="step-dark" x="632" y="179" text-anchor="middle">03</text>
    <text class="state-title-small" x="616" y="208">内部状态完成</text>
    <text class="copy" x="616" y="232">receipts + channel outcomes</text>
    <rect x="616" y="248" width="152" height="40" rx="4" fill="#fdf2f8" stroke="#0f172a" stroke-width="1.5"/>
    <text class="mono" x="692" y="264" text-anchor="middle">release-state.status</text>
    <text class="mono" x="692" y="280" text-anchor="middle">= complete</text>

    <!-- public manifest external closure -->
    <rect x="848" y="136" width="280" height="184" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
    <rect x="864" y="152" width="32" height="20" rx="4" fill="#15803d"/>
    <text class="step" x="880" y="167" text-anchor="middle">04</text>
    <text class="state-title" x="912" y="172">Public Manifest 闭环</text>
    <text class="copy-strong" x="864" y="208">只在内部 complete 后执行</text>
    <rect x="864" y="224" width="248" height="28" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
    <text class="mono" x="988" y="243" text-anchor="middle">release-manifest.json</text>
    <text class="copy" x="864" y="276">生成并上传到 GitHub Release</text>
    <text class="copy" x="864" y="296">逐字节回读 · 核对资产集合</text>

    <!-- End marker -->
    <circle cx="1192" cy="228" r="10" fill="#f8fafc" stroke="#15803d" stroke-width="3"/>
    <circle cx="1192" cy="228" r="6" fill="#15803d"/>

    <!-- artifacts-failed -->
    <rect x="88" y="412" width="224" height="104" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <rect x="104" y="428" width="48" height="20" rx="4" fill="#dc2626"/>
    <text class="failure-chip" x="128" y="443" text-anchor="middle">失败</text>
    <text class="state-title-small" x="164" y="444">基础制品失败</text>
    <text class="mono-small" x="104" y="472">artifacts-failed</text>
    <text class="copy" x="104" y="496">Plan、Wheel、Chart 或配置失败</text>

    <!-- images-failed -->
    <rect x="344" y="412" width="224" height="104" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <rect x="360" y="428" width="48" height="20" rx="4" fill="#dc2626"/>
    <text class="failure-chip" x="384" y="443" text-anchor="middle">失败</text>
    <text class="state-title-small" x="420" y="444">镜像发布失败</text>
    <text class="mono-small" x="360" y="472">images-failed</text>
    <text class="copy" x="360" y="496">member 或 multi-arch index 不完整</text>

    <!-- publication-failed -->
    <rect x="776" y="412" width="280" height="104" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <rect x="792" y="428" width="48" height="20" rx="4" fill="#dc2626"/>
    <text class="failure-chip" x="816" y="443" text-anchor="middle">失败</text>
    <text class="state-title-small" x="852" y="444">渠道发布失败</text>
    <text class="mono-small" x="792" y="472">publication-failed</text>
    <text class="copy" x="792" y="496">其他启用渠道未成功收敛</text>

    <!-- Unified recovery policy, intentionally not connected as an automatic loop. -->
    <rect x="88" y="552" width="1088" height="72" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text class="state-title-small" x="108" y="580">恢复策略</text>
    <text class="copy" x="204" y="580">网络步骤内有界重试；失败 Job 需人工 Re-run failed jobs；源码或策略错误修复后创建新 Tag。</text>
    <text class="copy" x="204" y="604">失败状态不画自动回路，避免把人工恢复误解为状态机自动重试。</text>

    <text class="caption" x="56" y="692">内部 complete 是生成 Public Manifest 的前置门；Public Manifest 上传并回读一致后，外部发布闭环才完成。</text>
  </svg>