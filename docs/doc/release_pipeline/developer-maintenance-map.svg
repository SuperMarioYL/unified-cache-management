<svg viewBox="0 0 1280 720" role="img" aria-labelledby="ucmdevmap-title ucmdevmap-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="ucmdevmap-title">UCM 发布流水线：开发者日常维护地图</title>
    <desc id="ucmdevmap-desc">开发者按变更目标选择唯一权威入口：发布范围与渠道修改 release.yaml，平台能力与 Builder 修改 platforms.yaml，构建行为修改 requirements、Dockerfile 和 Chart 源码，版本语义修改版本物化脚本与 Tag 入口；候选列表、Release Plan、receipt、状态和公共 manifest 均由流水线生成，不允许手工维护。</desc>

    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif; }
      .title { fill: #0f172a; font-size: 28px; font-weight: 760; letter-spacing: -0.4px; }
      .subtitle { fill: #64748b; font-size: 16px; font-weight: 600; }
      .column { fill: #64748b; font-size: 12px; font-weight: 760; letter-spacing: 1.6px; }
      .row-title { fill: #0f172a; font-size: 16px; font-weight: 740; }
      .copy { fill: #334155; font-size: 12px; font-weight: 560; }
      .mono { fill: #1f2937; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: 650; }
      .warning-title { fill: #991b1b; font-size: 16px; font-weight: 760; }
      .warning-copy { fill: #7f1d1d; font-size: 12px; font-weight: 600; }
      .caption { fill: #334155; font-size: 16px; font-weight: 680; }
    </style>

    <defs>
      <marker id="ucmdevmap-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
      </marker>
      <marker id="ucmdevmap-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
      </marker>
      <marker id="ucmdevmap-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
      </marker>
    </defs>

    <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
    <text class="title" x="56" y="40">UCM 发布流水线：开发者日常维护地图</text>
    <text class="subtitle" x="1224" y="40" text-anchor="end">我要改变什么 → 改哪里 → 会影响什么</text>

    <rect x="56" y="64" width="1168" height="592" rx="16" fill="#f8fafc" stroke="#0f172a" stroke-width="3"/>

    <text class="column" x="96" y="96">变更目标</text>
    <text class="column" x="476" y="96">唯一权威入口</text>
    <text class="column" x="832" y="96">影响范围</text>
    <line x1="80" y1="108" x2="1200" y2="108" stroke="#94a3b8" stroke-width="2"/>

    <!-- Row connectors, emitted before cards. -->
    <line x1="408" y1="156" x2="456" y2="156" stroke="#0f172a" stroke-width="3" stroke-linecap="round" marker-end="url(#ucmdevmap-arrow)"/>
    <line x1="768" y1="156" x2="816" y2="156" stroke="#15803d" stroke-width="3" stroke-linecap="round" marker-end="url(#ucmdevmap-arrow-green)"/>
    <line x1="408" y1="260" x2="456" y2="260" stroke="#0f172a" stroke-width="3" stroke-linecap="round" marker-end="url(#ucmdevmap-arrow)"/>
    <line x1="768" y1="260" x2="816" y2="260" stroke="#15803d" stroke-width="3" stroke-linecap="round" marker-end="url(#ucmdevmap-arrow-green)"/>
    <line x1="408" y1="364" x2="456" y2="364" stroke="#0f172a" stroke-width="3" stroke-linecap="round" marker-end="url(#ucmdevmap-arrow)"/>
    <line x1="768" y1="364" x2="816" y2="364" stroke="#15803d" stroke-width="3" stroke-linecap="round" marker-end="url(#ucmdevmap-arrow-green)"/>
    <line x1="408" y1="468" x2="456" y2="468" stroke="#0f172a" stroke-width="3" stroke-linecap="round" marker-end="url(#ucmdevmap-arrow)"/>
    <line x1="768" y1="468" x2="816" y2="468" stroke="#15803d" stroke-width="3" stroke-linecap="round" marker-end="url(#ucmdevmap-arrow-green)"/>

    <!-- Row 1 -->
    <rect x="80" y="120" width="328" height="72" rx="8" fill="#fef3c7" stroke="#0f172a" stroke-width="2"/>
    <text class="row-title" x="96" y="148">发布范围、Profile 与渠道</text>
    <text class="copy" x="96" y="172">上游仓库、版本窗口、Runner、Retention</text>
    <rect x="456" y="120" width="312" height="72" rx="8" fill="#fcd34d" stroke="#0f172a" stroke-width="2.5"/>
    <text class="mono" x="612" y="162" text-anchor="middle">.github/release/release.yaml</text>
    <rect x="816" y="120" width="384" height="72" rx="8" fill="#bbf7d0" stroke="#0f172a" stroke-width="2"/>
    <text class="row-title" x="832" y="148">Runtime 选择与发布 Profile</text>
    <text class="copy" x="832" y="172">目标 Registry、启用渠道、保留策略</text>

    <!-- Row 2 -->
    <rect x="80" y="224" width="328" height="72" rx="8" fill="#fef3c7" stroke="#0f172a" stroke-width="2"/>
    <text class="row-title" x="96" y="252">平台能力与 Builder 规则</text>
    <text class="copy" x="96" y="276">310P 过滤、A2/A3/A5、检查命令</text>
    <rect x="456" y="224" width="312" height="72" rx="8" fill="#dbeafe" stroke="#0f172a" stroke-width="2.5"/>
    <text class="mono" x="612" y="266" text-anchor="middle">.github/release/platforms.yaml</text>
    <rect x="816" y="224" width="384" height="72" rx="8" fill="#bbf7d0" stroke="#0f172a" stroke-width="2"/>
    <text class="row-title" x="832" y="252">能力解析与 Builder 同步</text>
    <text class="copy" x="832" y="276">supported / blocked、digest 验证</text>

    <!-- Row 3 -->
    <rect x="80" y="328" width="328" height="72" rx="8" fill="#fef3c7" stroke="#0f172a" stroke-width="2"/>
    <text class="row-title" x="96" y="356">Wheel、镜像与 Chart 行为</text>
    <text class="copy" x="96" y="380">依赖、ABI、镜像内容、Chart 渲染</text>
    <rect x="456" y="328" width="312" height="72" rx="8" fill="#dbeafe" stroke="#0f172a" stroke-width="2.5"/>
    <text class="mono" x="612" y="356" text-anchor="middle">requirements + Dockerfile.*</text>
    <text class="mono" x="612" y="380" text-anchor="middle">Chart 源码</text>
    <rect x="816" y="328" width="384" height="72" rx="8" fill="#bbf7d0" stroke="#0f172a" stroke-width="2"/>
    <text class="row-title" x="832" y="356">Wheel / Runtime / Chart 制品</text>
    <text class="copy" x="832" y="380">构建与容器内验证行为</text>

    <!-- Row 4 -->
    <rect x="80" y="432" width="328" height="72" rx="8" fill="#fef3c7" stroke="#0f172a" stroke-width="2"/>
    <text class="row-title" x="96" y="460">Tag 与版本物化语义</text>
    <text class="copy" x="96" y="484">Stable、RC、Draft、Nightly</text>
    <rect x="456" y="432" width="312" height="72" rx="8" fill="#dbeafe" stroke="#0f172a" stroke-width="2.5"/>
    <text class="mono" x="612" y="460" text-anchor="middle">materialize_version.py</text>
    <text class="mono" x="612" y="484" text-anchor="middle">release-tag.yml / release-nightly.yml</text>
    <rect x="816" y="432" width="384" height="72" rx="8" fill="#bbf7d0" stroke="#0f172a" stroke-width="2"/>
    <text class="row-title" x="832" y="460">Wheel、Chart 与 Release 版本</text>
    <text class="copy" x="832" y="484">可见性、Prerelease 与 Draft 语义</text>

    <!-- Generated-data boundary -->
    <rect x="80" y="536" width="1120" height="80" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
    <text class="warning-title" x="96" y="564">不要手工维护流水线生成数据</text>
    <text class="warning-copy" x="96" y="588">候选列表、inspection/probe、Builder catalog、release-plan.json、receipt、release-state.json 与 release-manifest.json</text>
    <text class="warning-copy" x="96" y="608">这些对象是运行结果，不是配置入口；修改它们不会形成可重复的下一次发布。</text>

    <text class="caption" x="56" y="692">日常判断原则：改策略看 YAML，改构建看 Dockerfile，改版本语义看 Tag 物化脚本。</text>
  </svg>
