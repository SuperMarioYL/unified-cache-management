<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="960" viewBox="0 0 1800 960" role="img" aria-labelledby="title desc">
  <title id="title">UCM 开发测试与发布架构</title>
  <desc id="desc">展示 PR Build、develop 合入检查、Daily Nightly、版本发布分支、Draft 转测、RC、Stable 和 main 稳定基线，以及统一私有 GHCR 仓库与正式仓库。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 42px Inter, "Noto Sans SC", "PingFang SC", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 20px Inter, "Noto Sans SC", "PingFang SC", sans-serif; fill: #64748b; }
      .zone { font: 700 25px Inter, "Noto Sans SC", "PingFang SC", sans-serif; fill: #0f172a; }
      .label { font: 650 20px Inter, "Noto Sans SC", "PingFang SC", sans-serif; fill: #172033; }
      .small { font: 450 16px Inter, "Noto Sans SC", "PingFang SC", sans-serif; fill: #5b6475; }
      .white { font: 700 19px Inter, "Noto Sans SC", "PingFang SC", sans-serif; fill: #ffffff; }
      .line { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #94a3b8; stroke-width: 2.5; stroke-dasharray: 9 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="960" fill="#f7f9fc"/>
  <text x="55" y="66" class="title">UCM 开发测试与发布架构</text>
  <text x="55" y="103" class="subtitle">非正式镜像统一进入 *-private，PR、develop、Nightly、Draft 通过 Tag 前缀区分</text>

  <g filter="url(#shadow)">
    <rect x="45" y="145" width="500" height="710" rx="28" fill="#edf6ff" stroke="#6ba7e8" stroke-width="2"/>
    <rect x="575" y="145" width="525" height="710" rx="28" fill="#f0fbfa" stroke="#5db7ad" stroke-width="2"/>
    <rect x="1130" y="145" width="625" height="710" rx="28" fill="#f7f2ff" stroke="#9b7be5" stroke-width="2"/>
  </g>

  <text x="75" y="193" class="zone">GitHub 分支与版本入口</text>
  <text x="605" y="193" class="zone">统一构建与真实环境测试</text>
  <text x="1160" y="193" class="zone">发布渠道与用户入口</text>

  <rect x="80" y="225" width="430" height="70" rx="16" fill="#ffffff" stroke="#6ba7e8" stroke-width="2"/>
  <text x="295" y="255" text-anchor="middle" class="label">feature/* · bugfix/*</text>
  <text x="295" y="280" text-anchor="middle" class="small">PR 评审与临时构建</text>

  <path d="M295 295 V325" class="line"/>
  <rect x="80" y="335" width="275" height="76" rx="16" fill="#dceeff" stroke="#4f91d7" stroke-width="2"/>
  <text x="217" y="367" text-anchor="middle" class="label">develop</text>
  <text x="217" y="394" text-anchor="middle" class="small">日常集成 · 合入检查</text>
  <rect x="385" y="335" width="125" height="76" rx="16" fill="#ffffff" stroke="#4f91d7" stroke-width="2"/>
  <text x="447" y="367" text-anchor="middle" class="label">Daily Nightly</text>
  <text x="447" y="394" text-anchor="middle" class="small">完整回归</text>
  <path d="M355 373 H385" class="line"/>

  <path d="M217 411 V447" class="line"/>
  <rect x="80" y="455" width="430" height="82" rx="16" fill="#ffffff" stroke="#6ba7e8" stroke-width="2"/>
  <text x="295" y="488" text-anchor="middle" class="label">1.1.0-release</text>
  <text x="295" y="515" text-anchor="middle" class="small">从 develop 选定提交 · 冻结版本范围</text>

  <path d="M295 537 V573" class="line"/>
  <rect x="80" y="580" width="430" height="82" rx="16" fill="#dceeff" stroke="#4f91d7" stroke-width="2"/>
  <text x="295" y="613" text-anchor="middle" class="label">Draft Tag + Release</text>
  <text x="295" y="640" text-anchor="middle" class="small">draft/v1.1.0-1 · 内部转测</text>

  <path d="M295 662 V680 H180 V698" class="line"/>
  <path d="M280 749 H310" class="line"/>
  <rect x="80" y="705" width="200" height="88" rx="16" fill="#ffffff" stroke="#6ba7e8" stroke-width="2"/>
  <rect x="310" y="705" width="200" height="88" rx="16" fill="#ffffff" stroke="#6ba7e8" stroke-width="2"/>
  <text x="180" y="741" text-anchor="middle" class="label">RC</text>
  <text x="180" y="769" text-anchor="middle" class="small">v1.1.0rc1 · 受控预发布</text>
  <text x="410" y="741" text-anchor="middle" class="label">Stable → main</text>
  <text x="410" y="769" text-anchor="middle" class="small">v1.1.0 · 发布后更新稳定基线</text>

  <path d="M510 260 H610" class="dash"/>
  <path d="M510 496 H560 V260 H610" class="dash"/>
  <path d="M510 621 H560 V260 H610" class="line"/>

  <rect x="610" y="225" width="455" height="76" rx="17" fill="#dff6f3" stroke="#2f9d90" stroke-width="2"/>
  <text x="837" y="257" text-anchor="middle" class="label">GitHub Actions</text>
  <text x="837" y="283" text-anchor="middle" class="small">按分支、Tag 和矩阵生成构建计划</text>

  <path d="M837 301 V332" class="line"/>
  <rect x="610" y="340" width="135" height="70" rx="15" fill="#ffffff" stroke="#5db7ad" stroke-width="2"/>
  <rect x="770" y="340" width="135" height="70" rx="15" fill="#ffffff" stroke="#5db7ad" stroke-width="2"/>
  <rect x="930" y="340" width="135" height="70" rx="15" fill="#ffffff" stroke="#5db7ad" stroke-width="2"/>
  <text x="677" y="383" text-anchor="middle" class="label">whl</text>
  <text x="837" y="372" text-anchor="middle" class="label">image</text>
  <text x="837" y="397" text-anchor="middle" class="small">private / public</text>
  <text x="997" y="383" text-anchor="middle" class="label">chart</text>

  <path d="M677 410 V446 H837" class="line"/>
  <path d="M837 410 V446" class="line"/>
  <path d="M997 410 V446 H837" class="line"/>
  <rect x="610" y="455" width="455" height="68" rx="16" fill="#ffffff" stroke="#5db7ad" stroke-width="2"/>
  <text x="837" y="486" text-anchor="middle" class="label">同一 SHA 与发布清单</text>
  <text x="837" y="510" text-anchor="middle" class="small">文件摘要 · 镜像 digest · 版本矩阵</text>

  <path d="M837 523 V552 H720 V578" class="line"/>
  <path d="M837 523 V552 H955 V578" class="line"/>
  <rect x="610" y="585" width="220" height="100" rx="18" fill="#dff6f3" stroke="#2f9d90" stroke-width="2"/>
  <rect x="845" y="585" width="220" height="100" rx="18" fill="#fff5dc" stroke="#e7a62b" stroke-width="2"/>
  <text x="720" y="625" text-anchor="middle" class="label">Draft/RC 蓝区直测</text>
  <text x="720" y="654" text-anchor="middle" class="small">Runner · GPU/NPU · K8s</text>
  <text x="955" y="625" text-anchor="middle" class="label">Draft/RC 黄区测试</text>
  <text x="955" y="654" text-anchor="middle" class="small">受控转运 · GPU/NPU · K8s</text>

  <path d="M720 685 V718 H837" class="line"/>
  <path d="M955 685 V718 H837" class="line"/>
  <rect x="610" y="727" width="455" height="78" rx="17" fill="#ffffff" stroke="#5db7ad" stroke-width="2"/>
  <text x="837" y="759" text-anchor="middle" class="label">统一测试与发布门槛</text>
  <text x="837" y="786" text-anchor="middle" class="small">门槛 · 用例 · 性能 · 评审 · 批准</text>

  <path d="M1065 758 H1152 V330 H1180" class="dash"/>
  <text x="1125" y="385" text-anchor="middle" class="small">预发布</text>
  <path d="M1065 758 H1120 V605 H1180" class="line"/>
  <text x="1125" y="670" text-anchor="middle" class="small">正式</text>

  <rect x="1180" y="225" width="525" height="205" rx="22" fill="#ffffff" stroke="#9b7be5" stroke-width="2"/>
  <rect x="1210" y="250" width="465" height="48" rx="14" fill="#e9ddff"/>
  <text x="1442" y="281" text-anchor="middle" class="label">RC</text>
  <rect x="1210" y="320" width="140" height="70" rx="14" fill="#f7f2ff" stroke="#a98de9"/>
  <rect x="1365" y="320" width="140" height="70" rx="14" fill="#f7f2ff" stroke="#a98de9"/>
  <rect x="1520" y="320" width="155" height="70" rx="14" fill="#f7f2ff" stroke="#a98de9"/>
  <text x="1280" y="362" text-anchor="middle" class="label">Pre-release</text>
  <text x="1435" y="350" text-anchor="middle" class="label">GHCR</text>
  <text x="1435" y="375" text-anchor="middle" class="small">正式仓库</text>
  <text x="1597" y="349" text-anchor="middle" class="label">GitHub</text>
  <text x="1597" y="374" text-anchor="middle" class="small">Packages</text>

  <rect x="1180" y="470" width="525" height="305" rx="22" fill="#ffffff" stroke="#9b7be5" stroke-width="2"/>
  <rect x="1210" y="495" width="465" height="48" rx="14" fill="#e9ddff"/>
  <text x="1442" y="526" text-anchor="middle" class="label">Stable · Hotfix</text>
  <rect x="1210" y="565" width="140" height="70" rx="14" fill="#f7f2ff" stroke="#a98de9"/>
  <rect x="1365" y="565" width="140" height="70" rx="14" fill="#f7f2ff" stroke="#a98de9"/>
  <rect x="1520" y="565" width="155" height="70" rx="14" fill="#f7f2ff" stroke="#a98de9"/>
  <text x="1280" y="607" text-anchor="middle" class="label">PyPI</text>
  <text x="1435" y="595" text-anchor="middle" class="label">GHCR</text>
  <text x="1435" y="620" text-anchor="middle" class="small">正式仓库</text>
  <text x="1597" y="607" text-anchor="middle" class="label">Docker Hub</text>
  <rect x="1210" y="655" width="220" height="78" rx="14" fill="#f7f2ff" stroke="#a98de9"/>
  <rect x="1455" y="655" width="220" height="78" rx="14" fill="#7650bd" stroke="#7650bd"/>
  <text x="1320" y="688" text-anchor="middle" class="label">GitHub Packages</text>
  <text x="1320" y="714" text-anchor="middle" class="small">正式 chart</text>
  <text x="1565" y="688" text-anchor="middle" class="white">GitHub Release</text>
  <text x="1565" y="714" text-anchor="middle" class="white">统一用户入口</text>

  <text x="55" y="913" class="small">develop 持续集成；1.1.0-release 承载 Draft、RC 与 Stable；正式渠道回查后更新 main；蓝区与黄区是 OR 关系。</text>
</svg>
