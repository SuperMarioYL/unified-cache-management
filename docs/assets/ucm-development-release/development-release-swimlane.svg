  <circle cx="1045" cy="707" r="15" fill="#cf8b0b"/><text x="1045" y="712" text-anchor="middle" class="step">7</text>
  <circle cx="1305" cy="707" r="15" fill="#cf8b0b"/><text x="1305" y="712" text-anchor="middle" class="step">10</text>
  <circle cx="1550" cy="707" r="15" fill="#cf8b0b"/><text x="1550" y="712" text-anchor="middle" class="step">11</text>

  <text x="380" y="239" text-anchor="middle" class="label">功能分支与自测</text>
  <text x="380" y="266" text-anchor="middle" class="small">从 develop 创建</text>
  <text x="630" y="239" text-anchor="middle" class="label">PR Build 与评审</text>
  <text x="630" y="266" text-anchor="middle" class="small">Artifact · GHCR · pr-*</text>
  <text x="890" y="239" text-anchor="middle" class="label">合入 develop</text>
  <text x="890" y="266" text-anchor="middle" class="small">合入检查 · Daily Nightly</text>

  <text x="885" y="404" text-anchor="middle" class="label">确认 Draft 候选</text>
  <text x="885" y="431" text-anchor="middle" class="small">接收 whl · image · chart</text>
  <text x="1140" y="404" text-anchor="middle" class="label">蓝区或黄区测试</text>
  <text x="1140" y="431" text-anchor="middle" class="small">门槛 · 用例 · 性能</text>
  <text x="1400" y="404" text-anchor="middle" class="label">RC 回归结论</text>
  <text x="1400" y="431" text-anchor="middle" class="small">缺陷与遗留风险</text>

  <text x="1140" y="569" text-anchor="middle" class="label">创建发布分支与 Draft</text>
  <text x="1140" y="596" text-anchor="middle" class="small">1.1.0-release · draft/v1.1.0-1</text>
  <text x="1395" y="569" text-anchor="middle" class="label">发布 RC</text>
  <text x="1395" y="596" text-anchor="middle" class="small">从 1.1.0-release 创建 v1.1.0rc1</text>
  <text x="1625" y="569" text-anchor="middle" class="label">正式渠道发布</text>
  <text x="1625" y="596" text-anchor="middle" class="small">v1.1.0 · 回查后更新 main</text>

  <text x="1140" y="734" text-anchor="middle" class="label">确认版本范围</text>
  <text x="1140" y="761" text-anchor="middle" class="small">冻结或调整计划</text>
  <text x="1395" y="734" text-anchor="middle" class="label">评估 RC 风险</text>
  <text x="1395" y="761" text-anchor="middle" class="small">遗留问题与窗口</text>
  <text x="1625" y="734" text-anchor="middle" class="label">批准 Stable</text>
  <text x="1625" y="761" text-anchor="middle" class="small">或阻断发布</text>

