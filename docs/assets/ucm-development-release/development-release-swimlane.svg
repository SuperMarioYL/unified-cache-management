  <text x="820" y="321" text-anchor="middle" class="small">Draft 与 RC 失败都在发布分支修复，并通过独立 PR 同步回 develop</text>

  <text x="55" y="882" class="small">develop 持续集成；版本发布分支完成 Draft、RC 与 Stable；正式渠道回查后更新 main。</text>
