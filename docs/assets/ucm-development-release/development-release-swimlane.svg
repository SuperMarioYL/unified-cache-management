    <rect x="1290" y="367" width="220" height="82" rx="16" fill="#ffffff" stroke="#49aa9f" stroke-width="2"/>

    <rect x="1025" y="532" width="230" height="82" rx="16" fill="#ffffff" stroke="#8e6ad6" stroke-width="2"/>
    <rect x="1285" y="532" width="220" height="82" rx="16" fill="#ffffff" stroke="#8e6ad6" stroke-width="2"/>
    <rect x="1530" y="532" width="190" height="82" rx="16" fill="#ffffff" stroke="#8e6ad6" stroke-width="2"/>

    <rect x="1025" y="697" width="230" height="82" rx="16" fill="#ffffff" stroke="#df9f22" stroke-width="2"/>
    <rect x="1285" y="697" width="220" height="82" rx="16" fill="#ffffff" stroke="#df9f22" stroke-width="2"/>
    <rect x="1530" y="697" width="190" height="82" rx="16" fill="#ffffff" stroke="#df9f22" stroke-width="2"/>
  </g>

  <circle cx="295" cy="212" r="15" fill="#377fc8"/><text x="295" y="217" text-anchor="middle" class="step">1</text>
  <circle cx="545" cy="212" r="15" fill="#377fc8"/><text x="545" y="217" text-anchor="middle" class="step">2</text>
  <circle cx="805" cy="212" r="15" fill="#377fc8"/><text x="805" y="217" text-anchor="middle" class="step">3</text>
  <circle cx="795" cy="377" r="15" fill="#268f84"/><text x="795" y="382" text-anchor="middle" class="step">4</text>
