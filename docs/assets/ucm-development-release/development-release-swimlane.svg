<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="930" viewBox="0 0 1800 930" role="img" aria-labelledby="title desc">
  <title id="title">UCM 团队开发发布泳道</title>
  <desc id="desc">按开发与评审、测试、发布负责人、主管展示从 PR Build、版本发布分支、Draft 转测、RC 到 Stable 和 main 的职责交接。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 42px Inter, "Noto Sans SC", "PingFang SC", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 20px Inter, "Noto Sans SC", "PingFang SC", sans-serif; fill: #64748b; }
      .lane { font: 700 22px Inter, "Noto Sans SC", "PingFang SC", sans-serif; fill: #172033; }
      .phase { font: 650 17px Inter, "Noto Sans SC", "PingFang SC", sans-serif; fill: #5b6475; }
      .label { font: 650 18px Inter, "Noto Sans SC", "PingFang SC", sans-serif; fill: #172033; }
      .small { font: 450 15px Inter, "Noto Sans SC", "PingFang SC", sans-serif; fill: #5b6475; }
      .step { font: 700 14px Inter, sans-serif; fill: #ffffff; }
      .line { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #94a3b8; stroke-width: 2.5; stroke-dasharray: 9 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="930" fill="#f8fafc"/>
  <text x="55" y="65" class="title">UCM 团队开发发布泳道</text>
  <text x="55" y="101" class="subtitle">开发、测试、发布与批准相互衔接，每个阶段都有明确输入、结论和负责人</text>

  <text x="340" y="142" text-anchor="middle" class="phase">开发与 PR</text>
  <text x="610" y="142" text-anchor="middle" class="phase">主干集成</text>
  <text x="875" y="142" text-anchor="middle" class="phase">转测</text>
  <text x="1130" y="142" text-anchor="middle" class="phase">版本稳定</text>
  <text x="1390" y="142" text-anchor="middle" class="phase">RC</text>
  <text x="1630" y="142" text-anchor="middle" class="phase">Stable</text>

  <rect x="45" y="165" width="1710" height="155" rx="22" fill="#edf6ff" stroke="#8bb9e8" stroke-width="2"/>
  <rect x="45" y="330" width="1710" height="155" rx="22" fill="#f0fbfa" stroke="#6dc2b8" stroke-width="2"/>
  <rect x="45" y="495" width="1710" height="155" rx="22" fill="#f7f2ff" stroke="#a98de9" stroke-width="2"/>
  <rect x="45" y="660" width="1710" height="155" rx="22" fill="#fff7e8" stroke="#edb74f" stroke-width="2"/>

  <rect x="45" y="165" width="205" height="155" rx="22" fill="#dceeff"/>
  <rect x="45" y="330" width="205" height="155" rx="22" fill="#dff6f3"/>
  <rect x="45" y="495" width="205" height="155" rx="22" fill="#e9ddff"/>
  <rect x="45" y="660" width="205" height="155" rx="22" fill="#ffedc5"/>

  <text x="147" y="232" text-anchor="middle" class="lane">开发与评审</text>
  <text x="147" y="260" text-anchor="middle" class="small">编码 · PR · 修复</text>
  <text x="147" y="397" text-anchor="middle" class="lane">测试团队</text>
  <text x="147" y="425" text-anchor="middle" class="small">转测 · 环境 · 结论</text>
  <text x="147" y="562" text-anchor="middle" class="lane">发布负责人</text>
  <text x="147" y="590" text-anchor="middle" class="small">分支 · Tag · 渠道</text>
  <text x="147" y="727" text-anchor="middle" class="lane">主管</text>
  <text x="147" y="755" text-anchor="middle" class="small">范围 · 风险 · 批准</text>

