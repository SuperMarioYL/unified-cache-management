<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">UCM 构建类型与发布渠道</title>
  <desc id="desc">展示 whl、image、chart 在 PR Build、Draft 转测、RC 和 Stable 阶段的 Tag、发布位置与临时内容保留期。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 42px Inter, "Noto Sans SC", "PingFang SC", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 20px Inter, "Noto Sans SC", "PingFang SC", sans-serif; fill: #64748b; }
      .head { font: 700 21px Inter, "Noto Sans SC", "PingFang SC", sans-serif; fill: #172033; }
      .object { font: 750 24px Inter, "Noto Sans SC", "PingFang SC", sans-serif; fill: #ffffff; }
      .label { font: 650 18px Inter, "Noto Sans SC", "PingFang SC", sans-serif; fill: #172033; }
      .small { font: 450 14px Inter, "Noto Sans SC", "PingFang SC", sans-serif; fill: #5b6475; }
      .line { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="900" fill="#f8fafc"/>
  <text x="55" y="66" class="title">UCM 构建类型与发布渠道</text>
  <text x="55" y="103" class="subtitle">非正式镜像共用 &lt;image&gt;-private，正式镜像进入无后缀公开仓库</text>

  <rect x="45" y="145" width="175" height="92" rx="20" fill="#172033"/>
  <rect x="240" y="145" width="350" height="92" rx="20" fill="#edf6ff" stroke="#8bb9e8" stroke-width="2"/>
  <rect x="610" y="145" width="350" height="92" rx="20" fill="#fff7e8" stroke="#edb74f" stroke-width="2"/>
  <rect x="980" y="145" width="350" height="92" rx="20" fill="#f0fbfa" stroke="#6dc2b8" stroke-width="2"/>
  <rect x="1350" y="145" width="405" height="92" rx="20" fill="#f7f2ff" stroke="#a98de9" stroke-width="2"/>
  <text x="132" y="200" text-anchor="middle" class="object">发布对象</text>
  <text x="415" y="183" text-anchor="middle" class="head">PR Build</text>
  <text x="415" y="211" text-anchor="middle" class="small">无 Tag · 保留 7 天</text>
  <text x="785" y="183" text-anchor="middle" class="head">Draft 转测</text>
  <text x="785" y="211" text-anchor="middle" class="small">draft/v1.1.0-1 · 保留 30 天</text>
  <text x="1155" y="183" text-anchor="middle" class="head">RC</text>
  <text x="1155" y="211" text-anchor="middle" class="small">v1.1.0rc1 · Pre-release</text>
  <text x="1552" y="183" text-anchor="middle" class="head">Stable · Hotfix</text>
  <text x="1552" y="211" text-anchor="middle" class="small">v1.1.0 · 正式 Release</text>

  <g filter="url(#shadow)">
    <rect x="45" y="275" width="175" height="122" rx="22" fill="#397dcc"/>
    <rect x="45" y="435" width="175" height="122" rx="22" fill="#7650bd"/>
    <rect x="45" y="595" width="175" height="122" rx="22" fill="#268f84"/>

    <rect x="240" y="275" width="350" height="122" rx="22" fill="#ffffff" stroke="#8bb9e8" stroke-width="2"/>
    <rect x="240" y="435" width="350" height="122" rx="22" fill="#ffffff" stroke="#8bb9e8" stroke-width="2"/>
    <rect x="240" y="595" width="350" height="122" rx="22" fill="#ffffff" stroke="#8bb9e8" stroke-width="2"/>

    <rect x="610" y="275" width="350" height="122" rx="22" fill="#ffffff" stroke="#edb74f" stroke-width="2"/>
    <rect x="610" y="435" width="350" height="122" rx="22" fill="#ffffff" stroke="#edb74f" stroke-width="2"/>
    <rect x="610" y="595" width="350" height="122" rx="22" fill="#ffffff" stroke="#edb74f" stroke-width="2"/>

    <rect x="980" y="275" width="350" height="122" rx="22" fill="#ffffff" stroke="#6dc2b8" stroke-width="2"/>
    <rect x="980" y="435" width="350" height="122" rx="22" fill="#ffffff" stroke="#6dc2b8" stroke-width="2"/>
    <rect x="980" y="595" width="350" height="122" rx="22" fill="#ffffff" stroke="#6dc2b8" stroke-width="2"/>

    <rect x="1350" y="275" width="405" height="122" rx="22" fill="#ffffff" stroke="#a98de9" stroke-width="2"/>
    <rect x="1350" y="435" width="405" height="122" rx="22" fill="#ffffff" stroke="#a98de9" stroke-width="2"/>
    <rect x="1350" y="595" width="405" height="122" rx="22" fill="#ffffff" stroke="#a98de9" stroke-width="2"/>
  </g>

  <text x="132" y="347" text-anchor="middle" class="object">whl</text>
  <text x="132" y="507" text-anchor="middle" class="object">image</text>
  <text x="132" y="667" text-anchor="middle" class="object">chart</text>

  <text x="415" y="323" text-anchor="middle" class="label">Actions Artifact</text>
  <text x="415" y="353" text-anchor="middle" class="small">ucm-pr-&lt;PR&gt;-&lt;SHA&gt;-whl</text>
  <text x="415" y="478" text-anchor="middle" class="label">私有 GHCR &lt;image&gt;-private</text>
  <text x="415" y="508" text-anchor="middle" class="small">pr-&lt;PR&gt;-&lt;SHA&gt;-&lt;upstream&gt;-&lt;backend&gt;</text>
  <text x="415" y="532" text-anchor="middle" class="small">产物创建 7 天后自动清理</text>
  <text x="415" y="643" text-anchor="middle" class="label">Actions Artifact</text>
  <text x="415" y="673" text-anchor="middle" class="small">ucm-pr-&lt;PR&gt;-&lt;SHA&gt;-chart</text>

  <text x="785" y="323" text-anchor="middle" class="label">Draft Release 资产</text>
  <text x="785" y="353" text-anchor="middle" class="small">内部安装、校验与转测</text>
  <text x="785" y="478" text-anchor="middle" class="label">私有 GHCR &lt;image&gt;-private</text>
  <text x="785" y="508" text-anchor="middle" class="small">draft-v1.1.0-1-&lt;upstream&gt;-&lt;backend&gt;</text>
  <text x="785" y="532" text-anchor="middle" class="small">内部拉取 · 30 天后自动清理</text>
  <text x="785" y="643" text-anchor="middle" class="label">Draft Release 资产</text>
  <text x="785" y="673" text-anchor="middle" class="small">Chart 包、清单与测试说明</text>

  <text x="1155" y="323" text-anchor="middle" class="label">GitHub Pre-release</text>
  <text x="1155" y="353" text-anchor="middle" class="small">不可变 rcN whl</text>
  <text x="1155" y="478" text-anchor="middle" class="label">公开 GHCR &lt;image&gt;</text>
  <text x="1155" y="508" text-anchor="middle" class="small">v1.1.0rc1 · 无仓库后缀</text>
  <text x="1155" y="532" text-anchor="middle" class="small">平台列表和 digest</text>
  <text x="1155" y="643" text-anchor="middle" class="label">GitHub Packages</text>
  <text x="1155" y="673" text-anchor="middle" class="small">RC OCI Chart 版本</text>

  <text x="1552" y="318" text-anchor="middle" class="label">PyPI + GitHub Release</text>
  <text x="1552" y="348" text-anchor="middle" class="small">同一正式 whl 文件，分别完成下载回查</text>
  <text x="1552" y="473" text-anchor="middle" class="label">公开 GHCR &lt;image&gt; + Docker Hub</text>
  <text x="1552" y="503" text-anchor="middle" class="small">v1.1.0 · GHCR 无仓库后缀</text>
  <text x="1552" y="527" text-anchor="middle" class="small">同一组正式镜像按 digest 回查</text>
  <text x="1552" y="638" text-anchor="middle" class="label">GitHub Packages</text>
  <text x="1552" y="668" text-anchor="middle" class="small">正式 SemVer Chart，不覆盖历史版本</text>

  <path d="M220 336 H240" class="line"/>
  <path d="M220 496 H240" class="line"/>
  <path d="M220 656 H240" class="line"/>
  <path d="M590 336 H610" class="line"/>
  <path d="M590 496 H610" class="line"/>
  <path d="M590 656 H610" class="line"/>
  <path d="M960 336 H980" class="line"/>
  <path d="M960 496 H980" class="line"/>
  <path d="M960 656 H980" class="line"/>
  <path d="M1330 336 H1350" class="line"/>
  <path d="M1330 496 H1350" class="line"/>
  <path d="M1330 656 H1350" class="line"/>

  <rect x="1350" y="760" width="405" height="72" rx="18" fill="#e9ddff" stroke="#8e6ad6" stroke-width="2"/>
  <text x="1552" y="791" text-anchor="middle" class="label">GitHub Release 汇总正式版本</text>
  <text x="1552" y="816" text-anchor="middle" class="small">whl · 镜像地址与 digest · Chart 地址 · 测试结论</text>
  <path d="M1552 717 V760" class="line"/>

  <text x="55" y="850" class="small">临时内容保留期 - PR 7 天，develop 与 Nightly 14 天，Draft 30 天。</text>
  <text x="55" y="876" class="small">PR、develop、Nightly 只清理 Artifact 与私有镜像；Draft 还清理 Release 和 Tag；RC、Stable 与 Hotfix 不纳入临时清理。</text>
</svg>
