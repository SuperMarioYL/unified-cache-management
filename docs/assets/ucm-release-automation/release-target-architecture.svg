<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">UCM 发布自动化目标架构</title>
  <desc id="desc">正式 Tag 和 PR 命令进入统一的版本与产品计划，复用三条构建线，但分别写入正式渠道与临时渠道。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#64748B"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#0277BD"/></marker>
    <style>
      .canvas{fill:#FAFAFA}.title{font:700 28px Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#111827}
      .sub{font:400 15px Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#64748B}.laneTitle{font:700 17px Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#334155}
      .label{font:700 17px Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#1F2937}.text{font:400 14px Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#374151}
      .small{font:400 12px Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#64748B}
      .formal{fill:#E1F5FE;stroke:#0277BD;stroke-width:2}.temp{fill:#FCE4EC;stroke:#E91E63;stroke-width:2}
      .plan{fill:#FFF9C4;stroke:#D4A72C;stroke-width:2}.wheel{fill:#E8F5E9;stroke:#43A047;stroke-width:2}
      .image{fill:#FFF3E0;stroke:#F59E0B;stroke-width:2}.chart{fill:#F3E8FF;stroke:#8B5CF6;stroke-width:2}
      .channel{fill:#FFFFFF;stroke:#94A3B8;stroke-width:1.5}.lane{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5}
      .line{fill:none;stroke:#64748B;stroke-width:2;marker-end:url(#arrow)}.formalLine{fill:none;stroke:#0277BD;stroke-width:2.5;marker-end:url(#arrowBlue)}
      .tempLine{fill:none;stroke:#E91E63;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#arrow)}
      .metaLine{fill:none;stroke:#64748B;stroke-width:1.5;stroke-dasharray:5 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="canvas" width="1600" height="920"/>
  <text class="title" x="48" y="48">UCM 发布自动化目标架构</text>
  <text class="sub" x="48" y="76">正式版和 PR 临时版共用构建定义，分开发布；PyPI、Docker Hub 和 GitHub Release 只接受正式版本。</text>

  <rect class="formal" x="48" y="128" width="220" height="92" rx="12"/>
  <text class="label" x="158" y="164" text-anchor="middle">受保护版本 Tag</text>
  <text class="text" x="158" y="191" text-anchor="middle">触发完整正式发布</text>
  <rect class="temp" x="48" y="252" width="220" height="104" rx="12"/>
  <text class="label" x="158" y="286" text-anchor="middle">PR 评审机器人</text>
  <text class="text" x="158" y="313" text-anchor="middle">解析 /ucm-build 命令</text>
  <text class="small" x="158" y="337" text-anchor="middle">校验成员、权限和 PR 最新提交</text>

  <rect class="plan" x="342" y="166" width="246" height="150" rx="12"/>
  <text class="label" x="465" y="204" text-anchor="middle">发布计划生成器</text>
  <text class="text" x="465" y="235" text-anchor="middle">读取产品与版本配置</text>
  <text class="text" x="465" y="261" text-anchor="middle">固定源码提交</text>
  <text class="text" x="465" y="287" text-anchor="middle">展开需要构建的产品矩阵</text>
  <path class="formalLine" d="M268 174 H342"/>
  <path class="tempLine" d="M268 304 H304 V276 H342"/>

  <rect class="lane" x="654" y="112" width="560" height="186" rx="14"/>
  <text class="laneTitle" x="680" y="144">Wheel 发布流程</text>
  <rect class="wheel" x="680" y="166" width="190" height="94" rx="10"/>
  <text class="label" x="775" y="200" text-anchor="middle">构建与校验</text>
  <text class="text" x="775" y="227" text-anchor="middle">Python / 后端 / 架构矩阵</text>
  <text class="small" x="775" y="249" text-anchor="middle">产出 wheel + checksums</text>
  <rect class="channel" x="920" y="154" width="262" height="118" rx="10"/>
  <text class="label" x="1051" y="186" text-anchor="middle">按发布类型分流</text>
  <text class="text" x="1051" y="216" text-anchor="middle">正式 - PyPI + GitHub Release</text>
  <text class="text" x="1051" y="243" text-anchor="middle">临时 - Actions Artifact</text>
  <path class="line" d="M870 213 H920"/>

  <rect class="lane" x="654" y="326" width="560" height="212" rx="14"/>
  <text class="laneTitle" x="680" y="358">镜像发布流程</text>
  <rect class="image" x="680" y="384" width="190" height="116" rx="10"/>
  <text class="label" x="775" y="418" text-anchor="middle">矩阵构建</text>
  <text class="text" x="775" y="445" text-anchor="middle">上游版本 / 后端 / 架构</text>
  <text class="text" x="775" y="470" text-anchor="middle">合成多架构镜像</text>
  <text class="small" x="775" y="492" text-anchor="middle">正式版先写暂存地址</text>
  <rect class="channel" x="920" y="372" width="262" height="140" rx="10"/>
  <text class="label" x="1051" y="404" text-anchor="middle">按发布类型分流</text>
  <text class="text" x="1051" y="436" text-anchor="middle">正式 - GHCR + Docker Hub</text>
  <text class="text" x="1051" y="463" text-anchor="middle">临时 - PR 专用 GHCR 标签</text>
  <text class="small" x="1051" y="490" text-anchor="middle">临时镜像设置保留期并自动清理</text>
  <path class="line" d="M870 442 H920"/>

  <rect class="lane" x="654" y="566" width="560" height="186" rx="14"/>
  <text class="laneTitle" x="680" y="598">Chart 发布流程</text>
  <rect class="chart" x="680" y="620" width="190" height="94" rx="10"/>
  <text class="label" x="775" y="654" text-anchor="middle">检查与打包</text>
  <text class="text" x="775" y="681" text-anchor="middle">lint / template / package</text>
  <text class="small" x="775" y="703" text-anchor="middle">产出 OCI Chart</text>
  <rect class="channel" x="920" y="608" width="262" height="118" rx="10"/>
  <text class="label" x="1051" y="640" text-anchor="middle">按发布类型分流</text>
  <text class="text" x="1051" y="670" text-anchor="middle">正式 - GitHub Packages</text>
  <text class="text" x="1051" y="697" text-anchor="middle">临时 - PR 专用 OCI 版本</text>
  <path class="line" d="M870 667 H920"/>

  <path class="line" d="M588 218 H620 V213 H654"/>
  <path class="line" d="M588 241 H620 V442 H654"/>
  <path class="line" d="M588 264 H620 V667 H654"/>

  <rect class="channel" x="1290" y="96" width="250" height="80" rx="12"/>
  <text class="label" x="1415" y="126" text-anchor="middle">GitHub Release</text>
  <text class="text" x="1415" y="151" text-anchor="middle">正式 Wheel、说明和产品地址</text>
  <text class="small" x="1415" y="170" text-anchor="middle">不为 PR 创建临时 Release</text>
  <rect class="channel" x="1290" y="200" width="250" height="80" rx="12"/>
  <text class="label" x="1415" y="230" text-anchor="middle">PyPI</text>
  <text class="text" x="1415" y="255" text-anchor="middle">仅正式 Wheel</text>
  <text class="small" x="1415" y="274" text-anchor="middle">发布后重新安装验证</text>
  <rect class="channel" x="1290" y="304" width="250" height="80" rx="12"/>
  <text class="label" x="1415" y="334" text-anchor="middle">Actions Artifact</text>
  <text class="text" x="1415" y="359" text-anchor="middle">PR 临时 Wheel</text>
  <text class="small" x="1415" y="378" text-anchor="middle">按保留期自动过期</text>
  <rect class="channel" x="1290" y="408" width="250" height="80" rx="12"/>
  <text class="label" x="1415" y="438" text-anchor="middle">GHCR</text>
  <text class="text" x="1415" y="463" text-anchor="middle">正式与 PR 临时镜像</text>
  <text class="small" x="1415" y="482" text-anchor="middle">标签区分正式与 pr-N-sha</text>
  <rect class="channel" x="1290" y="512" width="250" height="80" rx="12"/>
  <text class="label" x="1415" y="542" text-anchor="middle">Docker Hub</text>
  <text class="text" x="1415" y="567" text-anchor="middle">仅正式镜像</text>
  <text class="small" x="1415" y="586" text-anchor="middle">发布后回读多架构摘要</text>
  <rect class="channel" x="1290" y="632" width="250" height="80" rx="12"/>
  <text class="label" x="1415" y="662" text-anchor="middle">GitHub Packages</text>
  <text class="text" x="1415" y="687" text-anchor="middle">正式与 PR 临时 OCI Chart</text>
  <text class="small" x="1415" y="706" text-anchor="middle">版本名区分正式与 pr-N-sha</text>

  <path class="formalLine" d="M1182 184 H1238 V136 H1290"/>
  <path class="formalLine" d="M1182 208 H1250 V240 H1290"/>
  <path class="tempLine" d="M1182 245 H1220 V344 H1290"/>
  <path class="formalLine" d="M1182 430 H1250 V440 H1290"/>
  <path class="tempLine" d="M1182 480 H1230 V464 H1290"/>
  <path class="formalLine" d="M1182 454 H1260 V552 H1290"/>
  <path class="formalLine" d="M1182 652 H1290"/>
  <path class="tempLine" d="M1182 700 H1238 V688 H1290"/>

  <path class="metaLine" d="M1540 448 H1560 V132 H1540"/>
  <path class="metaLine" d="M1540 552 H1572 V144 H1540"/>
  <path class="metaLine" d="M1540 672 H1584 V156 H1540"/>

  <rect class="plan" x="654" y="790" width="886" height="82" rx="12"/>
  <text class="label" x="1097" y="822" text-anchor="middle">PR 临时构建回执</text>
  <text class="text" x="1097" y="850" text-anchor="middle">机器人在 PR 中回复固定提交、任务状态、Wheel 下载地址、镜像地址、Chart 地址和过期时间</text>
  <path class="tempLine" d="M1290 368 H1220 V770 H900 V790"/>
  <path class="tempLine" d="M1290 480 H1232 V770 H1050 V790"/>
  <path class="tempLine" d="M1290 704 H1244 V770 H1200 V790"/>
</svg>
