<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="450" viewBox="0 0 1600 450" role="img" aria-labelledby="title desc">
  <title id="title">Day 0 UCM 新模型适配五步路线</title>
  <desc id="desc">从产品发布自动化开始，依次建设蓝区基础设施、GitHub 验证能力、AI 开发辅助和 Agent 自动编排，最终实现 Day 0 UCM 新模型适配。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748B"/>
    </marker>
    <marker id="goalArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#0277BD"/>
    </marker>
    <style>
      .canvas{fill:#FAFAFA}
      .title{font:700 30px Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#111827}
      .stepTitle{font:700 17px Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#1F2937}
      .stepText{font:500 15px Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#475569}
      .stepNo{font:700 16px Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#FFFFFF}
      .goalTitle{font:700 23px Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0C4A6E}
      .s1{fill:#E1F5FE;stroke:#0277BD;stroke-width:2}
      .s2{fill:#FFF3E0;stroke:#F59E0B;stroke-width:2}
      .s3{fill:#E8F5E9;stroke:#43A047;stroke-width:2}
      .s4{fill:#F3E8FF;stroke:#8B5CF6;stroke-width:2}
      .s5{fill:#FCE4EC;stroke:#E91E63;stroke-width:2}
      .goal{fill:#E1F5FE;stroke:#0277BD;stroke-width:2.5}
      .num1{fill:#0277BD}.num2{fill:#F59E0B}.num3{fill:#43A047}.num4{fill:#8B5CF6}.num5{fill:#E91E63}
      .line{fill:none;stroke:#64748B;stroke-width:2;marker-end:url(#arrow)}
      .goalLine{fill:none;stroke:#0277BD;stroke-width:2.5;marker-end:url(#goalArrow)}
    </style>
  </defs>

  <rect class="canvas" width="1600" height="450"/>
  <text class="title" x="48" y="50">Day 0 UCM 新模型适配路线</text>

  <rect class="s1" x="48" y="105" width="250" height="155" rx="14"/>
  <circle class="num1" cx="82" cy="139" r="19"/>
  <text class="stepNo" x="82" y="145" text-anchor="middle">1</text>
  <text class="stepTitle" x="112" y="145">产品发布自动化</text>
  <text class="stepText" x="72" y="215">发布 Wheel、镜像和 Chart</text>

  <rect class="s2" x="362" y="105" width="250" height="155" rx="14"/>
  <circle class="num2" cx="396" cy="139" r="19"/>
  <text class="stepNo" x="396" y="145" text-anchor="middle">2</text>
  <text class="stepTitle" x="426" y="133">纳管蓝区裸金属资源</text>
  <text class="stepTitle" x="426" y="157">建设基础架构服务</text>
  <text class="stepText" x="386" y="215">提供统一运行环境</text>

  <rect class="s3" x="676" y="105" width="250" height="155" rx="14"/>
  <circle class="num3" cx="710" cy="139" r="19"/>
  <text class="stepNo" x="710" y="145" text-anchor="middle">3</text>
  <text class="stepTitle" x="740" y="133">GitHub 接入基础服务</text>
  <text class="stepTitle" x="740" y="157">建立基础验证能力</text>
  <text class="stepText" x="700" y="215">自动部署与功能验证</text>

  <rect class="s4" x="990" y="105" width="250" height="155" rx="14"/>
  <circle class="num4" cx="1024" cy="139" r="19"/>
  <text class="stepNo" x="1024" y="145" text-anchor="middle">4</text>
  <text class="stepTitle" x="1054" y="133">接入 AI Agent</text>
  <text class="stepTitle" x="1054" y="157">增强开发能力</text>
  <text class="stepText" x="1014" y="215">代码审查与开发辅助</text>

  <rect class="s5" x="1304" y="105" width="250" height="155" rx="14"/>
  <circle class="num5" cx="1338" cy="139" r="19"/>
  <text class="stepNo" x="1338" y="145" text-anchor="middle">5</text>
  <text class="stepTitle" x="1368" y="133">Agent 对接基础服务</text>
  <text class="stepTitle" x="1368" y="157">编排完整适配过程</text>
  <text class="stepText" x="1328" y="215">自动构建、部署与验证</text>

  <path class="line" d="M298 183 H362"/>
  <path class="line" d="M612 183 H676"/>
  <path class="line" d="M926 183 H990"/>
  <path class="line" d="M1240 183 H1304"/>

  <rect class="goal" x="1000" y="338" width="554" height="72" rx="18"/>
  <text class="goalTitle" x="1277" y="383" text-anchor="middle">最终目标 - Day 0 UCM 适配新模型</text>
  <path class="goalLine" d="M1429 260 V298 H1277 V338"/>
</svg>
