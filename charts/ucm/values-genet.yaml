mooncakeMaster:
  podAnnotations:
    scheduling.volcano.sh/queue-name: genet-exclusive
  nodeSelector: {}
  tolerations:
    - key: genet.io/non-shared-pool
      operator: Equal
      value: "true"
      effect: NoSchedule
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: genet.io/node-pool
                operator: In
                values:
                  - non-shared

servingEngineSpec:
  # 1. 交给 Volcano 调度器（缺则回落 default-scheduler，队列注解被忽略）
  schedulerName: "volcano"

  # 4. 容忍独占池节点污点（genet 节点 reconciler 自动打 NoSchedule）
  tolerations:
    - key: genet.io/non-shared-pool
      operator: Equal
      value: "true"
      effect: NoSchedule

  modelSpec:
    # 2. 队列注解（生效位）：kthena 从 ModelServing CR 注解读队列写 PodGroup.spec.queue
    annotations:
      scheduling.volcano.sh/queue-name: genet-exclusive

    # 3. 仅调度到独占池节点
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: genet.io/node-pool
                  operator: In
                  values:
                    - non-shared

    # pod 级队列注解：kthena 路径不消费（见文件头注意事项），仅留作 pod 元数据自描述
    podAnnotations:
      scheduling.volcano.sh/queue-name: genet-exclusive
