# ============================================================
# genet 独占池 + Volcano 队列调度叠加层（overlay）
# ------------------------------------------------------------
# 把"接 genet 独占池队列"所需的全部调度配置集中在此，与通用 chart 解耦。
# base values.yaml 默认不绑定 genet 池；要落独占池队列时，部署命令追加 -f values-genet.yaml：
#
#   helm ... -f values.yaml -f values-genet.yaml -f models/<chip>/values-<model>.yaml
#
# 顺序：values.yaml → values-genet.yaml → 模型 values（模型文件最后，可按需覆盖）。
# 引擎工作负载由 kthena ModelServing 模板（templates/kthena/modelserving.yaml）消费这些值。
#
# 落独占池队列的四件套（缺一不可）：
#   1. schedulerName: volcano                       —— 交给 Volcano 调度器；同时是 kthena 自建 PodGroup 的触发条件
#                                                      （PodGroup CRD 存在 + schedulerName==volcano 即自建，与 gangPolicy 无关）
#   2. modelSpec.annotations[scheduling.volcano.sh/queue-name]: genet-exclusive
#                                                   —— kthena podgroupmanager 只从 ModelServing CR 自身注解读队列
#                                                      写 PodGroup.spec.queue；MS 上没有该注解则 queue 被同步置空（落 default 队列）
#   3. modelSpec.affinity (genet.io/node-pool=non-shared)  —— 落到独占池节点
#   4. tolerations (genet.io/non-shared-pool=true:NoSchedule) —— 容忍独占池污点
#
# 注意：pod 级注解 podAnnotations[scheduling.volcano.sh/queue-name] 在 kthena 路径下不被消费——
# kthena 给 pod 打 scheduling.k8s.io/group-name 后 volcano pg-controller 直接跳过该 pod，
# 「从 pod 注解读 queue-name」那条路走不到。下方仍保留一份 pod 级注解仅作 pod 元数据自描述。
#
# 队列名 = genet 的 queuePrefix(genet-) + 池类型 = genet-exclusive（独占池）。
# 该队列在 genet 侧 manageQueues=true 已自动建好，无需手动创建。
# 切裸金属池：node-pool 值改 bare-metal、污点 key 改 genet.io/bare-metal-pool、队列名改 genet-baremetal。
# ============================================================

